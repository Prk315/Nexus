: 3, "imp": 0.072, "h": 0.915, "t": "More About Transactions", "d": "We introduced the idea of transactions from the point of view of the SQL programmer in Section 6.6. Before proceeding to our study of database resilience and recovery from failures, we need to discuss the fundamental not\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 256.31, "y": 42.5, "z": 127.66, "jx": -150.0, "jy": 15426.0, "ch": "DBMS 17"}, {"id": "dbms-1713-correct-execution-of-transactions", "c": 3, "imp": 0.0737, "h": 0.77, "t": "Correct Execution of Transactions", "d": "Before we can deal with correcting system errors, we need to understand what it means for a transaction to be executed \"correctly.\" To begin, we assume that the database is composed of \"elements.\" We shall not specify pr\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 247.1, "y": 53.75, "z": 104.92, "jx": -300.0, "jy": 15426.0, "ch": "DBMS 17"}, {"id": "dbms-1714-the-prim-itive-operations-of-transactions", "c": 3, "imp": 0.0, "h": 0.57, "t": "The Prim itive Operations of Transactions", "d": "Let us now consider in detail how transactions interact with the database. There are three address spaces that interact in important ways:  - 1. The space of disk blocks holding the database elements. - 2. The virtual or\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 281.05, "y": 35.73, "z": 157.5, "jx": -75.0, "jy": 15544.0, "ch": "DBMS 17"}, {"id": "dbms-1721-log-records", "c": 3, "imp": 0.0675, "h": 0.73, "t": "Log Records", "d": "Imagine the log as a file opened for appending only. As transactions execute, the *log manager* has the job of recording in the log each important event. One block of the log at a time is filled with log records, each re\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 230.78, "y": 103.32, "z": 154.89, "jx": -375.0, "jy": 15544.0, "ch": "DBMS 17"}, {"id": "dbms-1722-the-undo-logging-rules", "c": 3, "imp": 0.0408, "h": 0.808, "t": "The Undo-Logging Rules", "d": "An undo log is sufficient to allow recovery from a system failure, provided transactions and the buffer manager obey two rules:  - *U\\:* If transaction *T* modifies database element *X ,* then the log record of the form \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 305.18, "y": 20.88, "z": 83.44, "jx": 300.0, "jy": 15426.0, "ch": "DBMS 17"}, {"id": "dbms-1723-recovery-using-undo-logging", "c": 3, "imp": 0.0299, "h": 0.57, "t": "Recovery Using Undo Logging", "d": "Suppose now that a system failure occurs. It is possible that certain database changes made by a given transaction were written to disk, while other changes made by the same transaction never reached the disk. If so, the\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 262.73, "y": 69.16, "z": 187.82, "jx": -225.0, "jy": 15544.0, "ch": "DBMS 17"}, {"id": "dbms-1724-checkpointing", "c": 3, "imp": 0.0136, "h": 0.601, "t": "Checkpointing", "d": "As we observed, recovery requires that the entire log be examined, in principle. When logging follows the undo style, once a transaction has its COMMIT log record written to disk, the log records of that transaction are \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 244.47, "y": 77.16, "z": 170.46, "jx": 150.0, "jy": 15662.0, "ch": "DBMS 17"}, {"id": "dbms-1725-nonquiescent-checkpointing", "c": 3, "imp": 0.0, "h": 0.0, "t": "Nonquiescent Checkpointing", "d": "A problem with the checkpointing technique described in Section 17.2.4 is that effectively we must shut down the system while the checkpoint is being made. Since the active transactions may take a long time to commit or \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 242.95, "y": 75.16, "z": 205.57, "jx": 75.0, "jy": 15780.0, "ch": "DBMS 17"}, {"id": "dbms-1731-the-redo-logging-rule", "c": 3, "imp": 0.0054, "h": 0.846, "t": "The Redo-Logging Rule", "d": "In redo logging the meaning of a log record *<T, X , v>* is \"transaction *T* wrote new value *v* for database element *X .\"* There is no indication of the old value of *X* in this record. Every time a transaction *T* mod\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 234.14, "y": 119.31, "z": 192.45, "jx": -150.0, "jy": 15662.0, "ch": "DBMS 17"}, {"id": "dbms-1732-recovery-w-ith-redo-logging", "c": 3, "imp": 0.0, "h": 0.089, "t": "Recovery W ith Redo Logging", "d": "An important consequence of the redo rule *R i* is that unless the log has a <C0MMIT *T>* record, we know that no changes to the database made by transaction T have been written to disk. Thus, incomplete transactions may\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 329.76, "y": 58.51, "z": 140.11, "jx": 0.0, "jy": 15426.0, "ch": "DBMS 17"}, {"id": "dbms-1733-checkpointing-a-redo-log", "c": 3, "imp": 0.0, "h": 0.54, "t": "Checkpointing a Redo Log", "d": "Redo logs present a checkpointing problem that we do not see with undo logs. Since the database changes made by a committed transaction can be copied to disk much later than the time at which the transaction commits, we \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 250.88, "y": 97.82, "z": 196.71, "jx": -75.0, "jy": 15780.0, "ch": "DBMS 17"}, {"id": "dbms-1734-recovery-w-ith-a-checkpointed-redo-log", "c": 3, "imp": 0.0, "h": 0.708, "t": "Recovery W ith a Checkpointed Redo Log", "d": "As for an undo log, the insertion of records to mark the start and end of a checkpoint helps us limit our examination of the log when a recovery is necessary. Also as with undo logging, there are two cases, depending on \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 227.96, "y": 140.5, "z": 159.29, "jx": -300.0, "jy": 15662.0, "ch": "DBMS 17"}, {"id": "dbms-1741-the-u-ndor-edo-rules", "c": 3, "imp": 0.0, "h": 0.615, "t": "The U ndo/R edo Rules", "d": "An undo/redo log has the same sorts of log records as the other kinds of log, with one exception. The update log record that we write when a database element changes value has four components. Record *< T ,X ,v,w >* mean\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 204.34, "y": 122.71, "z": 175.17, "jx": 0.0, "jy": 15662.0, "ch": "DBMS 17"}, {"id": "dbms-1742-recovery-w-ith-u-ndor-edo-logging", "c": 3, "imp": 0.0, "h": 0.912, "t": "Recovery W ith U ndo/R edo Logging", "d": "When we need to recover using an undo/redo log, we have the information in the update records either to undo a transaction *T* by restoring the old values of", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 347.39, "y": 5.31, "z": 97.08, "jx": 375.0, "jy": 15544.0, "ch": "DBMS 17"}, {"id": "dbms-1743-checkpointing-an-u-ndor-edo-log", "c": 3, "imp": 0.0, "h": 0.638, "t": "Checkpointing an U ndo/R edo Log", "d": "A nonquiescent checkpoint is somewhat simpler for undo/redo logging than for the other logging methods. We have only to do the following:  - 1. Write a <START CKPT (7 \\, .. . , *Tk)>* record to the log, where T i,... , T\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 348.22, "y": 24.24, "z": 79.33, "jx": 225.0, "jy": 15544.0, "ch": "DBMS 17"}, {"id": "dbms-1751-the-archive", "c": 3, "imp": 0.0082, "h": 0.199, "t": "The Archive", "d": "To protect against media failures, we are thus led to a solution involving *archiving* \u2014 maintaining a copy of the database separate from the database itself. If it were possible to shut down the database for a while, we\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 332.78, "y": 68.35, "z": 111.53, "jx": 150.0, "jy": 15426.0, "ch": "DBMS 17"}, {"id": "dbms-1752-nonquiescent-archiving", "c": 3, "imp": 0.0, "h": 0.606, "t": "Nonquiescent Archiving", "d": "The problem with the simple view of archiving in Section 17.5.1 is that most databases cannot be shut down for the period of time (possibly hours) needed", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 277.94, "y": 76.85, "z": 224.12, "jx": 300.0, "jy": 15662.0, "ch": "DBMS 17"}, {"id": "dbms-1753-recovery-using-an-archive-and-log", "c": 3, "imp": 0.0, "h": 0.586, "t": "Recovery Using an Archive and Log", "d": "Suppose that a media failure occurs, and we must reconstruct the database from the most recent archive and whatever prefix of the log has reached the remote site and has not been lost in the crash. We perform the followi\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 338.58, "y": 45.93, "z": 98.22, "jx": 75.0, "jy": 15544.0, "ch": "DBMS 17"}, {"id": "dbms-1811-schedules", "c": 3, "imp": 0.3366, "h": 0.064, "t": "Schedules", "d": "A *schedule* is a sequence of the important actions taken by one or more transactions. When studying concurrency control, the important read and write actions take place in the main-memory buffers, not the disk. That is,\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 218.65, "y": 11.63, "z": -17.75, "jx": 0.0, "jy": 16073.0, "ch": "DBMS 18"}, {"id": "dbms-1812-serial-schedules", "c": 3, "imp": 0.0361, "h": 0.089, "t": "Serial Schedules", "d": "A schedule is *serial* if its actions consist of all the actions of one transaction, then all the actions of another transaction, and so on. No mixing of the actions is allowed.", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 173.02, "y": 3.41, "z": 6.17, "jx": 0.0, "jy": 16191.0, "ch": "DBMS 18"}, {"id": "dbms-1813-serializable-schedules", "c": 3, "imp": 0.0041, "h": 0.905, "t": "Serializable Schedules", "d": "The correctness principle for transactions tells us that every serial schedule will preserve consistency of the database state. But are there any other schedules that also are guaranteed to preserve consistency? There ar\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 250.0, "y": 15.18, "z": 16.31, "jx": 150.0, "jy": 16191.0, "ch": "DBMS 18"}, {"id": "dbms-1814-the-effect-of-transaction-semantics", "c": 3, "imp": 0.0, "h": 0.715, "t": "The Effect of Transaction Semantics", "d": "In our study of serializability so far, we have considered in detail the operations performed by the transactions, to determine whether or not a schedule is serializable. The details of the transactions do matter, as we \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 188.03, "y": -2.03, "z": 37.05, "jx": 600.0, "jy": 16309.0, "ch": "DBMS 18"}, {"id": "dbms-1815-a-notation-for-transactions-and-schedules", "c": 3, "imp": 0.0891, "h": 0.76, "t": "A Notation for Transactions and Schedules", "d": "If we assume \"no coincidences,\" then only the reads and writes performed by the transaction matter, not the actual values involved. Thus, we shall represent transactions and schedules by a shorthand notation, in which th\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 239.91, "y": 9.62, "z": -11.07, "jx": -300.0, "jy": 16191.0, "ch": "DBMS 18"}, {"id": "dbms-1821-conflicts", "c": 3, "imp": 0.0624, "h": 0.685, "t": "Conflicts", "d": "To begin, let us observe that most pairs of actions do *not* conflict. In what follows, we assume that T, and *Tj* are different transactions; i.e., *i* ^ *j.*  - 1 . *ri(X)\\ rj(Y)* is never a conflict, even if *X Y.* Th\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 305.25, "y": -6.46, "z": -31.95, "jx": -1050.0, "jy": 16309.0, "ch": "DBMS 18"}, {"id": "dbms-1822-precedence-graphs-and-a-test-for-conflict-serializability", "c": 3, "imp": 0.0082, "h": 0.661, "t": "Precedence Graphs and a Test for Conflict-Serializability", "d": "It is relatively simple to examine a schedule *S* and decide whether or not it is conflict-serializable. When a pair of conflicting actions appears anywhere in 5, the transactions performing those actions must appear in \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 184.24, "y": 18.21, "z": -25.48, "jx": -450.0, "jy": 16309.0, "ch": "DBMS 18"}, {"id": "dbms-1823-w-hy-the-precedence-graph-test-works", "c": 3, "imp": 0.0, "h": 0.6, "t": "W hy the Precedence-Graph Test Works", "d": "If there is a cycle involving *n* transactions Ti \u2014\u00bb *T2 -\u00a5 ... \u2014> Tn* \u2014> T i, then in the hypothetical serial order, the actions of Ti must precede those of *T2,* which precede those of T**3**, and so on, up to T\". But \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 188.87, "y": 13.82, "z": 45.96, "jx": 750.0, "jy": 16309.0, "ch": "DBMS 18"}, {"id": "dbms-1831-locks", "c": 3, "imp": 0.2159, "h": 0.144, "t": "Locks", "d": "In Fig. 18.11 we see a scheduler that uses a lock table to help perform its job. Recall from the chapter introduction that the responsibility of the scheduler is to take requests from transactions and either allow them t\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 242.06, "y": 40.52, "z": -60.38, "jx": -150.0, "jy": 16191.0, "ch": "DBMS 18"}, {"id": "dbms-1832-the-locking-scheduler", "c": 3, "imp": 0.0313, "h": 0.082, "t": "The Locking Scheduler", "d": "It is the job of a scheduler based on locking to grant requests if and only if the request will result in a legal schedule. If a request is not granted, the requesting transaction is delayed; it waits until the scheduler\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 280.15, "y": 3.93, "z": -47.76, "jx": 0.0, "jy": 16309.0, "ch": "DBMS 18"}, {"id": "dbms-1833-two-phase-locking", "c": 3, "imp": 0.0299, "h": 0.649, "t": "Two-Phase Locking", "d": "There is a surprising condition, called *two-phase locking* (or *2PL)* under which we can guarantee that a legal schedule of consistent transactions is conflictserializable:  \u2022 In every transaction, all lock actions prec\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 300.41, "y": -23.17, "z": -80.47, "jx": -75.0, "jy": 16427.0, "ch": "DBMS 18"}, {"id": "dbms-1834-w-hy-two-phase-locking-works", "c": 3, "imp": 0.0, "h": 0.728, "t": "W hy Two-Phase Locking Works", "d": "Intuitively, each two-phase-locked transaction may be thought to execute in its entirety at the instant it issues its first unlock request, as suggested by Fig. 18.14. Thus, there is always at least one conflict-equivale\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 190.56, "y": 39.18, "z": -60.49, "jx": -225.0, "jy": 16427.0, "ch": "DBMS 18"}, {"id": "dbms-1841-shared-and-exclusive-locks", "c": 3, "imp": 0.0, "h": 0.889, "t": "Shared and Exclusive Locks", "d": "The lock we need for writing is \"stronger\" than the lock we need to read, since it must prevent both reads and writes. Let us therefore consider a locking scheduler that uses two different kinds of locks: *shared locks* \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 235.16, "y": 42.54, "z": 2.65, "jx": -300.0, "jy": 16309.0, "ch": "DBMS 18"}, {"id": "dbms-1842-compatibility-matrices", "c": 3, "imp": 0.0, "h": 0.053, "t": "Compatibility Matrices", "d": "If we use several lock modes, then the scheduler needs a policy about when it can grant a lock request, given the other locks that may already be held on the same database element. A *compatibility matrix* is a convenien\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 225.62, "y": 77.63, "z": -98.75, "jx": -750.0, "jy": 16309.0, "ch": "DBMS 18"}, {"id": "dbms-1843-upgrading-locks", "c": 3, "imp": 0.0, "h": 0.834, "t": "Upgrading Locks", "d": "A transaction *T* that takes a shared lock on *X* is being \"friendly\" toward other transactions, since they are allowed to read *X* at the same time T is. Thus, we might wonder whether it would be friendlier still if a t\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 224.7, "y": 28.77, "z": -0.96, "jx": 300.0, "jy": 16309.0, "ch": "DBMS 18"}, {"id": "dbms-1844-update-locks", "c": 3, "imp": 0.0082, "h": 0.121, "t": "Update Locks", "d": "We can avoid the deadlock problem of Example 18.16 with a third lock mode, called *update locks.* An update lock *uli(X)* gives transaction T j only the privilege to read *X ,* not to write *X .* However, only the update\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 282.5, "y": 36.74, "z": -103.8, "jx": 150.0, "jy": 16309.0, "ch": "DBMS 18"}, {"id": "dbms-1845-increment-locks", "c": 3, "imp": 0.0041, "h": 0.55, "t": "Increment Locks", "d": "Another interesting kind of lock that is useful in some situations is an \"increment lock.\" Many transactions operate on the database only by incrementing or decrementing stored values. For example, consider a transaction\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 322.46, "y": 24.44, "z": -23.13, "jx": -375.0, "jy": 16427.0, "ch": "DBMS 18"}, {"id": "dbms-1851-a-scheduler-that-inserts-lock-actions", "c": 3, "imp": 0.0, "h": 0.189, "t": "A Scheduler That Inserts Lock Actions", "d": "Figure 18.24 shows a two-part scheduler that accepts requests such as read, write, commit, and abort, from transactions. The scheduler maintains a lock table, which, although it is shown as secondary-storage data, may be\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 307.71, "y": 105.35, "z": -70.77, "jx": 75.0, "jy": 16427.0, "ch": "DBMS 18"}, {"id": "dbms-1852-the-lock-table", "c": 3, "imp": 0.0204, "h": 0.178, "t": "The Lock Table", "d": "Abstractly, the lock table is a relation that associates database elements with locking information about that element, as suggested by Fig. 18.25. The table might, for instance, be implemented with a hash table, using (\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 284.83, "y": 69.28, "z": -55.99, "jx": -150.0, "jy": 16309.0, "ch": "DBMS 18"}, {"id": "dbms-1861-locks-w-ith-m-ultiple-granularity", "c": 3, "imp": 0.0, "h": 0.649, "t": "Locks W ith M ultiple Granularity", "d": "Recall that the term \"database element\" was purposely left undefined, because different systems use different sizes of database elements to lock, such as tuples, pages or blocks, and relations. Some applications benefit \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 251.5, "y": 34.35, "z": 1.05, "jx": -600.0, "jy": 16309.0, "ch": "DBMS 18"}, {"id": "dbms-1862-warning-locks", "c": 3, "imp": 0.0, "h": 0.073, "t": "Warning Locks", "d": "The solution to the problem of managing locks at different granularities involves a new kind of lock called a \"warning.\" These locks are useful when the database elements form a nested or hierarchical structure, as sugge\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 253.52, "y": 83.2, "z": -92.79, "jx": 450.0, "jy": 16309.0, "ch": "DBMS 18"}, {"id": "dbms-1863-phantoms-and-handling-insertions-correctly", "c": 3, "imp": 0.0054, "h": 0.823, "t": "Phantoms and Handling Insertions Correctly", "d": "When transactions create new subelements of a lockable element, there are some opportunities to go wrong. The problem is that we can only lock existing items; there is no easy way to lock database elements that do not ex\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 277.31, "y": -8.59, "z": 6.42, "jx": 375.0, "jy": 16427.0, "ch": "DBMS 18"}, {"id": "dbms-1871-m-otivation-for-tree-based-locking", "c": 3, "imp": 0.0, "h": 0.709, "t": "M otivation for Tree-Based Locking", "d": "Let us consider a B-tree index in a system that treats individual nodes (i.e., blocks) as lockable database elements. The node is the right level of lock granularity, because treating smaller pieces as elements offers no\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 310.3, "y": 7.69, "z": -110.41, "jx": 150.0, "jy": 16545.0, "ch": "DBMS 18"}, {"id": "dbms-1872-rules-for-access-to-tree-structured-data", "c": 3, "imp": 0.0, "h": 0.726, "t": "Rules for Access to Tree-Structured Data", "d": "The following restrictions on locks form the *tree protocol.* We assume that there is only one kind of lock, represented by lock requests of the form *li(X),* but the idea generalizes to any set of lock modes. We assume \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 323.12, "y": -39.31, "z": -113.95, "jx": -300.0, "jy": 16545.0, "ch": "DBMS 18"}, {"id": "dbms-1873-w-hy-the-tree-protocol-works", "c": 3, "imp": 0.0, "h": 0.771, "t": "W hy the Tree Protocol Works", "d": "The tree protocol implies a serial order on the transactions involved in a schedule. We can define an order of precedence as follows. Say that T, *<s Tj* if in schedule *S,* the transactions T\\* and *Tj* lock a node in c\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 227.02, "y": 42.56, "z": -40.1, "jx": -900.0, "jy": 16309.0, "ch": "DBMS 18"}, {"id": "dbms-1881-timestamps", "c": 3, "imp": 0.0606, "h": 0.863, "t": "Timestamps", "d": "To use timestamping as a concurrency-control method, the scheduler needs to assign to each transaction *T* a unique number, its *timestamp* TS *(T).* Timestamps must be issued in ascending order, at the time that a trans\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 237.07, "y": -18.59, "z": -21.74, "jx": 300.0, "jy": 16191.0, "ch": "DBMS 18"}, {"id": "dbms-1882-physically-unrealizable-behaviors", "c": 3, "imp": 0.0136, "h": 0.918, "t": "Physically Unrealizable Behaviors", "d": "In order to understand the architecture and rules of a timestamp scheduler, we need to remember that the scheduler assumes the timestamp order of transactions is also the serial order in which they must appear to execute\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 269.65, "y": -30.01, "z": -45.46, "jx": 900.0, "jy": 16309.0, "ch": "DBMS 18"}, {"id": "dbms-1883-problems-w-ith-dirty-data", "c": 3, "imp": 0.0, "h": 0.672, "t": "Problems W ith Dirty Data", "d": "There is a class of problems that the commit bit is designed to solve. One of these problems, a \"dirty read,\" is suggested in Fig. 18.37. There, transaction    Figure 18.36: Transaction T tries to write too late", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 301.66, "y": -27.33, "z": -18.1, "jx": 300.0, "jy": 16545.0, "ch": "DBMS 18"}, {"id": "dbms-1884-the-rules-for-timestamp-based-scheduling", "c": 3, "imp": 0.0082, "h": 0.651, "t": "The Rules for Timestamp-Based Scheduling", "d": "We can now summarize the rules that a scheduler using timestamps must follow to make sure that nothing physically unrealizable may occur. The scheduler, in response to a read or write request from a transaction *T* has t\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 175.55, "y": -32.73, "z": -33.76, "jx": 1050.0, "jy": 16309.0, "ch": "DBMS 18"}, {"id": "dbms-1885-multiversion-timestamps", "c": 3, "imp": 0.0, "h": 0.829, "t": "Multiversion Timestamps", "d": "An important variation of timestamping maintains old versions of database elements in addition to the current version that is stored in the database itself. The purpose is to allow reads  $r_T(X)$  that otherwise would c\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 258.34, "y": 0.35, "z": -77.54, "jx": 225.0, "jy": 16427.0, "ch": "DBMS 18"}, {"id": "dbms-1886-timestamps-versus-locking", "c": 3, "imp": 0.0, "h": 0.0, "t": "Timestamps Versus Locking", "d": "Generally, timestamping is superior in situations where either most transactions are read-only, or it is rare that concurrent transactions will try to read and write the same element. In high-conflict situations, locking\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 252.88, "y": -53.77, "z": -71.63, "jx": 0.0, "jy": 16545.0, "ch": "DBMS 18"}, {"id": "dbms-1891-architecture-of-a-validation-based-scheduler", "c": 3, "imp": 0.0, "h": 0.783, "t": "Architecture of a Validation-Based Scheduler", "d": "When validation is used as the concurrency-control mechanism, the scheduler must be told for each transaction T the sets of database elements T reads and writes, the *read set,* RS(T), and the *write set,* WS(T), respect\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 353.3, "y": -13.47, "z": -27.5, "jx": -525.0, "jy": 16427.0, "ch": "DBMS 18"}, {"id": "dbms-1892-the-validation-rules", "c": 3, "imp": 0.0, "h": 0.639, "t": "The Validation Rules", "d": "The information of Section 18.9.1 is enough for the scheduler to detect any potential violation of the assumed serial order of the transactions \u2014 the order in which the transactions validate. To understand the rules, let\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 143.88, "y": -19.64, "z": -21.06, "jx": 525.0, "jy": 16427.0, "ch": "DBMS 18"}, {"id": "dbms-1893-comparison-of-three-concurrency-control-mechanisms", "c": 3, "imp": 0.0, "h": 0.424, "t": "Comparison of Three Concurrency-Control Mechanisms", "d": "The three approaches to serializability that we have considered \u2014 locks, timestamps, and validation \u2014 each have their advantages. First, they can be compared for their storage utilization:  - *Locks:* Space in the lock t\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 276.91, "y": 26.52, "z": -20.18, "jx": -150.0, "jy": 16545.0, "ch": "DBMS 18"}, {"id": "dbms-1911-the-dirty-data-problem", "c": 3, "imp": 0.1488, "h": 0.119, "t": "The Dirty-Data Problem", "d": "Recall from Section 6.6.5 that data is \"dirty\" if it has been written by a transaction that is not yet committed. The dirty data could appear either in the buffers, or on disk, or both; either can cause trouble.", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 213.34, "y": 6.27, "z": -205.07, "jx": 0.0, "jy": 16838.0, "ch": "DBMS 19"}, {"id": "dbms-1912-cascading-rollback", "c": 3, "imp": 0.1112, "h": 0.147, "t": "Cascading Rollback", "d": "As we see from the examples above, if dirty data is available to transactions, then we sometimes have to perform a *cascading rollback.* That is, when a  transaction *T* aborts, we must determine which transactions have \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 235.52, "y": 51.9, "z": -213.42, "jx": -150.0, "jy": 16956.0, "ch": "DBMS 19"}, {"id": "dbms-1913-recoverable-schedules", "c": 3, "imp": 0.0326, "h": 0.121, "t": "Recoverable Schedules", "d": "For any of the logging methods we have discussed in Chapter 17 to allow recovery, the set of transactions that are regarded as committed *after* recovery must be consistent. That is, if a transaction *T\\* is, after recov\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 238.45, "y": 64.36, "z": -267.57, "jx": 75.0, "jy": 17074.0, "ch": "DBMS 19"}, {"id": "dbms-1914-schedules-that-avoid-cascading-rollback", "c": 3, "imp": 0.0, "h": 0.087, "t": "Schedules That Avoid Cascading Rollback", "d": "Recoverable schedules sometimes require cascading rollback. For instance, if after the first four steps of schedule *Si* in Example 19.3 *Ti* had to roll back, it would be necessary to roll back *T2* as well. To guarante\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 256.86, "y": 78.97, "z": -293.76, "jx": 225.0, "jy": 17192.0, "ch": "DBMS 19"}, {"id": "dbms-1915-managing-rollbacks-using-locking", "c": 3, "imp": 0.0621, "h": 0.156, "t": "Managing Rollbacks Using Locking", "d": "Our prior discussion applies to schedules that are generated by any kind of scheduler. In the common case that the scheduler is lock-based, there is a simple and commonly used way to guarantee that there are no cascading\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 231.75, "y": 44.99, "z": -145.93, "jx": -75.0, "jy": 17074.0, "ch": "DBMS 19"}, {"id": "dbms-1916-group-commit", "c": 3, "imp": 0.0, "h": 0.053, "t": "Group Commit", "d": "Under some circumstances, we can avoid reading dirty data even if we do not flush every commit record on the log to disk immediately. As long as we flush  log records in the order that they are written, we can release lo\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 229.87, "y": 65.69, "z": -302.61, "jx": 75.0, "jy": 17192.0, "ch": "DBMS 19"}, {"id": "dbms-1917-logical-logging", "c": 3, "imp": 0.0319, "h": 0.151, "t": "Logical Logging", "d": "We saw in Section 19.1.5 that dirty reads are easier to fix up when the unit of locking is the block or page. However, there are at least two problems presented when database elements are blocks.  1. All logging methods \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 193.77, "y": -33.57, "z": -168.53, "jx": 0.0, "jy": 16956.0, "ch": "DBMS 19"}, {"id": "dbms-1918-recovery-from-logical-logs", "c": 3, "imp": 0.0, "h": 0.089, "t": "Recovery From Logical Logs", "d": "If the logical actions are idempotent \u2014 i.e., they can be repeated any number of times without harm \u2014 then we can recover easily using a logical log. For  instance, we discussed in Example 19.6 how a tuple insertion coul\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 239.93, "y": 67.78, "z": -237.09, "jx": 225.0, "jy": 17074.0, "ch": "DBMS 19"}, {"id": "dbms-1921-deadlock-detection-by-timeout", "c": 3, "imp": 0.0163, "h": 0.189, "t": "Deadlock Detection by Timeout", "d": "When a deadlock exists, it is generally impossible to repair the situation so that all transactions involved can proceed. Thus, at least one of the transactions will have to be aborted and restarted.  The simplest way to\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 253.92, "y": 87.91, "z": -165.17, "jx": -225.0, "jy": 17192.0, "ch": "DBMS 19"}, {"id": "dbms-1922-the-waits-for-graph", "c": 3, "imp": 0.0559, "h": 0.055, "t": "The Waits-For Graph", "d": "Deadlocks that are caused by transactions waiting for locks held by another can be detected by a *waits-for graph,* indicating which transactions are waiting for locks held by another transaction. This graph can be used \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 198.82, "y": -6.63, "z": -150.94, "jx": -75.0, "jy": 17192.0, "ch": "DBMS 19"}, {"id": "dbms-1923-deadlock-prevention-by-ordering-elements", "c": 3, "imp": 0.0, "h": 0.113, "t": "Deadlock Prevention by Ordering Elements", "d": "Now, let us consider several more methods for deadlock prevention. The first requires us to order database elements in some arbitrary but fixed order. For instance, if database elements are blocks, we could order them le\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 273.69, "y": 115.77, "z": -173.07, "jx": -225.0, "jy": 17310.0, "ch": "DBMS 19"}, {"id": "dbms-1924-d-etecting-deadlocks-by-timestamps", "c": 3, "imp": 0.0, "h": 0.08, "t": "D etecting Deadlocks by Timestamps", "d": "We can detect deadlocks by maintaining the waits-for graph, as we discussed in Section 19.2.2. However, this graph can be large, and analyzing it for cycles each time a transaction has to wait for a lock can be time-cons\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 172.03, "y": -10.36, "z": -175.79, "jx": 75.0, "jy": 17310.0, "ch": "DBMS 19"}, {"id": "dbms-1925-comparison-of-deadlock-management-methods", "c": 3, "imp": 0.0, "h": 0.161, "t": "Comparison of Deadlock-Management Methods", "d": "In both the wait-die and wound-wait schemes, older transactions kill off newer transactions. Since transactions restart with their old timestamp, eventually each transaction becomes the oldest in the system and is sure t\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 256.4, "y": 77.24, "z": -219.39, "jx": -225.0, "jy": 17074.0, "ch": "DBMS 19"}, {"id": "dbms-1931-problems-of-long-transactions", "c": 3, "imp": 0.0, "h": 0.081, "t": "Problems of Long Transactions", "d": "Roughly, a *long transaction* is one that takes too long to be allowed to hold locks that another transaction needs. Depending on the environment, \"too long\" could mean seconds, minutes, or hours. Three broad classes of \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 218.6, "y": 7.86, "z": -237.68, "jx": 150.0, "jy": 16956.0, "ch": "DBMS 19"}, {"id": "dbms-1932-sagas", "c": 3, "imp": 0.0, "h": 0.097, "t": "Sagas", "d": "A *saga* is a collection of actions, such as those of Example 19.13, that together form a long-duration \"transaction.\" That is, a saga consists of:  - 1. A collection of actions. - 2. A directed graph whose nodes are eit\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 217.8, "y": -35.05, "z": -169.05, "jx": 225.0, "jy": 17310.0, "ch": "DBMS 19"}, {"id": "dbms-1933-compensating-transactions", "c": 3, "imp": 0.0082, "h": 0.085, "t": "Compensating Transactions", "d": "In a saga, each action *A* has a *compensating transaction,* which we denote *A* -1 . Intuitively, if we execute *A,* and later execute *A ~ 1,* then the resulting database state is the same as if neither *A* nor *A~ 1* \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 178.35, "y": -15.33, "z": -91.07, "jx": -75.0, "jy": 17310.0, "ch": "DBMS 19"}, {"id": "dbms-1934-w-hy-compensating-transactions-work", "c": 3, "imp": 0.0, "h": 0.854, "t": "W hy Compensating Transactions Work", "d": "Let us say that two sequences of actions are *equivalent* (=) if they take any database state *D* to the same state. The fundamental assumption about compensating transactions can be stated:  \u2022 If *A* is any action and *\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 193.09, "y": -10.19, "z": -20.83, "jx": 0.0, "jy": 17428.0, "ch": "DBMS 19"}, {"id": "dbms-2011-models-of-parallelism", "c": 3, "imp": 0.256, "h": 0.193, "t": "Models of Parallelism", "d": "At the heart of all parallel machines is a collection of processors. Often the number of processors *p* is large, in the hundreds or thousands. We shall assume that each processor has its own local cache, which we do not\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 171.41, "y": -204.58, "z": 270.72, "jx": -75.0, "jy": 17721.0, "ch": "DBMS 20"}, {"id": "dbms-2012-tuple-at-a-time-operations-in-parallel", "c": 3, "imp": 0.0326, "h": 0.078, "t": "Tuple-at-a-Time Operations in Parallel", "d": "Let us begin our discussion of parallel algorithms for a shared-nothing machine by considering the selection operator. First, we must consider how data is best stored. As first suggested by Section 13.3.3, it is useful t\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 138.71, "y": -243.71, "z": 308.18, "jx": 525.0, "jy": 17839.0, "ch": "DBMS 20"}, {"id": "dbms-2013-parallel-algorithms-for-full-relation-operations", "c": 3, "imp": 0.0673, "h": 0.113, "t": "Parallel Algorithms for Full-Relation Operations", "d": "First, let us consider the operation *S(R).* If we use a hash function to distribute the tuples of *R* as in Section 20.1.2, then we shall place duplicate tuples of *R* at the same processor. We can produce *S(R)* in par\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 129.31, "y": -267.04, "z": 253.38, "jx": -225.0, "jy": 17839.0, "ch": "DBMS 20"}, {"id": "dbms-2014-performance-of-parallel-algorithms", "c": 3, "imp": 0.0, "h": 0.192, "t": "Performance of Parallel Algorithms", "d": "Now, let us consider how the running time of a parallel algorithm on a *p*processor machine compares with the time to execute an algorithm for the  <sup>1</sup>In principle, th is union could be eith er a set- o r bag-un\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 140.87, "y": -205.45, "z": 292.15, "jx": 75.0, "jy": 17839.0, "ch": "DBMS 20"}, {"id": "dbms-2021-the-storage-model", "c": 3, "imp": 0.0376, "h": 0.109, "t": "The Storage Model", "d": "For the map-reduce framework to make sense, we should assume a massively parallel machine, most likely shared-nothing. Typically, the processors are commodity computers, mounted in racks with a simple communication netwo\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 210.89, "y": -209.25, "z": 295.78, "jx": 375.0, "jy": 17839.0, "ch": "DBMS 20"}, {"id": "dbms-2023-the-reduce-function", "c": 3, "imp": 0.0, "h": 0.196, "t": "The Reduce Function", "d": "The second user-defined function, *reduce,* is also executed by one or more processes, located at any number of processors. The input to *reduce* is a single key value from the intermediate result, together with the list\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 177.45, "y": -240.47, "z": 267.84, "jx": 225.0, "jy": 17839.0, "ch": "DBMS 20"}, {"id": "dbms-2031-distribution-of-data", "c": 3, "imp": 0.0714, "h": 0.058, "t": "Distribution of Data", "d": "One important reason to distribute data is that the organization is itself distributed among many sites, and the sites each have data that is germane primarily to that site. Some examples are:  - 1. A bank may have many \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 236.48, "y": -125.81, "z": 249.96, "jx": -225.0, "jy": 17721.0, "ch": "DBMS 20"}, {"id": "dbms-2032-distributed-transactions", "c": 3, "imp": 0.0593, "h": 0.707, "t": "Distributed Transactions", "d": "A consequence of the distribution of data is that a transaction may involve processes at several sites. Thus, our model of what a transaction is must change. No longer is a transaction a piece of code executed by a singl\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 235.74, "y": -70.54, "z": 184.7, "jx": -375.0, "jy": 17839.0, "ch": "DBMS 20"}, {"id": "dbms-2033-data-replication", "c": 3, "imp": 0.0082, "h": 0.183, "t": "Data Replication", "d": "One important advantage of a distributed system is the ability to *replicate* data, that is, to make copies of the data at different sites. One motivation is that if a site fails, there may be other sites that can provid\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 208.3, "y": -160.44, "z": 251.49, "jx": -525.0, "jy": 17839.0, "ch": "DBMS 20"}, {"id": "dbms-2041-the-distributed-join-problem", "c": 3, "imp": 0.0408, "h": 0.2, "t": "The Distributed Join Problem", "d": "Suppose we want to compute *R(A,B)* txi *S(B,C).* However, *R* and *S* reside at different nodes of a network, as suggested in Fig. 20.5. There are two obvious ways to compute the join.    Figure 20.5: Joining relations \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 87.75, "y": -307.88, "z": 226.37, "jx": 75.0, "jy": 17957.0, "ch": "DBMS 20"}, {"id": "dbms-2042-semijoin-reductions", "c": 3, "imp": 0.0, "h": 0.099, "t": "Semijoin Reductions", "d": "Both these problems can be dealt with using the same type of query plan, in which only the relevant part of each relation is shipped to the site of the other. Recall that the semijoin of relations *R (X , Y)* and *S(Y, Z\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 116.47, "y": -253.88, "z": 339.99, "jx": 525.0, "jy": 17957.0, "ch": "DBMS 20"}, {"id": "dbms-2043-joins-of-many-relations", "c": 3, "imp": 0.0, "h": 0.19, "t": "Joins of Many Relations", "d": "When we want to take the natural join of two relations, only one semijoin is useful. The same holds for an equijoin, since we can act as if the equated pairs of attributes had the same name and treat the equijoin as if i\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 58.93, "y": -339.16, "z": 221.92, "jx": 0.0, "jy": 18075.0, "ch": "DBMS 20"}, {"id": "dbms-2044-acyclic-hypergraphs", "c": 3, "imp": 0.0, "h": 0.433, "t": "Acyclic Hypergraphs", "d": "Let us assume that we are taking a natural join of several relations, although as mentioned, we can also handle equijoins by pretending the names of equated attributes from different relations are the same, and renaming \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 78.39, "y": -279.15, "z": 178.63, "jx": -300.0, "jy": 18075.0, "ch": "DBMS 20"}, {"id": "dbms-2045-full-reducers-for-acyclic-hypergraphs", "c": 3, "imp": 0.0, "h": 0.107, "t": "Full Reducers for Acyclic Hypergraphs", "d": "We can construct a full reducer for any acyclic hypergraph by following the sequence of ear reductions. We construct the sequence of semijoins as follows, by induction on the number of hyperedges in an acyclic hypergraph\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 122.34, "y": -304.66, "z": 264.38, "jx": -75.0, "jy": 17957.0, "ch": "DBMS 20"}, {"id": "dbms-2046-w-hy-the-full-reducer-algorithm-works", "c": 3, "imp": 0.0, "h": 0.1, "t": "W hy the Full-Reducer Algorithm Works", "d": "We can show that the algorithm produces a full reducer for any acyclic hypergraph by induction on the number of hyperedges.  **BASIS:** One hyperedge. There are no dangling tuples, so nothing needs to be done.  **IN DU C\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 120.81, "y": -278.22, "z": 321.12, "jx": 675.0, "jy": 17957.0, "ch": "DBMS 20"}, {"id": "dbms-2051-supporting-distributed-atomicity", "c": 3, "imp": 0.0082, "h": 0.551, "t": "Supporting Distributed Atomicity", "d": "We shall begin with an example that illustrates the problems that might arise.  E xam ple 20.13: Consider our example of a chain of stores mentioned in Section 20.3. Suppose a manager of the chain wants to query all the \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 200.43, "y": -130.5, "z": 237.05, "jx": -525.0, "jy": 17957.0, "ch": "DBMS 20"}, {"id": "dbms-2052-two-phase-commit", "c": 3, "imp": 0.0455, "h": 0.103, "t": "Two-Phase Commit", "d": "In order to avoid the problems suggested in Section 20.5.1, distributed DBMS's use a complex protocol for deciding whether or not to commit a distributed transaction. In this section, we shall describe the basic idea beh\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 267.83, "y": -61.35, "z": 236.25, "jx": 75.0, "jy": 17721.0, "ch": "DBMS 20"}, {"id": "dbms-2053-recovery-of-distributed-transactions", "c": 3, "imp": 0.0082, "h": 0.069, "t": "Recovery of Distributed Transactions", "d": "At any time during the two-phase commit process, a site may fail. We need to make sure that what happens when the site recovers is consistent with the  global decision that was made about a distributed transaction *T.* T\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 284.22, "y": -63.35, "z": 282.39, "jx": 675.0, "jy": 17839.0, "ch": "DBMS 20"}, {"id": "dbms-2061-centralized-lock-systems", "c": 3, "imp": 0.0082, "h": 0.633, "t": "Centralized Lock Systems", "d": "Perhaps the simplest approach is to designate one site, the *lock site,* to maintain a lock table for logical elements, whether or not they have copies at that site. When a transaction wants a lock on logical element *X \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 227.74, "y": -67.14, "z": 231.37, "jx": -375.0, "jy": 17957.0, "ch": "DBMS 20"}, {"id": "dbms-2062-a-cost-model-for-distributed-locking-algorithms", "c": 3, "imp": 0.0, "h": 0.879, "t": "A Cost Model for Distributed Locking Algorithms", "d": "Suppose that each data element exists at exactly one site (i.e., there is no data replication) and that the lock manager at each site stores locks and lock requests for the elements at its site. Transactions may be distr\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 227.12, "y": -115.34, "z": 220.4, "jx": -675.0, "jy": 17957.0, "ch": "DBMS 20"}, {"id": "dbms-2063-locking-replicated-elements", "c": 3, "imp": 0.0, "h": 0.723, "t": "Locking Replicated Elements", "d": "When an element *X* has replicas at several sites, we must be careful how we interpret the locking of *X .*  E xam ple 20.17: Suppose there are two copies, *X i* and *X 2,* of a database element *X .* Suppose also that a\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 208.26, "y": -90.61, "z": 257.34, "jx": -450.0, "jy": 18075.0, "ch": "DBMS 20"}, {"id": "dbms-2064-primary-copy-locking", "c": 3, "imp": 0.0, "h": 0.121, "t": "Primary-Copy Locking", "d": "An improvement on the centralized locking approach, one which also allows replicated data, is to distribute the function of the lock site, but still maintain the principle that each logical element has a single site resp\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 272.24, "y": -137.95, "z": 269.67, "jx": -675.0, "jy": 17839.0, "ch": "DBMS 20"}, {"id": "dbms-2065-global-locks-from-local-locks", "c": 3, "imp": 0.0, "h": 0.918, "t": "Global Locks From Local Locks", "d": "Another approach is to synthesize global locks from collections of local locks. In these schemes, no copy of a database element *X* is \"primary\"; rather they are symmetric, and local shared or exclusive locks can be requ\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 269.85, "y": -49.54, "z": 201.0, "jx": -225.0, "jy": 17957.0, "ch": "DBMS 20"}, {"id": "dbms-2071-peer-to-peer-networks", "c": 3, "imp": 0.0213, "h": 0.105, "t": "Peer-to-Peer Networks", "d": "A *peer-to-peer* network is a collection of *nodes* or *peers* (participating machines) that:  - 1. Are *autonomous:* participants do not respect any central control and can join or leave the network at will. - **2**. Ar\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 189.54, "y": -184.32, "z": 299.07, "jx": -75.0, "jy": 17839.0, "ch": "DBMS 20"}, {"id": "dbms-2072-the-distributed-hashing-problem", "c": 3, "imp": 0.0559, "h": 0.055, "t": "The Distributed-Hashing Problem", "d": "Early peer-to-peer networks such as Napster used a centralized table that told where data elements could be found. Later systems distributed the function of locating elements, either by replication or division of the tas\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 225.04, "y": -160.05, "z": 306.57, "jx": 225.0, "jy": 17957.0, "ch": "DBMS 20"}, {"id": "dbms-2073-centralized-solutions-for-distributed-hashing", "c": 3, "imp": 0.0, "h": 0.172, "t": "Centralized Solutions for Distributed Hashing", "d": "If the set of participants in the network is fixed once and for all, or the set of participants changes slowly, then there are straightforward ways to manage lookup of keys. For example, we could use a hash function *h* \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 228.73, "y": -245.29, "z": 301.36, "jx": 375.0, "jy": 17957.0, "ch": "DBMS 20"}, {"id": "dbms-2074-chord-circles", "c": 3, "imp": 0.0, "h": 0.056, "t": "Chord Circles", "d": "We shall now describe one of several possible algorithms for distributed hashing, an algorithm with the desirable property that it uses a number of messages that is logarithmic in the number of peers. In addition, the am\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 243.15, "y": -173.49, "z": 338.67, "jx": 150.0, "jy": 18075.0, "ch": "DBMS 20"}, {"id": "dbms-2075-links-in-chord-circles", "c": 3, "imp": 0.0082, "h": 0.059, "t": "Links in Chord Circles", "d": "Each node around the circle stores links to its predecessor and successor. Thus, for example, in Fig. 20.14, *Ni* has successor *Ns* and predecessor iV56. These links are sufficient to send messages around the circle to \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 254.34, "y": -121.6, "z": 322.14, "jx": 300.0, "jy": 18075.0, "ch": "DBMS 20"}, {"id": "dbms-2076-search-using-finger-tables", "c": 3, "imp": 0.0, "h": 0.089, "t": "Search Using Finger Tables", "d": "Suppose we are at node *Ni* and we want to find the key-value pair (*K* , *V)* where *h(K) \u2014 j.* We know that (*K ,V* ), if it exists, will be at the lowest-numbered node that is at least *j.6* We can use the finger tabl\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 208.8, "y": -148.63, "z": 343.24, "jx": 450.0, "jy": 18075.0, "ch": "DBMS 20"}, {"id": "dbms-2077-adding-new-nodes", "c": 3, "imp": 0.0, "h": 0.185, "t": "Adding New Nodes", "d": "Suppose a new node *Ni* (i.e., a node whose ID hashes to *i)* wants to join the network of peers. If *Ni* does not know how to communicate with any peer, it is not possible for *Ni* to join. However, if *Ni* knows even o\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 75.26, "y": -348.55, "z": 236.15, "jx": -150.0, "jy": 18075.0, "ch": "DBMS 20"}, {"id": "dbms-2078-when-a-peer-leaves-the-network", "c": 3, "imp": 0.0, "h": 0.091, "t": "When a Peer Leaves the Network", "d": "A central tenet of peer-to-peer systems is that a node cannot be compelled to participate. Thus, a node can leave the circle at any time. The simple case is when a node leaves \"gracefully,\" that is, cooperating with othe\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 277.69, "y": -85.8, "z": 315.29, "jx": 0.0, "jy": 18193.0, "ch": "DBMS 20"}, {"id": "dbms-2079-when-a-peer-fails", "c": 3, "imp": 0.0, "h": 0.143, "t": "When a Peer Fails", "d": "A harder problem occurs when a node fails, is turned off, or decides to leave without doing the \"graceful\" steps of Section 20.7.8. If the data is not replicated, then data at the failed node is now unavailable to the ne\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -320.38, "y": -277.48, "z": 155.5, "jx": 225.0, "jy": 17721.0, "ch": "DBMS 20"}, {"id": "dbms-211-w-hat-is-a-data-model", "c": 3, "imp": 0.8654, "h": 0.157, "t": "W hat is a Data Model?", "d": "A *data model* is a notation for describing data or information. The description generally consists of three parts:  1. *Structure of the data.* You may be familiar with tools in programming languages such as C or Java f\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 23.22, "y": 5.51, "z": 141.49, "jx": 0.0, "jy": 411.0, "ch": "DBMS 2"}, {"id": "dbms-2111-w-hy-information-integration", "c": 3, "imp": 0.1992, "h": 0.091, "t": "W hy Information Integration?", "d": "If we could start anew with an architecture and schema for all the data in the world, and we could put that data in a single database, there would be no need for information integration. However, in the real world, matte\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 137.35, "y": -174.93, "z": -174.56, "jx": 150.0, "jy": 18486.0, "ch": "DBMS 21"}, {"id": "dbms-2112-the-heterogeneity-problem", "c": 3, "imp": 0.0644, "h": 0.163, "t": "The Heterogeneity Problem", "d": "When we try to connect information sources that were developed independently, we invariably find that the sources differ in many ways, even if they are intended to store the same kinds of data. Such sources are called *h\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 169.03, "y": -215.32, "z": -186.86, "jx": 525.0, "jy": 18604.0, "ch": "DBMS 21"}, {"id": "dbms-212-important-data-models", "c": 3, "imp": 0.0236, "h": 0.145, "t": "Important Data Models", "d": "Today, the two data models of preeminent importance for database systems are:  - 1. The relational model, including object-relational extensions. - 2. The semistructured-data model, including XML and related standards.  \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 21.7, "y": -32.22, "z": 183.19, "jx": -225.0, "jy": 529.0, "ch": "DBMS 2"}, {"id": "dbms-2121-federated-database-systems", "c": 3, "imp": 0.0183, "h": 0.054, "t": "Federated Database Systems", "d": "Perhaps the simplest architecture for integrating several databases is to implement one-to-one connections between all pairs of databases that need to talk to one another. These connections allow one database system *D\\*\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 179.7, "y": -158.44, "z": -205.15, "jx": 375.0, "jy": 18604.0, "ch": "DBMS 21"}, {"id": "dbms-2122-data-warehouses", "c": 3, "imp": 0.0942, "h": 0.121, "t": "Data Warehouses", "d": "In the *data warehouse* integration architecture, data from several sources is extracted and combined into a *global* schema. The data is then stored at the warehouse, which looks to the user like an ordinary database. T\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 133.96, "y": -177.91, "z": -214.81, "jx": 225.0, "jy": 18604.0, "ch": "DBMS 21"}, {"id": "dbms-2123-mediators", "c": 3, "imp": 0.0916, "h": 0.193, "t": "Mediators", "d": "A mediator supports a virtual view, or collection of views, that integrates several sources in much the same way that the materialized relation (s) in a warehouse integrate sources. However, since the mediator doesn't st\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 157.35, "y": -184.63, "z": -253.9, "jx": 75.0, "jy": 18722.0, "ch": "DBMS 21"}, {"id": "dbms-213-the-relational-model-in-brief", "c": 3, "imp": 0.8663, "h": 0.088, "t": "The Relational Model in Brief", "d": "The relational model is based on tables, of which Fig. 2.1 is an example. We shall discuss this model beginning in Section 2.2. This relation, or table, describes movies: their title, the year in which they were made, th\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -18.63, "y": -22.81, "z": 152.0, "jx": 75.0, "jy": 529.0, "ch": "DBMS 2"}, {"id": "dbms-2131-templates-for-query-patterns", "c": 3, "imp": 0.0637, "h": 0.124, "t": "Templates for Query Patterns", "d": "A systematic way to design a wrapper that connects a mediator to a source is to classify the possible queries that the mediator can ask into *templates,* which are queries with parameters that represent constants. The me\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 196.07, "y": -205.54, "z": -226.75, "jx": 225.0, "jy": 18840.0, "ch": "DBMS 21"}, {"id": "dbms-2132-wrapper-generators", "c": 3, "imp": 0.0, "h": 0.623, "t": "Wrapper Generators", "d": "The templates defining a wrapper must be turned into code for the wrapper itself. The software that creates the wrapper is called a *wrapper generator;* it is similar in spirit to the parser generators (e.g., YACC) that \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 227.29, "y": -224.62, "z": -208.8, "jx": 150.0, "jy": 18958.0, "ch": "DBMS 21"}, {"id": "dbms-2133-filters", "c": 3, "imp": 0.0151, "h": 0.845, "t": "Filters", "d": "Suppose that a wrapper on a car dealer's database has the template shown in Fig. 21.5 for finding cars by color. However, the mediator is asked to find cars of a particular model *and* color. Perhaps the wrapper has been\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 198.87, "y": -257.92, "z": -216.28, "jx": 0.0, "jy": 18958.0, "ch": "DBMS 21"}, {"id": "dbms-2134-other-operations-at-the-wrapper", "c": 3, "imp": 0.0, "h": 0.166, "t": "Other Operations at the Wrapper", "d": "It is possible to transform data in other ways at the wrapper, as long as we are sure that the source-query part of the template returns to the wrapper all the data needed in the transformation. For instance, columns may\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 125.38, "y": -196.71, "z": -281.28, "jx": 75.0, "jy": 18840.0, "ch": "DBMS 21"}, {"id": "dbms-214-the-semistructured-model-in-brief", "c": 3, "imp": 0.0, "h": 0.099, "t": "The Semistructured Model in Brief", "d": "Semistructured data resembles trees or graphs, rather than tables or arrays. The principal manifestation of this viewpoint today is XML, a way to represent data by hierarchically nested tagged elements. The tags, similar\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 40.85, "y": 27.12, "z": 105.48, "jx": 225.0, "jy": 529.0, "ch": "DBMS 2"}, {"id": "dbms-2141-the-problem-of-limited-source-capabilities", "c": 3, "imp": 0.0151, "h": 0.104, "t": "The Problem of Limited Source Capabilities", "d": "Today, many useful sources have only Web-based interfaces, even if they are, behind the scenes, an ordinary database. Web sources usually permit querying only through a query form, which does not accept arbitrary SQL que\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 181.1, "y": -262.13, "z": -182.27, "jx": 225.0, "jy": 18722.0, "ch": "DBMS 21"}, {"id": "dbms-2142-a-notation-for-describing-source-capabilities", "c": 3, "imp": 0.0967, "h": 0.062, "t": "A Notation for Describing Source Capabilities", "d": "If data is relational, or may be thought of as relational, then we can describe the legal forms of queries by *adornments.* These are sequences of codes that represent the requirements for the attributes of the relation,\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 193.81, "y": -125.61, "z": -297.19, "jx": -150.0, "jy": 18486.0, "ch": "DBMS 21"}, {"id": "dbms-2143-capability-based-query-plan-selection", "c": 3, "imp": 0.0163, "h": 0.851, "t": "Capability-Based Query-Plan Selection", "d": "Given a query at the mediator, a capability-based query optimizer first considers what queries it can ask at the sources to help answer the query. If we imagine those queries asked and answered, then we have bindings for\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 190.03, "y": -291.07, "z": -198.12, "jx": 300.0, "jy": 19076.0, "ch": "DBMS 21"}, {"id": "dbms-2144-adding-cost-based-optimization", "c": 3, "imp": 0.0183, "h": 0.06, "t": "Adding Cost-Based Optimization", "d": "The mediator's query optimizer is not done when the capabilities of the sources are examined. Having found the feasible plans, it must choose among them. Making an intelligent, cost-based optimization requires that the m\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 188.51, "y": -172.1, "z": -257.67, "jx": -75.0, "jy": 18840.0, "ch": "DBMS 21"}, {"id": "dbms-215-other-data-models", "c": 3, "imp": 0.0323, "h": 0.133, "t": "Other Data Models", "d": "There are many other models that are, or have been, associated with DBMS's. A modern trend is to add object-oriented features to the relational model. There are two effects of object-orientation on relations:  - 1. Value\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 18.01, "y": -23.98, "z": 131.79, "jx": -75.0, "jy": 529.0, "ch": "DBMS 2"}, {"id": "dbms-2151-simplified-adornment-notation", "c": 3, "imp": 0.0, "h": 0.942, "t": "Simplified Adornment Notation", "d": "The Chain Algorithm concerns itself with Datalog rules and with whether prior source requests have provided bindings for any of the variables in the body of the rule. Since we care only about whether we have found all po\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 239.39, "y": -155.37, "z": -212.82, "jx": -150.0, "jy": 19076.0, "ch": "DBMS 21"}, {"id": "dbms-2152-obtaining-answers-for-subgoals", "c": 3, "imp": 0.0361, "h": 0.198, "t": "Obtaining Answers for Subgoals", "d": "We now need to formalize the comments made at the beginning of Section 21.5.1 about when a subgoal with some of its arguments bound can be answered by a source query. Suppose we have a subgoal *R XlX2'\"Xn(ai,a<sup>2</sup\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 227.5, "y": -91.85, "z": -325.05, "jx": -375.0, "jy": 18604.0, "ch": "DBMS 21"}, {"id": "dbms-2153-the-chain-algorithm", "c": 3, "imp": 0.067, "h": 0.584, "t": "The Chain Algorithm", "d": "The *Chain Algorithm* is a greedy approach to selecting an order in which we obtain relations for each of the subgoals of a Datalog rule. It is not guaranteed to provide the most efficient solution, but it will provide a\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 218.39, "y": -153.7, "z": -251.59, "jx": -150.0, "jy": 18958.0, "ch": "DBMS 21"}, {"id": "dbms-2154-incorporating-union-views-at-the-mediator", "c": 3, "imp": 0.0, "h": 0.749, "t": "Incorporating Union Views at the Mediator", "d": "In our description of the Chain Algorithm, we assumed that each predicate in the Datalog query at the mediator was a \"view\" of data at one particular source. However, it is common for there to be several sources that can\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 254.54, "y": -175.28, "z": -242.49, "jx": -300.0, "jy": 19076.0, "ch": "DBMS 21"}, {"id": "dbms-216-comparison-of-modeling-approaches", "c": 3, "imp": 0.0, "h": 0.117, "t": "Comparison of Modeling Approaches", "d": "Even from our brief example, it appears that semistructured models have more flexibility than relations. This difference becomes even more apparent when we discuss, as we shall, how full graph structures are embedded int\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 49.11, "y": 39.68, "z": 127.15, "jx": -375.0, "jy": 529.0, "ch": "DBMS 2"}, {"id": "dbms-2161-motivation-for-lav-mediators", "c": 3, "imp": 0.0, "h": 0.113, "t": "Motivation for LAV Mediators", "d": "In many applications, GAV mediators are easy to construct. You decide on the global predicates or relations that the mediator will support, and for each source, you consider which predicates it can support, and how it ca\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 160.67, "y": -151.98, "z": -287.26, "jx": -225.0, "jy": 18840.0, "ch": "DBMS 21"}, {"id": "dbms-2162-terminology-for-lav-mediation", "c": 3, "imp": 0.0116, "h": 0.82, "t": "Terminology for LAV Mediation", "d": "LAV mediators are always defined using a form of logic that serves as the language for defining views. In our presentation, we shall use Datalog. Both the queries at the mediator and the queries (view definitions) that d\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 217.61, "y": -138.22, "z": -298.13, "jx": 0.0, "jy": 19076.0, "ch": "DBMS 21"}, {"id": "dbms-2163-expanding-solutions", "c": 3, "imp": 0.0082, "h": 0.889, "t": "Expanding Solutions", "d": "Given a query *Q,* a solution *S* has a body whose subgoals are views, and each view *V* is defined by a conjunctive query with that view as the head. We can substitute the body of V's conjunctive query for a subgoal in \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 204.91, "y": -113.4, "z": -337.09, "jx": -75.0, "jy": 19194.0, "ch": "DBMS 21"}, {"id": "dbms-2164-containment-of-conjunctive-queries", "c": 3, "imp": 0.0082, "h": 0.068, "t": "Containment of Conjunctive Queries", "d": "In order for a conjunctive query *S* to be a solution to the given mediator query *Q,* the expansion of *S,* say *E,* must produce only answers that *Q* produces, regardless of what relations are represented by the predi\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 168.03, "y": -109.7, "z": -331.55, "jx": -525.0, "jy": 18604.0, "ch": "DBMS 21"}, {"id": "dbms-2165-why-the-containment-mapping-test-works", "c": 3, "imp": 0.0, "h": 0.668, "t": "Why the Containment-Mapping Test Works", "d": "We need to argue two points. First, if there is a containment mapping, why must there be a containment of conjunctive queries? Second, if there is containment, why must there be a containment mapping? We shall not give f\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 176.63, "y": -104.48, "z": -358.27, "jx": 0.0, "jy": 19312.0, "ch": "DBMS 21"}, {"id": "dbms-2166-finding-solutions-to-a-mediator-query", "c": 3, "imp": 0.0, "h": 0.699, "t": "Finding Solutions to a Mediator Query", "d": "We have one more issue to resolve. We are given a mediator query *Q,* and we need to find all solutions *S* such that the expansion *E* of *S* is contained in *Q.* But there could be an infinite number of *S* built from \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 185.99, "y": -328.12, "z": -194.23, "jx": 75.0, "jy": 19194.0, "ch": "DBMS 21"}, {"id": "dbms-2167-why-the-lmss-theorem-holds", "c": 3, "imp": 0.0, "h": 0.08, "t": "Why the LMSS Theorem Holds", "d": "Suppose we have a query *Q* with *n* subgoals, and there is a solution *S* with more than *n* subgoals. The expansion *E* of *S* must be contained in query *Q,* which means that there is a containment mapping from *Q* to\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 223.7, "y": -66.77, "z": -353.44, "jx": -75.0, "jy": 18722.0, "ch": "DBMS 21"}, {"id": "dbms-2171-deciding-w-hether-records-represent-a-common-entity", "c": 3, "imp": 0.0652, "h": 0.087, "t": "Deciding W hether Records Represent a Common Entity", "d": "Imagine we have a collection of records that represent members of an entity set. These records may be tuples derived from several different sources, or even from one source. We only need to know that the records each hav\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 308.28, "y": -80.47, "z": -281.71, "jx": 0.0, "jy": 18486.0, "ch": "DBMS 21"}, {"id": "dbms-2172-merging-similar-records", "c": 3, "imp": 0.0, "h": 0.183, "t": "Merging Similar Records", "d": "In many applications, when we find two records that are similar enough to merge, we would like to replace them by a single record that, in some sense, contains the information of both. For instance, if we want to compile\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 338.23, "y": -52.93, "z": -283.23, "jx": -225.0, "jy": 18604.0, "ch": "DBMS 21"}, {"id": "dbms-2173-useful-properties-of-similarity-and-merge-functions", "c": 3, "imp": 0.0, "h": 0.099, "t": "Useful Properties of Similarity and Merge Functions", "d": "Any choice of similarity and merge functions allows us to test pairs of records for similarity and merge them if so. As we saw in the first part of Example 21.22, the result we get when no more records can be merged may \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 328.99, "y": -68.27, "z": -259.29, "jx": 75.0, "jy": 18604.0, "ch": "DBMS 21"}, {"id": "dbms-2174-the-r-swoosh-algorithm-for-icar-records", "c": 3, "imp": 0.0, "h": 0.947, "t": "The R-Swoosh Algorithm for ICAR Records", "d": "When the similarity and merge functions satisfy the ICAR properties, there is a simple algorithm that merges all possible records. The representability property guarantees that if two records are similar, then as they ar\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 268.47, "y": -117.16, "z": -261.52, "jx": 150.0, "jy": 19076.0, "ch": "DBMS 21"}, {"id": "dbms-2175-w-hy-r-swoosh-works", "c": 3, "imp": 0.0, "h": 0.085, "t": "W hy R-Swoosh Works", "d": "Recall that for ICAR similarity and merge functions, the goal is to merge records that form connected components. There is a loop invariant that holds for the while-loop of Fig. 21.14:  \u2022 If a connected component *C* is \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 271.88, "y": -82.25, "z": -307.81, "jx": -225.0, "jy": 18722.0, "ch": "DBMS 21"}, {"id": "dbms-2176-other-approaches-to-entity-resolution", "c": 3, "imp": 0.0, "h": 0.148, "t": "Other Approaches to Entity Resolution", "d": "There are many other algorithms known to discover and (optionally) merge similar records. We shall outline some of them briefly here.", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 335.39, "y": -78.21, "z": -298.79, "jx": -75.0, "jy": 18604.0, "ch": "DBMS 21"}, {"id": "dbms-221-attributes", "c": 3, "imp": 1.0, "h": 0.065, "t": "Attributes", "d": "The columns of a relation are named by *attributes-,* in Fig. 2.3 the attributes are t i t l e , year, length, and genre. Attributes appear at the tops of the columns. Usually, an attribute describes the meaning of entri\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -44.69, "y": -69.57, "z": 162.3, "jx": 0.0, "jy": 647.0, "ch": "DBMS 2"}, {"id": "dbms-2211-the-market-basket-model", "c": 3, "imp": 0.1601, "h": 0.173, "t": "The Market-Basket Model", "d": "In several important applications, the data involves a set of *items,* perhaps all the items that a supermarket sells, and a set of *baskets-,* each basket is a subset of the set of items, typically a small subset. The b\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -109.7, "y": 413.17, "z": 23.2, "jx": 150.0, "jy": 19605.0, "ch": "DBMS 22"}, {"id": "dbms-2212-basic-definitions", "c": 3, "imp": 0.0232, "h": 0.187, "t": "Basic Definitions", "d": "Suppose we are given a set of items *I* and a set of baskets *B.* Each basket *b* in *B* is a subset of *I.* To talk about frequent sets of items, we need a *support threshold s,* which an integer. We say a set of items \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -159.33, "y": 402.18, "z": 13.32, "jx": 225.0, "jy": 19723.0, "ch": "DBMS 22"}, {"id": "dbms-2213-association-rules", "c": 3, "imp": 0.0, "h": 0.094, "t": "Association Rules", "d": "A natural query about market-basket data asks for implications among purchases that people make. That is, we want to find pairs of items such that people buying the first are likely to buy the second as well. More genera\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -79.48, "y": 401.41, "z": 45.85, "jx": 75.0, "jy": 19723.0, "ch": "DBMS 22"}, {"id": "dbms-2214-the-computation-model-for-frequent-itemsets", "c": 3, "imp": 0.0331, "h": 0.078, "t": "The Computation Model for Frequent Itemsets", "d": "Since we are studying database systems, our first thought might be that the market-basket data is stored in a relation such as:  ``` Baskets(basket, item) ```  consisting of pairs that are a basket ID and the ID of one o\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -88.18, "y": 406.94, "z": 2.12, "jx": 375.0, "jy": 19723.0, "ch": "DBMS 22"}, {"id": "dbms-222-schemas", "c": 3, "imp": 0.0747, "h": 0.137, "t": "Schemas", "d": "The name of a relation and the set of attributes for a relation is called the *schema* for that relation. We show the schema for the relation with the relation name followed by a parenthesized list of its attributes. Thu\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 9.69, "y": -96.72, "z": 178.59, "jx": 150.0, "jy": 765.0, "ch": "DBMS 2"}, {"id": "dbms-2221-the-distribution-of-frequent-item-sets", "c": 3, "imp": 0.0, "h": 0.106, "t": "The Distribution of Frequent Item sets", "d": "If we pick a support threshold *s =* 1, then all itemsets that appear in any basket are \"frequent,\" so just producing the answer could be infeasible. However, in applications such as managing sales at a store, a small su\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -104.5, "y": 411.43, "z": 59.52, "jx": 525.0, "jy": 19723.0, "ch": "DBMS 22"}, {"id": "dbms-2222-the-naive-algorithm-for-finding-frequent-itemsets", "c": 3, "imp": 0.0361, "h": 0.117, "t": "The Naive Algorithm for Finding Frequent Itemsets", "d": "Let us suppose that there is some fixed number of bytes of main memory *M ,* perhaps a gigabyte, or 16 gigabytes, or whatever our machine has. Let there be *k* different items in our market-basket dataset, and assume the\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -104.2, "y": 441.19, "z": -16.21, "jx": 675.0, "jy": 19723.0, "ch": "DBMS 22"}, {"id": "dbms-2223-the-a-priori-algorithm", "c": 3, "imp": 0.0198, "h": 0.167, "t": "The A-Priori Algorithm", "d": "The A-Priori Algorithm is a method for finding frequent itemsets of size n, for any n, in *n* passes. It normally uses much less main memory than the naive algorithm, and it is certain to use less memory if the support t\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -90.97, "y": 422.01, "z": -33.52, "jx": 225.0, "jy": 19841.0, "ch": "DBMS 22"}, {"id": "dbms-2224-implementation-of-the-a-priori-algorithm", "c": 3, "imp": 0.0082, "h": 0.066, "t": "Implementation of the A-Priori Algorithm", "d": "Figure 22.4 is just an outline of the algorithm. We must consider carefully how the steps are implemented. The heart of the algorithm is line (3), which we shall implement, each time through, by a single pass through the\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -196.22, "y": 392.07, "z": -4.66, "jx": 75.0, "jy": 19841.0, "ch": "DBMS 22"}, {"id": "dbms-2225-making-better-use-of-main-memory", "c": 3, "imp": 0.0, "h": 0.143, "t": "Making Better Use of Main Memory", "d": "We expect that the memory bottleneck comes on the second pass of Algorithm 22.4, that is, at the execution of line (3) of Fig. 22.4 with *n \u2014* 2. That is, we assume counting candidate pairs takes more space than counting\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -71.63, "y": 446.57, "z": -28.2, "jx": 150.0, "jy": 19959.0, "ch": "DBMS 22"}, {"id": "dbms-2226-w-hen-to-use-the-pc-y-algorithm", "c": 3, "imp": 0.0082, "h": 0.105, "t": "W hen to Use the PC Y Algorithm", "d": "In the PCY Algorithm, the set of candidate pairs is sufficiently irregular that we cannot use the triangular-matrix method for organizing counts; we must use a table of counts. Thus, it does not make sense to use PCY unl\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -122.9, "y": 423.26, "z": -53.94, "jx": 300.0, "jy": 19959.0, "ch": "DBMS 22"}, {"id": "dbms-2227-the-m-ultistage-algorithm", "c": 3, "imp": 0.0, "h": 0.081, "t": "The M ultistage Algorithm", "d": "Instead of counting pairs on the second pass, as we do in A-Priori or PCY, we could use the same bucketing technique (with a different hash function) on the second pass. To make the average counts even smaller on the sec\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -92.22, "y": 476.86, "z": -13.29, "jx": 375.0, "jy": 19841.0, "ch": "DBMS 22"}, {"id": "dbms-223-tuples", "c": 3, "imp": 0.4659, "h": 0.14, "t": "Tuples", "d": "The rows of a relation, other than the header row containing the attribute names, are called *tuples.* A tuple has one *component* for each attribute of the relation. For instance, the first of the three tuples in Fig. 2\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 1.4, "y": -131.23, "z": 146.2, "jx": 300.0, "jy": 765.0, "ch": "DBMS 2"}, {"id": "dbms-2231-the-jaccard-measure-of-similarity", "c": 3, "imp": 0.1715, "h": 0.081, "t": "The Jaccard Measure of Similarity", "d": "Our starting point is to define exactly what we mean by \"similar\" items. Since we are interested in finding items that tend to appear together in the same baskets, the natural viewpoint is that each item is a set: the se\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -230.51, "y": 353.49, "z": -164.05, "jx": 0.0, "jy": 19605.0, "ch": "DBMS 22"}, {"id": "dbms-2232-applications-of-jaccard-similarity", "c": 3, "imp": 0.0163, "h": 0.099, "t": "Applications of Jaccard Similarity", "d": "A number of important data-mining problems can be expressed as finding sets with high Jaccard similarity. We shall discuss two of them in detail here.", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -255.13, "y": 321.33, "z": -192.04, "jx": -675.0, "jy": 19723.0, "ch": "DBMS 22"}, {"id": "dbms-2233-minhashing", "c": 3, "imp": 0.0744, "h": 0.078, "t": "Minhashing", "d": "Computing the Jaccard similarity of two large sets is time consuming. Moreover, even if we can compute similarities efficiently, a large dataset has fax too many pairs of sets for us to compute the similarity of every pa\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -200.82, "y": 376.46, "z": -119.21, "jx": -375.0, "jy": 19723.0, "ch": "DBMS 22"}, {"id": "dbms-2234-minhashing-and-jaccard-distance", "c": 3, "imp": 0.0, "h": 0.081, "t": "Minhashing and Jaccard Distance", "d": "There is a surprising relationship between the minhash values and the Jaccard similarity:  \u2022 If we choose a permutation at random, the probability that it will produce the same minhash values for two sets is the same as \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -207.91, "y": 363.61, "z": -194.59, "jx": -225.0, "jy": 19723.0, "ch": "DBMS 22"}, {"id": "dbms-2235-why-minhashing-works", "c": 3, "imp": 0.0, "h": 0.132, "t": "Why Minhashing Works", "d": "To see why the Jaccard similarity is the probability that two sets have the same minhash value according to a randomly chosen permutation of elements, let *S*  and *T* be two sets. Imagine going down the list of elements\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -240.77, "y": 363.45, "z": -199.02, "jx": -75.0, "jy": 19723.0, "ch": "DBMS 22"}, {"id": "dbms-2236-implementing-minhashing", "c": 3, "imp": 0.0, "h": 0.065, "t": "Implementing Minhashing", "d": "While we have spoken of choosing a random permutation of all possible elements, it is not feasible to do so. It would take far too long, and we might have to deal with elements that appeared in none of our sets. Rather, \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -161.22, "y": 401.86, "z": -89.56, "jx": 75.0, "jy": 20077.0, "ch": "DBMS 22"}, {"id": "dbms-224-domains", "c": 3, "imp": 0.0171, "h": 0.133, "t": "Domains", "d": "The relational model requires that each component of each tuple be atomic; that is, it must be of some elementary type such as integer or string. It is not permitted for a value to be a record structure, set, list, array\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 17.07, "y": -88.33, "z": 197.14, "jx": -150.0, "jy": 883.0, "ch": "DBMS 2"}, {"id": "dbms-2241-entity-resolution-as-an-example-of-lsh", "c": 3, "imp": 0.0151, "h": 0.064, "t": "Entity Resolution as an Example of LSH", "d": "Recall our discussion of entity resolution in Section 21.7. There, we had a large collection of records, and we needed to find similar pairs. The notion of \"similarity\" was not Jaccard similarity, and in fact we left ope\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -254.72, "y": 340.3, "z": -133.32, "jx": -525.0, "jy": 19723.0, "ch": "DBMS 22"}, {"id": "dbms-2242-locality-sensitive-hashing-of-signatures", "c": 3, "imp": 0.0, "h": 0.154, "t": "Locality-Sensitive Hashing of Signatures", "d": "The use of locality-sensitive hashing in Example 22.10 is relatively straightforward. For a more subtle applicatio
