olean-operations", "c": 3, "imp": 0.0, "h": 0.72, "t": "Boolean Operations", "d": "The boolean operations of relational algebra \u2014 union, intersection, and set difference \u2014 can each be expressed simply in Datalog. Here are the three techniques needed. We assume *R* and *S* are relations with the same nu\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -36.35, "y": -271.09, "z": 6.56, "jx": -225.0, "jy": 4004.0, "ch": "DBMS 5"}, {"id": "dbms-542-projection", "c": 3, "imp": 0.0894, "h": 0.089, "t": "Projection", "d": "To compute a projection of a relation *R,* we use one rule with a single subgoal with predicate *R.* The arguments of this subgoal are distinct variables, one for each attribute of the relation. The head has an atom with\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -1.89, "y": -206.4, "z": 84.11, "jx": 0.0, "jy": 3414.0, "ch": "DBMS 5"}, {"id": "dbms-543-selection", "c": 3, "imp": 0.038, "h": 0.836, "t": "Selection", "d": "Selections can be somewhat more difficult to express in Datalog. The simple case is when the selection condition is the AND of one or more arithmetic comparisons. In that case, we create a rule with  1. One relational su\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 62.32, "y": -222.35, "z": 35.69, "jx": 75.0, "jy": 4004.0, "ch": "DBMS 5"}, {"id": "dbms-544-product", "c": 3, "imp": 0.0402, "h": 0.098, "t": "Product", "d": "The product of two relations *R x S* can be expressed by a single Datalog rule. This rule has two subgoals, one for *R* and one for *S.* Each of these subgoals has distinct variables, one for each attribute of *R* or *S.\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 83.26, "y": -182.51, "z": 75.96, "jx": 75.0, "jy": 3768.0, "ch": "DBMS 5"}, {"id": "dbms-545-joins", "c": 3, "imp": 0.0495, "h": 0.751, "t": "Joins", "d": "We can take the natural join of two relations by a Datalog rule that looks much like the rule for a product. The difference is that if we want *R* ix *S,* then we must use the same variable for attributes of *R* and *S* \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 81.64, "y": -241.12, "z": 120.71, "jx": 0.0, "jy": 4240.0, "ch": "DBMS 5"}, {"id": "dbms-546-simulating-multiple-operations-with-datalog", "c": 3, "imp": 0.0, "h": 0.797, "t": "Simulating Multiple Operations with Datalog", "d": "Datalog rules are not only capable of mimicking a single operation of relational algebra. We can in fact mimic any algebraic expression. The trick is to look at the expression tree for the relational-algebra expression a\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -29.52, "y": -246.5, "z": -14.04, "jx": 225.0, "jy": 4004.0, "ch": "DBMS 5"}, {"id": "dbms-547-comparison-between-datalog-and-relational-algebra", "c": 3, "imp": 0.0, "h": 0.112, "t": "Comparison Between Datalog and Relational Algebra", "d": "We see from Section 5.4.6 that every expression in the basic relational algebra of Section 2.4 can be expressed as a Datalog query. There are operations in the extended relational algebra, such as grouping and aggregatio\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 110.52, "y": -120.03, "z": 18.53, "jx": 150.0, "jy": 3650.0, "ch": "DBMS 5"}, {"id": "dbms-611-projection-in-sql", "c": 3, "imp": 0.0979, "h": 0.166, "t": "Projection in SQL", "d": "We can, if we wish, eliminate some of the components of the chosen tuples; that is, we can project the relation produced by a SQL query onto some of its attributes. In place of the \\* of the SELECT clause, we may list so\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 156.61, "y": -60.17, "z": 220.57, "jx": 75.0, "jy": 4651.0, "ch": "DBMS 6"}, {"id": "dbms-612-selection-in-sql", "c": 3, "imp": 0.1417, "h": 0.156, "t": "Selection in SQL", "d": "The selection operator of relational algebra, and much more, is available through the WHERE clause of SQL. The expressions that may follow WHERE include conditional expressions like those found in common languages such a\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 143.33, "y": -78.7, "z": 122.73, "jx": 225.0, "jy": 4651.0, "ch": "DBMS 6"}, {"id": "dbms-613-comparison-of-strings", "c": 3, "imp": 0.0082, "h": 0.637, "t": "Comparison of Strings", "d": "Two strings are equal if they are the same sequence of characters. Recall from Section 2.3.2 that strings can be stored as fixed-length strings, using CHAR, or variable-length strings, using VARCHAR. When comparing strin\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 175.44, "y": -37.26, "z": 134.96, "jx": 0.0, "jy": 4769.0, "ch": "DBMS 6"}, {"id": "dbms-614-pattern-matching-in-sql", "c": 3, "imp": 0.0229, "h": 0.586, "t": "Pattern Matching in SQL", "d": "SQL also provides the capability to compare strings on the basis of a simple pattern match. An alternative form of comparison expression is", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 166.44, "y": -77.58, "z": 162.11, "jx": 300.0, "jy": 4769.0, "ch": "DBMS 6"}, {"id": "dbms-615-dates-and-times", "c": 3, "imp": 0.0, "h": 0.618, "t": "Dates and Times", "d": "Implementations of SQL generally support dates and times as special data types. These values are often representable in a variety of formats such as 05/14/1948 or 14 May 1948. Here we shall describe only the SQL standard\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 94.49, "y": -61.29, "z": 143.78, "jx": 150.0, "jy": 4769.0, "ch": "DBMS 6"}, {"id": "dbms-616-null-values-and-comparisons-involving-null", "c": 3, "imp": 0.105, "h": 0.08, "t": "Null Values and Comparisons Involving NULL", "d": "SQL allows attributes to have a special value NULL, which is called the *null value.* There are many different interpretations that can be put on null values. Here are some of the most common:  1. *Value unknown:* that i\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 183.13, "y": -80.29, "z": 145.9, "jx": -225.0, "jy": 4651.0, "ch": "DBMS 6"}, {"id": "dbms-617-the-truth-value-unknown", "c": 3, "imp": 0.0, "h": 0.941, "t": "The Truth-Value UNKNOWN", "d": "In Section 6.1.2 we assumed that the result of a comparison was either TRUE or FALSE, and these truth-values were combined in the obvious way using the logical operators AND, OR, and NOT. We have just seen that when NULL\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 195.61, "y": -37.61, "z": 147.96, "jx": -225.0, "jy": 4887.0, "ch": "DBMS 6"}, {"id": "dbms-618-ordering-the-output", "c": 3, "imp": 0.0746, "h": 0.124, "t": "Ordering the Output", "d": "We may ask that the tuples produced by a query be presented in sorted order. The order may be based on the value of any attribute, with ties broken by the value of a second attribute, remaining ties broken by a third, an\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 145.46, "y": -18.11, "z": 184.72, "jx": -75.0, "jy": 4651.0, "ch": "DBMS 6"}, {"id": "dbms-621-products-and-joins-in-sql", "c": 3, "imp": 0.066, "h": 0.17, "t": "Products and Joins in SQL", "d": "SQL has a simple way to couple relations in one query: list each relation in the FROM clause. Then, the SELECT and WHERE clauses can refer to the attributes of any of the relations in the FROM clause.  E xam ple 6.12 : S\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 149.82, "y": -105.97, "z": 181.61, "jx": -150.0, "jy": 4769.0, "ch": "DBMS 6"}, {"id": "dbms-622-disambiguating-attributes", "c": 3, "imp": 0.0348, "h": 0.748, "t": "Disambiguating Attributes", "d": "Sometimes we ask a query involving several relations, and among these relations are two or more attributes with the same name. If so, we need a way to indicate which of these attributes is meant by a use of their shared \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 164.96, "y": -103.23, "z": 176.99, "jx": -75.0, "jy": 4887.0, "ch": "DBMS 6"}, {"id": "dbms-623-tuple-variables", "c": 3, "imp": 0.042, "h": 0.883, "t": "Tuple Variables", "d": "Disambiguating attributes by prefixing the relation name works as long as the query involves combining several different relations. However, sometimes we need to ask a query that involves two or more tuples from the same\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 140.14, "y": -50.2, "z": 212.1, "jx": 0.0, "jy": 5005.0, "ch": "DBMS 6"}, {"id": "dbms-624-interpreting-m-ultirelation-queries", "c": 3, "imp": 0.0163, "h": 0.928, "t": "Interpreting M ultirelation Queries", "d": "There are several ways to define the meaning of the select-from-where expressions that we have just covered. All are *equivalent,* in the sense that they each give the same answer for each query applied to the same relat\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 143.37, "y": -15.53, "z": 269.4, "jx": 0.0, "jy": 5123.0, "ch": "DBMS 6"}, {"id": "dbms-625-union-intersection-and-difference-of-queries", "c": 3, "imp": 0.0262, "h": 0.082, "t": "Union, Intersection, and Difference of Queries", "d": "Sometimes we wish to combine relations using the set operations of relational algebra: union, intersection, and difference. SQL provides corresponding operators that apply to the results of queries, provided those querie\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 134.82, "y": -50.91, "z": 152.69, "jx": 75.0, "jy": 4887.0, "ch": "DBMS 6"}, {"id": "dbms-631-subqueries-that-produce-scalar-values", "c": 3, "imp": 0.0262, "h": 0.125, "t": "Subqueries that Produce Scalar Values", "d": "An atomic value that can appear as one component of a tuple is referred to as a *scalar.* A select-from-where expression can produce a relation with any number of attributes in its schema, and there can be any number of \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 134.25, "y": -6.02, "z": 144.81, "jx": -750.0, "jy": 4769.0, "ch": "DBMS 6"}, {"id": "dbms-632-conditions-involving-relations", "c": 3, "imp": 0.1315, "h": 0.805, "t": "Conditions Involving Relations", "d": "There are a number of SQL operators that we can apply to a relation *R* and produce a boolean result. However, the relation *R* must be expressed as a subquery. As a trick, if we want to apply these operators to a stored\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 192.33, "y": -41.78, "z": 99.68, "jx": -600.0, "jy": 4769.0, "ch": "DBMS 6"}, {"id": "dbms-633-conditions-involving-tuples", "c": 3, "imp": 0.0054, "h": 0.865, "t": "Conditions Involving Tuples", "d": "A tuple in SQL is represented by a parenthesized list of scalar values. Examples are (123, 'fo o ') and (name, address, networth). The first of these has constants as components; the second has attributes as components. \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 143.2, "y": -34.04, "z": 130.65, "jx": -300.0, "jy": 4769.0, "ch": "DBMS 6"}, {"id": "dbms-634-correlated-subqueries", "c": 3, "imp": 0.0, "h": 0.865, "t": "Correlated Subqueries", "d": "The simplest subqueries can be evaluated once and for all, and the result used in a higher-level query. A more complicated use of nested subqueries requires the subquery to be evaluated many times, once for each assignme\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 145.23, "y": 2.4, "z": 302.7, "jx": 75.0, "jy": 5241.0, "ch": "DBMS 6"}, {"id": "dbms-635-subqueries-in-from-clauses", "c": 3, "imp": 0.0, "h": 0.103, "t": "Subqueries in FROM Clauses", "d": "Another use for subqueries is as relations in a FROM clause. In a FROM list, instead of a stored relation, we may use a parenthesized subquery. Since we don't have a name for the result of this subquery, we must give it \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 155.41, "y": -19.44, "z": 228.44, "jx": -450.0, "jy": 4769.0, "ch": "DBMS 6"}, {"id": "dbms-636-sql-join-expressions", "c": 3, "imp": 0.0, "h": 0.0, "t": "SQL Join Expressions", "d": "We can construct relations by a number of variations on the join operator applied to two relations. These variants include products, natural joins, thetajoins, and outerjoins. The result can stand as a query by itself. A\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 126.02, "y": -193.03, "z": 154.8, "jx": 150.0, "jy": 5123.0, "ch": "DBMS 6"}, {"id": "dbms-637-natural-joins", "c": 3, "imp": 0.0219, "h": 0.584, "t": "Natural Joins", "d": "As we recall from Section 2.4.8, a natural join differs from a theta-join in that:  - 1. The join condition is that all pairs of attributes from the two relations having a common name are equated, and there are no other \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 156.18, "y": -181.05, "z": 153.88, "jx": 150.0, "jy": 5005.0, "ch": "DBMS 6"}, {"id": "dbms-638-outerjoins", "c": 3, "imp": 0.0041, "h": 0.054, "t": "Outerjoins", "d": "The outerjoin operator was introduced in Section 5.2.7 as a way to augment the result of a join by the dangling tuples, padded with null values. In SQL, we can specify an outerjoin; NULL is used as the null value.  E xam\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 155.78, "y": -136.14, "z": 161.53, "jx": -375.0, "jy": 4887.0, "ch": "DBMS 6"}, {"id": "dbms-641-eliminating-duplicates", "c": 3, "imp": 0.0087, "h": 0.655, "t": "Eliminating Duplicates", "d": "As mentioned in Section 6.3.4, SQL's notion of relations differs from the abstract notion of relations presented in Section 2.2. A relation, being a set, cannot have more than one copy of any given tuple. When a SQL quer\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 100.67, "y": -71.28, "z": 171.28, "jx": -150.0, "jy": 5123.0, "ch": "DBMS 6"}, {"id": "dbms-642-duplicates-in-unions-intersections-and-differences", "c": 3, "imp": 0.022, "h": 0.125, "t": "Duplicates in Unions, Intersections, and Differences", "d": "Unlike the SELECT statement, which preserves duplicates as a default and only eliminates them when instructed to by the DISTINCT keyword, the union, intersection, and difference operations, which we introduced in Section\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 123.98, "y": -14.17, "z": 117.45, "jx": -150.0, "jy": 5005.0, "ch": "DBMS 6"}, {"id": "dbms-643-grouping-and-aggregation-in-sql", "c": 3, "imp": 0.0, "h": 0.0, "t": "Grouping and Aggregation in SQL", "d": "In Section 5.2.4, we introduced the grouping-and-aggregation operator **7** for our extended relational algebra. Recall that this operator allows us to partition  the tuples of a relation into \"groups,\" based on the valu\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 96.69, "y": -60.1, "z": 45.85, "jx": -150.0, "jy": 5477.0, "ch": "DBMS 6"}, {"id": "dbms-644-aggregation-operators", "c": 3, "imp": 0.022, "h": 0.734, "t": "Aggregation Operators", "d": "SQL uses the five aggregation operators SUM, AVG, MIN, MAX, and COUNT that we met in Section 5.2.2. These operators are used by applying them to a scalarvalued expression, typically a column name, in a SELECT clause. One\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 116.15, "y": -42.82, "z": 117.62, "jx": -75.0, "jy": 5241.0, "ch": "DBMS 6"}, {"id": "dbms-645-grouping", "c": 3, "imp": 0.0325, "h": 0.0, "t": "Grouping", "d": "To group tuples, we use a GROUP BY clause, following the WHERE clause. The keywords GROUP BY are followed by a list of *grouping* attributes. In the simplest situation, there is only one relation reference in the FROM cl\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 100.19, "y": -38.77, "z": 75.57, "jx": 0.0, "jy": 5359.0, "ch": "DBMS 6"}, {"id": "dbms-646-grouping-aggregation-and-nulls", "c": 3, "imp": 0.0253, "h": 0.679, "t": "Grouping, Aggregation, and Nulls", "d": "When tuples have nulls, there are a few rules we must remember:  - The value NULL is ignored in any aggregation. It does not contribute to a sum, average, or count of an attribute, nor can it be the minimum or maximum in\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 56.2, "y": -71.67, "z": 41.59, "jx": 0.0, "jy": 5477.0, "ch": "DBMS 6"}, {"id": "dbms-647-having-clauses", "c": 3, "imp": 0.0, "h": 0.0, "t": "HAVING Clauses", "d": "Suppose that we did not wish to include all of the producers in our table of Example 6.32. We could restrict the tuples prior to grouping in a way that would make undesired groups empty. For instance, if we only wanted t\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 119.99, "y": -56.24, "z": 87.53, "jx": 150.0, "jy": 5477.0, "ch": "DBMS 6"}, {"id": "dbms-651-insertion", "c": 3, "imp": 0.0404, "h": 0.0, "t": "Insertion", "d": "The basic form of insertion statement is:  ``` INSERT INTO R (A 1, ... , A n) VALUES (ui, ... , vn); ```  A tuple is created using the value for attribute *Ai,* for \\* = **1**,2 ,,.. , n. If the list of attributes does n\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -12.06, "y": -86.09, "z": 17.18, "jx": 0.0, "jy": 5595.0, "ch": "DBMS 6"}, {"id": "dbms-652-deletion", "c": 3, "imp": 0.0321, "h": 0.161, "t": "Deletion", "d": "The form of a deletion is", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -38.59, "y": -69.53, "z": -56.64, "jx": -375.0, "jy": 4651.0, "ch": "DBMS 6"}, {"id": "dbms-653-updates", "c": 3, "imp": 0.0116, "h": 0.0, "t": "Updates", "d": "While we might think of both insertions and deletions of tuples as \"updates\" to the database, an *update* in SQL is a very specific kind of change to the database: one or more tuples that already exist in the database ha\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 19.7, "y": -28.62, "z": -21.82, "jx": 0.0, "jy": 5713.0, "ch": "DBMS 6"}, {"id": "dbms-661-serializability", "c": 3, "imp": 0.1976, "h": 0.137, "t": "Serializability", "d": "In applications like Web services, banking, or airline reservations, hundreds of operations per second may be performed on the database. The operations initiate at any of thousands or millions of sites, such as desktop c\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 193.77, "y": -74.67, "z": -75.95, "jx": 375.0, "jy": 4651.0, "ch": "DBMS 6"}, {"id": "dbms-662-atomicity", "c": 3, "imp": 0.1315, "h": 0.119, "t": "Atomicity", "d": "In addition to nonserialized behavior that can occur if two or more database operations are performed about the same time, it is possible for a single operation to put the database in an unacceptable state if there is a \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 206.05, "y": -44.22, "z": -12.28, "jx": 450.0, "jy": 4769.0, "ch": "DBMS 6"}, {"id": "dbms-663-transactions", "c": 3, "imp": 0.2901, "h": 0.645, "t": "Transactions", "d": "The solution to the problems of serialization and atomicity posed in Sections 6.6.1 and 6.6.2 is to group database operations into *transactions.* A transaction is a collection of one or more operations on the database t\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 232.29, "y": 3.2, "z": 53.0, "jx": 225.0, "jy": 4887.0, "ch": "DBMS 6"}, {"id": "dbms-664-read-only-transactions", "c": 3, "imp": 0.0054, "h": 0.095, "t": "Read-Only Transactions", "d": "Examples 6.40 and 6.41 each involved a transaction that read and then (possibly) wrote some data into the database. This sort of transaction is prone to", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 225.06, "y": -86.92, "z": -93.55, "jx": 750.0, "jy": 4769.0, "ch": "DBMS 6"}, {"id": "dbms-665-dirty-reads", "c": 3, "imp": 0.038, "h": 0.177, "t": "Dirty Reads", "d": "*Dirty data* is a common term for data written by a transaction that has not yet committed. A *dirty read* is a read of dirty data written by another transaction. The risk in reading dirty data is that the transaction th\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 180.85, "y": -73.52, "z": -125.52, "jx": 600.0, "jy": 4769.0, "ch": "DBMS 6"}, {"id": "dbms-666-other-isolation-levels", "c": 3, "imp": 0.0, "h": 0.073, "t": "Other Isolation Levels", "d": "SQL provides a total of four *isolation levels.* Two of them we have already seen: serializable and read-uncommitted (dirty reads allowed). The other two are *read-committed* and *repeatable-read.* They can be specified \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 163.01, "y": -99.8, "z": -124.09, "jx": 375.0, "jy": 4887.0, "ch": "DBMS 6"}, {"id": "dbms-711-declaring-foreign-key-constraints", "c": 3, "imp": 0.1733, "h": 0.099, "t": "Declaring Foreign-Key Constraints", "d": "A foreign key constraint is an assertion that values for certain attributes must make sense. Recall, for instance, that in Example 2.21 we considered how to express in relational algebra the constraint that the producer \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 48.52, "y": 228.63, "z": 124.2, "jx": 0.0, "jy": 6006.0, "ch": "DBMS 7"}, {"id": "dbms-712-maintaining-referential-integrity", "c": 3, "imp": 0.0, "h": 0.074, "t": "Maintaining Referential Integrity", "d": "The schema designer may choose from among three alternatives to enforce a foreign-key constraint. We can learn the general idea by exploring Example 7.1, where it is required that a presC# value in relation Studio also b\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 31.14, "y": 256.09, "z": 141.2, "jx": 300.0, "jy": 6124.0, "ch": "DBMS 7"}, {"id": "dbms-713-deferred-checking-of-constraints", "c": 3, "imp": 0.0, "h": 0.078, "t": "Deferred Checking of Constraints", "d": "Let us assume the situation of Example 7.1, where presC# in Studio is a foreign key referencing ce rt# of MovieExec. Arnold Schwarzenegger retires as Governor of California and decides to found a movie studio, called La \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 80.99, "y": 241.56, "z": 140.73, "jx": 0.0, "jy": 6124.0, "ch": "DBMS 7"}, {"id": "dbms-721-not-null-constraints", "c": 3, "imp": 0.0, "h": 0.159, "t": "Not-Null Constraints", "d": "One simple constraint to associate with an attribute is NOT NULL. The effect is to disallow tuples in which this attribute is NULL. The constraint is declared by the keywords NOT NULL following the declaration of the att\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 59.91, "y": 254.41, "z": 116.34, "jx": 450.0, "jy": 6124.0, "ch": "DBMS 7"}, {"id": "dbms-722-attribute-based-check-constraints", "c": 3, "imp": 0.0791, "h": 0.194, "t": "Attribute-Based CHECK Constraints", "d": "More complex constraints can be attached to an attribute declaration by the keyword CHECK and a parenthesized condition that must hold for every value of this attribute. In practice, an attribute-based CHECK constraint i\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 69.4, "y": 289.73, "z": 93.48, "jx": -300.0, "jy": 6124.0, "ch": "DBMS 7"}, {"id": "dbms-723-tuple-based-check-constraints", "c": 3, "imp": 0.0163, "h": 0.108, "t": "Tuple-Based CHECK Constraints", "d": "To declare a constraint on the tuples of a single table *R,* we may add to the list of attributes and key or foreign-key declarations, in *R 's* CREATE TABLE statement, the keyword CHECK followed by a parenthesized condi\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 86.46, "y": 323.77, "z": 58.04, "jx": 225.0, "jy": 6242.0, "ch": "DBMS 7"}, {"id": "dbms-724-comparison-of-tuple-and-attribute-based-constraints", "c": 3, "imp": 0.0, "h": 0.169, "t": "Comparison of Tuple- and Attribute-Based Constraints", "d": "If a constraint on a tuple involves more than one attribute of that tuple, then it must be written as a tuple-based constraint. However, if the constraint involves only one attribute of the tuple, then it can be written \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 27.77, "y": 252.2, "z": 110.48, "jx": -150.0, "jy": 6124.0, "ch": "DBMS 7"}, {"id": "dbms-731-giving-n-ames-to-constraints", "c": 3, "imp": 0.0, "h": 0.115, "t": "Giving N ames to Constraints", "d": "In order to modify or delete an existing constraint, it is necessary that the constraint have a name. To do so, we precede the constraint by the keyword CONSTRAINT and a name for the constraint.  E xam ple 7.9: We could \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 52.72, "y": 247.77, "z": 155.62, "jx": 150.0, "jy": 6124.0, "ch": "DBMS 7"}, {"id": "dbms-732-altering-constraints-on-tables", "c": 3, "imp": 0.0, "h": 0.146, "t": "Altering Constraints on Tables", "d": "We mentioned in Section 7.1.3 that we can switch the checking of a constraint from immediate to deferred or vice-versa with a SET CONSTRAINT statement. Other changes to constraints are effected with an ALTER TABLE statem\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 22.65, "y": 132.57, "z": 131.73, "jx": -450.0, "jy": 6124.0, "ch": "DBMS 7"}, {"id": "dbms-741-creating-assertions", "c": 3, "imp": 0.0, "h": 0.081, "t": "Creating Assertions", "d": "The SQL standard proposes a simple form of *assertion* that allows us to enforce any condition (expression that can follow WHERE). Like other schema elements, we declare an assertion with a CREATE statement. The form of \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 47.27, "y": 316.37, "z": 83.78, "jx": -225.0, "jy": 6242.0, "ch": "DBMS 7"}, {"id": "dbms-742-using-assertions", "c": 3, "imp": 0.0, "h": 0.055, "t": "Using Assertions", "d": "There is a difference between the way we write tuple-based CHECK constraints and the way we write assertions. Tuple-based checks can refer directly to the attributes of that relation in whose declaration they appear. An \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 104.47, "y": 346.2, "z": 31.52, "jx": 0.0, "jy": 6360.0, "ch": "DBMS 7"}, {"id": "dbms-751-triggers-in-sql", "c": 3, "imp": 0.0, "h": 0.169, "t": "Triggers in SQL", "d": "The SQL trigger statement gives the user a number of different options in the event, condition, and action parts. Here are the principal features.  - 1. The check of the trigger's condition and the action of the trigger \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 78.24, "y": 322.91, "z": 108.77, "jx": 75.0, "jy": 6242.0, "ch": "DBMS 7"}, {"id": "dbms-752-the-options-for-trigger-design", "c": 3, "imp": 0.0, "h": 0.125, "t": "The Options for Trigger Design", "d": "Of course Example 7.13 illustrates only some of the features of SQL triggers. In the points that follow, we shall outline the options that are offered by triggers and how to express these options.  - Line (2) of Fig. 7.5\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 99.97, "y": 304.44, "z": 89.9, "jx": -75.0, "jy": 6242.0, "ch": "DBMS 7"}, {"id": "dbms-811-declaring-views", "c": 3, "imp": 0.1258, "h": 0.119, "t": "Declaring Views", "d": "The simplest form of view definition is:  CREATE VIEW <view-name> AS <view-definition>;  The view definition is a SQL query.", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -29.17, "y": -209.33, "z": -358.28, "jx": -75.0, "jy": 6653.0, "ch": "DBMS 8"}, {"id": "dbms-812-querying-views", "c": 3, "imp": 0.0116, "h": 0.141, "t": "Querying Views", "d": "A view may be queried exactly as if it were a stored table. We mention its name in a FROM clause and rely on the DBMS to produce the needed tuples by operating on the relations used to define the virtual view.  E xam ple\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -75.34, "y": -204.03, "z": -364.29, "jx": -675.0, "jy": 6771.0, "ch": "DBMS 8"}, {"id": "dbms-813-renaming-attributes", "c": 3, "imp": 0.0, "h": 0.161, "t": "Renaming Attributes", "d": "Sometimes, we might prefer to give a view's attributes names of our own choosing, rather than use the names that come out of the query defining the view. We may specify the attributes of the view by listing them, surroun\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 7.13, "y": -206.56, "z": -345.44, "jx": -525.0, "jy": 6771.0, "ch": "DBMS 8"}, {"id": "dbms-821-view-removal", "c": 3, "imp": 0.0, "h": 0.115, "t": "View Removal", "d": "An extreme modification of a view is to delete it altogether. This modification may be done whether or not the view is updatable. A typical DROP statement is", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -16.7, "y": -237.62, "z": -334.52, "jx": -75.0, "jy": 6771.0, "ch": "DBMS 8"}, {"id": "dbms-822-updatable-views", "c": 3, "imp": 0.0, "h": 0.162, "t": "Updatable Views", "d": "SQL provides a formal definition of when modifications to a view axe permitted. The SQL rules are complex, but roughly, they permit modifications on views that are defined by selecting (using SELECT, not SELECT DISTINCT)\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -35.75, "y": -244.43, "z": -372.42, "jx": -225.0, "jy": 6771.0, "ch": "DBMS 8"}, {"id": "dbms-823-instead-of-triggers-on-views", "c": 3, "imp": 0.0116, "h": 0.084, "t": "Instead-Of Triggers on Views", "d": "When a trigger is defined on a view, we can use INSTEAD OF in place of BEFORE or AFTER. If we do so, then when an event awakens the trigger, the action of the trigger is done instead of the event itself. That is, an inst\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -64.0, "y": -187.62, "z": -371.32, "jx": -825.0, "jy": 6771.0, "ch": "DBMS 8"}, {"id": "dbms-831-m-otivation-for-indexes", "c": 3, "imp": 0.0966, "h": 0.182, "t": "M otivation for Indexes", "d": "When relations are very large, it becomes expensive to scan all the tuples of a relation to find those (perhaps very few) tuples that match a given condition. For example, consider the first query we examined:  ``` SELEC\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -23.99, "y": -106.55, "z": -351.64, "jx": 75.0, "jy": 6653.0, "ch": "DBMS 8"}, {"id": "dbms-832-declaring-indexes", "c": 3, "imp": 0.0, "h": 0.155, "t": "Declaring Indexes", "d": "Although the creation of indexes is not part of any SQL standard up to and including SQL-99, most commercial systems have a way for the database designer to say that the system should create an index on a certain attribu\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -27.46, "y": -77.44, "z": -370.32, "jx": 675.0, "jy": 6771.0, "ch": "DBMS 8"}, {"id": "dbms-841-a-simple-cost-model", "c": 3, "imp": 0.0082, "h": 0.152, "t": "A Simple Cost Model", "d": "To understand how to choose indexes for a database, we first need to know where the time is spent answering a query. The details of how relations are stored will be taken up when we consider DBMS implementation. But for \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -70.26, "y": -111.17, "z": -355.9, "jx": 225.0, "jy": 6771.0, "ch": "DBMS 8"}, {"id": "dbms-842-some-useful-indexes", "c": 3, "imp": 0.0, "h": 0.118, "t": "Some Useful Indexes", "d": "Often, the most useful index we can put on a relation is an index on its key. There are two reasons:  - 1. Queries in which a value for the key is specified are common. Thus, an index on the key will get used frequently.\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 8.28, "y": -95.92, "z": -366.86, "jx": 825.0, "jy": 6771.0, "ch": "DBMS 8"}, {"id": "dbms-843-calculating-the-best-indexes-to-create", "c": 3, "imp": 0.0, "h": 0.144, "t": "Calculating the Best Indexes to Create", "d": "It might seem that the more indexes we create, the more likely it is that an index useful for a given query will be available. However, if modifications are the most frequent action, then we should be very conservative a\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 1.23, "y": -96.79, "z": -329.72, "jx": 525.0, "jy": 6771.0, "ch": "DBMS 8"}, {"id": "dbms-844-automatic-selection-of-indexes-to-create", "c": 3, "imp": 0.0, "h": 0.113, "t": "Automatic Selection of Indexes to Create", "d": "\"Tuning\" a database is a process that includes not only index selection, but the choice of many different parameters. We have not yet discussed much about  physical implementation of databases, but some examples of tunin\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -30.54, "y": -83.93, "z": -332.59, "jx": 375.0, "jy": 6771.0, "ch": "DBMS 8"}, {"id": "dbms-851-maintaining-a-materialized-view", "c": 3, "imp": 0.0082, "h": 0.157, "t": "Maintaining a Materialized View", "d": "In principle, the DBMS needs to recompute a materialized view every time one of its base tables changes in any way. For simple views, it is possible to limit the number of times we need to consider changing the materiali\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -92.44, "y": -174.78, "z": -369.35, "jx": 0.0, "jy": 6889.0, "ch": "DBMS 8"}, {"id": "dbms-852-periodic-maintenance-of-materialized-views", "c": 3, "imp": 0.0, "h": 0.088, "t": "Periodic Maintenance of Materialized Views", "d": "There is another setting in which we may use materialized views, yet not have to worry about the cost or complexity of maintaining them up-to-date as the underlying base tables change. We shall encounter the option when \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -97.65, "y": -134.65, "z": -363.2, "jx": 0.0, "jy": 7007.0, "ch": "DBMS 8"}, {"id": "dbms-853-rewriting-queries-to-use-materialized-views", "c": 3, "imp": 0.0, "h": 0.118, "t": "Rewriting Queries to Use Materialized Views", "d": "A materialized view can be referred to in the FROM clause of a query, just as a virtual view can (Section 8.1.2). However, because a materialized view is stored in the database, it is possible to rewrite a query to use a\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 0.42, "y": -235.48, "z": -366.24, "jx": -375.0, "jy": 6771.0, "ch": "DBMS 8"}, {"id": "dbms-854-automatic-creation-of-materialized-views", "c": 3, "imp": 0.0, "h": 0.111, "t": "Automatic Creation of Materialized Views", "d": "The ideas that were discussed in Section 8.4.4 for indexes can apply as well to materialized views. We first need to establish or approximate the query workload. An automated materialized-view-selection advisor needs to \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -21.36, "y": -155.5, "z": -350.39, "jx": 75.0, "jy": 6771.0, "ch": "DBMS 8"}, {"id": "dbms-911-the-web-server-tier", "c": 3, "imp": 0.169, "h": 0.19, "t": "The Web-Server Tier", "d": "The web-server processes manage the interactions with the user. When a user makes contact, perhaps by opening a URL, a web server, typically running  Apache/Tomcat, responds to the request. The user then becomes a *clien\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 216.27, "y": 260.44, "z": -114.55, "jx": 75.0, "jy": 7418.0, "ch": "DBMS 9"}, {"id": "dbms-912-the-application-tier", "c": 3, "imp": 0.16, "h": 0.148, "t": "The Application Tier", "d": "The job of the application tier is to turn data, from the database, into a response to the request that it receives from the web-server. Each web-server process can invoke one or more application-tier processes to handle\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 229.97, "y": 287.52, "z": -132.77, "jx": 150.0, "jy": 7300.0, "ch": "DBMS 9"}, {"id": "dbms-913-the-database-tier", "c": 3, "imp": 0.1248, "h": 0.108, "t": "The Database Tier", "d": "Like the other tiers, there can be many processes in the database tier, and the processes can be distributed over many machines, or all be together on one. The database tier executes queries that are requested from the a\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 137.8, "y": 217.23, "z": -65.78, "jx": 225.0, "jy": 7654.0, "ch": "DBMS 9"}, {"id": "dbms-921-environments", "c": 3, "imp": 0.1276, "h": 0.196, "t": "Environments", "d": "A *SQL environment* is the framework under which data may exist and SQL operations on data may be executed. In practice, we should think of a SQL environment as a DBMS running at some installation. For example, ABC compa\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 103.75, "y": 177.38, "z": -31.48, "jx": 300.0, "jy": 7772.0, "ch": "DBMS 9"}, {"id": "dbms-922-schemas", "c": 3, "imp": 0.2064, "h": 0.132, "t": "Schemas", "d": "The simplest form of schema declaration is:  CREATE SCHEMA <schema name> <element declarations>  The element declarations are of the forms discussed in various places, such as Sections 2.3, 8.1.1, 7.5.1, and 9.4.1.", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 78.53, "y": 114.93, "z": 32.93, "jx": 0.0, "jy": 7300.0, "ch": "DBMS 9"}, {"id": "dbms-923-catalogs", "c": 3, "imp": 0.0163, "h": 0.167, "t": "Catalogs", "d": "Just as schema elements like tables are ere: ithin a schema, schemas are created and modified within a catalog. In principle, we would expect the process of creating and populating catalogs to be analogous to the process\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 74.28, "y": 146.8, "z": -0.02, "jx": -150.0, "jy": 7890.0, "ch": "DBMS 9"}, {"id": "dbms-924-clients-and-servers-in-the-sql-environment", "c": 3, "imp": 0.0, "h": 0.758, "t": "Clients and Servers in the SQL Environment", "d": "A SQL environment is more than a collection of catalogs and schemas. It contains elements whose purpose is to support operations on the database or", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 54.67, "y": 167.0, "z": 6.78, "jx": -225.0, "jy": 8008.0, "ch": "DBMS 9"}, {"id": "dbms-925-connections", "c": 3, "imp": 0.1551, "h": 0.136, "t": "Connections", "d": "If we wish to run some program involving SQL at a host where a SQL client exists, then we may open a connection between the client and server by executing a SQL statement", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 184.12, "y": 244.91, "z": -81.81, "jx": 0.0, "jy": 7536.0, "ch": "DBMS 9"}, {"id": "dbms-926-sessions", "c": 3, "imp": 0.0054, "h": 0.158, "t": "Sessions", "d": "The SQL operations that are performed while a connection is active form a *session.* The session lasts as long as the connection that created it. For example, when a connection is made dormant, its session also becomes d\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 230.24, "y": 228.04, "z": -122.27, "jx": 150.0, "jy": 7536.0, "ch": "DBMS 9"}, {"id": "dbms-927-modules", "c": 3, "imp": 0.0877, "h": 0.146, "t": "Modules", "d": "A *module* is the SQL term for an application program. The SQL standard suggests that there are three kinds of modules, but insists only that a SQL implementation offer the user at least one of these types.  - 1. *Generi\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 126.74, "y": 172.68, "z": -0.95, "jx": 150.0, "jy": 7890.0, "ch": "DBMS 9"}, {"id": "dbms-931-the-impedance-mismatch-problem", "c": 3, "imp": 0.0577, "h": 0.128, "t": "The Impedance Mismatch Problem", "d": "The basic problem of connecting SQL statements with those of a conventional programming language is *impedance mismatch:* the fact that the data model of SQL differs so much from the models of other languages. As we know\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 193.38, "y": 221.01, "z": -41.85, "jx": 75.0, "jy": 7654.0, "ch": "DBMS 9"}, {"id": "dbms-932-connecting-sql-to-the-host-language", "c": 3, "imp": 0.0054, "h": 0.192, "t": "Connecting SQL to the Host Language", "d": "When we wish to use a SQL statement within a host-language program, we warn the preprocessor that SQL code is coming with the keywords EXEC SQL in front of the statement. We transfer information between the database, whi\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 223.31, "y": 219.05, "z": -75.54, "jx": 150.0, "jy": 7772.0, "ch": "DBMS 9"}, {"id": "dbms-933-the-declare-section", "c": 3, "imp": 0.0232, "h": 0.824, "t": "The DECLARE Section", "d": "To declare shared variables, we place their declarations between two embedded SQL statements:  ``` EXEC SQL BEGIN DECLARE SECTION; EXEC SQL END DECLARE SECTION; ```  What appears between them is called the *declare secti\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 115.99, "y": 177.45, "z": 18.26, "jx": -75.0, "jy": 8008.0, "ch": "DBMS 9"}, {"id": "dbms-934-using-shared-variables", "c": 3, "imp": 0.0963, "h": 0.164, "t": "Using Shared Variables", "d": "A shared variable can be used in SQL statements in places where we expect or allow a constant. Recall that shared variables are preceded by a colon when so used. Here is an example in which we use the variables of Exampl\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 201.86, "y": 174.47, "z": 17.83, "jx": -150.0, "jy": 7536.0, "ch": "DBMS 9"}, {"id": "dbms-935-single-row-select-statements", "c": 3, "imp": 0.0408, "h": 0.198, "t": "Single-Row Select Statements", "d": "The form of a single-row select is the same as an ordinary select-from-where statement, except that following the SELECT clause is the keyword INTO and a list of shared variables. These shared variables each are preceded\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 174.44, "y": 139.37, "z": 50.24, "jx": -75.0, "jy": 7654.0, "ch": "DBMS 9"}, {"id": "dbms-936-cursors", "c": 3, "imp": 0.0, "h": 0.058, "t": "Cursors", "d": "The most versatile way to connect SQL queries to a host language is with a cursor that runs through the tuples of a relation. This relation can be a stored table, or it can be something that is generated by a query. To c\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 222.95, "y": 210.39, "z": -11.52, "jx": 0.0, "jy": 7772.0, "ch": "DBMS 9"}, {"id": "dbms-937-modifications-by-cursor", "c": 3, "imp": 0.015, "h": 0.11, "t": "Modifications by Cursor", "d": "When a cursor ranges over the tuples of a base table (i.e., a relation that is stored in the database), then one can not only read the current tuple, but one can update or delete the current tuple. The syntax of these UP\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 230.57, "y": 135.8, "z": 29.56, "jx": -225.0, "jy": 7654.0, "ch": "DBMS 9"}, {"id": "dbms-938-protecting-against-concurrent-updates", "c": 3, "imp": 0.0161, "h": 0.717, "t": "Protecting Against Concurrent Updates", "d": "Suppose that as we examine the net worths of movie executives using the function worthRanges of Fig. 9.8, some other process is modifying the underlying MovieExec relation. What should we do about this possibility? Perha\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 215.55, "y": 81.98, "z": 32.18, "jx": -300.0, "jy": 7772.0, "ch": "DBMS 9"}, {"id": "dbms-939-dynamic-sql", "c": 3, "imp": 0.0482, "h": 0.829, "t": "Dynamic SQL", "d": "Our model of SQL embedded in a host language has been that of specific SQL queries and commands within a host-language program. An alternative style of embedded SQL has the statements themselves be computed by the host l\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 147.15, "y": 191.9, "z": -34.69, "jx": 225.0, "jy": 8008.0, "ch": "DBMS 9"}, {"id": "dbms-941-creating-psm-functions-and-procedures", "c": 3, "imp": 0.0915, "h": 0.656, "t": "Creating PSM Functions and Procedures", "d": "In PSM, you define *modules,* which are collections of function and procedure definitions, temporary relation declarations, and several other optional declarations. The major elements of a procedure declaration are:  ```\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 138.23, "y": 147.02, "z": 42.85, "jx": 75.0, "jy": 8008.0, "ch": "DBMS 9"}, {"id": "dbms-942-some-simple-statement-forms-in-psm", "c": 3, "imp": 0.0408, "h": 0.847, "t": "Some Simple Statement Forms in PSM", "d": "Let us begin with a potpourri of statement forms that are easy to master.  1. *The call-statement:* The form of a procedure call is:  CALL <procedure name> (<argument lis t> );", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 178.05, "y": 187.67, "z": 92.61, "jx": 375.0, "jy": 8126.0, "ch": "DBMS 9"}, {"id": "dbms-943-branching-statements", "c": 3, "imp": 0.0, "h": 0.761, "t": "Branching Statements", "d": "For our first complex PSM statement type, let us consider the if-statement. The form is only a little strange; it differs from C or similar languages in that:  - 1. The statement ends with keywords END IF. - 2. If-statem\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 207.88, "y": 217.02, "z": 110.11, "jx": 300.0, "jy": 8244.0, "ch": "DBMS 9"}, {"id": "dbms-944-queries-in-psm", "c": 3, "imp": 0.0, "h": 0.871, "t": "Queries in PSM", "d": "9) END IF;  There are several ways that select-from-where queries are used in PSM.  - 1. Subqueries can be used in conditions, or in general, any place a subquery is legal in SQL. We saw two examples of subqueries in lin\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 189.47, "y": 162.82, "z": 87.57, "jx": 0.0, "jy": 8244.0, "ch": "DBMS 9"}, {"id": "dbms-945-loops-in-psm", "c": 3, "imp": 0.0, "h": 0.635, "t": "Loops in PSM", "d": "The basic loop construct in PSM is:  ``` LOOP    < statement list> END LOOP; ```  One often labels the LOOP statement, so it is possible to break out of the loop, using a statement:", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 117.38, "y": 131.77, "z": 75.38, "jx": 75.0, "jy": 8126.0, "ch": "DBMS 9"}, {"id": "dbms-946-for-loops", "c": 3, "imp": 0.0, "h": 0.861, "t": "For-Loops", "d": "There is also in PSM a for-loop construct, but it is used only to iterate over a cursor. The form of the statement is shown in Fig. 9.16. This statement not only declares a cursor, but it handles for us a number of \"grub\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 155.86, "y": 143.12, "z": 73.33, "jx": -75.0, "jy": 8126.0, "ch": "DBMS 9"}, {"id": "dbms-947-exceptions-in-psm", "c": 3, "imp": 0.0, "h": 0.804, "t": "Exceptions in PSM", "d": "A SQL system indicates error conditions by setting a nonzero sequence of digits in the five-character string SQLSTATE. We have seen one example of these codes: '02000' for \"no tuple found.\" For another example, '21000' i\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 186.45, "y": 209.36, "z": 125.74, "jx": 450.0, "jy": 8244.0, "ch": "DBMS 9"}, {"id": "dbms-948-using-psm-functions-and-procedures", "c": 3, "imp": 0.0186, "h": 0.775, "t": "Using PSM Functions and Procedures", "d": "As we mentioned in Section 9.4.2, we can call a PSM procedure anywhere SQL statements can appear, e.g., as embedded SQL, from PSM code itself, or from SQL issued to the generic interface. We invoke a procedure by precedi\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 180.15, "y": 130.85, "z": -6.31, "jx": -225.0, "jy": 8126.0, "ch": "DBMS 9"}, {"id": "dbms-951-introduction-to-sqlcli", "c": 3, "imp": 0.0319, "h": 0.195, "t": "Introduction to SQL/CLI", "d": "A program written in C and using SQL/CLI (hereafter, just CLI) will include the header file s q lc li.h , from which it gets a large number of functions, type definitions, structures, and symbolic constants. The program \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 93.95, "y": 135.1, "z": -11.52, "jx": 0.0, "jy": 7890.0, "ch": "DBMS 9"}, {"id": "dbms-952-processing-statements", "c": 3, "imp": 0.0, "h": 0.0, "t": "Processing Statements", "d": "At the end of Fig. 9.19, a statement record whose handle is execStat, has been created. However, there is as yet no SQL statement with which that record is associated. The process of associating and executing SQL stateme\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 216.95, "y": 189.18, "z": -99.01, "jx": 0.0, "jy": 8598.0, "ch": "DBMS 9"}, {"id": "dbms-953-fetching-data-from-a-query-result", "c": 3, "imp": 0.0, "h": 0.876, "t": "Fetching Data From a Query Result", "d": "The function that corresponds to a FETCH command in embedded SQL or PSM is", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 174.15, "y": 159.42, "z": -37.76, "jx": -300.0, "jy": 8244.0, "ch": "DBMS 9"}, {"id": "dbms-954-passing-parameters-to-queries", "c": 3, "imp": 0.0558, "h": 0.668, "t": "Passing Parameters to Queries", "d": "Embedded SQL gives us the ability to execute a SQL statement, part of which consists of values determined by the current contents of shared variables. There is a similar capability in CLI, but it is rather more complicat\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 125.01, "y": 140.75, "z": -34.49, "jx": 225.0, "jy": 8126.0, "ch": "DBMS 9"}, {"id": "dbms-961-introduction-to-jdbc", "c": 3, "imp": 0.0368, "h": 0.6, "t": "Introduction to JDBC", "d": "The first steps we must take to use JDBC are:  1. include the line:  ``` import ja v a .s q l.* ; ```", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 105.7, "y": 91.65, "z": -46.87, "jx": 150.0, "jy": 8244.0, "ch": "DBMS 9"}, {"id": "dbms-962-creating-statements-in-jdbc", "c": 3, "imp": 0.0082, "h": 0.562, "t": "Creating Statements in JDBC", "d": "There are two methods we can apply to a Connection object in order to create statements:  - 1. createS tatem entO returns a Statement object. This object has no associated SQL statement yet, so method createS tatem entO \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 76.04, "y": 42.62, "z": -18.56, "jx": -75.0, "jy": 8362.0, "ch": "DBMS 9"}, {"id": "dbms-963-cursor-operations-in-jdbc", "c": 3, "imp": 0.0, "h": 0.527, "t": "Cursor Operations in JDBC", "d": "When we execute a query and obtain a result-set object, we may, in effect, run a cursor through the tuples of the result set. To do so, the R esultSet class provides the following useful methods:  - 1. n e x t(), when ap\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 120.73, "y": 89.06, "z": 22.4, "jx": -75.0, "jy": 8480.0, "ch": "DBMS 9"}, {"id": "dbms-964-parameter-passing", "c": 3, "imp": 0.0, "h": 0.651, "t": "Parameter Passing", "d": "As in CLI, we can use a question-mark in place of a portion of a query, and then bind values to those *parameters.* To do so in JDBC, we need to create a prepared statement, and we need to apply to that PreparedStatement\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 162.45, "y": 161.16, "z": -6.23, "jx": -150.0, "jy": 8244.0, "ch": "DBMS 9"}, {"id": "dbms-971-ph-p-basics", "c": 3, "imp": 0.1378, "h": 0.078, "t": "PH P Basics", "d": "All PHP code is intended to exist inside HTML text. A browser will recognize that text is PHP code by placing it inside a special tag, which looks like:  ``` <?php   PHP code goes here ?> ```  Many aspects of PHP, such a\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 199.25, "y": 251.39, "z": 17.25, "jx": -150.0, "jy": 7300.0, "ch": "DBMS 9"}, {"id": "dbms-972-arrays", "c": 3, "imp": 0.1429, "h": 0.158, "t": "Arrays", "d": "PHP has ordinary arrays (called *numeric),* which are indexed 0 ,1 ,... . It also has arrays that are really mappings, called *associative arrays.* The indexes *(keys)* of an associative array can be any strings, and the\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 176.12, "y": 213.09, "z": 4.71, "jx": -75.0, "jy": 7418.0, "ch": "DBMS 9"}, {"id": "dbms-973-the-pear-db-library", "c": 3, "imp": 0.0082, "h": 0.648, "t": "The PEAR DB Library", "d": "PHP has a collection of libraries called PEAR (PHP Extension and Application Repository). One of these libraries, DB, has generic functions that are analogous to the methods of JDBC. We tell the function DB:: connect whi\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 105.58, "y": 221.92, "z": 1.41, "jx": -375.0, "jy": 8126.0, "ch": "DBMS 9"}, {"id": "dbms-974-creating-a-database-connection-using-db", "c": 3, "imp": 0.0105, "h": 0.742, "t": "Creating a Database Connection Using DB", "d": "The form of an invocation of the connect function is:  ``` $myCon = DB:: connect ( < vendor> : / / Cuser nam e>: <password>               <host nam e>/<database n am e> ); ```  The components of this call are like those \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 137.97, "y": 114.58, "z": -76.79, "jx": 75.0, "jy": 8362.0, "ch": "DBMS 9"}, {"id": "dbms-975-executing-sql-statements", "c": 3, "imp": 0.0054, "h": 0.805, "t": "Executing SQL Statements", "d": "All SQL statements are referred to as \"queries\" and are executed by the function query, which takes the statement as an argument and is applied to the connection variable.  E xam ple 9.30: Let us duplicate the insertion \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 184.9, "y": 145.74, "z": -69.94, "jx": 75.0, "jy": 8480.0, "ch": "DBMS 9"}, {"id": "dbms-976-cursor-operations-in-ph-p", "c": 3, "imp": 0.0, "h": 0.104, "t": "Cursor Operations in PH P", "d": "When the query function gets a true query as argument, it returns a result object, that is, a list of tuples. Each tuple is a numeric array, indexed by integers starting at 0. The essential function that we can apply to \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 214.76, "y": 159.75, "z": 68.71, "jx": -150.0, "jy": 7772.0, "ch": "DBMS 9"}, {"id": "dbms-977-dynamic-sql-in-ph-p", "c": 3, "imp": 0.0, "h": 0.892, "t": "Dynamic SQL in PH P", "d": "As in JDBC, PHP allows a SQL query to contain question-marks. These question-marks are placeholders for values that can be filled in later, during the execution of the statement. The process of doing so is as follows.  W\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 120.51, "y": 228.79, "z": -27.1, "jx": -450.0, "jy": 8244.0, "ch": "DBMS 9"}, {"id": "discrete-random-variable", "c": 1, "imp": 0.7825, "h": 0.174, "t": "Discrete random variable", "d": "A random variable X is said to be discrete if there is a finite list of values  $a_1, a_2, \\ldots, a_n$  or an infinite list of values  $a_1, a_2, \\ldots$  such that  $P(X = a_j \\text{ for some } j) = 1$ . If X is a disc\u2026", "pc": 1, "nw": 1, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -33.03, "y": 125.14, "z": -286.95, "jx": 0.0, "jy": 5046.0, "ch": "Distributions and probability mass functions"}, {"id": "dropping-whats-independent", "c": 1, "imp": 0.0, "h": 0.734, "t": "Dropping what's independent", "d": "If X and Y are independent, then E(Y|X) = E(Y).", "pc": 1, "nw": 1, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -116.36, "y": 199.1, "z": -197.68, "jx": -75.0, "jy": 22186.0, "ch": "Properties of conditional expectation"}, {"id": "eves-law", "c": 1, "imp": 0.0, "h": 0.0, "t": "Eve's law", "d": "For any r.v.s X and Y,  $$Var(Y) = E(Var(Y|X)) + Var(E(Y|X)).$$", "pc": 0, "nw": 0, "nm": 0, "hp": 1, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -141.03, "y": 143.99, "z": -158.78, "jx": 75.0, "jy": 22890.0, "ch": "Conditional variance"}, {"id": "existence-and-uniqueness-of-stationary-distribution", "c": 1, "imp": 0.0, "h": 0.052, "t": "Existence and uniqueness of stationary distribution", "d": "For any irreducible Markov chain, there exists a unique stationary distribution. In this distribution, every state has positive probability.", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -97.85, "y": 315.98, "z": -121.31, "jx": 0.0, "jy": 4460.0, "ch": "Stationary distribution"}, {"id": "expectation-by-integrating-the-survival-function", "c": 1, "imp": 0.0, "h": 0.0, "t": "Expectation by integrating the survival function", "d": "Let X be a nonnegative r.v. Its expectation can be found by integrating its survival function:  $$E(X) = \\int_0^\\infty P(X > x) dx.$$", "pc": 0, "nw": 0, "nm": 0, "hp": 1, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -79.96, "y": 74.89, "z": -193.54, "jx": -75.0, "jy": 19427.0, "ch": "Universality of the Uniform"}, {"id": "expectation-of-a-continuous-rv", "c": 1, "imp": 0.0343, "h": 0.65, "t": "Expectation of a continuous r.v.", "d": "The expected value (also called the expectation or mean) of a continuous r.v. X with PDF f is  $$E(X) = \\int_{-\\infty}^{\\infty} x f(x) dx.$$", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -11.52, "y": 102.0, "z": -195.38, "jx": -150.0, "jy": 9978.0, "ch": "Probability density functions"}, {"id": "expectation-of-a-discrete-rv", "c": 1, "imp": 0.2019, "h": 0.607, "t": "Expectation of a discrete r.v.", "d": "The expected value (also called the expectation or mean) of a discrete r.v. X whose distinct possible values are", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -71.73, "y": 91.09, "z": -186.58, "jx": 0.0, "jy": 8509.0, "ch": "Definition of expectation"}, {"id": "expectation-via-survival-function", "c": 1, "imp": 0.0054, "h": 0.861, "t": "Expectation via survival function", "d": "Let X be a nonnegative integer-valued r.v. Let F be the CDF of X, and G(x) = 1\u2212F(x) = P(X > x). The function G is called the survival function of X. Then  $$E(X) = \\sum_{n=0}^{\\infty} G(n).$$", "pc": 0, "nw": 0, "nm": 0, "hp": 1, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -106.33, "y": 47.71, "z": -192.36, "jx": -75.0, "jy": 13441.0, "ch": "Indicator r.v.s and the fundamental bridge"}, {"id": "expected-time-to-return", "c": 1, "imp": 0.0, "h": 0.073, "t": "Expected time to return", "d": "Let  $X_0, X_1, \\ldots$  be an irreducible Markov chain with stationary distribution s. Let  $r_i$  be the expected time it takes the chain to return to i, given that it starts at i. Then  $s_i = 1/r_i$ .", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -64.12, "y": 331.25, "z": -156.68, "jx": 150.0, "jy": 4460.0, "ch": "Stationary distribution"}, {"id": "exponential-distribution", "c": 1, "imp": 0.0151, "h": 0.867, "t": "Exponential distribution", "d": "A continuous r.v. X is said to have the *Exponential distribution* with parameter  $\\lambda$ , where  $\\lambda > 0$ , if its PDF is  $$f(x) = \\lambda e^{-\\lambda x}, \\quad x > 0.$$", "pc": 2, "nw": 2, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 29.22, "y": 68.77, "z": -322.01, "jx": -75.0, "jy": 6104.0, "ch": "Exponential"}, {"id": "exponential-mixture-of-poissons-is-geometric", "c": 1, "imp": 0.0, "h": 0.0, "t": "Exponential mixture of Poissons is Geometric", "d": "Suppose that  $X \\sim \\text{Expo}(\\lambda)$  and  $Y|X = x \\sim \\text{Pois}(x)$ . Then  $Y \\sim \\text{Geom}(\\lambda/(\\lambda+1))$ .", "pc": 0, "nw": 0, "nm": 0, "hp": 1, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 61.19, "y": -43.98, "z": -237.2, "jx": 0.0, "jy": 21246.0, "ch": "Conditioning, superposition, and thinning"}, {"id": "first-success-distribution", "c": 1, "imp": 0.0074, "h": 0.863, "t": "First Success distribution", "d": "In a sequence of independent Bernoulli trials with success probability p, let Y be the number of trials until the first successful trial, including the success. Then Y has the First Success distribution with parameter p;\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -136.2, "y": -16.61, "z": -234.09, "jx": -75.0, "jy": 12619.0, "ch": "Geometric and Negative Binomial"}, {"id": "function-of-an-rv", "c": 1, "imp": 0.0546, "h": 0.184, "t": "Function of an r.v.", "d": "For an experiment with sample space S, an r.v. X, and a function  $g : \\mathbb{R} \\to \\mathbb{R}$ , g(X) is the r.v. that maps s to g(X(s)) for all  $s \\in S$ .", "pc": 3, "nw": 3, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -38.47, "y": 157.27, "z": -297.16, "jx": 0.0, "jy": 6397.0, "ch": "Functions of random variables"}, {"id": "function-of-two-rvs", "c": 1, "imp": 0.0054, "h": 0.886, "t": "Function of two r.v.s", "d": "Given an experiment with sample space S, if X and Y are r.v.s that map  $s \\in S$  to X(s) and Y(s) respectively, then g(X,Y) is the r.v. that maps s to g(X(s),Y(s)).", "pc": 3, "nw": 3, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -61.37, "y": 117.39, "z": -293.76, "jx": 0.0, "jy": 6515.0, "ch": "Functions of random variables"}, {"id": "functions-of-independent-rvs", "c": 1, "imp": 0.0, "h": 0.827, "t": "Functions of independent r.v.s", "d": "If X and Y are independent r.v.s, then any function of X is independent of any function of Y.", "pc": 2, "nw": 2, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -21.44, "y": 221.86, "z": -288.44, "jx": -375.0, "jy": 15614.0, "ch": "Independence of r.v.s"}, {"id": "fundamental-bridge-between-probability-and-expectation", "c": 1, "imp": 0.0264, "h": 0.847, "t": "Fundamental bridge between probability and expectation", "d": "There is a one-to-one correspondence between events and indicator r.v.s, and the probability of an event A is the expected value of its indicator r.v. IA:  $$P(A) = E(I_A).$$", "pc": 0, "nw": 0, "nm": 0, "hp": 1, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -128.11, "y": 93.08, "z": -210.95, "jx": 75.0, "jy": 13441.0, "ch": "Indicator r.v.s and the fundamental bridge"}, {"id": "gamma-distribution", "c": 1, "imp": 0.0163, "h": 0.903, "t": "Gamma distribution", "d": "An r.v. Y is said to have the *Gamma distribution* with parameters a and  $\\lambda$ , where a > 0 and  $\\lambda > 0$ , if its PDF is  $$f(y) = \\frac{1}{\\Gamma(a)} (\\lambda y)^a e^{-\\lambda y} \\frac{1}{y}, \\quad y > 0.$$", "pc": 1, "nw": 1, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 7.79, "y": 57.22, "z": -347.83, "jx": 0.0, "jy": 11211.0, "ch": "Gamma"}, {"id": "gamma-function", "c": 1, "imp": 0.0, "h": 0.656, "t": "Gamma function", "d": "The gamma function  $\\Gamma$  is defined by  $$\\Gamma(a) = \\int_0^\\infty x^a e^{-x} \\, \\frac{dx}{x},$$", "pc": 1, "nw": 1, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 5.33, "y": 31.83, "z": -380.5, "jx": 0.0, "jy": 11329.0, "ch": "Gamma"}, {"id": "gamma-mixture-of-poissons-is-negative-binomial", "c": 1, "imp": 0.0, "h": 0.0, "t": "Gamma mixture of Poissons is Negative Binomial", "d": "Suppose that  $X \\sim \\text{Gamma}(r, \\lambda)$  and  $Y|X = x \\sim \\text{Pois}(x)$ . Then  $Y \\sim \\text{NBin}(r, \\lambda/(\\lambda + 1))$ .", "pc": 0, "nw": 0, "nm": 0, "hp": 1, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 93.86, "y": -36.04, "z": -234.75, "jx": 150.0, "jy": 21246.0, "ch": "Conditioning, superposition, and thinning"}, {"id": "general-definition-of-probability", "c": 1, "imp": 0.9667, "h": 0.059, "t": "General definition of probability", "d": "A probability space consists of a sample space S and a probability function P which takes an event A \u2286 S as input and returns P(A), a real number between 0 and 1, as output. The function P must satisfy the following axio\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 3.0, "b": 1.0, "hr": 0.84, "x": -127.29, "y": 164.51, "z": -329.41, "jx": 0.0, "jy": 2934.0, "ch": "Axioms of probability"}, {"id": "geometric-cdf", "c": 1, "imp": 0.007, "h": 0.608, "t": "Geometric CDF", "d": "If X \u223c Geom(p), then the CDF of X is  $$F(x) = \\begin{cases} 1 - q^{\\lfloor x \\rfloor + 1}, & \\text{if } x \\ge 0; \\\\ 0, & \\text{if } x < 0, \\end{cases}$$", "pc": 0, "nw": 0, "nm": 0, "hp": 1, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -113.44, "y": 7.5, "z": -217.68, "jx": -75.0, "jy": 12737.0, "ch": "Geometric and Negative Binomial"}, {"id": "geometric-pmf", "c": 1, "imp": 0.0225, "h": 0.749, "t": "Geometric PMF", "d": "If  $X \\sim \\text{Geom}(p)$ , then the PMF of X is  $$P(X = k) = q^k p$$", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -85.37, "y": 40.04, "z": -243.55, "jx": 75.0, "jy": 12619.0, "ch": "Geometric and Negative Binomial"}, {"id": "hamming-distance", "c": 1, "imp": 0.0041, "h": 0.179, "t": "Hamming distance", "d": "For two binary vectors v and w of the same length, the Hamming distance d(v, w) is the number of positions in which they differ. We can write this as  $$d(v,w) = \\sum_{i} |v_i - w_i|.$$", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -183.28, "y": 29.79, "z": -366.84, "jx": 0.0, "jy": 10800.0, "ch": "\\\\*Using probability and expectation to prove existence"}, {"id": "hypergeometric-pmf", "c": 1, "imp": 0.0, "h": 0.886, "t": "Hypergeometric PMF", "d": "If  $X \\sim \\mathrm{HGeom}(w,b,n)$ , then the PMF of X is  $$P(X = k) = \\frac{\\binom{w}{k} \\binom{b}{n-k}}{\\binom{w+b}{n}},$$", "pc": 0, "nw": 0, "nm": 0, "hp": 1, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -109.88, "y": -33.94, "z": -275.62, "jx": 0.0, "jy": 13030.0, "ch": "Hypergeometric"}, {"id": "iid", "c": 1, "imp": 0.0408, "h": 0.775, "t": "i.i.d.", "d": "We will often work with random variables that are independent and have the same distribution. We call such r.v.s *independent and identically distributed*, or *i.i.d.* for short.  - **3.8.7** (i. vs. i.d.). \"Independent\"\u2026", "pc": 1, "nw": 0, "nm": 1, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 43.71, "y": 186.94, "z": -212.26, "jx": -225.0, "jy": 15614.0, "ch": "Independence of r.v.s"}, {"id": "inclusion-exclusion", "c": 1, "imp": 0.0, "h": 0.176, "t": "Inclusion-exclusion", "d": "For any events  $A_1, \\ldots, A_n$ ,  $$P\\left(\\bigcup_{i=1}^{n} A_{i}\\right) = \\sum_{i} P(A_{i}) - \\sum_{i < j} P(A_{i} \\cap A_{j}) + \\sum_{i < j < k} P(A_{i} \\cap A_{j} \\cap A_{k}) - \\dots + (-1)^{n+1} P(A_{1} \\cap \\do\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 3.0, "b": 1.0, "hr": 0.84, "x": -209.59, "y": 141.54, "z": -277.48, "jx": 0.0, "jy": 3170.0, "ch": "Axioms of probability"}, {"id": "independence-of-continuous-rvs", "c": 1, "imp": 0.022, "h": 0.0, "t": "Independence of continuous r.v.s", "d": "Random variables X and Y are independent if for all x and y,  $$F_{X,Y}(x,y) = F_X(x)F_Y(y).$$", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -74.13, "y": 206.78, "z": -225.51, "jx": 0.0, "jy": 15732.0, "ch": "Independence of r.v.s"}, {"id": "independence-of-discrete-rvs", "c": 1, "imp": 0.0054, "h": 0.58, "t": "Independence of discrete r.v.s", "d": "Random variables X and Y are independent if for all x and y,  $$F_{X,Y}(x,y) = F_X(x)F_Y(y).$$", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -131.74, "y": 236.8, "z": -192.89, "jx": 75.0, "jy": 15614.0, "ch": "Independence of r.v.s"}, {"id": "independence-of-many-events", "c": 1, "imp": 0.1482, "h": 0.804, "t": "Independence of many events", "d": "For n events  $A_1, A_2, \\ldots, A_n$  to be *independent*, we require any pair to satisfy  $P(A_i \\cap A_j) = P(A_i)P(A_j)$  (for  $i \\neq j$ ), any triplet to satisfy  $P(A_i \\cap A_j \\cap A_k) = P(A_i)P(A_j)P(A_k)$  (\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -55.32, "y": 286.62, "z": -260.23, "jx": -75.0, "jy": 8920.0, "ch": "Independence of events"}, {"id": "independence-of-many-rvs", "c": 1, "imp": 0.0767, "h": 0.794, "t": "Independence of many r.v.s", "d": "Random variables X1, . . . , X<sup>n</sup> are independent if  $$P(X_1 \\le x_1, \\dots, X_n \\le x_n) = P(X_1 \\le x_1) \\dots P(X_n \\le x_n),$$", "pc": 2, "nw": 2, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -21.17, "y": 237.56, "z": -240.93, "jx": -225.0, "jy": 15496.0, "ch": "Independence of r.v.s"}, {"id": "independence-of-three-events", "c": 1, "imp": 0.0, "h": 0.923, "t": "Independence of three events", "d": "Events A, B, and C are said to be *independent* if all of the following equations hold:  $$P(A \\cap B) = P(A)P(B),$$     $$P(A \\cap C) = P(A)P(C),$$     $$P(B \\cap C) = P(B)P(C),$$     $$P(A \\cap B \\cap C) = P(A)P(B)P(C)\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -118.64, "y": 309.76, "z": -293.06, "jx": 75.0, "jy": 8920.0, "ch": "Independence of events"}, {"id": "independence-of-two-events", "c": 1, "imp": 0.2358, "h": 0.943, "t": "Independence of two events", "d": "Events A and B are independent if  $$P(A \\cap B) = P(A)P(B).$$", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -107.18, "y": 268.27, "z": -275.22, "jx": 0.0, "jy": 8802.0, "ch": "Independence of events"}, {"id": "independence-of-two-rvs", "c": 1, "imp": 0.1626, "h": 0.744, "t": "Independence of two r.v.s", "d": "Random variables X and Y are said to be independent if  $$P(X \\le x, Y \\le y) = P(X \\le x)P(Y \\le y),$$", "pc": 1, "nw": 1, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -62.43, "y": 261.92, "z": -231.61, "jx": 0.0, "jy": 15378.0, "ch": "Independence of r.v.s"}, {"id": "indicator-random-variable", "c": 1, "imp": 0.0702, "h": 0.564, "t": "Indicator random variable", "d": "The indicator random variable of an event A is the r.v. which equals 1 if A occurs and 0 otherwise. We will denote the indicator r.v. of A by I<sup>A</sup> or I(A). Note that I<sup>A</sup> \u223c Bern(p) with p = P(A).", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -137.62, "y": 16.71, "z": -252.83, "jx": 0.0, "jy": 7512.0, "ch": "Bernoulli and Binomial"}, {"id": "indicator-rv-properties", "c": 1, "imp": 0.0199, "h": 0.8, "t": "Indicator r.v. properties", "d": "Let A and B be events. Then the following properties hold.  - 1. (IA) <sup>k</sup> = I<sup>A</sup> for any positive integer k. - 2. IA<sup>c</sup> = 1 \u2212 IA. - 3. IA\u2229<sup>B</sup> = IAIB. - 4. IA\u222a<sup>B</sup> = I<sup>A</su\u2026", "pc": 1, "nw": 1, "nm": 0, "hp": 1, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -140.85, "y": 43.71, "z": -214.83, "jx": 0.0, "jy": 13323.0, "ch": "Indicator r.v.s and the fundamental bridge"}, {"id": "irreducible-and-reducible-chain", "c": 1, "imp": 0.0, "h": 0.179, "t": "Irreducible and reducible chain", "d": "A Markov chain with transition matrix Q is irreducible if for any two states i and j, it is possible to go from i to j in a finite number of steps (with positive probability). That is, for any states i, j there is some p\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -19.75, "y": 354.25, "z": -95.27, "jx": -150.0, "jy": 2230.0, "ch": "Classification of states"}, {"id": "jensen", "c": 1, "imp": 0.0, "h": 0.121, "t": "Jensen", "d": "Let X be a random variable. If g is a convex function, then  $E(g(X)) \\ge g(E(X))$ . If g is a concave function, then  $E(g(X)) \\le g(E(X))$ . In both cases, the only way that equality can hold is if there are constants \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 1, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -20.01, "y": 317.46, "z": 250.54, "jx": -150.0, "jy": 1644.0, "ch": "Inequalities"}, {"id": "joint-cdf", "c": 1, "imp": 0.1145, "h": 0.858, "t": "Joint CDF", "d": "The joint CDF of r.v.s X and Y is the function FX,Y given by  $$F_{X,Y}(x,y) = P(X \\le x, Y \\le y).$$", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -96.01, "y": 213.98, "z": -202.54, "jx": -75.0, "jy": 15496.0, "ch": "Independence of r.v.s"}, {"id": "joint-mgf", "c": 1, "imp": 0.0, "h": 0.724, "t": "Joint MGF", "d": "The *joint moment generating function* (joint MGF) of a random vector  $\\mathbf{X} = (X_1, \\dots, X_k)$  is the function M defined by  $$M(\\mathbf{t}) = E(e^{\\mathbf{t}'\\mathbf{X}}) = E\\left(e^{t_1X_1 + \\dots + t_kX_k}\\r\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -40.78, "y": 227.52, "z": -168.88, "jx": -75.0, "jy": 16847.0, "ch": "Multivariate Normal"}, {"id": "joint-pdf", "c": 1, "imp": 0.0606, "h": 0.772, "t": "Joint PDF", "d": "If X and Y are continuous with joint CDF FX,Y , their joint PDF is the derivative of the joint CDF with respect to x and y:  $$f_{X,Y}(x,y) = \\frac{\\partial^2}{\\partial x \\partial y} F_{X,Y}(x,y).$$", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 24.57, "y": 143.94, "z": -318.1, "jx": 150.0, "jy": 15378.0, "ch": "Independence of r.v.s"}, {"id": "joint-pmf", "c": 1, "imp": 0.0261, "h": 0.667, "t": "Joint PMF", "d": "The joint PMF of discrete r.v.s X and Y is the function pX,Y given by  $$p_{X,Y}(x,y) = P(X = x, Y = y).$$", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -122.84, "y": 178.77, "z": -208.96, "jx": 225.0, "jy": 15614.0, "ch": "Independence of r.v.s"}, {"id": "kinds-of-moments", "c": 1, "imp": 0.1682, "h": 0.711, "t": "Kinds of moments", "d": "Let X be an r.v. with mean  $\\mu$  and variance  $\\sigma^2$ . For any positive integer n, the nth moment of X is  $E(X^n)$ , the nth moment is  $E((X-\\mu)^n)$ , and the nth moment is  $E(\\left(\\frac{X-\\mu}{\\sigma}\\right)\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -3.51, "y": 146.72, "z": -165.09, "jx": 0.0, "jy": 13734.0, "ch": "Interpreting moments"}, {"id": "kurtosis", "c": 1, "imp": 0.0033, "h": 0.659, "t": "Kurtosis", "d": "The kurtosis of an r.v. X with mean \u00b5 and variance \u03c3 2 is a shifted version of the fourth standardized moment of X:  $$\\operatorname{Kurt}(X) = E\\left(\\frac{X-\\mu}{\\sigma}\\right)^4 - 3.$$", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 28.63, "y": 157.99, "z": -134.18, "jx": -75.0, "jy": 13852.0, "ch": "Interpreting moments"}, {"id": "la-013-lemma-013", "c": 2, "imp": 0.0095, "h": 0.196, "t": "Bijektiv afbildning", "d": "En afbildning  $f: X \\to Y$  er bijektiv, hvis og kun hvis der eksisterer en afbildning  $g: Y \\to X$ , s\u00e5dan at  $f \\circ g = \\operatorname{id}_Y \\operatorname{og} g \\circ f = \\operatorname{id}_X$ .", "pc": 3, "nw": 3, "nm": 0, "hp": 1, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -5.12, "y": 162.11, "z": 74.17, "jx": -150.0, "jy": 0.0, "ch": "LA 0"}, {"id": "la-021-legeme", "c": 2, "imp": 0.2473, "h": 0.169, "t": "legeme", "d": "Et *legeme* er en triple  $(\\mathbb{F}, +, \\cdot)$ , der best\u00e5r af en m\u00e6ngde  $\\mathbb{F}$  samt to afbildninger  $+: \\mathbb{F} \\times \\mathbb{F} \\to \\mathbb{F}$  og  $\\cdot: \\mathbb{F} \\times \\mathbb{F} \\to \\mathbb{F}$\u2026", "pc": 4, "nw": 4, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -167.58, "y": 115.97, "z": -15.21, "jx": 150.0, "jy": 0.0, "ch": "LA 0"}, {"id": "la-023-vaere-et-legeme-for-alle-a", "c": 2, "imp": 0.0, "h": 0.098, "t": "Nullproduktregler", "d": "*Lad*  $\\mathbb{F}$  *v\u00e6re et legeme. For alle a*  $\\in$   $\\mathbb{F}$  *g\u00e6lder f\u00f8lgende:*   - (E1)  $a \\cdot 0 = 0 = 0 \\cdot a$ . - (E2)  $a \\cdot (-1) = -a = (-1) \\cdot a$ .", "pc": 0, "nw": 0, "nm": 0, "hp": 1, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -1
