n of the general idea, let us return to the problem introduced in Section 22.3, where we saw the advantage\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -274.9, "y": 298.96, "z": -207.83, "jx": -375.0, "jy": 19841.0, "ch": "DBMS 22"}, {"id": "dbms-2243-combining-minhashing-and-locality-sensitive-hashing", "c": 3, "imp": 0.0, "h": 0.092, "t": "Combining Minhashing and Locality-Sensitive Hashing", "d": "The two ideas, minhashing **and LSH. must** be combined properly to solve the sort of problems we **discussed in Section 22.3.2.** Suppose, for example, that we have a large repository of **documents, which** we have alr\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -180.34, "y": 389.82, "z": -139.76, "jx": -75.0, "jy": 19841.0, "ch": "DBMS 22"}, {"id": "dbms-225-equivalent-representations-of-a-relation", "c": 3, "imp": 0.0, "h": 0.193, "t": "Equivalent Representations of a Relation", "d": "Relations are sets of tuples, not lists of tuples. Thus the order in which the tuples of a relation are presented is immaterial. For example, we can list the three tuples of Fig. 2.3 in any of their six possible orders, \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -28.65, "y": -154.26, "z": 147.28, "jx": 300.0, "jy": 883.0, "ch": "DBMS 2"}, {"id": "dbms-2251-applications-of-clustering", "c": 3, "imp": 0.0396, "h": 0.135, "t": "Applications of Clustering", "d": "Many discussions of clustering begin with a small example, in which a small number of points are given in a two-dimensional space, such as Fig, 22.12. Algorithms to cluster such data are relatively simple, and we shall m\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -234.05, "y": 363.09, "z": -77.99, "jx": -225.0, "jy": 19841.0, "ch": "DBMS 22"}, {"id": "dbms-2252-distance-measures", "c": 3, "imp": 0.0, "h": 0.112, "t": "Distance Measures", "d": "A *distance measure* on a set of points is a function *d{x, y)* that satisfies:  - 1. *d(x,y)* > 0 for all points *x* and *y.* - 2. *d(x,y)* = 0 if and only if *x = y.* - 3. *d(x,y)* = *d(y,x) (symmetry).* - 4. *d(x,y) <\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 247.37, "y": 317.82, "z": 114.63, "jx": -150.0, "jy": 19605.0, "ch": "DBMS 22"}, {"id": "dbms-2253-agglomerative-clustering", "c": 3, "imp": 0.0163, "h": 0.199, "t": "Agglomerative Clustering", "d": "We shall now begin our study of algorithms for computing clusters. The first approach is, at the highest level, straightforward. Start with every point in its own cluster. Until some stopping condition is met, repeatedly\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -268.86, "y": 338.15, "z": -95.31, "jx": -150.0, "jy": 19959.0, "ch": "DBMS 22"}, {"id": "dbms-2254-ameans-algorithms", "c": 3, "imp": 0.0, "h": 0.08, "t": "A>Means Algorithms", "d": "The second broad approach to clustering is called point-assignment. A popular version, which is typical of the approach is called *k-means.* This approach is really a family of algorithms, just as agglomerative clusterin\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -299.25, "y": 318.81, "z": -88.47, "jx": -75.0, "jy": 20077.0, "ch": "DBMS 22"}, {"id": "dbms-2255-c-means-for-large-scale-data", "c": 3, "imp": 0.0, "h": 0.081, "t": "/c-Means for Large-Scale Data", "d": "We shall now examine an extension of fc-means that is designed to deal with sets of points that are so large they cannot fit in main memory. The goal is not to assign every point to a cluster, but to determine where the \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -255.61, "y": 362.37, "z": -53.96, "jx": -300.0, "jy": 19959.0, "ch": "DBMS 22"}, {"id": "dbms-2256-processing-a-memory-load-of-points", "c": 3, "imp": 0.0, "h": 0.185, "t": "Processing a Memory Load of Points", "d": "We shall now describe how one memory load of points is processed. We assume that main memory current contains the summary statistics for the *k* clusters and also for zero or more groups of points that are in the compres\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -222.46, "y": 376.03, "z": -37.79, "jx": 0.0, "jy": 19959.0, "ch": "DBMS 22"}, {"id": "dbms-226-relation-instances", "c": 3, "imp": 0.0116, "h": 0.173, "t": "Relation Instances", "d": "A relation about movies is not static; rather, relations change over time. We expect to insert tuples for new movies, as these appear. We also expect changes to existing tuples if we get revised or corrected information \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -37.67, "y": -182.27, "z": 152.64, "jx": 750.0, "jy": 883.0, "ch": "DBMS 2"}, {"id": "dbms-227-keys-of-relations", "c": 3, "imp": 0.0, "h": 0.182, "t": "Keys of Relations", "d": "There are many constraints on relations that the relational model allows us to place on database schemas. We shall defer much of the discussion of constraints until Chapter 7. However, one kind of constraint is so fundam\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -10.8, "y": -118.36, "z": 175.91, "jx": 150.0, "jy": 883.0, "ch": "DBMS 2"}, {"id": "dbms-228-an-example-database-schema", "c": 3, "imp": 0.0, "h": 0.074, "t": "An Example Database Schema", "d": "We shall close this section with an example of a complete database schema. The topic is movies, and it builds on the relation Movies that has appeared so far in examples. The database schema is shown in Fig. 2.5. Here ar\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 15.57, "y": -53.89, "z": 198.51, "jx": -900.0, "jy": 883.0, "ch": "DBMS 2"}, {"id": "dbms-231-relations-in-sql", "c": 3, "imp": 0.0568, "h": 0.133, "t": "Relations in SQL", "d": "SQL makes a distinction between three kinds of relations:  - 1. Stored relations, which are called *tables.* These are the kind of relation we deal with ordinarily \u2014 a relation that exists in the database and that can be\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 11.2, "y": -71.69, "z": 142.46, "jx": 0.0, "jy": 883.0, "ch": "DBMS 2"}, {"id": "dbms-2311-components-of-a-search-engine", "c": 3, "imp": 0.1722, "h": 0.186, "t": "Components of a Search Engine", "d": "There are two main functions that a search engine must perform.  - 1. The Web must be *crawled.* That is, copies of many of the pages on the Web must be brought to the search engine and processed. - 2. Queries must be an\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 402.13, "y": -91.97, "z": -128.04, "jx": -75.0, "jy": 20370.0, "ch": "DBMS 23"}, {"id": "dbms-2312-web-crawlers", "c": 3, "imp": 0.0116, "h": 0.143, "t": "Web Crawlers", "d": "A crawler can be a single machine that is started with a set *S,* containing the URL's of one or more Web pages to crawl. There is a repository *R* of pages, with the URL's that have already been crawled; initially *R* i\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 400.38, "y": -112.09, "z": -152.22, "jx": -150.0, "jy": 20488.0, "ch": "DBMS 23"}, {"id": "dbms-2313-query-processing-in-search-engines", "c": 3, "imp": 0.0054, "h": 0.126, "t": "Query Processing in Search Engines", "d": "Search engine queries are not like SQL queries. Rather they are typically a set of words, for which the search engine must find and rank all pages containing all, or perhaps a subset of, those words. In some cases, the q\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 419.46, "y": -39.22, "z": -105.53, "jx": -600.0, "jy": 20488.0, "ch": "DBMS 23"}, {"id": "dbms-2314-ranking-pages", "c": 3, "imp": 0.0245, "h": 0.092, "t": "Ranking Pages", "d": "Once the set of pages that match the query is determined, these pages are ranked, and only the highest-ranked pages are shown to the user. The exact way that pages are ranked is a secret formula, as closely guarded by se\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 360.62, "y": -121.43, "z": -139.08, "jx": -450.0, "jy": 20488.0, "ch": "DBMS 23"}, {"id": "dbms-232-data-types", "c": 3, "imp": 0.0476, "h": 0.189, "t": "Data Types", "d": "To begin, let us introduce the primitive data types that are supported by SQL systems. All attributes must have a data type.  - 1. Character strings of fixed or varying length. The type CHAR(n) denotes a fixed-length str\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 40.71, "y": -68.01, "z": 161.52, "jx": 150.0, "jy": 1001.0, "ch": "DBMS 2"}, {"id": "dbms-2321-the-intuition-behind-pagerank", "c": 3, "imp": 0.0442, "h": 0.124, "t": "The Intuition Behind PageRank", "d": "The insight that makes Google and other search engines able to return the \"important\" pages on a topic is that the Web itself points out the important pages. When you create a page, you tend to link that page to others t\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 410.56, "y": -140.01, "z": -120.8, "jx": -300.0, "jy": 20488.0, "ch": "DBMS 23"}, {"id": "dbms-2322-recursive-formulation-of-pagerank-first-try", "c": 3, "imp": 0.0, "h": 0.195, "t": "Recursive Formulation of PageRank \u2014 First Try", "d": "To describe how the random walker moves, we can use the *transition matrix of the Web.* Number the pages 1 ,2 ,... *,n.* The matrix M , the transition matrix of the Web has element m y in row *i* and column *j,* where:  \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 409.0, "y": -179.34, "z": -115.42, "jx": 0.0, "jy": 20606.0, "ch": "DBMS 23"}, {"id": "dbms-2323-spider-traps-and-dead-ends", "c": 3, "imp": 0.0082, "h": 0.069, "t": "Spider Traps and Dead Ends", "d": "The graph of Fig. 23.2 is atypical of the Web, not only because of its size, but for two structural reasons:  - Some Web pages (called dead ends) have no out-links. If the random walker arrives at such a page, there is n\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 391.2, "y": -144.45, "z": -148.93, "jx": 300.0, "jy": 20606.0, "ch": "DBMS 23"}, {"id": "dbms-2324-pagerank-accounting-for-spider-traps-and-dead-ends", "c": 3, "imp": 0.0, "h": 0.196, "t": "PageRank Accounting for Spider Traps and Dead Ends", "d": "The solution to both spider traps and dead ends is to limit the time the random walker is allowed to wander at random. We pick a constant *(3 <* 1, typically in the range 0.8 to 0.9, and at each step, we let the walker f\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 359.54, "y": -153.89, "z": -153.28, "jx": -75.0, "jy": 20724.0, "ch": "DBMS 23"}, {"id": "dbms-233-simple-table-declarations", "c": 3, "imp": 0.0163, "h": 0.571, "t": "Simple Table Declarations", "d": "The simplest form of declaration of a relation schema consists of the keywords CREATE TABLE followed by the name of the relation and a parenthesized, comma-separated list of the attribute names and their types.  E xam pl\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 43.19, "y": -63.57, "z": 213.02, "jx": 0.0, "jy": 1119.0, "ch": "DBMS 2"}, {"id": "dbms-2331-teleport-sets", "c": 3, "imp": 0.0, "h": 0.108, "t": "Teleport Sets", "d": "In Section 23.2.4, we \"taxed\" each page 1 \u2014 *fi* of its estimated PageRank and distributed the tax equally among all pages. Equivalently, we allowed random walkers on the graph of the Web to choose, with probability 1 \u2014 \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 437.91, "y": -157.11, "z": -99.79, "jx": 150.0, "jy": 20606.0, "ch": "DBMS 23"}, {"id": "dbms-2332-calculating-a-topic-specific-pagerank", "c": 3, "imp": 0.0, "h": 0.143, "t": "Calculating A Topic-Specific PageRank", "d": "Suppose we had a set of pages that we were certain were about a particular topic, say sports. We make these pages the teleport set, which has the effect of increasing their PageRank. However, it also increases the PageRa\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 325.58, "y": -138.73, "z": -142.68, "jx": -150.0, "jy": 20606.0, "ch": "DBMS 23"}, {"id": "dbms-2333-link-spam", "c": 3, "imp": 0.0209, "h": 0.074, "t": "Link Spam", "d": "Another application of topic-specific PageRank is in combating \"link spam.\" Because it is known that many search engines use PageRank as part of the formula to rank pages by importance, it has become financially advantag\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 423.26, "y": -49.44, "z": -130.76, "jx": -750.0, "jy": 20488.0, "ch": "DBMS 23"}, {"id": "dbms-2334-topic-specific-pagerank-and-link-spam", "c": 3, "imp": 0.0054, "h": 0.083, "t": "Topic-Specific PageRank and Link Spam", "d": "A search engine needs to detect pages that are on the Web for the purpose of creating link spam. A useful tool is to compute the *TrustRank* of pages. Although the original definition is somewhat different, we may take t\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 435.87, "y": -13.72, "z": -118.39, "jx": -300.0, "jy": 20606.0, "ch": "DBMS 23"}, {"id": "dbms-234-modifying-relation-schemas", "c": 3, "imp": 0.0, "h": 0.177, "t": "Modifying Relation Schemas", "d": "We now know how to declare a table. But what if we need to change the schema of the table after it has been in use for a long time and has many tuples in its current instance? We can remove the entire table, including al\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -31.47, "y": -119.48, "z": 115.28, "jx": 450.0, "jy": 883.0, "ch": "DBMS 2"}, {"id": "dbms-2341-data-stream-management-systems", "c": 3, "imp": 0.1025, "h": 0.077, "t": "Data-Stream-Management Systems", "d": "If we are to allow queries on such streams of data, we need some new mechanisms. While we may be able to store the data on high-rate streams, we cannot do so in a way that allows instantaneous queries using a language li\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 411.51, "y": 113.82, "z": -43.11, "jx": 75.0, "jy": 20370.0, "ch": "DBMS 23"}, {"id": "dbms-2342-stream-applications", "c": 3, "imp": 0.0054, "h": 0.11, "t": "Stream Applications", "d": "Before addressing the mechanics of data-stream-management systems, let us look at some of the applications where the data is in the form of a stream or streams.  - 1. *Click Streams.* As we mentioned, a common source of \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 425.94, "y": 61.8, "z": -66.92, "jx": 750.0, "jy": 20488.0, "ch": "DBMS 23"}, {"id": "dbms-2343-a-data-stream-data-model", "c": 3, "imp": 0.0, "h": 0.108, "t": "A Data-Stream Data Model", "d": "We shall now offer a data model useful for discussing algorithms on data streams. First, we shall assume the following about the streams themselves:  - Each stream consists of a sequence of tuples. The tuples have a fixe\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 387.24, "y": 139.95, "z": -51.78, "jx": 0.0, "jy": 20488.0, "ch": "DBMS 23"}, {"id": "dbms-2344-converting-streams-into-relations", "c": 3, "imp": 0.0, "h": 0.087, "t": "Converting Streams Into Relations", "d": "Windows allow us to convert streams into relations. That is, the window expressions as in Example 23.10 describe a relation at any time. The contents of the relation typically changes rapidly. For example, consider the e\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 433.94, "y": 105.6, "z": -16.63, "jx": 300.0, "jy": 20488.0, "ch": "DBMS 23"}, {"id": "dbms-2345-converting-relations-into-streams", "c": 3, "imp": 0.0, "h": 0.185, "t": "Converting Relations Into Streams", "d": "When we issue queries such as that of Example 23.11 as standing queries, the resulting relations change frequently. Maintaining these relations as materialized views may result in a lot of effort making insertions and de\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 394.86, "y": 122.48, "z": -15.16, "jx": 150.0, "jy": 20488.0, "ch": "DBMS 23"}, {"id": "dbms-235-default-values", "c": 3, "imp": 0.0253, "h": 0.775, "t": "Default Values", "d": "When we create or modify tuples, we sometimes do not have values for all components. For instance, we mentioned in Example 2.4 that when we add a column to a relation schema, the existing tuples do not have a known value\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 7.61, "y": -81.48, "z": 105.64, "jx": -150.0, "jy": 1119.0, "ch": "DBMS 2"}, {"id": "dbms-2351-motivation", "c": 3, "imp": 0.0, "h": 0.056, "t": "Motivation", "d": "Suppose we wish to have a stream with a window of a billion integers. Such a window could fit in a large main memory of four gigabytes, and it would have no trouble fitting on disk. Surely, if we are only interested in r\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 418.89, "y": 128.0, "z": -70.2, "jx": 600.0, "jy": 20488.0, "ch": "DBMS 23"}, {"id": "dbms-2352-counting-bits", "c": 3, "imp": 0.0, "h": 0.068, "t": "Counting Bits", "d": "In this section, we shall examine the following problem. Assume that the length of the sliding window is *N ,* and the stream consists of bits, 0 or 1. We assume that the stream began at some time in the past, and we ass\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 406.02, "y": 145.92, "z": -26.54, "jx": 450.0, "jy": 20488.0, "ch": "DBMS 23"}, {"id": "dbms-2353-counting-the-number-of-d-istinct-elements", "c": 3, "imp": 0.0, "h": 0.133, "t": "Counting the Number of D istinct Elements", "d": "We now turn to another important problem: counting the distinct elements in a (window on) a stream. The problem has a number of applications, such as the following:  - 1. The popularity of a Web site is often measured by\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 429.9, "y": 10.77, "z": -90.62, "jx": 75.0, "jy": 20724.0, "ch": "DBMS 23"}, {"id": "dbms-236-declaring-keys", "c": 3, "imp": 0.0, "h": 0.096, "t": "Declaring Keys", "d": "There are two ways to declare an attribute or set of attributes to be a key in the CREATE TABLE statement that defines a stored relation.  - 1. We may declare one attribute to be a key when that attribute is listed in th\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -76.52, "y": -61.45, "z": 141.89, "jx": -300.0, "jy": 765.0, "ch": "DBMS 2"}, {"id": "dbms-241-why-do-we-need-a-special-query-language", "c": 3, "imp": 0.0, "h": 0.137, "t": "Why Do We Need a Special Query Language?", "d": "Before introducing the operations of relational algebra, one should ask why, or whether, we need a new kind of programming languages for databases. Won't conventional languages like C or Java suffice to ask and answer an\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -38.88, "y": -129.81, "z": 140.12, "jx": 1050.0, "jy": 883.0, "ch": "DBMS 2"}, {"id": "dbms-2410-combining-operations-to-form-queries", "c": 3, "imp": 0.0, "h": 0.814, "t": "Combining Operations to Form Queries", "d": "If all we could do was to write single operations on one or two relations as queries, then relational algebra would not be nearly as useful as it is. However, relational algebra, like all algebras, allows us to form expr\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 62.49, "y": -49.54, "z": 259.96, "jx": 0.0, "jy": 1237.0, "ch": "DBMS 2"}, {"id": "dbms-2411-naming-and-renaming", "c": 3, "imp": 0.0, "h": 0.116, "t": "Naming and Renaming", "d": "In order to control the names of the attributes used for relations that are constructed by applying relational-algebra operations, it is often convenient to use an operator that explicitly renames relations. We shall use\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -12.7, "y": -154.47, "z": 110.74, "jx": 600.0, "jy": 883.0, "ch": "DBMS 2"}, {"id": "dbms-2412-relationships-among-operations", "c": 3, "imp": 0.0, "h": 0.143, "t": "Relationships Among Operations", "d": "Some of the operations that we have described in Section 2.4 can be expressed in terms of other relational-algebra operations. For example, intersection can be expressed in terms of set difference:  $$R \\cap S = R - (R -\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 52.04, "y": -167.65, "z": 206.89, "jx": -1050.0, "jy": 883.0, "ch": "DBMS 2"}, {"id": "dbms-2413-a-linear-notation-for-algebraic-expressions", "c": 3, "imp": 0.0, "h": 0.085, "t": "A Linear Notation for Algebraic Expressions", "d": "In Section 2.4.10 we used an expression tree to represent a complex expression of relational algebra. An alternative is to invent names for the temporary relations that correspond to the interior nodes of the tree and wr\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 80.52, "y": -153.79, "z": 310.92, "jx": 375.0, "jy": 529.0, "ch": "DBMS 2"}, {"id": "dbms-242-what-is-an-algebra", "c": 3, "imp": 0.0217, "h": 0.167, "t": "What is an Algebra?", "d": "An algebra, in general, consists of operators and atomic operands. For instance, in the algebra of arithmetic, the atomic operands are variables like *x* and constants like 15. The operators are the usual arithmetic ones\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 71.75, "y": -161.95, "z": 270.18, "jx": 150.0, "jy": 411.0, "ch": "DBMS 2"}, {"id": "dbms-243-overview-of-relational-algebra", "c": 3, "imp": 0.0, "h": 0.077, "t": "Overview of Relational Algebra", "d": "The operations of the traditional relational algebra fall into four broad classes:  - a) The usual set operations union, intersection, and difference applied to relations. - b) Operations that remove parts of a relation:\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 60.24, "y": -159.54, "z": 137.6, "jx": -150.0, "jy": 1001.0, "ch": "DBMS 2"}, {"id": "dbms-244-set-operations-on-relations", "c": 3, "imp": 0.1338, "h": 0.066, "t": "Set Operations on Relations", "d": "The three most common operations on sets are union, intersection, and difference. We assume the reader is familiar with these operations, which are defined as follows on arbitrary sets *R* and 5:  - *RU S,* the *union* o\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 62.63, "y": -148.45, "z": 171.2, "jx": -150.0, "jy": 411.0, "ch": "DBMS 2"}, {"id": "dbms-245-projection", "c": 3, "imp": 0.1245, "h": 0.115, "t": "Projection", "d": "The *projection* operator is used to produce from a relation *R* a new relation that has only some of *R 's* columns. The value of expression *, a 2 ,... , A n (R)* is a relation that has only the columns for attributes \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 15.49, "y": -173.05, "z": 146.6, "jx": 0.0, "jy": 765.0, "ch": "DBMS 2"}, {"id": "dbms-246-selection", "c": 3, "imp": 0.2022, "h": 0.116, "t": "Selection", "d": "The *selection* operator, applied to a relation *R,* produces a new relation with a subset of *R 's* tuples. The tuples in the resulting relation are those that satisfy some condition *C* that involves the attributes of \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 107.56, "y": -162.63, "z": 106.04, "jx": -600.0, "jy": 883.0, "ch": "DBMS 2"}, {"id": "dbms-247-cartesian-product", "c": 3, "imp": 0.0283, "h": 0.056, "t": "Cartesian Product", "d": "The *Cartesian product* (or *cross-product,* or just *product)* of two sets *R* and *S* is the set of pairs that can be formed by choosing the first element of the pair to be any element of *R* and the second any element\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 55.46, "y": -124.5, "z": 152.77, "jx": -450.0, "jy": 883.0, "ch": "DBMS 2"}, {"id": "dbms-248-natural-joins", "c": 3, "imp": 0.0, "h": 0.062, "t": "Natural Joins", "d": "More often than we want to take the product of two relations, we find a need to *join* them by pairing only those tuples that match in some way. The simplest sort of match is the *natural join* of two relations *R* and 5\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 25.74, "y": -131.43, "z": 174.38, "jx": -300.0, "jy": 883.0, "ch": "DBMS 2"}, {"id": "dbms-249-theta-joins", "c": 3, "imp": 0.0208, "h": 0.167, "t": "Theta-Joins", "d": "The natural join forces us to pair tuples using one specific condition. While this way, equating shared attributes, is the most common basis on which relations are joined, it is sometimes desirable to pair tuples from tw\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 99.36, "y": -175.56, "z": 105.51, "jx": 900.0, "jy": 883.0, "ch": "DBMS 2"}, {"id": "dbms-251-relational-algebra-as-a-constraint-language", "c": 3, "imp": 0.0171, "h": 0.058, "t": "Relational Algebra as a Constraint Language", "d": "There are two ways in which we can use expressions of relational algebra to express constraints.  - 1. If *R* is an expression of relational algebra, then *R* = 0 is a constraint that says \"The value of *R* must be empty\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 33.19, "y": -121.61, "z": 200.64, "jx": -750.0, "jy": 883.0, "ch": "DBMS 2"}, {"id": "dbms-252-referential-integrity-constraints", "c": 3, "imp": 0.0082, "h": 0.107, "t": "Referential Integrity Constraints", "d": "A common kind of constraint, called a *referential integrity constraint*, asserts that a value appearing in one context also appears in another, related context. For example, in our movies database, should we see a Stars\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 23.16, "y": -100.35, "z": 250.31, "jx": 0.0, "jy": 1001.0, "ch": "DBMS 2"}, {"id": "dbms-253-key-constraints", "c": 3, "imp": 0.0082, "h": 0.07, "t": "Key Constraints", "d": "The same constraint notation allows us to express far more than referential integrity. Here, we shall see how we can express algebraically the constraint that a certain attribute or set of attributes is a key for a relat\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -11.26, "y": 36.46, "z": 146.23, "jx": -150.0, "jy": 765.0, "ch": "DBMS 2"}, {"id": "dbms-254-additional-constraint-examples", "c": 3, "imp": 0.0, "h": 0.948, "t": "Additional Constraint Examples", "d": "There are many other kinds of constraints that we can express in relational algebra and that are useful for restricting database contents. A large family of constraints involve the permitted values in a context. For exam\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 44.82, "y": -86.46, "z": 203.77, "jx": 150.0, "jy": 1119.0, "ch": "DBMS 2"}, {"id": "dbms-311-definition-of-functional-dependency", "c": 3, "imp": 0.2466, "h": 0.172, "t": "Definition of Functional Dependency", "d": "A *functional dependency* (FD) on a relation *R* is a statement of the form \"If two tuples of *R* agree on all of the attributes *A-i,A2.... ,A\"* (i.e., the tuples have the same values in their respective components for \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -70.64, "y": -264.04, "z": 236.34, "jx": -75.0, "jy": 1530.0, "ch": "DBMS 3"}, {"id": "dbms-312-keys-of-relations", "c": 3, "imp": 0.1412, "h": 0.197, "t": "Keys of Relations", "d": "We say a set of one or more attributes *{Ai,A <sup>2</sup> ,* ... , *An}* is a *key* for a relation *R* if:  - 1. Those attributes functionally determine all other attributes of the relation. That is, it is impossible fo\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -77.07, "y": -222.48, "z": 272.79, "jx": -225.0, "jy": 1648.0, "ch": "DBMS 3"}, {"id": "dbms-313-superkeys", "c": 3, "imp": 0.0459, "h": 0.193, "t": "Superkeys", "d": "A set of attributes that contains a key is called a *superkey,* short for \"superset of a key.\" Thus, every key is a superkey. However, some superkeys are not (minimal) keys. Note that every superkey satisfies the first c\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -50.87, "y": -200.58, "z": 306.77, "jx": 0.0, "jy": 1766.0, "ch": "DBMS 3"}, {"id": "dbms-321-reasoning-about-functional-dependencies", "c": 3, "imp": 0.0199, "h": 0.075, "t": "Reasoning About Functional Dependencies", "d": "Let us begin with a motivating example that will show us how we can infer a functional dependency from other given FD's.  E xam ple 3.4: If we are told that a relation *R(A, B, C)* satisfies the FD's *A \u2014> B* and *B \u2014> C\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -85.78, "y": -301.19, "z": 221.24, "jx": 75.0, "jy": 1648.0, "ch": "DBMS 3"}, {"id": "dbms-322-the-splittingcombining-rule", "c": 3, "imp": 0.0826, "h": 0.19, "t": "The Splitting/Combining Rule", "d": "Recall that in Section 3.1.1 we commented that the FD:  $$A_1 A_2 \\cdots A_n \\to B_1 B_2 \\cdots B_m$$  was equivalent to the set of FD's:", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -140.06, "y": -255.84, "z": 248.78, "jx": 75.0, "jy": 1530.0, "ch": "DBMS 3"}, {"id": "dbms-323-trivial-functional-dependencies", "c": 3, "imp": 0.0151, "h": 0.103, "t": "Trivial Functional Dependencies", "d": "A constraint of any kind on a relation is said to be *trivial* if it holds for every instance of the relation, regardless of what other constraints are assumed. When the constraints are FD's, it is easy to tell whether a\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -127.44, "y": -293.36, "z": 233.58, "jx": 225.0, "jy": 1648.0, "ch": "DBMS 3"}, {"id": "dbms-324-computing-the-closure-of-attributes", "c": 3, "imp": 0.0217, "h": 0.074, "t": "Computing the Closure of Attributes", "d": "Before proceeding to other rules, we shall give a general principle from which all true rules follow. Suppose *{Ai,A <sup>2</sup> ,... ,A*n} is a set of attributes and *S*  is a set of FD's. The *closure* of *{Ai,A <sup>\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -106.2, "y": -247.24, "z": 291.53, "jx": -150.0, "jy": 1766.0, "ch": "DBMS 3"}, {"id": "dbms-325-w-hy-the-closure-algorithm-works", "c": 3, "imp": 0.0, "h": 0.091, "t": "W hy the Closure Algorithm Works", "d": "In this section, we shall show why Algorithm 3.7 correctly decides whether or not an FD *A\\ A 2 \u25a0 \u25a0 \u2022 An -> B* follows from a given set of FD's *S.* There are two parts to the proof:  1. We must prove that Algorithm 3.7 \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -183.74, "y": -250.65, "z": 257.26, "jx": 375.0, "jy": 1648.0, "ch": "DBMS 3"}, {"id": "dbms-326-the-transitive-rule", "c": 3, "imp": 0.0277, "h": 0.072, "t": "The Transitive Rule", "d": "The transitive rule lets us cascade two FD's, and generalizes the observation of Example 3.4.  \u2022 If *A\\A%* \u2022 \u25a0 \u2022 *A n B i B 2 \u25a0 \u25a0 \u25a0 B m* and *B \\B 2 \u25a0 \u25a0 \u25a0 B m* -\u00bb\u2022 *C\\C2---Ck* hold in relation *R,* then *Ai A 2 \u25a0 \u25a0 \u25a0 A\"*\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -103.94, "y": -270.76, "z": 219.7, "jx": 150.0, "jy": 1766.0, "ch": "DBMS 3"}, {"id": "dbms-327-closing-sets-of-functional-dependencies", "c": 3, "imp": 0.0228, "h": 0.188, "t": "Closing Sets of Functional Dependencies", "d": "Sometimes we have a choice of which FD's we use to represent the full set of FD's for a relation. If we are given a set of FD's *S* (such as the FD's that hold in a given relation), then any set of FD's equivalent to *S*\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -51.29, "y": -268.3, "z": 273.66, "jx": -375.0, "jy": 1648.0, "ch": "DBMS 3"}, {"id": "dbms-328-projecting-functional-dependencies", "c": 3, "imp": 0.0095, "h": 0.089, "t": "Projecting Functional Dependencies", "d": "When we study design of relation schemas, we shall also have need to answer the following question about FD's. Suppose we have a relation *R* with set of FD's *S,* and we project *R* by computing *Ri \u2014 itl(R),* for some \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -25.78, "y": -225.5, "z": 198.94, "jx": -75.0, "jy": 1648.0, "ch": "DBMS 3"}, {"id": "dbms-331-anomalies", "c": 3, "imp": 0.1419, "h": 0.098, "t": "Anomalies", "d": "Problems such as redundancy that occur when we try to cram too much into a single relation axe called *anomalies.* The principal kinds of anomalies that we encounter are:  - 1. *Redundancy.* Information may be repeated u\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -57.49, "y": -177.47, "z": 241.8, "jx": -300.0, "jy": 1766.0, "ch": "DBMS 3"}, {"id": "dbms-332-decomposing-relations", "c": 3, "imp": 0.0459, "h": 0.077, "t": "Decomposing Relations", "d": "The accepted way to eliminate these anomalies is to *decompose* relations. Decomposition of *R* involves splitting the attributes of *R* to make the schemas of two new relations. After describing the decomposition proces\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -62.87, "y": -241.26, "z": 206.8, "jx": 300.0, "jy": 1884.0, "ch": "DBMS 3"}, {"id": "dbms-333-boyce-codd-normal-form", "c": 3, "imp": 0.0534, "h": 0.19, "t": "Boyce-Codd Normal Form", "d": "The goal of decomposition is to replace a relation by several that do not exhibit anomalies. There is, it turns out, a simple condition under which the anomalies discussed above can be guaranteed not to exist. This condi\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -29.01, "y": -187.86, "z": 280.39, "jx": 0.0, "jy": 1884.0, "ch": "DBMS 3"}, {"id": "dbms-334-decomposition-into-bcnf", "c": 3, "imp": 0.0082, "h": 0.908, "t": "Decomposition into BCNF", "d": "By repeatedly choosing suitable decompositions, we can break any relation schema into a collection of subsets of its attributes with the following important properties:  - 1. These subsets are the schemas of relations in\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -70.33, "y": -224.64, "z": 170.33, "jx": 300.0, "jy": 2002.0, "ch": "DBMS 3"}, {"id": "dbms-341-recovering-information-from-a-decomposition", "c": 3, "imp": 0.0217, "h": 0.168, "t": "Recovering Information from a Decomposition", "d": "Since we learned that every two-attribute relation is in BCNF, why did we have to go through the trouble of Algorithm 3.20? Why not just take any relation *R* and decompose it into relations, each of whose schemas is a p\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -40.0, "y": -235.68, "z": 270.9, "jx": -450.0, "jy": 1884.0, "ch": "DBMS 3"}, {"id": "dbms-342-the-chase-test-for-lossless-join", "c": 3, "imp": 0.0163, "h": 0.762, "t": "The Chase Test for Lossless Join", "d": "In Section 3.4.1 we argued why a particular decomposition, that of *R (A ,B ,C )* into *{A ,B }* and *{B ,C },* with a particular FD, *B* \u2014\u25ba *C,* had a lossless join. Now, consider a more general situation. We have decom\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -61.96, "y": -294.86, "z": 173.46, "jx": 450.0, "jy": 2002.0, "ch": "DBMS 3"}, {"id": "dbms-343-w-hy-the-chase-works", "c": 3, "imp": 0.0, "h": 0.694, "t": "W hy the Chase Works", "d": "There are two issues to address:  - 1. When the chase results in a row that matches the tuple *t* (i.e., the tableau is shown to have a row with all unsubscripted variables), why must the join be lossless? - 2. When, aft\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -21.44, "y": -261.77, "z": 309.67, "jx": -450.0, "jy": 2002.0, "ch": "DBMS 3"}, {"id": "dbms-344-dependency-preservation", "c": 3, "imp": 0.015, "h": 0.772, "t": "Dependency Preservation", "d": "We mentioned that it is not possible, in some cases, to decompose a relation into BCNF relations that have both the lossless-join and dependency-preservation properties. Below is an example where we need to make a tradeo\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -17.06, "y": -202.76, "z": 263.71, "jx": 150.0, "jy": 2002.0, "ch": "DBMS 3"}, {"id": "dbms-351-definition-of-third-normal-form", "c": 3, "imp": 0.0095, "h": 0.903, "t": "Definition of Third Normal Form", "d": "A relation *<sup>R</sup>* is in *third normal form* (3NF) if:  \u2022 Whenever *Ai A2 \u25a0 \u25a0 \u25a0 A\" \u2014>\u25a0 B iB 2 \u25a0 \u25a0 \u25a0 Bm* is a nontrivial FD, either  $$\\{A_1,A_2,\\ldots,A_n\\}$$", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 0.96, "y": -188.97, "z": 256.74, "jx": 0.0, "jy": 2002.0, "ch": "DBMS 3"}, {"id": "dbms-352-the-synthesis-algorithm-for-3nf-schemas", "c": 3, "imp": 0.0, "h": 0.947, "t": "The Synthesis Algorithm for 3NF Schemas", "d": "We can now explain and justify how we decompose a relation *R* into a set of relations such that:  - a) The relations of the decomposition are all in 3NF. - b) The decomposition has a lossless join. - c) The decompositio\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -18.95, "y": -221.3, "z": 232.46, "jx": 150.0, "jy": 2120.0, "ch": "DBMS 3"}, {"id": "dbms-353-why-the-3nf-synthesis-algorithm-works", "c": 3, "imp": 0.0, "h": 0.708, "t": "Why the 3NF Synthesis Algorithm Works", "d": "We need to show three things: that the lossless-join and dependency-preservation properties hold, and that all the relations of the decomposition are in 3NF.  - 1. *Lossless Join.* Start with a relation of the decomposit\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -57.47, "y": -241.89, "z": 292.43, "jx": -300.0, "jy": 2120.0, "ch": "DBMS 3"}, {"id": "dbms-361-attribute-independence-and-its-consequent-redundancy", "c": 3, "imp": 0.0163, "h": 0.09, "t": "Attribute Independence and Its Consequent Redundancy", "d": "There are occasional situations where we design a relation schema and find it is in BCNF, yet the relation has a kind of redundancy that is not related to FD's. The most common source of redundancy in BCNF schemas is an \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -41.03, "y": -178.53, "z": 311.9, "jx": -150.0, "jy": 1884.0, "ch": "DBMS 3"}, {"id": "dbms-362-definition-of-multivalued-dependencies", "c": 3, "imp": 0.0, "h": 0.781, "t": "Definition of Multivalued Dependencies", "d": "A *multivalued dependency* (abbreviated MVD) is a statement about some relation *R* that when you fix the values for one set of attributes, then the values in certain other attributes are independent of the values of all\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -23.06, "y": -176.8, "z": 357.22, "jx": -150.0, "jy": 2002.0, "ch": "DBMS 3"}, {"id": "dbms-363-reasoning-about-multivalued-dependencies", "c": 3, "imp": 0.0163, "h": 0.165, "t": "Reasoning About Multivalued Dependencies", "d": "There are a number of rules about MVD's that are similar to the rules we learned for FD's in Section 3.2. For example, MVD's obey  \u2022 *Trivial MVD's.* The MVD  $$A_1 A_2 \\cdots A_n \\longrightarrow B_1 B_2 \\cdots B_m$$", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -168.62, "y": -287.26, "z": 233.2, "jx": 300.0, "jy": 1766.0, "ch": "DBMS 3"}, {"id": "dbms-364-fourth-normal-form", "c": 3, "imp": 0.0136, "h": 0.077, "t": "Fourth Normal Form", "d": "The redundancy that we found in Section 3.6.1 to be caused by MVD's can be eliminated if we use these dependencies for decomposition. In this section we shall introduce a new normal form, called \"fourth normal form.\" In \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -96.65, "y": -226.01, "z": 231.43, "jx": -300.0, "jy": 1884.0, "ch": "DBMS 3"}, {"id": "dbms-365-decomposition-into-fourth-normal-form", "c": 3, "imp": 0.0, "h": 0.569, "t": "Decomposition into Fourth Normal Form", "d": "The 4NF decomposition algorithm is quite analogous to the BCNF decomposition algorithm.  A lgorithm 3.33: Decomposition into Fourth Normal Form.  **INPUT:** A relation *Ro* with a set of functional and multivalued depend\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -102.25, "y": -231.99, "z": 187.49, "jx": -150.0, "jy": 2120.0, "ch": "DBMS 3"}, {"id": "dbms-366-relationships-among-normal-forms", "c": 3, "imp": 0.0, "h": 0.651, "t": "Relationships Among Normal Forms", "d": "As we have mentioned, 4NF implies BCNF, which in turn implies 3NF. Thus, the sets of relation schemas (including dependencies) satisfying the three normal forms are related as in Fig. 3.12. That is, if a relation with ce\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 3.24, "y": -155.78, "z": 233.24, "jx": 0.0, "jy": 2120.0, "ch": "DBMS 3"}, {"id": "dbms-371-the-closure-and-the-chase", "c": 3, "imp": 0.0, "h": 0.198, "t": "The Closure and the Chase", "d": "In Section 3.2.4 we saw how to take a set of attributes *X* and compute its closure *X +* of all attributes that functionally depend on *X .* In that manner, we can test whether an FD *X -\u00a5 Y* follows from a given set of\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -132.79, "y": -259.87, "z": 330.23, "jx": 150.0, "jy": 1884.0, "ch": "DBMS 3"}, {"id": "dbms-372-extending-the-chase-to-m-vds", "c": 3, "imp": 0.0, "h": 0.15, "t": "Extending the Chase to M VD's", "d": "The method of inferring an FD using the chase can be applied to infer MVD's as well. When we try to infer an FD, we are asking whether we can conclude that two possibly unequal values must indeed be the same. When we app\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -206.59, "y": -300.25, "z": 221.92, "jx": 450.0, "jy": 1884.0, "ch": "DBMS 3"}, {"id": "dbms-373-why-the-chase-works-for-m-vds", "c": 3, "imp": 0.0, "h": 0.551, "t": "Why the Chase Works for M VD's", "d": "The arguments are essentially the same as we have given before. Each step of the chase, whether it equates symbols or generates new rows, is a true observation about tuples of the given relation *R* that is justified by \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -65.44, "y": -333.57, "z": 150.66, "jx": 300.0, "jy": 2120.0, "ch": "DBMS 3"}, {"id": "dbms-374-projecting-m-vds", "c": 3, "imp": 0.0, "h": 0.61, "t": "Projecting M VD's", "d": "Recall that our reason for wanting to infer MVD's was to perform a cascade of decompositions leading to 4NF relations. To do that task, we need to be able to project the given dependencies onto the schemas of the two rel\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -50.43, "y": -237.38, "z": 230.69, "jx": -300.0, "jy": 2002.0, "ch": "DBMS 3"}, {"id": "dbms-4101-from-odl-classes-to-relations", "c": 3, "imp": 0.0, "h": 0.115, "t": "From ODL Classes to Relations", "d": "As a starting point, let us assume that our goal is to have one relation for each class and for that relation to have one attribute for each property. We shall see many ways in which this approach must be modified, but f\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -114.85, "y": -31.63, "z": 277.4, "jx": -600.0, "jy": 2649.0, "ch": "DBMS 4"}, {"id": "dbms-4102-complex-attributes-in-classes", "c": 3, "imp": 0.0, "h": 0.908, "t": "Complex Attributes in Classes", "d": "Even when a class' properties are all attributes we may have some difficulty converting the class to a relation. The reason is that attributes in ODL can have complex types such as structures, sets, bags, or lists. On th\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -25.25, "y": 17.27, "z": 304.28, "jx": -300.0, "jy": 3121.0, "ch": "DBMS 4"}, {"id": "dbms-4103-representing-set-valued-attributes", "c": 3, "imp": 0.0, "h": 0.641, "t": "Representing Set-Valued Attributes", "d": "However, record structures are not the most complex kind of attribute that can appear in ODL class definitions. Values can also be built using type constructors Set, Bag, List, Array, and Dictionary from Section 4.9.6. E\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -2.6, "y": -15.05, "z": 349.73, "jx": 150.0, "jy": 3121.0, "ch": "DBMS 4"}, {"id": "dbms-4104-representing-other-type-constructors", "c": 3, "imp": 0.0, "h": 0.559, "t": "Representing Other Type Constructors", "d": "Besides record structures and sets, an ODL class definition could use Bag, L ist, Array, or D ictionary to construct values. To represent a bag (multiset), in which a single object can be a member of the bag n times, we \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -4.68, "y": -70.6, "z": 231.55, "jx": 0.0, "jy": 3121.0, "ch": "DBMS 4"}, {"id": "dbms-4105-representing-odl-relationships", "c": 3, "imp": 0.0, "h": 0.692, "t": "Representing ODL Relationships", "d": "Usually, an ODL class definition will contain relationships to other ODL classes. As in the E /R model, we can create for each relationship a new relation that connects the keys of the two related classes. However, in OD\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 16.0, "y": 5.45, "z": 331.29, "jx": -150.0, "jy": 3121.0, "ch": "DBMS 4"}, {"id": "dbms-411-entity-sets", "c": 3, "imp": 0.4792, "h": 0.104, "t": "Entity Sets", "d": "An *entity* is an abstract object of some sort, and a collection of similar entities forms an *entity set.* An entity in some ways resembles an \"object\" in the sense of object-oriented programming. Likewise, an entity se\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -197.16, "y": -31.1, "z": 271.99, "jx": 0.0, "jy": 2413.0, "ch": "DBMS 4"}, {"id": "dbms-4110-converting-multiway-relationships-to-binary", "c": 3, "imp": 0.0, "h": 0.138, "t": "Converting Multiway Relationships to Binary", "d": "There are some data models, such as UML (Section 4.7) and ODL (Section 4.9), that limit relationships to be binary. Thus, while the E /R model does not  <sup>1</sup>H ere, we have reverted to th e earlier notion of three\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -189.54, "y": -115.11, "z": 273.13, "jx": 1350.0, "jy": 2649.0, "ch": "DBMS 4"}, {"id": "dbms-4111-subclasses-in-the-e-r-model", "c": 3, "imp": 0.0, "h": 0.081, "t": "Subclasses in the E /R Model", "d": "Often, an entity set contains certain entities that have special properties not associated with all members of the set. If so, we find it useful to define certain    Figure 4.9: Replacing a multiway relationship by an en\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -188.24, "y": -105.3, "z": 297.92, "jx": 1650.0, "jy": 2649.0, "ch": "DBMS 4"}, {"id": "dbms-412-attributes", "c": 3, "imp": 0.4402, "h": 0.121, "t": "Attributes", "d": "Entity sets have associated *attributes,* which are properties of the entities in that set. For instance, the entity set *Movies* might be given attributes such as *title* and *length.* It should not surprise you if the \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -118.03, "y": -25.87, "z": 235.37, "jx": -300.0, "jy": 2531.0, "ch": "DBMS 4"}, {"id": "dbms-413-relationships", "c": 3, "imp": 0.2022, "h": 0.19, "t": "Relationships", "d": "*Relationships* are connections among two or more entity sets. For instance, if *Movies* and *Stars* are two entity sets, we could have a relationship *Stars-in* that connects movies and stars. The intent is that a movie\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -146.33, "y": -73.27, "z": 265.42, "jx": 150.0, "jy": 2531.0, "ch": "DBMS 4"}, {"id": "dbms-414-entity-relationship-diagrams", "c": 3, "imp": 0.0, "h": 0.072, "t": "Entity-Relationship Diagrams", "d": "An *E /R diagram* is a graph representing entity sets, attributes, and relationships. Elements of each of these kinds are represented by nodes of the graph, and we use a special shape of node to indicate the kind, as fol\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -147.46, "y": -73.83, "z": 223.31, "jx": 0.0, "jy": 2649.0, "ch": "DBMS 4"}, {"id": "dbms-415-instances-of-an-e-r-diagram", "c": 3, "imp": 0.0, "h": 0.146, "t": "Instances of an E /R Diagram", "d": "E /R diagrams are a notation for describing schemas of databases. We may imagine that a database described by an E /R diagram contains particular data, an \"instance\" of the database. Since the database is not implemented\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -249.36, "y": -42.97, "z": 276.0, "jx": -150.0, "jy": 2531.0, "ch": "DBMS 4"}, {"id": "dbms-416-m-ultiplicity-of-binary-e-r-relationships", "c": 3, "imp": 0.0, "h": 0.167, "t": "M ultiplicity of Binary E /R Relationships", "d": "In general, a binary relationship can connect any member of one of its entity sets to any number of members of the other entity set. However, it is common for there to be a restriction on the \"multiplicity\" of a relation\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -249.88, "y": -19.67, "z": 276.59, "jx": 0.0, "jy": 2531.0, "ch": "DBMS 4"}, {"id": "dbms-417-multiway-relationships", "c": 3, "imp": 0.0249, "h": 0.09, "t": "Multiway Relationships", "d": "The E /R model makes it convenient to define relationships involving more than two entity sets. In practice, ternary (three-way) or higher-degree relationships are rare, but they occasionally are necessary to reflect the\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -165.9, "y": -47.35, "z": 315.48, "jx": 1500.0, "jy": 2649.0, "ch": "DBMS 4"}, {"id": "dbms-418-roles-in-relationships", "c": 3, "imp": 0.0216, "h": 0.147, "t": "Roles in Relationships", "d": "It is possible that one entity set appears two or more times in a single relationship. If so, we draw as many lines from the relationship to the entity set as the entity set appears in the relationship. Each line to the \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 20.24, "y": -16.59, "z": 325.95, "jx": 300.0, "jy": 2413.0, "ch": "DBMS 4"}, {"id": "dbms-419-attributes-on-relationships", "c": 3, "imp": 0.0, "h": 0.103, "t": "Attributes on Relationships", "d": "Sometimes it is convenient, or even essential, to associate attributes with a relationship, rather than with any one of the entity sets that the relationship connects. For example, consider the relationship of Fig. 4.4, \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -136.9, "y": -3.95, "z": 188.46, "jx": -1500.0, "jy": 2649.0, "ch": "DBMS 4"}, {"id": "dbms-421-faithfulness", "c": 3, "imp": 0.0255, "h": 0.117, "t": "Faithfulness", "d": "First and foremost, the design should be faithful to the specifications of the application. That is, entity sets and their attributes should reflect reality. You can't attach an attribute *number-of-cylinders* to *Stars,\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -100.46, "y": -70.98, "z": 286.26, "jx": 150.0, "jy": 2649.0, "ch": "DBMS 4"}, {"id": "dbms-422-avoiding-redundancy", "c": 3, "imp": 0.0487, "h": 0.16, "t": "Avoiding Redundancy", "d": "We should be careful to say everything once only. The problems we discussed in Section 3.3 regarding redundancy and anomalies are typical of problems that can arise in E /R designs. However, in the E /R model, there are \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -95.06, "y": -114.76, "z": 276.91, "jx": 1050.0, "jy": 2649.0, "ch": "DBMS 4"}, {"id": "dbms-423-simplicity-counts", "c": 3, "imp": 0.0408, "h": 0.911, "t": "Simplicity Counts", "d": "Avoid introducing more elements into your design than is absolutely necessary.  Exam ple 4.14: Suppose that instead of a relationship between *Movies* and *Studios* we postulated the existence of \"movie-holdings,\" the ow\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -56.62, "y": -99.15, "z": 325.76, "jx": 300.0, "jy": 2767.0, "ch": "DBMS 4"}, {"id": "dbms-424-choosing-the-right-relationships", "c": 3, "imp": 0.0, "h": 0.13, "t": "Choosing the Right Relationships", "d": "Entity sets can be connected in various ways by relationships. However, adding to our design every possible relationship is not often a good idea. Doing so can lead to redundancy, update anomalies, and deletion anomalies\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -114.6, "y": -136.07, "z": 259.73, "jx": 1200.0, "jy": 2649.0, "ch": "DBMS 4"}, {"id": "dbms-425-picking-the-right-kind-of-element", "c": 3, "imp": 0.0163, "h": 0.645, "t": "Picking the Right Kind of Element", "d": "Sometimes we have options regarding the type of design element used to represent a real-world concept. Many of these choices are between using attributes and using entity set/relationship combinations. In general, an att\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -123.28, "y": -86.52, "z": 290.85, "jx": -150.0, "jy": 2767.0, "ch": "DBMS 4"}, {"id": "dbms-431-keys-in-the-e-r-model", "c": 3, "imp": 0.0, "h": 0.167, "t": "Keys in the E /R Model", "d": "A *key* for an entity set *E* is a set *K* of one or more attributes such that, given any two distinct entities ei and *e2* in *E, e\\* and *e2* cannot have identical values for each of the attributes in the key *K .* If \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -104.94, "y": 6.55, "z": 204.18, "jx": -1050.0, "jy": 2649.0, "ch": "DBMS 4"}, {"id": "dbms-432-representing-keys-in-the-e-r-model", "c": 3, "imp": 0.0, "h": 0.133, "t": "Representing Keys in the E /R Model", "d": "In our E/R-diagram notation, we underline the attributes belonging to a key for an entity set. For example, Fig. 4.17 reproduces our E /R diagram for movies, stars, and studios from Fig. 4.2, but with key attributes unde\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -134.1, "y": 23.18, "z": 213.94, "jx": -900.0, "jy": 2649.0, "ch": "DBMS 4"}, {"id": "dbms-433-referential-integrity", "c": 3, "imp": 0.0, "h": 0.607, "t": "Referential Integrity", "d": "Recall our discussion of referential-integrity constraints in Section 2.5.2. These constraints say that a value appearing in one context must also appear in another. For example, let us consider the many-one relationship\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -2.73, "y": -98.55, "z": 301.35, "jx": 150.0, "jy": 2885.0, "ch": "DBMS 4"}, {"id": "dbms-434-degree-constraints", "c": 3, "imp": 0.0, "h": 0.141, "t": "Degree Constraints", "d": "In the E /R model, we can attach a bounding number to the edges that connect a relationship to an entity set, indicating limits on the number of entities that can be connected to any one entity of the related entity set.\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 127.23, "y": -71.12, "z": 409.95, "jx": -150.0, "jy": 2413.0, "ch": "DBMS 4"}, {"id": "dbms-441-causes-of-weak-entity-sets", "c": 3, "imp": 0.0, "h": 0.807, "t": "Causes of Weak Entity Sets", "d": "There are two principal reasons we need weak entity sets. First, sometimes entity sets fall into a hierarchy based on classifications unrelated to the \"isa hierarchy\" of Section 4.1.11. If entities of set *E* are subunit\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -138.11, "y": -111.19, "z": 336.48, "jx": -450.0, "jy": 2885.0, "ch": "DBMS 4"}, {"id": "dbms-442-requirements-for-weak-entity-sets", "c": 3, "imp": 0.0, "h": 0.076, "t": "Requirements for Weak Entity Sets", "d": "We cannot obtain key attributes for a weak entity set indiscriminately. Rather, if *E* is a weak entity set then its key consists of:", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -160.24, "y": 3.1, "z": 210.27, "jx": -750.0, "jy": 2649.0, "ch": "DBMS 4"}, {"id": "dbms-443-weak-entity-set-notation", "c": 3, "imp": 0.0, "h": 0.095, "t": "Weak Entity Set Notation", "d": "We shall adopt the following conventions to indicate that an entity set is weak and to declare its key attributes.  - 1. If an entity set is weak, it will be shown as a rectangle with a double border. Examples of this co\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -172.53, "y": -57.71, "z": 235.53, "jx": 900.0, "jy": 2649.0, "ch": "DBMS 4"}, {"id": "dbms-451-prom-entity-sets-to-relations", "c": 3, "imp": 0.0, "h": 0.183, "t": "Prom Entity Sets to Relations", "d": "Let us first consider entity sets that are not weak. We shall take up the modifications needed to accommodate weak entity sets in Section 4.5.4. For each non-weak entity set, we shall create a relation of the same name a\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -127.55, "y": -62.93, "z": 223.86, "jx": 600.0, "jy": 2649.0, "ch": "DBMS 4"}, {"id": "dbms-452-from-e-r-relationships-to-relations", "c": 3, "imp": 0.0, "h": 0.157, "t": "From E /R Relationships to Relations", "d": "Relationships in the E /R model are also represented by relations. The relation for a given relationship *R* has the following attributes:  - 1. For each entity set involved in relationship *R,* we take its key attribute\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -153.4, "y": -51.82, "z": 220.42, "jx": 300.0, "jy": 2649.0, "ch": "DBMS 4"}, {"id": "dbms-453-combining-relations", "c": 3, "imp": 0.0, "h": 0.177, "t": "Combining Relations", "d": "Sometimes, the relations that we get from converting entity sets and relationships to relations are not the best possible choice of relations for the given data. One common situation occurs when there is an entity set *E\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -155.8, "y": -75.77, "z": 241.37, "jx": -300.0, "jy": 2649.0, "ch": "DBMS 4"}, {"id": "dbms-454-handling-weak-entity-sets", "c": 3, "imp": 0.0, "h": 0.12, "t": "Handling Weak Entity Sets", "d": "When a weak entity set appears in an E /R diagram, we need to do three things differently.  - 1. The relation for the weak entity set *W* itself must include not only the attributes of *W* but also the key attributes of \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -128.11, "y": -72.29, "z": 243.01, "jx": 450.0, "jy": 2649.0, "ch": "DBMS 4"}, {"id": "dbms-461-er-style-conversion", "c": 3, "imp": 0.0, "h": 0.118, "t": "E/R -Style Conversion", "d": "Our first approach is to create a relation for each entity set, as usual. If the entity set *E* is not the root of the hierarchy, then the relation for *E* will include the key attributes at the root, to identify the ent\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -157.08, "y": -42.5, "z": 261.4, "jx": -150.0, "jy": 2649.0, "ch": "DBMS 4"}, {"id": "dbms-462-an-object-oriented-approach", "c": 3, "imp": 0.0054, "h": 0.066, "t": "An Object-Oriented Approach", "d": "An alternative strategy for converting isa-hierarchies to relations is to enumerate all the possible subtrees of the hierarchy. For each, create one relation that represents entities having components in exactly those su\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -110.77, "y": 33.06, "z": 249.34, "jx": -1800.0, "jy": 2649.0, "ch": "DBMS 4"}, {"id": "dbms-463-using-null-values-to-combine-relations", "c": 3, "imp": 0.0, "h": 0.566, "t": "Using Null Values to Combine Relations", "d": "There is one more approach to representing information about a hierarchy of entity sets. If we are allowed to use NULL (the null value as in SQL) as a value in tuples, we can handle a hierarchy of entity sets with a sing\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -59.2, "y": -108.3, "z": 373.21, "jx": 450.0, "jy": 2885.0, "ch": "DBMS 4"}, {"id": "dbms-464-comparison-of-approaches", "c": 3, "imp": 0.0, "h": 0.85, "t": "Comparison of Approaches", "d": "Each of the three approaches, which we shall refer to as \"straight-E/R,\" \"objectoriented,\" and \"nulls,\" respectively, have advantages and disadvantages. Here is a list of the principal issues.  - 1. It can be expensive t\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -99.49, "y": -80.01, "z": 250.07, "jx": -300.0, "jy": 2767.0, "ch": "DBMS 4"}, {"id": "dbms-471-uml-classes", "c": 3, "imp": 0.0551, "h": 0.177, "t": "UML Classes", "d": "A class in UML is similar to an entity set in the E /R model. The notation for a class is rather different, however. Figure 4.35 shows the class that corresponds to the E /R entity set *Movies* from our running example o\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -186.8, "y": 9.87, "z": 315.9, "jx": 300.0, "jy": 2531.0, "ch": "DBMS 4"}, {"id": "dbms-472-keys-for-uml-classes", "c": 3, "imp": 0.0, "h": 0.09, "t": "Keys for UML classes", "d": "As for entity sets, we can declare one key for a UML class. To do so, we follow each attribute in the key by the letters PK, standing for \"primary key.\" There is no convenient way to stipulate that several attributes or \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -129.25, "y": -24.49, "z": 185.13, "jx": -1200.0, "jy": 2649.0, "ch": "DBMS 4"}, {"id": "dbms-473-associations", "c": 3, "imp": 0.0394, "h": 0.115, "t": "Associations", "d": "A binary relationship between classes is called an *association.* There is no analog of multiway relationships in UML. Rather, a multiway relationship has to be broken into binary relationships, which as we suggested in \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -146.79, "y": 1.32, "z": 313.52, "jx": 150.0, "jy": 2767.0, "ch": "DBMS 4"}, {"id": "dbms-474-self-associations", "c": 3, "imp": 0.0, "h": 0.759, "t": "Self-Associations", "d": "An association can have both ends at the same class; such an association is called a *self-association.* To distinguish the two roles played by one class in a self-association, we give the association two names, one for \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -35.11, "y": -98.37, "z": 366.6, "jx": 300.0, "jy": 2885.0, "ch": "DBMS 4"}, {"id": "dbms-475-association-classes", "c": 3, "imp": 0.0054, "h": 0.146, "t": "Association Classes", "d": "We can attach attributes to an association in much the way we did in the E /R model, in Section 4.1.9.5 In UML, we create a new class, called an *association class,* and attach it to the middle of the association. The as\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -124.84, "y": 17.68, "z": 281.79, "jx": -150.0, "jy": 2885.0, "ch": "DBMS 4"}, {"id": "dbms-476-subclasses-in-uml", "c": 3, "imp": 0.0163, "h": 0.083, "t": "Subclasses in UML", "d": "Any UML class can have a hierarchy of subclasses below it. The primary key comes from the root of the hierarchy, just as with E /R hierarchies. UML permits a class *C* to have four different kinds of subclasses below it,\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -159.02, "y": 43.0, "z": 324.17, "jx": 1800.0, "jy": 2649.0, "ch": "DBMS 4"}, {"id": "dbms-477-aggregations-and-compositions", "c": 3, "imp": 0.0298, "h": 0.052, "t": "Aggregations and Compositions", "d": "There are two special notations for many-one associations whose implications are rather subtle. In one sense, they reflect the object-oriented style of programming, where it is common for one class to have references to \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -95.91, "y": 3.12, "z": 305.67, "jx": -300.0, "jy": 2885.0, "ch": "DBMS 4"}, {"id": "dbms-481-uml-to-relations-basics", "c": 3, "imp": 0.0, "h": 0.085, "t": "UML-to-Relations Basics", "d": "Here is an outline of the points that should be familiar from our discussion in Section 4.5:  - *Classes to Relations.* For each class, create a relation whose name is the name of the class, and whose attributes are the \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -149.52, "y": 1.43, "z": 276.54, "jx": 0.0, "jy": 2885.0, "ch": "DBMS 4"}, {"id": "dbms-482-from-uml-subclasses-to-relations", "c": 3, "imp": 0.0, "h": 0.192, "t": "From UML Subclasses to Relations", "d": "The three options we enumerated in Section 4.6 apply to UML subclass hierarchies as well. Recall these options are \"E /R style\" (relations for each subclass have only the key attributes and attributes of that subclass), \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -146.96, "y": 28.63, "z": 277.9, "jx": 0.0, "jy": 2767.0, "ch": "DBMS 4"}, {"id": "dbms-483-from-aggregations-and-compositions-to-relations", "c": 3, "imp": 0.0, "h": 0.099, "t": "From Aggregations and Compositions to Relations", "d": "Aggregations and compositions are really types of many-one associations. Thus, one approach to their representation in a relational database schema is to convert them as we do for any association in Section 4.8.1. Since \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -120.25, "y": 43.25, "z": 341.98, "jx": 150.0, "jy": 3003.0, "ch": "DBMS 4"}, {"id": "dbms-484-the-uml-analog-of-weak-entity-sets", "c": 3, "imp": 0.0, "h": 0.099, "t": "The UML Analog of Weak Entity Sets", "d": "We have not mentioned a UML notation that corresponds to the double-border notation for weak entity sets in the E /R model. There is a sense in which none is needed. The reason is that UML, unlike E/R , draws on the trad\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -165.7, "y": -37.87, "z": 238.41, "jx": 750.0, "jy": 2649.0, "ch": "DBMS 4"}, {"id": "dbms-491-class-declarations", "c": 3, "imp": 0.0577, "h": 0.186, "t": "Class Declarations", "d": "A declaration of a class in ODL, in its simplest form, is:  ``` c la ss <name> {    <list of properties> }; ```  That is, the keyword c la ss is followed by the name of the class and a bracketed list of properties. A pro\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -73.85, "y": -1.86, "z": 286.92, "jx": -300.0, "jy": 2413.0, "ch": "DBMS 4"}, {"id": "dbms-492-attributes-in-odl", "c": 3, "imp": 0.0082, "h": 0.154, "t": "Attributes in ODL", "d": "The simplest kind of property is the *attribute.* In ODL, attributes need not be of simple types, such as integers and strings. ODL has a type system, described in Section 4.9.6, that allows us to form structured types a\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -64.86, "y": 3.35, "z": 270.53, "jx": -1650.0, "jy": 2649.0, "ch": "DBMS 4"}, {"id": "dbms-493-relationships-in-odl", "c": 3, "imp": 0.0571, "h": 0.197, "t": "Relationships in ODL", "d": "An ODL relationship is declared inside a class declaration, by the keyword re la tio n s h ip , a type, and the name of the relationship. The type of a relationship describes what a single object of the class is connecte\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -18.83, "y": -11.4, "z": 308.87, "jx": 0.0, "jy": 3003.0, "ch": "DBMS 4"}, {"id": "dbms-494-inverse-relationships", "c": 3, "imp": 0.0082, "h": 0.176, "t": "Inverse Relationships", "d": "Just as we might like to access the stars of a given movie, we might like to know the movies in which a given star acted. To get this information into S tar objects, we can add the line", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 6.97, "y": 45.28, "z": 386.04, "jx": 150.0, "jy": 2413.0, "ch": "DBMS 4"}, {"id": "dbms-495-m-ultiplicity-of-relationships", "c": 3, "imp": 0.0, "h": 0.893, "t": "M ultiplicity of Relationships", "d": "Like the binary relationships of the E /R model, a pair of inverse relationships in ODL can be classified as either many-many, many-one in either direction, or one-one. The type declarations for the pair of relationships\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -0.81, "y": 21.72, "z": 354.63, "jx": 300.0, "jy": 3121.0, "ch": "DBMS 4"}, {"id": "dbms-496-types-in-odl", "c": 3, "imp": 0.0, "h": 0.159, "t": "Types in ODL", "d": "ODL offers the database designer a type system similar to that found in C or other conventional programming languages. A type system is built from a basis of types that are defined by themselves and certain recursive rul\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -104.3, "y": -38.06, "z": 268.01, "jx": -450.0, "jy": 2649.0, "ch": "DBMS 4"}, {"id": "dbms-497-subclasses-in-odl", "c": 3, "imp": 0.0, "h": 0.096, "t": "Subclasses in ODL", "d": "We can declare one class *C* to be a subclass of another class *D.* To do so, follow the name *C* in its declaration with the keyword extends and the name *D.* Then, class *C* inherits all the properties of *D,* and may \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -95.06, "y": 44.2, "z": 284.42, "jx": -150.0, "jy": 3003.0, "ch": "DBMS 4"}, {"id": "dbms-498-declaring-keys-in-odl", "c": 3, "imp": 0.0, "h": 0.143, "t": "Declaring Keys in ODL", "d": "The declaration of a key or keys for a class is optional. The reason is that ODL, being object-oriented, assumes that all objects have an object-identity, as discussed in connection with UML in Section 4.8.4.  In ODL we \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -87.21, "y": 9.09, "z": 249.85, "jx": -1350.0, "jy": 2649.0, "ch": "DBMS 4"}, {"id": "dbms-511-why-bags", "c": 3, "imp": 0.0, "h": 0.187, "t": "Why Bags?", "d": "As we mentioned, commercial DBMS's implement relations that are bags, rather than sets. An important motivation for relations as bags is that some relational operations are considerably more efficient if we use the bag m\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -35.77, "y": -236.02, "z": 68.49, "jx": 0.0, "jy": 3532.0, "ch": "DBMS 5"}, {"id": "dbms-512-union-intersection-and-difference-of-bags", "c": 3, "imp": 0.0877, "h": 0.054, "t": "Union, Intersection, and Difference of Bags", "d": "These three operations have new definitions for bags. Suppose that *R* and *S* are bags, and that tuple *t* appears *n* times in *R* and *m* times in *S.* Note that either n or *m* (or both) can be 0. Then:  - In the bag\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 67.58, "y": -192.87, "z": 48.57, "jx": 150.0, "jy": 3414.0, "ch": "DBMS 5"}, {"id": "dbms-513-projection-of-bags", "c": 3, "imp": 0.0076, "h": 0.189, "t": "Projection of Bags", "d": "We have already illustrated the projection of bags. As we saw in Example 5.2, each tuple is processed independently during the projection. If *R* is the bag of Fig. 5.2 and we compute the bag-projection *tta,b (R),* then\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 40.65, "y": -231.55, "z": 79.59, "jx": 150.0, "jy": 3532.0, "ch": "DBMS 5"}, {"id": "dbms-514-selection-on-bags", "c": 3, "imp": 0.0, "h": 0.607, "t": "Selection on Bags", "d": "To apply a selection to a bag, we apply the selection condition to each tuple independently. As always with bags, we do not eliminate duplicate tuples in the result.  E xam ple 5.5: If *R* is the bag", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 53.93, "y": -196.22, "z": 9.68, "jx": 150.0, "jy": 4122.0, "ch": "DBMS 5"}, {"id": "dbms-515-product-of-bags", "c": 3, "imp": 0.0198, "h": 0.056, "t": "Product of Bags", "d": "The rule for the Cartesian product of bags is the expected one. Each tuple of one relation is paired with each tuple of the other, regardless of whether it is a duplicate or not. As a result, if a tuple r appears in a re\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 68.48, "y": -171.52, "z": 112.96, "jx": 75.0, "jy": 3886.0, "ch": "DBMS 5"}, {"id": "dbms-516-joins-of-bags", "c": 3, "imp": 0.0, "h": 0.674, "t": "Joins of Bags", "d": "Joining bags presents no surprises. We compare each tuple of one relation with each tuple of the other, decide whether or not this pair of tuples joins successfully, and if so we put the resulting tuple in the answer. Wh\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 58.32, "y": -217.99, "z": 86.9, "jx": 0.0, "jy": 4358.0, "ch": "DBMS 5"}, {"id": "dbms-521-duplicate-elimination", "c": 3, "imp": 0.0321, "h": 0.161, "t": "Duplicate Elimination", "d": "Sometimes, we need an operator that converts a bag to a set. For that purpose, we use *6(R)* to return the set consisting of one copy of every tuple that appears one or more times in relation *R.*  E xam ple 5.8: If *R* \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 131.81, "y": -158.11, "z": 19.44, "jx": 300.0, "jy": 3532.0, "ch": "DBMS 5"}, {"id": "dbms-522-aggregation-operators", "c": 3, "imp": 0.1334, "h": 0.139, "t": "Aggregation Operators", "d": "There are several operators that apply to sets or bags of numbers or strings. These operators are used to summarize or \"aggregate\" the values in one column of a relation, and thus are referred to as *aggregation* operato\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 110.93, "y": -71.47, "z": 62.14, "jx": -150.0, "jy": 3414.0, "ch": "DBMS 5"}, {"id": "dbms-523-grouping", "c": 3, "imp": 0.1172, "h": 0.173, "t": "Grouping", "d": "Often we do not want simply the average or some other aggregation of an entire column. Rather, we need to consider the tuples of a relation in groups, corresponding to the value of one or more other columns, and we aggre\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 94.09, "y": -103.6, "z": 69.96, "jx": -300.0, "jy": 3532.0, "ch": "DBMS 5"}, {"id": "dbms-524-the-grouping-operator", "c": 3, "imp": 0.0617, "h": 0.184, "t": "The Grouping Operator", "d": "We shall now introduce an operator that allows us to group a relation and/or aggregate some columns. If there is grouping, then the aggregation is within groups.  The subscript used with the **7** operator is a list *L* \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 46.84, "y": -139.25, "z": 33.87, "jx": -150.0, "jy": 3650.0, "ch": "DBMS 5"}, {"id": "dbms-525-extending-the-projection-operator", "c": 3, "imp": 0.126, "h": 0.897, "t": "Extending the Projection Operator", "d": "Let us reconsider the projection operator **7***tl(R)* introduced in Section 2.4.5. In the classical relational algebra, *L* is a list of (some of the) attributes of *R.* We extend the projection operator to allow it to \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 9.26, "y": -189.59, "z": 30.86, "jx": -75.0, "jy": 3768.0, "ch": "DBMS 5"}, {"id": "dbms-526-the-sorting-operator", "c": 3, "imp": 0.0592, "h": 0.192, "t": "The Sorting Operator", "d": "There are several contexts in which we want to sort the tuples of a relation by one or more of its attributes. Often, when querying data, one wants the result relation to be sorted. For instance, in a query about all the\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 103.03, "y": -95.49, "z": 18.62, "jx": -150.0, "jy": 3532.0, "ch": "DBMS 5"}, {"id": "dbms-527-outerjoins", "c": 3, "imp": 0.0041, "h": 0.632, "t": "Outerjoins", "d": "A property of the join operator is that it is possible for certain tuples to be \"dangling\"; that is, they fail to match any tuple of the other relation in the  common attributes. Dangling tuples do not have any trace in \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 92.45, "y": -194.03, "z": 153.41, "jx": 375.0, "jy": 4004.0, "ch": "DBMS 5"}, {"id": "dbms-531-predicates-and-atoms", "c": 3, "imp": 0.1291, "h": 0.564, "t": "Predicates and Atoms", "d": "Relations are represented in Datalog by *predicates.* Each predicate takes a fixed number of arguments, and a predicate followed by its arguments is called an *atom..* The syntax of atoms is just like that of function ca\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -3.36, "y": -241.08, "z": 10.77, "jx": -75.0, "jy": 3886.0, "ch": "DBMS 5"}, {"id": "dbms-532-arithmetic-atoms", "c": 3, "imp": 0.0, "h": 0.875, "t": "Arithmetic Atoms", "d": "There is another kind of atom that is important in Datalog: an *arithmetic atom.* This kind of atom is a comparison between two arithmetic expressions, for example *x < y* or *x + 1 > y + 4 x z.* For contrast, we shall c\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -20.6, "y": -272.97, "z": -11.26, "jx": -375.0, "jy": 4004.0, "ch": "DBMS 5"}, {"id": "dbms-533-datalog-rules-and-queries", "c": 3, "imp": 0.0465, "h": 0.88, "t": "Datalog Rules and Queries", "d": "Operations similar to those of relational algebra are described in Datalog by *rules,* which consist of  - 1. A relational atom called the *head,* followed by - 2. The symbol \u00ab\u2014, which we often read \"if,\" followed by - 3\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 2.34, "y": -257.04, "z": 38.73, "jx": -75.0, "jy": 4004.0, "ch": "DBMS 5"}, {"id": "dbms-534-meaning-of-datalog-rules", "c": 3, "imp": 0.0505, "h": 0.093, "t": "Meaning of Datalog Rules", "d": "Example 5.18 gave us a hint of the meaning of a Datalog rule. More precisely, imagine the variables of the rule ranging over all possible values. Whenever these variables have values that together make all the subgoals t\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 88.63, "y": -139.98, "z": 28.86, "jx": 0.0, "jy": 3650.0, "ch": "DBMS 5"}, {"id": "dbms-535-extensional-and-intensional-predicates", "c": 3, "imp": 0.0292, "h": 0.589, "t": "Extensional and Intensional Predicates", "d": "It is useful to make the distinction between  - *Extensional* predicates, which are predicates whose relations are stored in a database, and - *Intensional* predicates, whose relations are computed by applying one or mor\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 27.49, "y": -265.89, "z": 87.11, "jx": -150.0, "jy": 4122.0, "ch": "DBMS 5"}, {"id": "dbms-536-datalog-rules-applied-to-bags", "c": 3, "imp": 0.0, "h": 0.632, "t": "Datalog Rules Applied to Bags", "d": "Datalog is inherently a logic of sets. However, as long as there are no negated, relational subgoals, the ideas for evaluating Datalog rules when relations are sets apply to bags as well. When relations are bags, it is c\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 28.83, "y": -225.91, "z": 26.56, "jx": 0.0, "jy": 4122.0, "ch": "DBMS 5"}, {"id": "dbms-541-bo
