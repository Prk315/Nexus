<!doctype html><html><head><meta charset=utf-8><title>Concept map</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;font-family:-apple-system,system-ui,sans-serif;background:#c6c5cb}
#app{position:fixed;inset:0;display:grid;grid-template-columns:224px 1fr;grid-template-rows:54px 1fr;gap:12px;padding:12px;box-sizing:border-box}
.card{background:#e9e8ec;border:1px solid #d4d3d9;border-radius:14px;box-shadow:0 1px 4px rgba(30,28,40,.07)}
#topbar{grid-column:1 / -1;grid-row:1;display:flex;align-items:center;gap:12px;padding:0 18px;color:#3a3a44;font-size:13px}
#topbar b{font-size:14px}
#topbar .sub{color:#8f8f98;font-size:12px}
#recbtn{margin-left:auto;padding:8px 16px;border:0;border-radius:8px;background:#b8892f;color:#fff;font-size:13px;font-weight:600;cursor:pointer}
.lgd{display:inline-flex;align-items:center;gap:5px;color:#7a7a84;font-size:11.5px;margin-left:14px}
.lgd i{width:9px;height:9px;border-radius:50%}
#modesw{display:inline-flex;background:#dedde3;border-radius:9px;padding:3px;gap:2px;margin-left:16px}
#modesw .msw{padding:6px 15px;border:0;border-radius:7px;background:transparent;color:#6a6a72;font-size:12.5px;font-weight:600;cursor:pointer}
#modesw .msw.on{background:#fbfbfd;color:#26262e;box-shadow:0 1px 3px rgba(30,28,40,.12)}
#acts{display:flex;gap:7px;margin-left:18px}
.act{position:relative;padding:7px 12px;border:1px solid #d3d2d9;border-radius:8px;background:#f2f1f5;color:#3a3a44;font-size:12.5px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.act:hover{background:#e4e3ea}
.act .dot{width:7px;height:7px;border-radius:50%;flex:none}
.act .cnt{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:#c0562f;color:#fff;font-size:10.5px;font-weight:700;display:none;align-items:center;justify-content:center}
#sidebar{grid-column:1;grid-row:2;padding:14px 12px;color:#9a9aa4;font-size:12px;line-height:1.6;overflow-y:auto}
#sidebar .sbh{font-weight:700;color:#3a3a44;margin-bottom:10px;font-size:13px}
.chead{display:flex;justify-content:space-between;align-items:center;cursor:pointer;font-weight:600;color:#3a3a44;font-size:12.5px;padding:6px 5px;border-radius:6px}
.chead:hover{background:#dedde3}
.chead.active{background:#dbdae1;box-shadow:inset 3px 0 0 #b8892f;color:#26262e}
.chead .cn{color:#a6a6ae;font-weight:600;font-size:11px}
.tlist{margin:1px 0 8px 8px}
.trow{display:flex;justify-content:space-between;align-items:center;cursor:pointer;font-size:11.5px;color:#5a5a64;padding:3px 6px;border-radius:5px}
.trow:hover{background:#dedde3;color:#26262e}
.trow .tc{color:#a4a4ac;font-size:11px;white-space:nowrap}
.trow .tc b{color:#b8892f}
.tplay{color:#3a6ea5;font-weight:700;margin-left:7px;padding:0 3px}
#clearfocus{margin-top:12px;color:#3a6ea5;cursor:pointer;font-size:12px;display:none}
#main{grid-column:2;grid-row:2;position:relative;overflow:hidden;
 background:radial-gradient(circle at 50% 44%, #edecf0 0%, #dcdbe1 56%, #c2c1c9 100%)}
#g{position:absolute;inset:0}
#panel{position:absolute;top:0;right:0;width:340px;max-width:82%;height:100%;box-sizing:border-box;
 background:rgba(248,248,251,.97);backdrop-filter:blur(8px);border-left:1px solid #d3d2d8;
 padding:20px 22px;color:#2a2a32;font-size:13.5px;line-height:1.5;transform:translateX(370px);
 transition:transform .24s ease;overflow-y:auto;z-index:5}
#panel.open{transform:none}
#pclose{position:absolute;top:10px;right:15px;cursor:pointer;color:#9a9aa4;font-size:22px;line-height:1}
#ptitle{font-size:18px;font-weight:700;margin:2px 34px 3px 0;color:#1b1b23}
#pcourse{font-size:11px;color:#8a8a93;text-transform:uppercase;letter-spacing:.5px;margin-bottom:14px}
.gauge{margin:9px 0}
.gauge .lab{display:flex;justify-content:space-between;font-size:12px;color:#5a5a64;margin-bottom:3px}
.bar{height:7px;border-radius:4px;background:#e2e2e8;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:4px}
.sec{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:#9a9aa4;margin:17px 0 6px}
#pdesc{color:#45454f;font-size:12.5px;max-height:150px;overflow:auto}
.pr{display:flex;justify-content:space-between;font-size:12.5px;padding:3px 0;border-bottom:1px solid #ededf1}
#ppractice{margin-top:14px;width:100%;padding:11px;border:0;border-radius:8px;background:#3a6ea5;color:#fff;font-size:14px;font-weight:600;cursor:pointer}
#ppractice:disabled{background:#c9c9d0;cursor:default}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#2a2a32;color:#eee;
 padding:9px 16px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .3s;z-index:9;pointer-events:none}
#prac{position:absolute;inset:0;background:rgba(20,19,26,.55);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:8}
#prac.open{display:flex}
#praccard{width:min(660px,88%);max-height:88%;overflow:auto;background:#faf9fc;border-radius:16px;padding:22px 26px;box-shadow:0 12px 44px rgba(0,0,0,.4);color:#25252c}
#prachead{font-size:11.5px;color:#8a8a93;text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px;display:flex;justify-content:space-between}
#pracbody{font-size:15px;line-height:1.6;overflow-x:auto}
#pracsol{margin-top:16px;padding-top:14px;border-top:1px solid #e6e6ec;color:#3a3a44;font-size:14px;line-height:1.55;display:none;overflow-x:auto}
#pracctl{margin-top:20px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#pracctl button{padding:9px 16px;border:0;border-radius:8px;font-size:13.5px;font-weight:600;cursor:pointer;color:#fff}
.bshow{background:#3a6ea5}.bg-again{background:#c0562f}.bg-hard{background:#c99a2a}.bg-good{background:#4a8c5c}.bg-easy{background:#3a7d8c}.bdone{background:#4a4a54}
.pm{display:inline-block;margin:4px 6px 4px 0;padding:8px 13px;border:0;border-radius:8px;background:#3a6ea5;color:#fff;font-size:12.5px;font-weight:600;cursor:pointer}
.pm.sec{background:#5a6b82}
.cty{font-size:11px;color:#9a9aa4;text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px}
.opts{margin-top:16px;display:flex;flex-direction:column;gap:8px}
.opt{padding:10px 14px;border:1px solid #dcdce2;border-radius:8px;cursor:pointer;font-size:14px}
.opt:hover{background:#eef0f4}
.opt-ok{background:#e6f3ea;border-color:#4a8c5c}
.opt-bad{background:#f6e4de;border-color:#c0562f}
#hud{position:absolute;right:14px;bottom:14px;width:194px;background:rgba(248,248,251,.9);backdrop-filter:blur(6px);border:1px solid #d6d6dc;border-radius:10px;padding:11px 13px;font-size:11px;color:#4a4a54;z-index:4;box-shadow:0 1px 4px rgba(0,0,0,.07)}
#hud .htitle{font-weight:700;color:#3a3a44;font-size:10.5px;margin-bottom:7px;text-transform:uppercase;letter-spacing:.5px}
#hud .hb{margin:6px 0}
#hud .hl{display:flex;justify-content:space-between;margin-bottom:2px;color:#6a6a72}
#hud .hbar{height:6px;border-radius:3px;background:#e4e4ea;overflow:hidden}
#hud .hbar>i{display:block;height:100%;border-radius:3px}
.rmap{max-height:150px;overflow:auto;margin-bottom:9px}
.rstep{display:flex;align-items:center;gap:7px;font-size:12px;color:#5a5a64;padding:3px 5px;border-radius:5px;cursor:pointer}
.rstep:hover{background:#eef0f4}
.rstep i{width:8px;height:8px;border-radius:50%;flex:none}
.rstep.cur{background:#fff4e2;color:#26262e;font-weight:600}
.rstep.goal span{font-weight:700}
#startpath{margin-top:2px;width:100%;padding:10px;border:0;border-radius:8px;background:#3a6ea5;color:#fff;font-size:13px;font-weight:600;cursor:pointer}
#pexamples{margin-top:2px}
.wex{border:1px solid #e2e2e8;border-radius:8px;margin:6px 0;overflow:hidden}
.wex .wexh{padding:8px 11px;cursor:pointer;font-size:12.5px;font-weight:600;color:#3a3a44;background:#f2f1f5;display:flex;justify-content:space-between;gap:8px}
.wex .wexh:hover{background:#e9e8ee}
.wex .wexb{display:none;padding:10px 12px;font-size:13px;line-height:1.5;border-top:1px solid #e6e6ec;overflow-x:auto}
.wex.open .wexb{display:block}
.cjrn{color:#3a6ea5;cursor:pointer;font-weight:800;margin-right:6px;font-size:12px}
.cjrn:hover{color:#2b5580}
#journey{position:absolute;inset:0;z-index:4;background:radial-gradient(circle at 50% 24%,#eeedf1,#d7d6dd 72%);display:none;flex-direction:column}
#journey.open{display:flex}
#jhead{height:46px;flex:none;display:flex;align-items:center;gap:14px;padding:0 16px;border-bottom:1px solid #d4d3d9;background:rgba(233,232,236,.94)}
#jback{cursor:pointer;color:#3a6ea5;font-weight:600;font-size:13px}
#jtitle{font-weight:700;color:#2a2a32;font-size:14px}
#jlegend{display:flex;gap:12px;color:#7a7a84;font-size:11px}
#jlegend i{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:4px;vertical-align:middle}
#jprog{margin-left:auto;display:flex;align-items:center;gap:9px;color:#6a6a72;font-size:12px}
#jprogbar{width:130px;height:7px;border-radius:4px;background:#dcdbe1;overflow:hidden}
#jprogbar>i{display:block;height:100%;background:#4a8c5c;width:0;transition:width .4s}
#jwrap{flex:1;position:relative;overflow-y:auto;overflow-x:hidden}
#jpath{max-width:560px;margin:0 auto;padding:20px 0 90px;position:relative}
.junit{text-align:center;margin:24px 0 4px}
.junit>span{font-size:13px;font-weight:700;color:#3a3a44;background:#e3e2e8;padding:5px 16px;border-radius:999px}
.junit .us{color:#a0a0a8;font-weight:600;margin-left:8px}
.jl{position:relative;height:74px}
.jl .conn{position:absolute;left:50%;top:-20px;width:2px;height:30px;background:#cfced5;transform:translateX(-1px)}
.jl .node{position:absolute;top:8px;transform:translateX(-50%);display:flex;align-items:center;gap:13px;cursor:pointer}
.jl .dot{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;font-weight:700;flex:none;border:3px solid #fbfbfd;box-sizing:border-box}
.jl.cur .dot{box-shadow:0 0 0 5px #f4e6c4}
.jl .lbl{white-space:nowrap}
.jl .lbl .t{font-size:14px;color:#2a2a32}
.jl.cur .lbl .t{font-weight:700}
.jl .lbl .s{font-size:11.5px;color:#8a8a93}
.jl.locked .lbl .t{color:#9a9aa4}
.jl:not(.locked) .node:hover .dot{border-color:#3a6ea5}
.jl .lbl .sub2{font-size:11px;color:#a2a2aa;margin-top:1px}
.jl .lbl .acts2{margin-top:8px;display:flex;gap:7px;flex-wrap:nowrap}
.jl .lbl .acts2 button{padding:6px 12px;border:0;border-radius:7px;font-size:11.5px;font-weight:700;cursor:pointer}
.jl .lbl .prac{background:#3a6ea5;color:#fff}
.jl .lbl .prac:hover{background:#315d8c}
.jl .lbl .grad{background:#4a8c5c;color:#fff}
.jl .lbl .grad:hover{background:#3f7a4f}
.jl.mastered .dot{background:#4a8c5c}
.jl.locked .node{cursor:default}
.jl.locked .dot{opacity:.85}
.jl.cur .dot{width:62px;height:62px;font-size:24px}
.jl.cur{height:156px}      /* room for the section line + Practice/Graduate actions */
.jl.mastered{height:104px} /* room for the Review action */
.rmhead{max-width:560px;margin:6px auto 2px;padding:2px 4px}
.rmhead .big{font-size:26px;font-weight:800;color:#2a2a32;line-height:1}
.rmhead .cap{font-size:12px;color:#8a8a93;margin-top:3px}
.rmbar{height:8px;border-radius:5px;background:#dcdbe1;overflow:hidden;margin-top:10px}
.rmbar>i{display:block;height:100%;background:linear-gradient(90deg,#4a8c5c,#6fb27f);width:0;transition:width .5s}
#jempty{color:#8a8a93;font-size:13px;text-align:center;margin-top:40px;display:none}
/* ---- dashboard shell (default view): 2x2, graph large in the upper-right ---- */
#main{padding:0}
#dash{position:absolute;inset:0;display:grid;grid-template-columns:300px minmax(0,1fr);gap:12px;padding:12px;box-sizing:border-box}
#dashleft,#dashright{display:flex;flex-direction:column;gap:12px;min-height:0;min-width:0}
.dcard{background:#e9e8ec;border:1px solid #d9d8de;border-radius:12px;padding:14px 15px;box-sizing:border-box;overflow:auto}
.dcard .dch{font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:#8a8a93;font-weight:700;margin-bottom:11px}
#cardstats,#carddue,#cardactivity{flex:1;min-height:0}
#graphcard{flex:3;min-height:0;position:relative;padding:0;overflow:hidden;
 background:radial-gradient(circle at 50% 44%, #edecf0 0%, #dcdbe1 56%, #c2c1c9 100%)}
#g{position:absolute;inset:0}
/* view switching */
#main.view-learn #dash{display:none}
#main.view-retain #dashleft{display:none}
#main.view-retain #cardactivity{display:none}
#main.view-retain #dash{grid-template-columns:minmax(0,1fr)}
#main.view-retain #graphcard{flex:1}
#hud{display:none}
#main.view-retain #hud{display:block}
/* dashboard card widgets */
.dstat{margin:9px 0}
.dsl{display:flex;justify-content:space-between;font-size:12px;color:#5a5a64;margin-bottom:4px}
.dsl span:last-child{font-weight:700;color:#3a3a44}
.dsbar{height:7px;border-radius:4px;background:#dcdbe1;overflow:hidden}
.dsbar>i{display:block;height:100%;border-radius:4px;transition:width .5s}
.dempty{color:#9a9aa4;font-size:12.5px;line-height:1.5}
.duerow,.actrow{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:6px;font-size:12.5px;color:#4a4a54}
.duerow{cursor:pointer;justify-content:space-between}
.duerow:hover{background:#dedde3}
.duename,.actname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.duedot,.actdot{width:9px;height:9px;border-radius:50%;flex:none}
.actname{flex:1}
.acttime{color:#a2a2aa;font-size:11px;flex:none}
#duestart{margin-top:10px;width:100%;padding:9px;border:0;border-radius:8px;background:#e0842c;color:#fff;font-size:12.5px;font-weight:700;cursor:pointer}
#duestart:hover{background:#cb7523}
/* authored learning-module overlay (opened from the roadmap) */
#module{position:absolute;inset:0;z-index:6;background:#fff;display:none;flex-direction:column}
#module.open{display:flex}
#mhead{height:46px;flex:none;display:flex;align-items:center;gap:14px;padding:0 16px;border-bottom:1px solid #d4d3d9;background:rgba(233,232,236,.94)}
#mback{cursor:pointer;color:#3a6ea5;font-weight:600;font-size:13px}
#mtitle{font-weight:700;color:#2a2a32;font-size:14px}
#moduleframe{flex:1;border:0;width:100%}
.jl .lbl .modl{background:#6b4ea8;color:#fff}
.jl .lbl .modl:hover{background:#5c439a}
.jl .lbl .modtag{display:inline-block;margin-left:7px;padding:1px 7px;border-radius:999px;background:#ece7f6;color:#6b4ea8;font-size:10px;font-weight:700;vertical-align:middle}</style>
<script src="https://cdn.jsdelivr.net/npm/3d-force-graph@1.73.4/dist/3d-force-graph.min.js"></script>
<link rel=stylesheet href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7/dist/umd/supabase.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
</head><body>
<div id=app>
 <div id=topbar class=card><b>Concept map</b>
   <div id=modesw>
     <button class="msw on" data-mode=dashboard>Dashboard</button>
     <button class="msw" data-mode=learn>Learn</button>
     <button class="msw" data-mode=retain>Retain</button>
   </div>
   <div id=acts>
     <button class=act data-a=flash><span class=dot style="background:#c0562f"></span>Flashcards due<span class=cnt id=cnt-flash></span></button>
     <button class=act data-a=exam><span class=dot style="background:#3a6ea5"></span>Exam simulation</button>
     <button class=act data-a=theory><span class=dot style="background:#4a8c5c"></span>Theory development<span class=cnt id=cnt-theory></span></button>
     <button class=act data-a=eval><span class=dot style="background:#c99a2a"></span>Evaluation<span class=cnt id=cnt-eval></span></button>
   </div>
   <button id=recbtn>Recommend where to start</button></div>
 <div id=sidebar class=card></div>
 <div id=main class=card>
  <div id=dash>
   <div id=dashleft>
    <div class=dcard id=cardstats><div class=dch>Progress</div><div id=statsbody></div></div>
    <div class=dcard id=carddue><div class=dch>Due for review</div><div id=duebody></div></div>
   </div>
   <div id=dashright>
    <div class=dcard id=graphcard><div id=g></div><div id=hud></div></div>
    <div class=dcard id=cardactivity><div class=dch>Recent activity</div><div id=actbody></div></div>
   </div>
  </div>
  <div id=panel>
   <div id=pclose>&times;</div>
   <div id=ptitle></div><div id=pcourse></div>
   <div id=pgauges></div>
   <div class=sec>Description</div><div id=pdesc></div>
   <div class=sec>Prerequisites</div><div id=pprereq></div>
   <div class=sec>Learning path</div><div id=proadmap></div>
   <div class=sec>Practice</div><div id=pproblems style="font-size:12.5px;color:#5a5a64"></div>
   <button id=ppractice disabled>Practice this concept</button>
   <div class=sec id=pexsec style="display:none">Worked examples</div><div id=pexamples></div>
  </div>
  <div id=prac><div id=praccard>
   <div id=prachead><span id=prachtitle></span><span id=prachprog></span></div>
   <div id=pracbody></div><div id=pracsol></div><div id=pracctl></div>
  </div></div>
  <div id=journey>
   <div id=jhead>
    <span id=jback>← Map</span><span id=jtitle></span>
    <div id=jlegend><span><i style="background:#4a8c5c"></i>graduated</span><span><i style="background:#d9a441"></i>current</span><span><i style="background:#c6c6cc"></i>locked</span></div>
    <div id=jprog><span id=jprogtxt></span><span id=jprogbar><i></i></span></div>
   </div>
   <div id=jwrap><div id=jpath></div></div>
  </div>
  <div id=module>
   <div id=mhead><span id=mback>← Roadmap</span><span id=mtitle></span></div>
   <iframe id=moduleframe title="Learning module"></iframe>
  </div>
 </div>
</div>

<script>
const DATA={"nodes": [{"id": "1d-poisson-process", "c": 1, "imp": 0.1273, "h": 0.61, "t": "1D Poisson process", "d": "A sequence of arrivals in continuous time is a Poisson process with rate \u03bb if the following conditions hold:  - 1. The number of arrivals in an interval of length t is distributed Pois(\u03bbt). - 2. The numbers of arrivals i\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 73.97, "y": -0.65, "z": -227.0, "jx": 0.0, "jy": 17140.0, "ch": "Poisson processes in one dimension"}, {"id": "2d-lotus", "c": 1, "imp": 0.0, "h": 0.449, "t": "2D LOTUS", "d": "Let g be a function from  $\\mathbb{R}^2$  to  $\\mathbb{R}$ . If X and Y are discrete, then  $$E(g(X,Y)) = \\sum_{x} \\sum_{y} g(x,y) P(X=x,Y=y).$$", "pc": 1, "nw": 1, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -76.55, "y": 131.71, "z": -253.1, "jx": 0.0, "jy": 18137.0, "ch": "2D LOTUS"}, {"id": "2d-poisson-process", "c": 1, "imp": 0.0, "h": 0.0, "t": "2D Poisson process", "d": "Events in the plane  $\\mathbb{R}^2$  are a 2D Poisson process with intensity  $\\lambda$  if the following conditions hold:  - 1. The number of events in a region A is distributed  $Pois(\\lambda \\cdot area(A))$ . - 2. The\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 67.72, "y": -31.26, "z": -259.44, "jx": 0.0, "jy": 19134.0, "ch": "Poisson processes in multiple dimensions"}, {"id": "68-95-997-rule", "c": 1, "imp": 0.0082, "h": 0.753, "t": "68-95-99.7% rule", "d": "If  $X \\sim \\mathcal{N}(\\mu, \\sigma^2)$ , then  $$P(|X - \\mu| < \\sigma) \\approx 0.68,$$     $P(|X - \\mu| < 2\\sigma) \\approx 0.95,$     $P(|X - \\mu| < 3\\sigma) \\approx 0.997.$", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 102.36, "y": 106.49, "z": -325.01, "jx": -75.0, "jy": 9449.0, "ch": "Normal"}, {"id": "adams-law", "c": 1, "imp": 0.0163, "h": 0.0, "t": "Adam's law", "d": "For any r.v.s X and Y,  $$E(E(Y|X)) = E(Y).$$", "pc": 0, "nw": 0, "nm": 0, "hp": 1, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -199.14, "y": 123.52, "z": -165.91, "jx": -225.0, "jy": 22186.0, "ch": "Properties of conditional expectation"}, {"id": "adams-law-with-extra-conditioning", "c": 1, "imp": 0.0, "h": 0.0, "t": "Adam's law with extra conditioning", "d": "For any r.v.s X, Y, Z,  $$E(E(Y|X,Z)|Z) = E(Y|Z).$$", "pc": 0, "nw": 0, "nm": 0, "hp": 1, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -250.78, "y": 123.63, "z": -174.61, "jx": 0.0, "jy": 22304.0, "ch": "Properties of conditional expectation"}, {"id": "bayes-rule", "c": 1, "imp": 0.0082, "h": 0.881, "t": "Bayes' rule", "d": "$$P(A|B) = \\frac{P(B|A)P(A)}{P(B)}.$$", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -187.95, "y": 234.7, "z": -335.88, "jx": -75.0, "jy": 5693.0, "ch": "Bayes' rule and the law of total probability"}, {"id": "bayes-rule-with-extra-conditioning", "c": 1, "imp": 0.0, "h": 0.083, "t": "Bayes' rule with extra conditioning", "d": "Provided that P(A\u2229E) > 0 and P(B \u2229 E) > 0, we have  $$P(A|B,E) = \\frac{P(B|A,E)P(A|E)}{P(B|E)}.$$", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -69.57, "y": -406.24, "z": 13.21, "jx": -75.0, "jy": 0.0, "ch": "Conditional probabilities are probabilities"}, {"id": "bernoulli-distribution", "c": 1, "imp": 0.0963, "h": 0.929, "t": "Bernoulli distribution", "d": "An r.v. X is said to have the Bernoulli distribution with parameter p if P(X = 1) = p and P(X = 0) = 1 \u2212 p, where 0 < p < 1. We write this as X \u223c Bern(p). The symbol \u223c is read \"is distributed as\".", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -128.88, "y": 54.33, "z": -290.6, "jx": 0.0, "jy": 7394.0, "ch": "Bernoulli and Binomial"}, {"id": "beta-distribution", "c": 1, "imp": 0.018, "h": 0.709, "t": "Beta distribution", "d": "An r.v. X is said to have the Beta distribution with parameters a and b, where a > 0 and b > 0, if its PDF is  $$f(x) = \\frac{1}{\\beta(a,b)} x^{a-1} (1-x)^{b-1}, \\quad 0 < x < 1,$$", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -17.19, "y": 110.4, "z": -354.72, "jx": 0.0, "jy": 7923.0, "ch": "Beta"}, {"id": "binary-entropy-function", "c": 1, "imp": 0.0, "h": 0.569, "t": "Binary entropy function", "d": "For 0 < p < 1, the binary entropy function H is given by  $$H(p) = -p \\log_2 p - (1-p) \\log_2 (1-p).$$", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -133.64, "y": 19.68, "z": -324.14, "jx": -75.0, "jy": 10682.0, "ch": "\\\\*Using probability and expectation to prove existence"}, {"id": "binomial-coefficient", "c": 1, "imp": 0.0224, "h": 0.093, "t": "Binomial coefficient", "d": "For any nonnegative integers k and n, the *binomial coefficient*  $\\binom{n}{k}$ , read as \"n choose k\", is the number of subsets of size k for a set of size n.", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 3.0, "b": 1.0, "hr": 0.84, "x": -189.88, "y": 75.72, "z": -268.16, "jx": 0.0, "jy": 1115.0, "ch": "Counting"}, {"id": "binomial-coefficient-formula", "c": 1, "imp": 0.0143, "h": 0.068, "t": "Binomial coefficient formula", "d": "For  $k \\leq n$ , we have  $$\\binom{n}{k} = \\frac{n(n-1)\\cdots(n-k+1)}{k!} = \\frac{n!}{(n-k)!k!}.$$", "pc": 0, "nw": 0, "nm": 0, "hp": 1, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -169.43, "y": 38.7, "z": -280.07, "jx": 0.0, "jy": 1233.0, "ch": "Counting"}, {"id": "binomial-pmf", "c": 1, "imp": 0.0314, "h": 0.876, "t": "Binomial PMF", "d": "If  $X \\sim \\text{Bin}(n, p)$ , then the PMF of X is  $$P(X = k) = \\binom{n}{k} p^k (1 - p)^{n-k}$$", "pc": 0, "nw": 0, "nm": 0, "hp": 1, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -112.88, "y": 10.52, "z": -257.26, "jx": 0.0, "jy": 7630.0, "ch": "Bernoulli and Binomial"}, {"id": "cauchy-schwarz", "c": 1, "imp": 0.0163, "h": 0.137, "t": "Cauchy-Schwarz", "d": "For any r.v.s X and Y with finite variances,  $$|E(XY)| \\le \\sqrt{E(X^2)E(Y^2)}.$$", "pc": 1, "nw": 1, "nm": 0, "hp": 1, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -28.83, "y": 333.19, "z": 237.14, "jx": -75.0, "jy": 1526.0, "ch": "Inequalities"}, {"id": "cdf-of-order-statistic", "c": 1, "imp": 0.0082, "h": 0.699, "t": "CDF of order statistic", "d": "Let X1, . . . , X<sup>n</sup> be i.i.d. continuous r.v.s with CDF F. Then the CDF of the jth order statistic X(j) is  $$P(X_{(j)} \\le x) = \\sum_{k=j}^{n} \\binom{n}{k} F(x)^k (1 - F(x))^{n-k}.$$", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -17.61, "y": 173.44, "z": -394.96, "jx": 0.0, "jy": 14381.0, "ch": "Order statistics"}, {"id": "central-limit-theorem", "c": 1, "imp": 0.0, "h": 0.0, "t": "Central limit theorem", "d": "As  $n \\to \\infty$ ,  $$\\sqrt{n}\\left(\\frac{\\bar{X}_n - \\mu}{\\sigma}\\right) \\to \\mathcal{N}(0, 1)$$  in distribution.", "pc": 0, "nw": 0, "nm": 0, "hp": 1, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 97.59, "y": 231.11, "z": -163.91, "jx": 0.0, "jy": 19720.0, "ch": "Central limit theorem"}, {"id": "change-of-variables", "c": 1, "imp": 0.0198, "h": 0.632, "t": "Change of variables", "d": "Let  $\\mathbf{X} = (X_1, \\dots, X_n)$  be a continuous random vector with joint PDF  $f_{\\mathbf{X}}$ . Let  $g: A_0 \\to B_0$  be an invertible function, where  $A_0$  and  $B_0$  are open<sup>1</sup> subsets of  $\\mathb\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 52.02, "y": 185.23, "z": -327.22, "jx": 0.0, "jy": 12208.0, "ch": "Change of variables"}, {"id": "change-of-variables-in-one-dimension", "c": 1, "imp": 0.0041, "h": 0.721, "t": "Change of variables in one dimension", "d": "Let X be a continuous r.v. with PDF  $f_X$ , and let Y = g(X), where g is differentiable and strictly increasing (or strictly decreasing). Then the PDF of Y is given by  $$f_Y(y) = f_X(x) \\left| \\frac{dx}{dy} \\right|,$$", "pc": 0, "nw": 0, "nm": 0, "hp": 1, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 36.95, "y": 199.46, "z": -291.08, "jx": 0.0, "jy": 12326.0, "ch": "Change of variables"}, {"id": "chebyshev", "c": 1, "imp": 0.0163, "h": 0.138, "t": "Chebyshev", "d": "Let X have mean  $\\mu$  and variance  $\\sigma^2$ . Then for any a > 0,  $$P(|X - \\mu| \\ge a) \\le \\frac{\\sigma^2}{a^2}.$$", "pc": 0, "nw": 0, "nm": 0, "hp": 1, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -38.48, "y": 225.08, "z": -122.44, "jx": 0.0, "jy": 1644.0, "ch": "Inequalities"}, {"id": "chernoff", "c": 1, "imp": 0.0, "h": 0.67, "t": "Chernoff", "d": "For any r.v. X and constants a > 0 and t > 0,  $$P(X \\geq a) \\leq \\frac{E(e^{tX})}{e^{ta}}.$$", "pc": 0, "nw": 0, "nm": 0, "hp": 1, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 18.95, "y": 247.6, "z": -122.43, "jx": 150.0, "jy": 1644.0, "ch": "Inequalities"}, {"id": "chi-square-distribution", "c": 1, "imp": 0.0209, "h": 0.7, "t": "Chi-Square distribution", "d": "Let  $V = Z_1^2 + \\cdots + Z_n^2$  where  $Z_1, Z_2, \\ldots, Z_n$  are i.i.d.  $\\mathcal{N}(0,1)$ . Then V is said to have the *Chi-Square distribution with n degrees of freedom*. We write this as  $V \\sim \\chi_n^2$ .", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 109.0, "y": 178.92, "z": -225.78, "jx": 0.0, "jy": 20013.0, "ch": "Chi-Square and Student-t"}, {"id": "choosing-the-complement", "c": 1, "imp": 0.0, "h": 0.136, "t": "Choosing the complement", "d": "For any nonnegative integers n and k with  $k \\leq n$ , we have  $$\\binom{n}{k} = \\binom{n}{n-k}.$$", "pc": 0, "nw": 0, "nm": 0, "hp": 1, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 168.05, "y": 147.21, "z": -416.92, "jx": -225.0, "jy": 586.0, "ch": "Story proofs"}, {"id": "codes-and-rates", "c": 1, "imp": 0.0198, "h": 0.181, "t": "Codes and rates", "d": "Given positive integers k and n, a code is a function c that assigns to each input message  $x \\in \\{0,1\\}^k$  a codeword  $c(x) \\in \\{0,1\\}^n$ . The rate of this code is k/n (the number of input bits per output bit). Af\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -184.73, "y": 6.33, "z": -393.4, "jx": 75.0, "jy": 10682.0, "ch": "\\\\*Using probability and expectation to prove existence"}, {"id": "coloring", "c": 1, "imp": 0.0, "h": 0.535, "t": "Coloring", "d": "Let (N(t) : t > 0) be a Poisson process with rate \u03bb, and C be a finite set of \"colors\", labeled from 1 through c. Suppose that each arrival gets randomly assigned a color from C, with color i having probability p<sup>i</\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 1, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 120.82, "y": -8.74, "z": -187.61, "jx": 0.0, "jy": 21482.0, "ch": "Conditioning, superposition, and thinning"}, {"id": "conditional-counts", "c": 1, "imp": 0.0245, "h": 0.467, "t": "Conditional counts", "d": "Let (N(t) : t > 0) be a Poisson process with rate \u03bb, and t<sup>1</sup> < t2. The conditional distribution of N(t1) given N(t2) = n is  $$N(t_1) \\mid N(t_2) = n \\sim \\operatorname{Bin}\\left(n, \\frac{t_1}{t_2}\\right).$$", "pc": 0, "nw": 0, "nm": 0, "hp": 1, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 95.95, "y": 1.37, "z": -190.48, "jx": -300.0, "jy": 21246.0, "ch": "Conditioning, superposition, and thinning"}, {"id": "conditional-expectation-given-an-event", "c": 1, "imp": 0.0427, "h": 0.0, "t": "Conditional expectation given an event", "d": "Let A be an event with positive probability. If Y is a discrete r.v., then the *conditional expectation of* Y given A is  $$E(Y|A) = \\sum_{y} yP(Y = y|A),$$", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -101.84, "y": 140.19, "z": -190.93, "jx": 0.0, "jy": 20542.0, "ch": "Conditional expectation given an event"}, {"id": "conditional-expectation-given-an-rv", "c": 1, "imp": 0.0, "h": 0.0, "t": "Conditional expectation given an r.v.", "d": "Let g(x) = E(Y|X = x). Then the *conditional expectation of* Y *given* X, denoted E(Y|X), is defined to be the random variable g(X). In other words, if after doing the experiment X crystallizes into x, then E(Y|X) crysta\u2026", "pc": 1, "nw": 1, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -51.22, "y": 142.81, "z": -228.14, "jx": 0.0, "jy": 20953.0, "ch": "Conditional expectation given an r.v."}, {"id": "conditional-independence", "c": 1, "imp": 0.0163, "h": 0.817, "t": "Conditional independence", "d": "Events A and B are said to be conditionally independent given E if  $P(A \\cap B|E) = P(A|E)P(B|E)$ .", "pc": 1, "nw": 1, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -38.1, "y": 328.44, "z": -271.32, "jx": 0.0, "jy": 9038.0, "ch": "Independence of events"}, {"id": "conditional-independence-of-rvs", "c": 1, "imp": 0.0, "h": 0.779, "t": "Conditional independence of r.v.s", "d": "Random variables X and Y are *conditionally independent* given an r.v. Z if for all  $x, y \\in \\mathbb{R}$  and all z in the support of Z,  $$P(X \\le x, Y \\le y | Z=z) = P(X \\le x | Z=z) P(Y \\le y | Z=z).$$", "pc": 1, "nw": 1, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -20.73, "y": 358.24, "z": -274.59, "jx": -150.0, "jy": 15378.0, "ch": "Independence of r.v.s"}, {"id": "conditional-pdf", "c": 1, "imp": 0.0131, "h": 0.675, "t": "Conditional PDF", "d": "For continuous r.v.s X and Y with joint PDF fX,Y , the conditional PDF of Y given X = x is  $$f_{Y|X}(y|x) = \\frac{f_{X,Y}(x,y)}{f_{X}(x)},$$", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -7.49, "y": 147.67, "z": -276.97, "jx": 75.0, "jy": 15496.0, "ch": "Independence of r.v.s"}, {"id": "conditional-pmf", "c": 1, "imp": 0.0345, "h": 0.788, "t": "Conditional PMF", "d": "For discrete r.v.s X and Y, the *conditional PMF* of Y given X = x is  $$P(Y = y | X = x) = \\frac{P(X = x, Y = y)}{P(X = x)}.$$", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -83.12, "y": 177.34, "z": -229.57, "jx": -75.0, "jy": 15614.0, "ch": "Independence of r.v.s"}, {"id": "conditional-probability", "c": 1, "imp": 0.1528, "h": 0.118, "t": "Conditional probability", "d": "If A and B are events with P(B) > 0, then the *conditional probability* of A given B, denoted by P(A|B), is defined as  $$P(A|B) = \\frac{P(A \\cap B)}{P(B)}.$$", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -129.61, "y": 189.79, "z": -275.4, "jx": 0.0, "jy": 4049.0, "ch": "Definition and intuition"}, {"id": "conditional-times", "c": 1, "imp": 0.0, "h": 0.798, "t": "Conditional times", "d": "In a Poisson process of rate \u03bb, conditional on N(t) = n, the joint distribution of the arrival times T1, . . . , T<sup>n</sup> is the same as the joint distribution of the order statistics of n i.i.d. Unif(0, t) r.v.s.", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 94.91, "y": -23.01, "z": -257.88, "jx": -150.0, "jy": 21246.0, "ch": "Conditioning, superposition, and thinning"}, {"id": "conditional-variance", "c": 1, "imp": 0.0, "h": 0.0, "t": "Conditional variance", "d": "The conditional variance of Y given X is  $$Var(Y|X) = E((Y - E(Y|X))^2|X).$$", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -96.7, "y": 145.99, "z": -154.92, "jx": -75.0, "jy": 22890.0, "ch": "Conditional variance"}, {"id": "continuous-form-of-bayes-rule-and-lotp", "c": 1, "imp": 0.0041, "h": 0.0, "t": "Continuous form of Bayes' rule and LOTP", "d": "For continuous r.v.s X and Y , we have the following continuous form of Bayes' rule:  $$f_{Y|X}(y|x) = \\frac{f_{X|Y}(x|y)f_Y(y)}{f_X(x)}, \\text{ for } f_X(x) > 0.$$", "pc": 0, "nw": 0, "nm": 0, "hp": 1, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -35.11, "y": 189.78, "z": -279.43, "jx": 0.0, "jy": 15850.0, "ch": "Independence of r.v.s"}, {"id": "continuous-rv", "c": 1, "imp": 0.3286, "h": 0.199, "t": "Continuous r.v.", "d": "An r.v. has a continuous distribution if its", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 27.11, "y": 106.1, "z": -280.5, "jx": -75.0, "jy": 9860.0, "ch": "Probability density functions"}, {"id": "convergence-to-stationary-distribution", "c": 1, "imp": 0.0, "h": 0.093, "t": "Convergence to stationary distribution", "d": "Let  $X_0, X_1, \\ldots$  be an irreducible, aperiodic Markov chain with stationary distribution  $\\mathbf{s}$  and transition matrix Q. Then  $P(X_n = i)$  converges to  $s_i$  as  $n \\to \\infty$ . In terms of the transi\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -94.9, "y": 330.98, "z": -147.85, "jx": -150.0, "jy": 4460.0, "ch": "Stationary distribution"}, {"id": "convolution-sums-and-integrals", "c": 1, "imp": 0.0, "h": 0.0, "t": "Convolution sums and integrals", "d": "Let X and Y be independent r.v.s and T = X + Y be their sum. If X and Y are discrete, then the PMF of T is  $$P(T = t) = \\sum_{x} P(Y = t - x)P(X = x)$$ $$= \\sum_{y} P(X = t - y)P(Y = y).$$", "pc": 0, "nw": 0, "nm": 0, "hp": 1, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -6.69, "y": 172.15, "z": -248.57, "jx": 0.0, "jy": 22597.0, "ch": "Convolutions"}, {"id": "correlation", "c": 1, "imp": 0.0082, "h": 0.0, "t": "Correlation", "d": "The *correlation* between r.v.s X and Y is  $$\\operatorname{Corr}(X,Y) = \\frac{\\operatorname{Cov}(X,Y)}{\\sqrt{\\operatorname{Var}(X)\\operatorname{Var}(Y)}}.$$  (This is undefined in the degenerate cases Var(X) = 0 or Var(\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -90.94, "y": 209.87, "z": -168.97, "jx": -75.0, "jy": 21775.0, "ch": "Covariance and correlation"}, {"id": "correlation-bounds", "c": 1, "imp": 0.0, "h": 0.0, "t": "Correlation bounds", "d": "For any r.v.s X and Y,  $$-1 \\leq \\operatorname{Corr}(X, Y) \\leq 1.$$", "pc": 5, "nw": 3, "nm": 2, "hp": 1, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -123.16, "y": 227.84, "z": -142.66, "jx": 0.0, "jy": 21893.0, "ch": "Covariance and correlation"}, {"id": "covariance", "c": 1, "imp": 0.0465, "h": 0.857, "t": "Covariance", "d": "The *covariance* between r.v.s X and Y is  $$Cov(X,Y) = E((X - EX)(Y - EY)).$$", "pc": 1, "nw": 1, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -129.93, "y": 204.6, "z": -166.1, "jx": 75.0, "jy": 21775.0, "ch": "Covariance and correlation"}, {"id": "covariance-in-a-multinomial", "c": 1, "imp": 0.0, "h": 0.0, "t": "Covariance in a Multinomial", "d": "Let  $(X_1, ..., X_k) \\sim \\text{Mult}_k(n, \\mathbf{p})$ , where  $\\mathbf{p} = (p_1, ..., p_k)$ . For  $i \\neq j$ ,  $\\text{Cov}(X_i, X_j) = -np_i p_j$ .", "pc": 0, "nw": 0, "nm": 0, "hp": 1, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -162.27, "y": 224.24, "z": -142.85, "jx": -150.0, "jy": 18723.0, "ch": "Multinomial"}, {"id": "dbms-1011-privileges", "c": 3, "imp": 0.0815, "h": 0.181, "t": "Privileges", "d": "SQL defines nine types of privileges: SELECT, INSERT, DELETE, UPDATE, REF-ERENCES, USAGE, TRIGGER, EXECUTE, and UNDER. The first four of these apply to a relation, which may be either a base table or a view. As their nam\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -205.06, "y": -247.5, "z": 40.6, "jx": 225.0, "jy": 9245.0, "ch": "DBMS 10"}, {"id": "dbms-1012-creating-privileges", "c": 3, "imp": 0.0, "h": 0.117, "t": "Creating Privileges", "d": "There are two aspects to the awarding of privileges: how they are created initially, and how they are passed from user to user. We shall discuss initialization here and the transmission of privileges in Section 10.1.4.  \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -190.96, "y": -278.89, "z": 26.85, "jx": -300.0, "jy": 9363.0, "ch": "DBMS 10"}, {"id": "dbms-1013-the-privilege-checking-process", "c": 3, "imp": 0.0, "h": 0.183, "t": "The Privilege-Checking Process", "d": "As we saw above, each module, schema, and session has an associated user; in SQL terms, there is an associated authorization ID for each. Any SQL operation has two parties:  - 1. The database elements upon which the oper\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -200.49, "y": -280.06, "z": 53.19, "jx": 300.0, "jy": 9363.0, "ch": "DBMS 10"}, {"id": "dbms-1014-granting-privileges", "c": 3, "imp": 0.0, "h": 0.18, "t": "Granting Privileges", "d": "So far, the only way we have seen to have privileges on a database element is to be the creator and owner of that element. SQL provides a GRANT statement to allow one user to give a privilege to another. The first user r\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -222.76, "y": -272.4, "z": 18.14, "jx": 0.0, "jy": 9363.0, "ch": "DBMS 10"}, {"id": "dbms-1015-grant-diagrams", "c": 3, "imp": 0.0, "h": 0.112, "t": "Grant Diagrams", "d": "Because of the complex web of grants and overlapping privileges that may result from a sequence of grants, it is useful to represent grants by a graph called a *grant diagram.* A SQL system maintains a representation of \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -240.08, "y": -246.76, "z": 26.1, "jx": -150.0, "jy": 9363.0, "ch": "DBMS 10"}, {"id": "dbms-1016-revoking-privileges", "c": 3, "imp": 0.0, "h": 0.183, "t": "Revoking Privileges", "d": "A granted privilege can be revoked at any time. The revoking of privileges may be required to *cascade,* in the sense that revoking a privilege with the grant option that has been passed on to other users may require tho\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -231.75, "y": -269.52, "z": 51.75, "jx": 150.0, "jy": 9363.0, "ch": "DBMS 10"}, {"id": "dbms-1021-defining-recursive-relations-in-sql", "c": 3, "imp": 0.2859, "h": 0.073, "t": "Defining Recursive Relations in SQL", "d": "The WITH statement in SQL allows us to define temporary relations, recursive or not. To define a recursive relation, the relation can be used within the WITH statement itself. A simple form of the WITH statement is:  WIT\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -163.48, "y": -156.13, "z": 113.41, "jx": -150.0, "jy": 8891.0, "ch": "DBMS 10"}, {"id": "dbms-1022-problematic-expressions-in-recursive-sql", "c": 3, "imp": 0.0054, "h": 0.085, "t": "Problematic Expressions in Recursive SQL", "d": "The SQL standard for recursion does not allow an arbitrary collection of mutually recursive relations to be written in a WITH clause. There is a small matter that the standard requires only that *linear* recursion be sup\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -186.04, "y": -191.89, "z": 125.5, "jx": 75.0, "jy": 9009.0, "ch": "DBMS 10"}, {"id": "dbms-1031-from-relations-to-object-relations", "c": 3, "imp": 0.1242, "h": 0.123, "t": "From Relations to Object-Relations", "d": "While the relation remains the fundamental concept, the relational model has been extended to the *object-relational model* by incorporation of features such as:  - 1. *Structured types for attributes.* Instead of allowi\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -146.3, "y": -180.18, "z": 94.93, "jx": -225.0, "jy": 9009.0, "ch": "DBMS 10"}, {"id": "dbms-1032-nested-relations", "c": 3, "imp": 0.0054, "h": 0.089, "t": "Nested Relations", "d": "In the *nested-relational model,* we allow attributes of relations to have a type that is not atomic; in particular, a type can be a relation schema. As a result, there is a convenient, recursive definition of the types \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -159.38, "y": -123.95, "z": 132.15, "jx": -75.0, "jy": 9009.0, "ch": "DBMS 10"}, {"id": "dbms-1033-references", "c": 3, "imp": 0.0856, "h": 0.113, "t": "References", "d": "The fact that movies like *Star Wars* will appear in several relations that are values of the movies attribute in the nested relation S ta rs is a cause of redundancy. In effect, the schema of Example 10.11 has the neste\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -170.15, "y": -184.37, "z": 62.32, "jx": 375.0, "jy": 9127.0, "ch": "DBMS 10"}, {"id": "dbms-1034-object-oriented-versus-object-relational", "c": 3, "imp": 0.0146, "h": 0.135, "t": "Object-Oriented Versus Object-Relational", "d": "The object-oriented data model, as typified by ODL, and the object-relational model discussed here, are remarkably similar. Some of the salient points of comparison follow.", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -192.25, "y": -161.92, "z": 97.06, "jx": -75.0, "jy": 9127.0, "ch": "DBMS 10"}, {"id": "dbms-1041-defining-types-in-sql", "c": 3, "imp": 0.0225, "h": 0.154, "t": "Defining Types in SQL", "d": "The SQL-99 standard allows the programmer to define UDT's in several ways. The simplest is as a renaming of an existing type.  CREATE TYPE *T* AS <primitive ty p e> ;  renames a primitive type such as INTEGER. Its purpos\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -126.31, "y": -178.07, "z": 110.3, "jx": -375.0, "jy": 9009.0, "ch": "DBMS 10"}, {"id": "dbms-1042-m-ethod-declarations-in-u-d-t-s", "c": 3, "imp": 0.0279, "h": 0.143, "t": "M ethod Declarations in U D T 's", "d": "The declaration of a method resembles the way a function in PSM is introduced; see Section 9.4.1. There is no analog of PSM procedures as methods. That is, every method returns a value of some type. While function declar\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -126.65, "y": -222.84, "z": 81.99, "jx": -225.0, "jy": 9127.0, "ch": "DBMS 10"}, {"id": "dbms-1043-method-definitions", "c": 3, "imp": 0.0082, "h": 0.058, "t": "Method Definitions", "d": "Separately, we need to define the method. A simple form of method definition is:  ``` CREATE METHOD <method name, arguments, and return type>   FOR <UDT name>      Cmethod body> ```  That is, the UDT for which the method\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -95.23, "y": -196.02, "z": 97.24, "jx": -75.0, "jy": 9245.0, "ch": "DBMS 10"}, {"id": "dbms-1044-declaring-relations-with-a-udt", "c": 3, "imp": 0.0, "h": 0.167, "t": "Declaring Relations with a UDT", "d": "Having declared a type, we may declare one or more relations whose tuples are of that type. The form of relation declarations is like that of Section 2.3.3, but the attribute declarations are omitted from the parenthesiz\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -203.9, "y": -167.36, "z": 137.67, "jx": -525.0, "jy": 9009.0, "ch": "DBMS 10"}, {"id": "dbms-1045-references", "c": 3, "imp": 0.0637, "h": 0.17, "t": "References", "d": "The effect of object identity in object-oriented languages is obtained in SQL through the notion of a *reference.* A table may have a *reference column* that serves as the \"identity\" for its tuples. This column could be \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -140.0, "y": -112.21, "z": 80.07, "jx": 225.0, "jy": 9009.0, "ch": "DBMS 10"}, {"id": "dbms-1046-creating-object-id-s-for-tables", "c": 3, "imp": 0.0, "h": 0.11, "t": "Creating Object ID 's for Tables", "d": "In order to refer to rows of a table, such as Movies in Example 10.18, that table needs to have an \"object-ID\" for its tuples. Such a table is said to be *referenceable.* In a CREATE TABLE statement where the type of the\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -81.87, "y": -160.21, "z": 116.89, "jx": -375.0, "jy": 9127.0, "ch": "DBMS 10"}, {"id": "dbms-1051-following-references", "c": 3, "imp": 0.0, "h": 0.145, "t": "Following References", "d": "Suppose a; is a value of type REF(T). Then *x* refers to some tuple *t* of type T. We can obtain tuple *t* itself, or components of *t,* by two means:  - 1. Operator -> has essentially the same meaning as this operator d\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -337.57, "y": -154.82, "z": 238.03, "jx": 0.0, "jy": 8891.0, "ch": "DBMS 10"}, {"id": "dbms-1052-accessing-components-of-tuples-with-a-udt", "c": 3, "imp": 0.0, "h": 0.06, "t": "Accessing Components of Tuples with a UDT", "d": "When we define a relation to have a UDT, the tuples must be thought of as single objects, rather than lists with components corresponding to the attributes of the UDT. As a case in point, consider the relation Movies dec\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -51.86, "y": -168.49, "z": 114.74, "jx": -450.0, "jy": 9363.0, "ch": "DBMS 10"}, {"id": "dbms-1053-generator-and-m-utator-functions", "c": 3, "imp": 0.0, "h": 0.074, "t": "Generator and M utator Functions", "d": "In order to create data that conforms to a UDT, or to change components of objects with a UDT, we can use two kinds of methods that are created automatically, along with the observer methods, whenever a UDT is defined. T\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -128.55, "y": -261.54, "z": 71.1, "jx": -225.0, "jy": 9245.0, "ch": "DBMS 10"}, {"id": "dbms-1054-ordering-relationships-on-u-d-t-s", "c": 3, "imp": 0.0, "h": 0.058, "t": "Ordering Relationships on U D T 's", "d": "Objects that are of some UDT are inherently abstract, in the sense that there is no way to compare two objects of the same UDT, either to test whether they are \"equal\" or whether one is less than another. Even two object\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -157.88, "y": -198.87, "z": 110.01, "jx": 75.0, "jy": 9127.0, "ch": "DBMS 10"}, {"id": "dbms-1061-olap-and-data-warehouses", "c": 3, "imp": 0.0, "h": 0.073, "t": "OLAP and Data Warehouses", "d": "It is common for OLAP applications to take place in a separate copy of the master database, called a *data warehouse.* Data from many separate databases may be integrated into the warehouse. In a common scenario, the war\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -242.93, "y": -132.0, "z": 163.43, "jx": 375.0, "jy": 9009.0, "ch": "DBMS 10"}, {"id": "dbms-1062-olap-applications", "c": 3, "imp": 0.0526, "h": 0.105, "t": "OLAP Applications", "d": "A common OLAP application uses a warehouse of sales data. Major store chains will accumulate terabytes of information representing every sale of every item at every store. Queries that aggregate sales into groups and ide\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -206.87, "y": -117.78, "z": 147.15, "jx": 150.0, "jy": 8891.0, "ch": "DBMS 10"}, {"id": "dbms-1063-a-m-ultidimensional-view-of-olap-data", "c": 3, "imp": 0.0151, "h": 0.181, "t": "A M ultidimensional View of OLAP Data", "d": "In typical OLAP applications there is a central relation or collection of data, called the *fact table.* A fact table represents events or objects of interest, such as sales in Example 10.26. Often, it helps to think of \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -215.51, "y": -131.41, "z": 111.08, "jx": 75.0, "jy": 9245.0, "ch": "DBMS 10"}, {"id": "dbms-1064-star-schemas", "c": 3, "imp": 0.0, "h": 0.072, "t": "Star Schemas", "d": "A *star schema* consists of the schema for the fact table, which links to several other relations, called \"dimension tables.\" The fact table is at the center of the \"star,\" whose points are the dimension tables. A fact t\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -128.81, "y": -96.93, "z": 148.5, "jx": 225.0, "jy": 9127.0, "ch": "DBMS 10"}, {"id": "dbms-1065-slicing-and-dicing", "c": 3, "imp": 0.0, "h": 0.102, "t": "Slicing and Dicing", "d": "We can think of the points of the raw-data cube as partitioned along each dimension at some level of granularity. For example, in the time dimension, we might partition (\"group by\" in SQL terms) according to days, weeks,\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -250.7, "y": -121.64, "z": 144.4, "jx": 525.0, "jy": 9009.0, "ch": "DBMS 10"}, {"id": "dbms-1071-the-cube-operator", "c": 3, "imp": 0.0163, "h": 0.068, "t": "The Cube Operator", "d": "Given a fact table *F,* we can define an augmented table C U B E (F ) that adds an additional value, denoted \\*, to each dimension. The \\* has the intuitive meaning \"any,\" and it represents aggregation along the dimensio\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -199.68, "y": -115.88, "z": 82.6, "jx": 450.0, "jy": 9363.0, "ch": "DBMS 10"}, {"id": "dbms-1072-the-cube-operator-in-sql", "c": 3, "imp": 0.0, "h": 0.199, "t": "The Cube Operator in SQL", "d": "SQL gives us a way to apply the cube operator within queries. If we add the term WITH CUBE to a group-by clause, then we get not only the tuple for each group, but also the tuples that represent aggregation along one or \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -242.07, "y": -115.67, "z": 71.35, "jx": 0.0, "jy": 9481.0, "ch": "DBMS 10"}, {"id": "dbms-111-early-database-management-systems", "c": 3, "imp": 0.1476, "h": 0.123, "t": "Early Database Management Systems", "d": "The first commercial database management systems appeared in the late 1960's. These systems evolved from file systems, which provide some of item (3) above; file systems store data over a long period of time, and they al\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 60.57, "y": -174.41, "z": -159.03, "jx": -75.0, "jy": 0.0, "ch": "DBMS 1"}, {"id": "dbms-1111-motivation-for-the-semistructured-data-model", "c": 3, "imp": 0.0701, "h": 0.065, "t": "Motivation for the Semistructured-Data Model", "d": "The models we have seen so far \u2014 E/R , UML, relational, ODL \u2014 each start with a schema. The schema is a rigid framework into which data is placed. This  rigidity provides certain advantages. Especially, the relational mo\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 19.33, "y": -44.08, "z": 7.72, "jx": 0.0, "jy": 9774.0, "ch": "DBMS 11"}, {"id": "dbms-1112-semistructured-data-representation", "c": 3, "imp": 0.0118, "h": 0.09, "t": "Semistructured Data Representation", "d": "A database of *semistructured data* is a collection of *nodes.* Each node is either a *leaf* or *interior.* Leaf nodes have associated data; the type of this data can be any atomic type, such as numbers and strings. Inte\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -22.24, "y": -29.11, "z": 45.55, "jx": 300.0, "jy": 9892.0, "ch": "DBMS 11"}, {"id": "dbms-1113-information-integration-via-semistructured-data", "c": 3, "imp": 0.0, "h": 0.074, "t": "Information Integration Via Semistructured Data", "d": "The flexibility and self-describing nature of semistructured data has made it important in two applications. We shall discuss its use for data exchange in Section 11.2, but here we shall consider its use as a tool for in\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 55.84, "y": -102.8, "z": -62.05, "jx": 150.0, "jy": 9892.0, "ch": "DBMS 11"}, {"id": "dbms-112-relational-database-systems", "c": 3, "imp": 0.1476, "h": 0.193, "t": "Relational Database Systems", "d": "Following a famous paper written by Ted Codd in 1970,2 database systems changed significantly. Codd proposed that database systems should present the user with a view of data organized as tables called *relations.* Behin\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 65.36, "y": -217.41, "z": -128.18, "jx": 75.0, "jy": 0.0, "ch": "DBMS 1"}, {"id": "dbms-1121-semantic-tags", "c": 3, "imp": 0.0616, "h": 0.072, "t": "Semantic Tags", "d": "Tags in XML are text surrounded by triangular brackets, i.e., < ...> , as in HTML. Also as in HTML, tags generally come in matching pairs, with an *opening tag* like <Foo> and a matched *closing* tag that is the same wor\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -27.83, "y": -16.47, "z": 58.39, "jx": -150.0, "jy": 10010.0, "ch": "DBMS 11"}, {"id": "dbms-1122-xml-w-ith-and-w-ithout-a-schema", "c": 3, "imp": 0.0326, "h": 0.561, "t": "XML W ith and W ithout a Schema", "d": "XML is designed to be used in two somewhat different modes:  1. *Well-formed* XML allows you to invent your own tags, much like the arc-labels in semistructured data. This mode corresponds quite closely to semistructured\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -1.13, "y": -58.4, "z": 7.85, "jx": 150.0, "jy": 10128.0, "ch": "DBMS 11"}, {"id": "dbms-1123-well-formed-xml", "c": 3, "imp": 0.0082, "h": 0.941, "t": "Well-Formed XML", "d": "The minimal requirement for well-formed XML is that the document begin with a declaration that it is XML, and that it have a *root element* that is the entire body of the text. Thus, a well-formed XML document would have\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -60.97, "y": -9.56, "z": 48.42, "jx": 0.0, "jy": 10128.0, "ch": "DBMS 11"}, {"id": "dbms-1124-attributes", "c": 3, "imp": 0.3384, "h": 0.154, "t": "Attributes", "d": "As in HTML, an XML element can have *attributes* (name-value pairs) within its opening tag. An attribute is an alternative way to represent a leaf node of semistructured data. Attributes, like tags, can represent labeled\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -61.16, "y": -4.55, "z": 125.24, "jx": -300.0, "jy": 9892.0, "ch": "DBMS 11"}, {"id": "dbms-1125-attributes-that-connect-elements", "c": 3, "imp": 0.0082, "h": 0.105, "t": "Attributes That Connect Elements", "d": "An important use for attributes is to represent connections in a semistructured data graph that do not form a tree. We shall see in Section 11.3.4 how to declare certain attributes to be identifiers for their elements. W\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -31.32, "y": 3.15, "z": 81.67, "jx": 150.0, "jy": 10010.0, "ch": "DBMS 11"}, {"id": "dbms-1126-namespaces", "c": 3, "imp": 0.0, "h": 0.166, "t": "Namespaces", "d": "There axe situations in which XML data involves tags that come from two or more different sources, and which may therefore have conflicting names. For example, we would not want to confuse an HTML tag used in text with a\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -7.43, "y": -397.53, "z": -65.99, "jx": 150.0, "jy": 9774.0, "ch": "DBMS 11"}, {"id": "dbms-1127-xml-and-databases", "c": 3, "imp": 0.0, "h": 0.167, "t": "XML and Databases", "d": "Information encoded in XML is not always intended to be stored in a database. It has become common for computers to share data across the Internet by passing messages in the form of XML elements. These messages live for \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 26.15, "y": 1.21, "z": 29.08, "jx": 0.0, "jy": 9892.0, "ch": "DBMS 11"}, {"id": "dbms-113-smaller-and-smaller-systems", "c": 3, "imp": 0.0, "h": 0.083, "t": "Smaller and Smaller Systems", "d": "Originally, DBMS's were large, expensive software systems running on large computers. The size was necessary, because to store a gigabyte of data required a large computer system. Today, hundreds of gigabytes fit on a si\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 58.46, "y": -196.89, "z": -137.98, "jx": 75.0, "jy": 118.0, "ch": "DBMS 1"}, {"id": "dbms-1131-the-form-of-a-dtd", "c": 3, "imp": 0.0, "h": 0.198, "t": "The Form of a DTD", "d": "The gross structure of a DTD is:  ``` <! DOCTYPE root-tag [      <! ELEMENT element-name ( components) >           more elements ```  The opening *root-tag* and its matched closing tag surround a document that conforms t\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 42.65, "y": 45.94, "z": 50.2, "jx": -150.0, "jy": 9892.0, "ch": "DBMS 11"}, {"id": "dbms-1132-using-a-dtd", "c": 3, "imp": 0.0, "h": 0.872, "t": "Using a DTD", "d": "If a document is intended to conform to a certain DTD, we can either:  - a) Include the DTD itself as a preamble to the document, or - b) In the opening line, refer to the DTD, which must be stored separately in the file\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -62.52, "y": 2.54, "z": 72.12, "jx": 150.0, "jy": 10246.0, "ch": "DBMS 11"}, {"id": "dbms-1133-attribute-lists", "c": 3, "imp": 0.0, "h": 0.161, "t": "Attribute Lists", "d": "A DTD also lets us specify which attributes an element may have, and what the types of these attributes are. A declaration of the form  ``` <!ATTLIST element-name attribute-name type > ```  says that the named attribute \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -94.19, "y": 4.78, "z": 112.44, "jx": -300.0, "jy": 10010.0, "ch": "DBMS 11"}, {"id": "dbms-1134-identifiers-and-references", "c": 3, "imp": 0.0, "h": 0.128, "t": "Identifiers and References", "d": "Recall from Section 11.2.5 that certain attributes can be used as identifiers for elements. In a DTD, we give these attributes the type ID. Other attributes have values that are references to these element ID's; these at\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -63.39, "y": -36.37, "z": 78.96, "jx": 300.0, "jy": 10010.0, "ch": "DBMS 11"}, {"id": "dbms-114-bigger-and-bigger-systems", "c": 3, "imp": 0.0, "h": 0.054, "t": "Bigger and Bigger Systems", "d": "On the other hand, a gigabyte is not that much data any more. Corporate databases routinely store terabytes (1012 bytes). Yet there are many databases that store petabytes (101S bytes) of data and serve it all to users. \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 41.83, "y": -156.83, "z": -170.9, "jx": -525.0, "jy": 118.0, "ch": "DBMS 1"}, {"id": "dbms-1141-the-form-of-an-xml-schema", "c": 3, "imp": 0.0, "h": 0.662, "t": "The Form of an XML Schema", "d": "An XML Schema description of a schema is itself an XML document. It uses the namespace at the URL:  that is provided by the World-Wide-Web Consortium. Each XML-Schema document thus has the form:  ``` <? xml v ersio n = \"\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -53.46, "y": -45.06, "z": 40.05, "jx": -150.0, "jy": 10128.0, "ch": "DBMS 11"}, {"id": "dbms-1142-elements", "c": 3, "imp": 0.1109, "h": 0.154, "t": "Elements", "d": "An important component of schemas is the *element,* which is similar to an element definition in a DTD. In the discussion that follows, you should be alert to the fact that, because XML-Schema definitions are XML documen\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 9.07, "y": 31.98, "z": 72.05, "jx": -150.0, "jy": 9774.0, "ch": "DBMS 11"}, {"id": "dbms-1143-complex-types", "c": 3, "imp": 0.0, "h": 0.729, "t": "Complex Types", "d": "A *complex type* in XML Schema can have several forms, but the most common is a sequence of elements. These elements are required to occur in the sequence given, but the number of repetitions of each element can be contr\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 29.3, "y": -81.3, "z": -21.95, "jx": -150.0, "jy": 10246.0, "ch": "DBMS 11"}, {"id": "dbms-1144-attributes", "c": 3, "imp": 0.152, "h": 0.198, "t": "Attributes", "d": "A complex type can have attributes. That is, when we define a complex type *T,* we can include instances of element <xs: a t t r i b u t e d When we use T as the type of an element *E,* then *E* can have (or must have) a\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -60.67, "y": -35.57, "z": 136.22, "jx": -300.0, "jy": 9774.0, "ch": "DBMS 11"}, {"id": "dbms-1145-restricted-simple-types", "c": 3, "imp": 0.0, "h": 0.105, "t": "Restricted Simple Types", "d": "It is possible to create a restricted version of a simple type such as integer or string by limiting the values the type can take. These types can then be used as the type of an attribute or element. We shall consider tw\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -100.62, "y": -388.85, "z": 96.73, "jx": 300.0, "jy": 9774.0, "ch": "DBMS 11"}, {"id": "dbms-1146-keys-in-xml-schema", "c": 3, "imp": 0.0, "h": 0.084, "t": "Keys in XML Schema", "d": "An element can have a key declaration, which says that when we look at a certain class C of elements, values of one or more given *fields* within those elements are unique. The concept of \"field\" is actually quite genera\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -9.46, "y": -7.53, "z": 63.66, "jx": 0.0, "jy": 10010.0, "ch": "DBMS 11"}, {"id": "dbms-1147-foreign-keys-in-xml-schema", "c": 3, "imp": 0.0, "h": 0.632, "t": "Foreign Keys in XML Schema", "d": "We can also declare that an element has, perhaps deeply nested within it, a field or fields that serve as a reference to the key for some other element. This  ``` 1) <? xml version = \"1.0\" encoding = \"utf-8\" ?> 2) <xs:sc\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 1.3, "y": -96.88, "z": -17.9, "jx": 0.0, "jy": 10246.0, "ch": "DBMS 11"}, {"id": "dbms-115-information-integration", "c": 3, "imp": 0.1938, "h": 0.185, "t": "Information Integration", "d": "To a great extent, the old problem of building and maintaining databases has become one of *information integration:* joining the information contained in many related databases into a whole. For example, a large company\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 82.08, "y": -160.22, "z": -122.22, "jx": -75.0, "jy": 118.0, "ch": "DBMS 1"}, {"id": "dbms-121-data-definition-language-commands", "c": 3, "imp": 0.0, "h": 0.122, "t": "Data-Definition Language Commands", "d": "The second kind of command is the simpler to process, and we show its trail beginning at the upper right side of Fig. 1.1. For example, the database administrator, or *DBA,* for a university registrar's database might de\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 49.86, "y": -245.35, "z": -148.7, "jx": 225.0, "jy": 118.0, "ch": "DBMS 1"}, {"id": "dbms-1211-the-xpath-data-model", "c": 3, "imp": 0.2895, "h": 0.17, "t": "The XPath Data Model", "d": "As in the relational model, XPath assumes that all values \u2014 those it produces and those constructed in intermediate steps \u2014 have the same general \"shape.\" In the relational model, this \"shape\" is a bag of tuples. Tuples \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -12.65, "y": 74.96, "z": 181.13, "jx": 0.0, "jy": 10539.0, "ch": "DBMS 12"}, {"id": "dbms-1213-path-expressions", "c": 3, "imp": 0.1546, "h": 0.814, "t": "Path Expressions", "d": "Typically, an XPath expression starts at the root of a document and gives a sequence of tags and slashes (/), say /7 i/T 2/ \u2022 \u2022 \u2022 */T n.* We evaluate this expression by starting with a sequence of items consisting of one\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 19.25, "y": 131.11, "z": 224.89, "jx": 0.0, "jy": 10657.0, "ch": "DBMS 12"}, {"id": "dbms-1214-relative-path-expressions", "c": 3, "imp": 0.0, "h": 0.863, "t": "Relative Path Expressions", "d": "In several contexts, we shall use XPath expressions that are *relative* to the current node or sequence of nodes.  - In Section 11.4.6 we talked about selector and field values that were really XPath expressions relative\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 34.1, "y": 153.78, "z": 262.04, "jx": -75.0, "jy": 10775.0, "ch": "DBMS 12"}, {"id": "dbms-1215-attributes-in-path-expressions", "c": 3, "imp": 0.0, "h": 0.741, "t": "Attributes in Path Expressions", "d": "Path expressions allow us to find all the elements within a document that are reached from the root along a particular kind of path (a sequence of tags). Sometimes, we want to find not these elements but rather the value\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 0.33, "y": 152.54, "z": 265.32, "jx": -375.0, "jy": 10775.0, "ch": "DBMS 12"}, {"id": "dbms-1216-axes", "c": 3, "imp": 0.0082, "h": 0.866, "t": "Axes", "d": "So far, we have only navigated through semistructured-data graphs in two ways: from a node to its children or to an attribute. XPath in fact provides a large number of *axes,* which are modes of navigation. Two of these \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -30.28, "y": 116.06, "z": 213.21, "jx": -450.0, "jy": 10657.0, "ch": "DBMS 12"}, {"id": "dbms-1217-context-of-expressions", "c": 3, "imp": 0.0, "h": 0.87, "t": "Context of Expressions", "d": "In order to understand the meaning of an axis like parent, we need to explore further the view of data in XPath. Results of expressions are sequences of elements or primitive values. However, XPath expressions and their \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -20.37, "y": 140.1, "z": 236.31, "jx": -525.0, "jy": 10775.0, "ch": "DBMS 12"}, {"id": "dbms-1218-wildcards", "c": 3, "imp": 0.0, "h": 0.708, "t": "Wildcards", "d": "Instead of specifying a tag along every step of a path, we can use a \\* to say \"any tag.\" Likewise, instead of specifying an attribute, @\\* says \"any attribute.\"  E xam ple 12.5 : Consider the path expression  ``` /StarM\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 10.79, "y": 170.79, "z": 248.85, "jx": 225.0, "jy": 10775.0, "ch": "DBMS 12"}, {"id": "dbms-1219-conditions-in-path-expressions", "c": 3, "imp": 0.0287, "h": 0.929, "t": "Conditions in Path Expressions", "d": "As we evaluate a path expression, we can restrict ourselves to follow only a subset of the paths whose tags match the tags in the expression. To do so, we follow a tag by a condition, surrounded by square brackets. This \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 53.71, "y": 115.96, "z": 203.07, "jx": -225.0, "jy": 10775.0, "ch": "DBMS 12"}, {"id": "dbms-122-overview-of-query-processing", "c": 3, "imp": 0.0, "h": 0.076, "t": "Overview of Query Processing", "d": "The great majority of interactions with the DBMS follow the path on the left side of Fig. 1.1. A user or an application program initiates some action, using the data-manipulation language (DML). This command does not aff\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 46.54, "y": -245.45, "z": -121.23, "jx": 375.0, "jy": 118.0, "ch": "DBMS 1"}, {"id": "dbms-1221-xquery-basics", "c": 3, "imp": 0.0628, "h": 0.61, "t": "XQuery Basics", "d": "XQuery uses the same model for values that we introduced for XPath in Section 12.1.1. That is, all values produced by XQuery expressions are sequences of items. Items are either primitive values or nodes of various types\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 40.38, "y": 83.68, "z": 145.99, "jx": 300.0, "jy": 10657.0, "ch": "DBMS 12"}, {"id": "dbms-12210-ordering-the-result-of-a-query", "c": 3, "imp": 0.0, "h": 0.873, "t": "Ordering the Result of a Query", "d": "It is possible to sort the results as part of a FLWR query, if we add an orderclause before the return-clause. In fact, the query form we have been concentrating on here is usually called FLWOR (but still pronounced \"flo\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 63.77, "y": 171.1, "z": 181.42, "jx": 375.0, "jy": 10893.0, "ch": "DBMS 12"}, {"id": "dbms-1222-flwr-expressions", "c": 3, "imp": 0.0163, "h": 0.881, "t": "FLWR Expressions", "d": "Beyond XPath expressions, the most important form of XQuery expression involves clauses of four types, called for-, let-, where-, and return- (FLWR) clauses.1 We shall introduce each type of clause in turn. However, we s\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 43.3, "y": 131.55, "z": 176.16, "jx": 375.0, "jy": 10775.0, "ch": "DBMS 12"}, {"id": "dbms-1223-replacement-of-variables-by-their-values", "c": 3, "imp": 0.0299, "h": 0.813, "t": "Replacement of Variables by Their Values", "d": "Let us consider a modification to the query of Example 12.12. Here, we want to produce not just a sequence of <Star> elements, but rather a sequence of Movie elements, each containing all the stars of movies with a given\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 68.16, "y": 108.15, "z": 226.98, "jx": 75.0, "jy": 10775.0, "ch": "DBMS 12"}, {"id": "dbms-1224-joins-in-xquery", "c": 3, "imp": 0.0163, "h": 0.769, "t": "Joins in XQuery", "d": "We can join two or more documents in XQuery in much the same way as we join two or more relations in SQL. In each case we need variables, each of which ranges over elements of one of the documents or tuples of one of the\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 82.5, "y": 103.73, "z": 191.03, "jx": -225.0, "jy": 10893.0, "ch": "DBMS 12"}, {"id": "dbms-1225-xquery-comparison-operators", "c": 3, "imp": 0.0, "h": 0.556, "t": "XQuery Comparison Operators", "d": "We shall now consider another puzzle where things don't quite work as expected. Our goal is to find the stars in s t a r s . xml of Fig. 12.7(a) that live at 123 Maple St., Malibu. Our first attempt is in Fig. 12.13.  ``\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 102.79, "y": 102.31, "z": 224.35, "jx": 75.0, "jy": 11011.0, "ch": "DBMS 12"}, {"id": "dbms-1226-elimination-of-duplicates", "c": 3, "imp": 0.0, "h": 0.81, "t": "Elimination of Duplicates", "d": "XQuery allows us to eliminate duplicates in sequences of any kind, by applying the built-in function d is tin c t-v a lu e s . There is a subtlely that must be noted, however. Strictly speaking, distinct-values applies t\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 100.44, "y": 122.97, "z": 222.01, "jx": -75.0, "jy": 11011.0, "ch": "DBMS 12"}, {"id": "dbms-1227-quantification-in-xquery", "c": 3, "imp": 0.0, "h": 0.923, "t": "Quantification in XQuery", "d": "There are expressions that say, in effect, \"for all\" and \"there exists.\" Their forms, respectively, are:  ``` every variable in expressionl s a t i s f i e s expressions  some variable in expressionl s a t i s f i e s ex\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 69.21, "y": 91.81, "z": 114.81, "jx": 525.0, "jy": 10775.0, "ch": "DBMS 12"}, {"id": "dbms-1228-aggregations", "c": 3, "imp": 0.0, "h": 0.899, "t": "Aggregations", "d": "XQuery provides built-in functions to compute the usual aggregations such as count, sum, or max. They take any sequence as argument; that is, they can be applied to the result of any XQuery expression.  ``` l e t $movies\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 67.18, "y": 87.26, "z": 182.84, "jx": 75.0, "jy": 10893.0, "ch": "DBMS 12"}, {"id": "dbms-1229-branching-in-xquery-expressions", "c": 3, "imp": 0.0, "h": 0.634, "t": "Branching in XQuery Expressions", "d": "There is an if-then-else expression in XQuery of the form  ``` i f ( expressionl) then expression2 e ls e expressions ```  To evaluate this expression, first evaluate *expressionl*; if it is true, evaluate *expression2,*\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 63.41, "y": 103.24, "z": 161.07, "jx": -375.0, "jy": 10893.0, "ch": "DBMS 12"}, {"id": "dbms-123-storage-and-buffer-management", "c": 3, "imp": 0.0, "h": 0.094, "t": "Storage and Buffer Management", "d": "The data of a database normally resides in secondary storage; in today's computer systems \"secondary storage\" generally means magnetic disk. However, to perform any useful operation on data, that data must be in main mem\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 62.88, "y": -170.91, "z": -192.6, "jx": -375.0, "jy": 118.0, "ch": "DBMS 1"}, {"id": "dbms-1231-xslt-basics", "c": 3, "imp": 0.0109, "h": 0.785, "t": "XSLT Basics", "d": "Like XML Schema, XSLT specifications are XML documents; these specifications are usually called *stylesheets.* The tags used in XSLT are found in a namespace, which is [http://www.w3.org/1999/XSL/Transform .](http://www.\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 6.87, "y": 87.44, "z": 222.39, "jx": 450.0, "jy": 10657.0, "ch": "DBMS 12"}, {"id": "dbms-1232-templates", "c": 3, "imp": 0.0109, "h": 0.718, "t": "Templates", "d": "A stylesheet will have one or more *templates.* To apply a stylesheet to an XML document, we go down the list of templates until we find one that matches the root. As processing proceeds, we often need to find matching t\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 18.64, "y": 77.7, "z": 213.75, "jx": 150.0, "jy": 10657.0, "ch": "DBMS 12"}, {"id": "dbms-1233-obtaining-values-from-xml-data", "c": 3, "imp": 0.0, "h": 0.914, "t": "Obtaining Values From XML Data", "d": "It is unusual that the document we produce does not depend in any way on the input to the transformation, as was the case in Example 12.20. The simplest way to extract data from the input is with the value-of tag. The fo\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -45.29, "y": 94.0, "z": 183.45, "jx": -150.0, "jy": 10657.0, "ch": "DBMS 12"}, {"id": "dbms-1234-recursive-use-of-templates", "c": 3, "imp": 0.0, "h": 0.733, "t": "Recursive Use of Templates", "d": "The most interesting and powerful transformations require recursive application of templates at various elements of the input. Having selected a template to  ``` 1) <? xml version = \"1.0\" encoding = \"utf-8\" ?> 2) <xsl:st\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 37.44, "y": 89.55, "z": 240.64, "jx": 225.0, "jy": 10893.0, "ch": "DBMS 12"}, {"id": "dbms-1235-iteration-in-xslt", "c": 3, "imp": 0.0, "h": 0.912, "t": "Iteration in XSLT", "d": "We can put a loop within a template that gives us freedom over the order in which we visit certain subelements of the element to which the template is being applied. The f or-each tag creates the loop, with a form:  ``` \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -46.78, "y": 90.75, "z": 211.52, "jx": -300.0, "jy": 10657.0, "ch": "DBMS 12"}, {"id": "dbms-1236-conditionals-in-xslt", "c": 3, "imp": 0.0, "h": 0.917, "t": "Conditionals in XSLT", "d": "We can introduce branching into our templates by using an i f tag. The form of this tag is:  ``` <xsl:if test = \"boolean expression\"> ```  Whatever appears between this tag and its matched closing tag is executed if and \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 32.27, "y": 100.19, "z": 221.39, "jx": -75.0, "jy": 10893.0, "ch": "DBMS 12"}, {"id": "dbms-124-transaction-processing", "c": 3, "imp": 0.0, "h": 0.13, "t": "Transaction Processing", "d": "It is normal to group one or more database operations into a *transaction,* which is a unit of work that must be executed atomically and in apparent isolation from other transactions. In addition, a DBMS offers the guara\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 40.55, "y": -194.28, "z": -180.28, "jx": -225.0, "jy": 118.0, "ch": "DBMS 1"}, {"id": "dbms-125-the-query-processor", "c": 3, "imp": 0.0, "h": 0.053, "t": "The Query Processor", "d": "The portion of the DBMS that most affects the performance that the user sees is the *query processor.* In Fig. 1.1 the query processor is represented by two components:  - 1. The *query compiler,* which translates the qu\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 72.93, "y": -254.6, "z": -130.77, "jx": 525.0, "jy": 118.0, "ch": "DBMS 1"}, {"id": "dbms-1311-the-memory-hierarchy", "c": 3, "imp": 0.2443, "h": 0.077, "t": "The Memory Hierarchy", "d": "A typical computer system has several different components in which data may be stored. These components have data capacities ranging over at least seven orders of magnitude and also have access speeds ranging over seven\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -243.55, "y": -59.58, "z": -87.27, "jx": 150.0, "jy": 11304.0, "ch": "DBMS 13"}, {"id": "dbms-1312-transfer-of-data-between-levels", "c": 3, "imp": 0.0361, "h": 0.17, "t": "Transfer of Data Between Levels", "d": "Normally, data moves between adjacent levels of the hierarchy. At the secondary and tertiary levels, accessing the desired data or finding the desired place to store data takes a great deal of time, so each level is orga\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -277.81, "y": -13.85, "z": -96.48, "jx": 600.0, "jy": 11422.0, "ch": "DBMS 13"}, {"id": "dbms-1313-volatile-and-nonvolatile-storage", "c": 3, "imp": 0.0185, "h": 0.121, "t": "Volatile and Nonvolatile Storage", "d": "An additional distinction among storage devices is whether they are *volatile* or *nonvolatile.* A volatile device \"forgets\" what is stored in it when the power goes off. A nonvolatile device, on the other hand, is expec\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -224.09, "y": -54.14, "z": -115.19, "jx": 900.0, "jy": 11422.0, "ch": "DBMS 13"}, {"id": "dbms-1314-virtual-memory", "c": 3, "imp": 0.0762, "h": 0.133, "t": "Virtual Memory-", "d": "Typical software executes in *virtual-memory,* an address space that is typically 32 bits; i.e., there are 232 bytes, or 4 gigabytes, in a virtual memory. The operating system manages virtual memory, keeping some of it i\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -273.66, "y": -44.81, "z": -121.21, "jx": 750.0, "jy": 11422.0, "ch": "DBMS 13"}, {"id": "dbms-1321-mechanics-of-disks", "c": 3, "imp": 0.0762, "h": 0.128, "t": "Mechanics of
