, "c": 2, "imp": 0.0, "h": 0.643, "t": "Nullstedsfactorisation", "d": "Lad  $p(t) = a_d t^d + a_{d-1} t^{d-1} + \\dots + a_1 t + a_0 \\in \\mathbb{C}[t]$  v\u00e6re et polynomium med koefficienter i  $\\mathbb{C}$ , s\u00e5dan at  $d \\ge 0$  og  $a_d \\ne 0$ . Da findes  $z_1, \\dots, z_d \\in \\mathbb{C}$ ,\u2026", "pc": 1, "nw": 1, "nm": 0, "hp": 1, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -2.49, "y": -13.13, "z": -116.62, "jx": 75.0, "jy": 3239.0, "ch": "LA 3"}, {"id": "la-354-hvis-r-er-en-kommutativ-ring-da-udgoer-maengden-r", "c": 2, "imp": 0.0124, "h": 0.185, "t": "Polynomier_ring", "d": "*Hvis R er en kommutativ ring, da udg\u00f8r m\u00e6ngden R*[*t*] *af polynomier med koefficienter i R sammen med sum og produkt af polynomier en kommutativ ring.*", "pc": 0, "nw": 0, "nm": 0, "hp": 1, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -24.37, "y": -81.76, "z": -184.74, "jx": 225.0, "jy": 2531.0, "ch": "LA 3"}, {"id": "la-355-lemma-355", "c": 2, "imp": 0.0245, "h": 0.759, "t": "Polynomierets grad", "d": "Lad  $p,q \\in R[t]$  v\u00e6re polynomier med koeffcienter i en kommutativ ring R. Da g\u00e6lder f\u00f8lgende udsagn:  - (1) Hvis  $deg(p) \\le d$  og  $deg(q) \\le e$ ,  $da \\ er \\ deg(p+q) \\le max\\{d,e\\}$ . - (2) Hvis  $deg(p) \\le d$\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 1, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -29.26, "y": -49.23, "z": -141.03, "jx": 225.0, "jy": 2885.0, "ch": "LA 3"}, {"id": "la-357-saetning-357", "c": 2, "imp": 0.0, "h": 0.786, "t": "Determinantgrad", "d": "Lad R[t] v\u00e6re den kommutative ring af polynomier med koefficienter i en kommutativ ring R, og lad  $P = (p_{ij}) \\in M_n(R[t])$  v\u00e6re en matrix med indgange i R[t]. Hvis  $\\deg(p_{ij}) \\leq d$  for alle  $1 \\leq i, j \\le\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 1, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -20.67, "y": -77.23, "z": -160.54, "jx": 150.0, "jy": 3003.0, "ch": "LA 3"}, {"id": "la-411-hoejre", "c": 2, "imp": 0.0255, "h": 0.079, "t": "h\u00f8jre", "d": "Lad F v\u00e6re et legeme. Et *h\u00f8jre* F*-vektorrum* er en triple (*V*,+, \u00b7), der best\u00e5r af en m\u00e6ngde *V* og to afbildninger +: *V* \u00d7*V* \u2192 *V* og \u00b7 : *V* \u00d7F \u2192 *V*, s\u00e5dan at:  - (A1) For alle *x*, *y*, *z* \u2208 *V* er (*x*+ *y*)+ \u2026", "pc": 17, "nw": 17, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -221.86, "y": 168.44, "z": -8.56, "jx": -150.0, "jy": 3886.0, "ch": "LA 4"}, {"id": "la-412-nulvektoren", "c": 2, "imp": 0.0, "h": 0.155, "t": "nulvektoren", "d": "Lad  $\\mathbb{F}$  v\u00e6re et legeme og lad  $(V, +, \\cdot)$  v\u00e6re et  $\\mathbb{F}$ -vektorrum.  - (1) Vektoren  $\\mathbf{0} \\in V$  i (A2) er entydigt bestemt. For hvis  $\\mathbf{0}$  og  $\\mathbf{0}'$  begge opfylder (A2)\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 338.07, "y": -294.63, "z": -133.47, "jx": 450.0, "jy": 3532.0, "ch": "LA 4"}, {"id": "la-414-stabil-med-hensyn-til-vektorrumsstrukturen-paa", "c": 2, "imp": 0.1273, "h": 0.135, "t": "stabil med hensyn til vektorrumsstrukturen p\u00e5", "d": "Lad  $\\mathbb{F}$  v\u00e6re et legeme, og lad  $(V,+,\\cdot)$  v\u00e6re et  $\\mathbb{F}$ -vektorrum. En delm\u00e6ngde  $U \\subset V$  siges at v\u00e6re *stabil med hensyn til vektorrumsstrukturen p\u00e5* V, hvis f\u00f8lgende er opfyldt:  - (1) N\u2026", "pc": 10, "nw": 10, "nm": 0, "hp": 1, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -315.64, "y": 180.42, "z": 54.27, "jx": 600.0, "jy": 3532.0, "ch": "LA 4"}, {"id": "la-416-saetning-416", "c": 2, "imp": 0.1034, "h": 0.128, "t": "Vektorrum afrestriktion", "d": "Lad  $\\mathbb{F}$  v\u00e6re et legeme, lad  $(V,+,\\cdot)$  v\u00e6re et  $\\mathbb{F}$ -vektorrum, lad  $U \\subset V$  v\u00e6re en delm\u00e6ngde, der er stabil med hensyn til vektorrumsstrukturen p\u00e5 V, og lad  $+' : U \\times U \\to U$  og \u2026", "pc": 3, "nw": 3, "nm": 0, "hp": 1, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -314.13, "y": 214.75, "z": 80.77, "jx": 300.0, "jy": 3650.0, "ch": "LA 4"}, {"id": "la-417-definition-417", "c": 2, "imp": 0.0, "h": 0.057, "t": "Un-derrum", "d": "Lad  $\\mathbb{F}$  v\u00e6re et legeme. Et  $\\mathbb{F}$ -vektorrum  $(U,+',\\cdot')$  siges at v\u00e6re et un-derrum af et  $\\mathbb{F}$ -vektorrum  $(V,+,\\cdot)$ , hvis U er en delm\u00e6ngde af V, der er stabil med hensyn til vektor\u2026", "pc": 2, "nw": 2, "nm": 0, "hp": 1, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -301.21, "y": 242.8, "z": 62.7, "jx": 600.0, "jy": 3886.0, "ch": "LA 4"}, {"id": "la-418-lemma-418", "c": 2, "imp": 0.0833, "h": 0.106, "t": "Nullrummet", "d": "Lad A v\u00e6re en  $m \\times n$ -matrix med indgange i et legeme  $\\mathbb{F}$ . Delm\u00e6ngden  $$N_A = \\{ \\boldsymbol{x} \\in \\mathbb{F}^n \\mid A\\boldsymbol{x} = \\boldsymbol{0} \\} \\subset \\mathbb{F}^n,$$", "pc": 0, "nw": 0, "nm": 0, "hp": 1, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -271.55, "y": 213.87, "z": 105.19, "jx": -75.0, "jy": 3768.0, "ch": "LA 4"}, {"id": "la-419-definition-419", "c": 2, "imp": 0.0285, "h": 0.145, "t": "Nulrum og s\u00f8jlerum", "d": "Lad A v\u00e6re en  $m \\times n$ -matrix med indgange i et legeme  $\\mathbb{F}$ . Da kaldes underrummene  $N_A \\subset \\mathbb{F}^n$  og  $R_A \\subset \\mathbb{F}^m$  for nulrummet og s\u00f8jlerummet af matricen A.", "pc": 1, "nw": 1, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -205.27, "y": 200.96, "z": -26.23, "jx": 150.0, "jy": 3532.0, "ch": "LA 4"}, {"id": "la-421-definition-421", "c": 2, "imp": 0.0645, "h": 0.073, "t": "Line\u00e6rafbildning", "d": "Lad  $\\mathbb{F}$  v\u00e6re et legeme og lad V og W v\u00e6re  $\\mathbb{F}$ -vektorrum. En afbildning  $f:V\\to W$  er line\u00e6r, hvis den opfylder f\u00f8lgende betingelser:  - (L1) For alle  $x, y \\in V$  g\u00e6lder det, at f(x + y) = f(x) \u2026", "pc": 11, "nw": 11, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -253.69, "y": 148.25, "z": -12.84, "jx": 0.0, "jy": 3532.0, "ch": "LA 4"}, {"id": "la-423-lemma-423", "c": 2, "imp": 0.0159, "h": 0.102, "t": "Line\u00e6rform", "d": "Lad  $\\mathbb{F}$  v\u00e6re et legeme, lad V v\u00e6re et  $\\mathbb{F}$ -vektorrum, og lad  $(\\mathbf{v}_1, \\dots, \\mathbf{v}_n)$  v\u00e6re en n-tuple af vektorer i V. Da findes der pr\u00e6cis \u00e9n line\u00e6r afbildning  $h: \\mathbb{F}^n \\to V\u2026", "pc": 5, "nw": 5, "nm": 0, "hp": 1, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -279.55, "y": 192.85, "z": 55.4, "jx": 750.0, "jy": 3886.0, "ch": "LA 4"}, {"id": "la-425-opfylder-l1-og-l2-for-alle", "c": 2, "imp": 0.0, "h": 0.053, "t": "Komposition af line\u00e6re afbildninger", "d": "Lad  $\\mathbb{F}$  v\u00e6re et legeme, og lad U, V og W v\u00e6re  $\\mathbb{F}$ -vektorrum. Givet to line\u00e6re afbildninger  $f: V \\to W$  og  $g: U \\to V$ , da er  $f \\circ g: U \\to W$  igen line\u00e6r.", "pc": 9, "nw": 9, "nm": 0, "hp": 1, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -301.25, "y": 153.75, "z": 18.4, "jx": 0.0, "jy": 3650.0, "ch": "LA 4"}, {"id": "la-426-mellem-to-f-vektorrum-er-en", "c": 2, "imp": 0.0111, "h": 0.199, "t": "Isomorfi", "d": "Lad F v\u00e6re et legeme. En line\u00e6r afbildning *f* : *V* \u2192 *W* mellem to F-vektorrum er en *isomorfi*, hvis der findes en line\u00e6r afbildning *g*: *W* \u2192 *V*, s\u00e5dan at *f* \u25e6 *g* = id*<sup>W</sup>* og *g* \u25e6 *f* = id*<sup>V</sup>\u2026", "pc": 41, "nw": 41, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -235.47, "y": 248.35, "z": -6.47, "jx": -450.0, "jy": 3886.0, "ch": "LA 4"}, {"id": "la-427-vaere-et-legeme-og-lad-f", "c": 2, "imp": 0.0, "h": 0.123, "t": "Isomorfi", "d": "*Lad* F *v\u00e6re et legeme og lad f* : *V* \u2192 *W v\u00e6re en line\u00e6r afbildning mellem to* F*-vektorrum. Da er f\u00f8lgende udsagn \u00e6kvivalente:*  - (1) *Afbildningen f* : *V* \u2192 *W er en bijektion.* - (2) *Afbildningen f* : *V* \u2192 *W e\u2026", "pc": 26, "nw": 26, "nm": 0, "hp": 1, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -309.49, "y": 227.16, "z": 51.19, "jx": 300.0, "jy": 3886.0, "ch": "LA 4"}, {"id": "la-429-er-et-legeme-og-hvis-f", "c": 2 $  med indgange i et legeme  $\\mathbb{F}$  er pr\u00e6cis r\u00f8dderne i  $\\mathbb{F}$  af det karakteristiske polynomium  $\\chi_A(t) \\in \\mathbb{F}[t]$ .", "pc": 1, "nw": 1, "nm": 0, "hp": 1, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -278.3, "y": 20.42, "z": 86.77, "jx": 300.0, "jy": 5359.0, "ch": "LA 5"}, {"id": "la-519-geometriske-multiplicitet", "c": 2, "imp": 0.071, "h": 0.08, "t": "geometriske multiplicitet", "d": "Lad  $\\lambda \\in \\mathbb{F}$  v\u00e6re en egenv\u00e6rdi for en kvadratisk matrix  $A \\in M_n(\\mathbb{F})$ . Den *geometriske multiplicitet* af  $\\lambda$  er dimensionen af egenrummet  $N_{A-I\\lambda}$  h\u00f8rende til  $\\lambda$ ,\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -212.91, "y": 57.66, "z": 47.26, "jx": 0.0, "jy": 5359.0, "ch": "LA 5"}, {"id": "la-521-diagonaliserbar", "c": 2, "imp": 0.0205, "h": 0.199, "t": "diagonaliserbar", "d": "En kvadratisk matrix  $A \\in M_n(\\mathbb{F})$  kaldes *diagonaliserbar*, hvis der findes en invertibel matrix  $P \\in M_n(\\mathbb{F})$ , s\u00e5dan at  $P^{-1}AP$  er en diagonalmatrix D.", "pc": 6, "nw": 6, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -210.18, "y": 42.52, "z": 91.32, "jx": 0.0, "jy": 5477.0, "ch": "LA 5"}, {"id": "la-5210-1", "c": 2, "imp": 0.0, "h": 0.92, "t": "Jordan-normalform", "d": "Hvis  $A \\in M_n(\\mathbb{R})$  er en symmetrisk reel kvadratisk matrix, s\u00e5 findes der en invertibel reel matrix  $P \\in M_n(\\mathbb{R})$ , s\u00e5dan at  $P^{-1}AP \\in M_n(\\mathbb{R})$  er \u00f8vre triangul\u00e6r. (2) Hvis  $A \\in M_\u2026", "pc": 6, "nw": 6, "nm": 0, "hp": 1, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -213.85, "y": 4.98, "z": 69.71, "jx": 0.0, "jy": 5595.0, "ch": "LA 5"}, {"id": "la-5212-bemaerkning-5212", "c": 2, "imp": 0.0, "h": 0.093, "t": "Bem\u00e6rkning 5.2.12", "d": "Det er let at udregne potenser af diagonaliserbare matricer. Hvis nemlig  $D = \\text{diag}(\\lambda_1, \\dots, \\lambda_n)$ , da er  $D^k = \\text{diag}(\\lambda_1^k, \\dots, \\lambda_n^k)$ , og hvis  $D = P^{-1}AP$ , da er  $$\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 343.97, "y": 198.72, "z": -203.82, "jx": -300.0, "jy": 5241.0, "ch": "LA 5"}, {"id": "la-522-saetning-522", "c": 2, "imp": 0.0245, "h": 0.443, "t": "Egenvektorbasisondehed", "d": "Lad  $\\mathbb{F}$  v\u00e6re et legeme, lad  $A,P \\in M_n(\\mathbb{F})$  v\u00e6re kvadratiske matricer, og lad  $(v_1,\\ldots,v_n)$  v\u00e6re familien af s\u00f8jlevektorer i P. Da er f\u00f8lgende udsagn \u00e6kvivalente:  - (1) Matricen P er invert\u2026", "pc": 9, "nw": 9, "nm": 0, "hp": 1, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -202.0, "y": 71.89, "z": 130.64, "jx": -150.0, "jy": 5595.0, "ch": "LA 5"}, {"id": "la-523-korollar-523", "c": 2, "imp": 0.0, "h": 0.537, "t": "Diagonaliserbar matrix", "d": "En kvadratisk matrix  $A \\in M_n(\\mathbb{F})$  er diagonaliserbar, hvis og kun hvis der findes en basis for  $\\mathbb{F}^n$  best\u00e5ende af egenvektorer for A.", "pc": 3, "nw": 3, "nm": 0, "hp": 1, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -216.85, "y": 60.79, "z": 162.62, "jx": -150.0, "jy": 5713.0, "ch": "LA 5"}, {"id": "la-526-bemaerkning-526", "c": 2, "imp": 0.0, "h": 0.052, "t": "Bem\u00e6rkning 5.2.6", "d": "Ved udregning af det karakteristiske polynomium er der altid risiko for at lave fejl, hvilket vil g\u00f8re alle f\u00f8lgende udregninger forkerte. En s\u00e5dan fejl er dog let at opdage. For hvis  $\\lambda$  ikke er en egenv\u00e6rdi for\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 1, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -430.79, "y": 258.47, "z": 34.87, "jx": -150.0, "jy": 5241.0, "ch": "LA 5"}, {"id": "la-527-saetning-527", "c": 2, "imp": 0.0, "h": 0.556, "t": "Simultanegenvektorbasis", "d": "Lad A og B v\u00e6re to  $n \\times n$ -matricer med indgange i et legeme  $\\mathbb{F}$ . Hvis der findes en basis  $(\\mathbf{v}_1, \\dots, \\mathbf{v}_n)$  for  $\\mathbb{F}^n$  best\u00e5ende af vektorer, der b\u00e5de er egenvektorer indes en b\u2026", "pc": 38, "nw": 33, "nm": 5, "hp": 1, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -356.21, "y": 96.4, "z": 184.71, "jx": 75.0, "jy": 6832.0, "ch": "LA 6"}, {"id": "la-646-saetning-646", "c": 2, "imp": 0.0, "h": 0.065, "t": "Normalform", "d": "Lad  $(V, \\langle -, - \\rangle)$  v\u00e6re et endeligt frembragt komplekst vektorrum med indre produkt. For en line\u00e6r endomorfi  $f: V \\to V$  er f\u00f8lgende \u00e6kvivalent:  - (1) Endomorfien  $f: V \\to V$  er normal. - (2) Der fi\u2026", "pc": 7, "nw": 7, "nm": 0, "hp": 1, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -411.85, "y": 64.41, "z": -85.07, "jx": 75.0, "jy": 6478.0, "ch": "LA 6"}, {"id": "la-647-korollar-647", "c": 2, "imp": 0.0, "h": 0.707, "t": "Ortogonale egenvektorer", "d": "Lad  $A \\in M_n(\\mathbb{F})$  v\u00e6re enten en symmetrisk reel matrix eller en normal kompleks matrix. Egenvektorer  $\\mathbf{x}, \\mathbf{y} \\in \\mathbb{F}^n$ , der h\u00f8rer til forskellige egenv\u00e6rdier  $\\lambda, \\mu \\in \\math\u2026", "pc": 4, "nw": 4, "nm": 0, "hp": 1, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -167.48, "y": 187.04, "z": 292.27, "jx": -150.0, "jy": 7540.0, "ch": "LA 6"}, {"id": "la-651-definition-651", "c": 2, "imp": 0.0, "h": 0.068, "t": "Hermitesk form", "d": "Lad  $\\mathbb{F} = \\mathbb{R}$  eller  $\\mathbb{F} = \\mathbb{C}$ , og lad  $\\langle -, - \\rangle : V \\times V \\to \\mathbb{F}$  v\u00e6re en hermitisk form p\u00e5 et  $\\mathbb{F}$ -vektorrum V.  - (1) Et underrum  $W \\subset V$  e\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -159.44, "y": 61.64, "z": 108.78, "jx": 225.0, "jy": 6006.0, "ch": "LA 6"}, {"id": "la-653-saetning-653", "c": 2, "imp": 0.0, "h": 0.0, "t": "Hermites form", "d": "(Sylvester)** Lad enten  $\\mathbb{F} = \\mathbb{R}$  eller  $\\mathbb{F} = \\mathbb{C}$ , og lad  $\\langle -, - \\rangle : V \\times V \\to \\mathbb{F}$  v\u00e6re en hermitisk form p\u00e5 et n-dimensionalt  $\\mathbb{F}$ -vektorrum.  (1\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 1, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -213.99, "y": 126.24, "z": 203.65, "jx": -450.0, "jy": 7422.0, "ch": "LA 6"}, {"id": "la-654-bemaerkning-654", "c": 2, "imp": 0.0, "h": 0.068, "t": "Bem\u00e6rkning 6.5.4", "d": "Lad  $(V, \\langle -, - \\rangle)$  v\u00e6re som i s\u00e6tning 6.5.3. Vi understreger, at et maksimalt underrum  $W \\subset V$ , der er enten negativ definit eller positiv definit med hensyn til den hermitiske form  $\\langle -, - \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -219.91, "y": -125.38, "z": -361.56, "jx": 75.0, "jy": 6006.0, "ch": "LA 6"}, {"id": "law-of-total-expectation", "c": 1, "imp": 0.0302, "h": 0.0, "t": "Law of total expectation", "d": "Let A1, . . . , A<sup>n</sup> be a partition of a sample space, with P(Ai) > 0 for all i, and let Y be a random variable on this sample space. Then  $$E(Y) = \\sum_{i=1}^{n} E(Y|A_i)P(A_i).$$", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -154.65, "y": 115.0, "z": -180.94, "jx": 0.0, "jy": 20660.0, "ch": "Conditional expectation given an event"}, {"id": "law-of-total-probability", "c": 1, "imp": 0.0049, "h": 0.179, "t": "Law of total probability", "d": "Let  $A_1, \\ldots, A_n$  be a partition of the sample space S (i.e., the  $A_i$  are disjoint events and their union is S), with  $P(A_i) > 0$  for all i. Then  $$P(B) = \\sum_{i=1}^{n} P(B|A_i)P(A_i).$$", "pc": 1, "nw": 1, "nm": 0, "hp": 1, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -90.95, "y": 210.64, "z": -295.26, "jx": -150.0, "jy": 5575.0, "ch": "Bayes' rule and the law of total probability"}, {"id": "linearity", "c": 1, "imp": 0.0, "h": 0.779, "t": "Linearity", "d": "$$E(Y_1 + Y_2|X) = E(Y_1|X) + E(Y_2|X)$$ .", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -152.31, "y": 47.38, "z": -135.65, "jx": 75.0, "jy": 22186.0, "ch": "Properties of conditional expectation"}, {"id": "linearity-of-expectation", "c": 1, "imp": 0.0163, "h": 0.616, "t": "Linearity of expectation", "d": "For any r.v.s X, Y and any constant c,  $$E(X + Y) = E(X) + E(Y),$$    $$E(cX) = cE(X).$$", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -113.85, "y": 63.58, "z": -152.14, "jx": 0.0, "jy": 11622.0, "ch": "Linearity of expectation"}, {"id": "location-scale-transformation", "c": 1, "imp": 0.0, "h": 0.925, "t": "Location-scale transformation", "d": "Let X be a random variable and  $Y = \\sigma X + \\mu$ , where  $\\sigma$  and  $\\mu$  are constants with  $\\sigma > 0$ . Then we say that Y has been obtained as a *location-scale transformation* of X. Here  $\\mu$  controls\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -53.75, "y": 174.49, "z": -328.29, "jx": -75.0, "jy": 7101.0, "ch": "Uniform"}, {"id": "lotp-with-extra-conditioning", "c": 1, "imp": 0.0, "h": 0.113, "t": "LOTP with extra conditioning", "d": "Let A1, . . . , A<sup>n</sup> be a partition of S. Provided that P(A<sup>i</sup> \u2229 E) > 0 for all i, we have  $$P(B|E) = \\sum_{i=1}^{n} P(B|A_i, E)P(A_i|E).$$", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 396.4, "y": 93.38, "z": -227.9, "jx": 75.0, "jy": 0.0, "ch": "Conditional probabilities are probabilities"}, {"id": "lotus", "c": 1, "imp": 0.0217, "h": 0.76, "t": "LOTUS", "d": "If X is a discrete r.v. and g is a function from  $\\mathbb{R}$  to  $\\mathbb{R}$ , then  $$E(g(X)) = \\sum_{x} g(x)P(X = x),$$", "pc": 3, "nw": 3, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -33.92, "y": 129.49, "z": -246.91, "jx": 0.0, "jy": 6808.0, "ch": "Law of the unconscious statistician (LOTUS)"}, {"id": "lotus-continuous", "c": 1, "imp": 0.0, "h": 0.927, "t": "LOTUS, continuous", "d": "If X is a continuous r.v. with PDF f and g is a function from  $\\mathbb{R}$  to  $\\mathbb{R}$ , then  $$E(g(X)) = \\int_{-\\infty}^{\\infty} g(x)f(x)dx.$$", "pc": 1, "nw": 1, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 0.09, "y": 91.62, "z": -266.54, "jx": 0.0, "jy": 9978.0, "ch": "Probability density functions"}, {"id": "marginal-pdf", "c": 1, "imp": 0.0131, "h": 0.685, "t": "Marginal PDF", "d": "For continuous r.v.s X and Y with joint PDF fX,Y , the marginal PDF of X is  $$f_X(x) = \\int_{-\\infty}^{\\infty} f_{X,Y}(x,y)dy.$$", "pc": 2, "nw": 2, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 6.93, "y": 161.54, "z": -321.26, "jx": 225.0, "jy": 15496.0, "ch": "Independence of r.v.s"}, {"id": "marginal-pmf", "c": 1, "imp": 0.0352, "h": 0.684, "t": "Marginal PMF", "d": "For discrete r.v.s X and Y, the marginal PMF of X is  $$P(X = x) = \\sum_{y} P(X = x, Y = y).$$", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -106.7, "y": 167.08, "z": -225.16, "jx": 375.0, "jy": 15614.0, "ch": "Independence of r.v.s"}, {"id": "markov", "c": 1, "imp": 0.1629, "h": 0.197, "t": "Markov", "d": "For any r.v. X and constant a > 0,  $$P(|X| \\ge a) \\le \\frac{E|X|}{a}.$$", "pc": 0, "nw": 0, "nm": 0, "hp": 1, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -0.78, "y": 268.96, "z": -98.75, "jx": 75.0, "jy": 1526.0, "ch": "Inequalities"}, {"id": "markov-chain", "c": 1, "imp": 0.1451, "h": 0.187, "t": "Markov chain", "d": "A sequence of random variables X0, X1, X2, . . . taking values in the state space {1, 2, . . . , M} is called a Markov chain if for all n \u2265 0,  $$P(X_{n+1} = j | X_n = i, X_{n-1} = i_{n-1}, \\dots, X_0 = i_0) = P(X_{n+1} \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 14.59, "y": 317.26, "z": -75.92, "jx": 0.0, "jy": 2523.0, "ch": "Markov property and transition matrix"}, {"id": "mean-and-variance-of-sample-mean", "c": 1, "imp": 0.0, "h": 0.889, "t": "Mean and variance of sample mean", "d": "Let  $X_1, \\ldots, X_n$  be i.i.d. r.v.s with mean  $\\mu$  and variance  $\\sigma^2$ . Then the sample mean  $\\bar{X}_n$  is unbiased for estimating  $\\mu$ . That is,  $$E(\\bar{X}_n) = \\mu.$$", "pc": 0, "nw": 0, "nm": 0, "hp": 1, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 5.7, "y": 106.22, "z": -151.17, "jx": -75.0, "jy": 17433.0, "ch": "Sample moments"}, {"id": "median", "c": 1, "imp": 0.0612, "h": 0.128, "t": "Median", "d": "We say that c is a median of a random variable X if P(X \u2264 c) \u2265 1/2 and P(X \u2265 c) \u2265 1/2. (The simplest way this can happen is if the CDF of X hits 1/2 exactly at c, but we know that some CDFs have jumps.)", "pc": 1, "nw": 0, "nm": 1, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 25.47, "y": 100.85, "z": -183.28, "jx": 0.0, "jy": 10271.0, "ch": "Summaries of a distribution"}, {"id": "memoryless-property", "c": 1, "imp": 0.0, "h": 0.19, "t": "Memoryless property", "d": "A continuous distribution is said to have the memoryless property if a random variable X from that distribution satisfies  $$P(X \\ge s + t | X \\ge s) = P(X \\ge t)$$", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -61.87, "y": 204.82, "z": -332.94, "jx": 75.0, "jy": 6104.0, "ch": "Exponential"}, {"id": "mgf-determines-the-distribution", "c": 1, "imp": 0.0082, "h": 0.0, "t": "MGF determines the distribution", "d": "The MGF of a random variable determines its distribution: if two r.v.s have the same MGF, they must have the same distribution. In fact, if there is even a tiny interval (\u2212a, a) containing 0 on which the MGFs are equal, \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 63.37, "y": 215.95, "z": -146.66, "jx": -75.0, "jy": 16554.0, "ch": "Moment generating functions"}, {"id": "mgf-of-a-sum-of-independent-rvs", "c": 1, "imp": 0.0, "h": 0.696, "t": "MGF of a sum of independent r.v.s", "d": "If X and Y are independent, then the MGF of X + Y is the product of the individual MGFs:  $$M_{X+Y}(t) = M_X(t)M_Y(t).$$", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -14.64, "y": 256.87, "z": -189.74, "jx": 75.0, "jy": 16554.0, "ch": "Moment generating functions"}, {"id": "mode", "c": 1, "imp": 0.0, "h": 0.578, "t": "Mode", "d": "For a discrete r.v. X, we say that c is a mode of X if it maximizes the PMF: P(X = c) \u2265 P(X = x) for all x. For a continuous r.v. X with PDF f, we say that c is a mode if it maximizes the PDF: f(c) \u2265 f(x) for all x.", "pc": 1, "nw": 0, "nm": 1, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 25.63, "y": 80.95, "z": -244.35, "jx": 0.0, "jy": 10389.0, "ch": "Summaries of a distribution"}, {"id": "moment-generating-function", "c": 1, "imp": 0.0475, "h": 0.752, "t": "Moment generating function", "d": "The moment generating function (MGF) of an r.v. X is  $M(t) = E(e^{tX})$ , as a function of t, if this is finite on some open interval (-a, a) containing 0. Otherwise we say the MGF of X does not exist.", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 8.32, "y": 209.65, "z": -159.87, "jx": -75.0, "jy": 16436.0, "ch": "Moment generating functions"}, {"id": "moments-via-derivatives-of-the-mgf", "c": 1, "imp": 0.0, "h": 0.606, "t": "Moments via derivatives of the MGF", "d": "Given the MGF of X, we can get the nth moment of X by evaluating the nth derivative of the MGF at 0: E(X<sup>n</sup> ) = M(n) (0).", "pc": 4, "nw": 0, "nm": 4, "hp": 1, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 75.84, "y": 243.68, "z": -190.84, "jx": 75.0, "jy": 16436.0, "ch": "Moment generating functions"}, {"id": "multinomial-conditioning", "c": 1, "imp": 0.0, "h": 0.731, "t": "Multinomial conditioning", "d": "If  $\\mathbf{X} \\sim \\text{Mult}_k(n, \\mathbf{p})$ , then  $$(X_2,\\ldots,X_k)|X_1=n_1\\sim \\text{Mult}_{k-1}(n-n_1,(p_2',\\ldots,p_k')),$$", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -220.55, "y": 216.82, "z": -182.3, "jx": -75.0, "jy": 18841.0, "ch": "Multinomial"}, {"id": "multinomial-joint-pmf", "c": 1, "imp": 0.0326, "h": 0.673, "t": "Multinomial joint PMF", "d": "If  $\\mathbf{X} \\sim \\mathrm{Mult}_k(n, \\mathbf{p})$ , then the joint PMF of  $\\mathbf{X}$  is  $$P(X_1 = n_1, \\dots, X_k = n_k) = \\frac{n!}{n_1! n_2! \\dots n_k!} \\cdot p_1^{n_1} p_2^{n_2} \\dots p_k^{n_k},$$", "pc": 0, "nw": 0, "nm": 0, "hp": 1, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -182.6, "y": 197.55, "z": -187.3, "jx": 0.0, "jy": 18723.0, "ch": "Multinomial"}, {"id": "multinomial-lumping", "c": 1, "imp": 0.0, "h": 0.774, "t": "Multinomial lumping", "d": "If  $\\mathbf{X} \\sim \\mathrm{Mult}_k(n, \\mathbf{p})$ , then for any distinct i and j,  $X_i + X_j \\sim \\mathrm{Bin}(n, p_i + p_j)$ . The random vector of counts obtained from merging categories i and j is still Multinomi\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -228.97, "y": 192.83, "z": -190.0, "jx": 75.0, "jy": 18841.0, "ch": "Multinomial"}, {"id": "multinomial-marginals", "c": 1, "imp": 0.0, "h": 0.434, "t": "Multinomial marginals", "d": "The marginals of a Multinomial are Binomial. Specifically, if  $\\mathbf{X} \\sim \\mathrm{Mult}_k(n, \\mathbf{p})$ , then  $X_j \\sim \\mathrm{Bin}(n, p_j)$ .", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -165.01, "y": 120.43, "z": -240.56, "jx": 150.0, "jy": 18723.0, "ch": "Multinomial"}, {"id": "multiplication-rule", "c": 1, "imp": 0.1988, "h": 0.09, "t": "Multiplication rule", "d": "Consider a compound experiment consisting of two sub-experiments, Experiment A and Experiment B. Suppose that Experiment A has a possible outcomes, and for each of those outcomes Experiment B has b possible outcomes. The\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 4.0, "b": 1.0, "hr": 0.936, "x": -194.01, "y": 135.56, "z": -318.46, "jx": 0.0, "jy": 879.0, "ch": "Counting"}, {"id": "multivariate-normal-distribution", "c": 1, "imp": 0.0, "h": 0.659, "t": "Multivariate Normal distribution", "d": "A k-dimensional random vector X = (X1, . . . , Xk) is said to have a Multivariate Normal (MVN) distribution if every linear combination of the X<sup>j</sup> has a Normal distribution. That is, we require  $$t_1X_1 + \\dot\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 133.99, "y": 137.57, "z": -278.19, "jx": 75.0, "jy": 16847.0, "ch": "Multivariate Normal"}, {"id": "n-step-transition-probability", "c": 1, "imp": 0.0, "h": 0.189, "t": "n-step transition probability", "d": "The n-step transition probability from i to j is the probability of being at j exactly n steps after being at i. We denote this by q (n) ij :  $$q_{ij}^{(n)} = P(X_n = j | X_0 = i).$$", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 43.53, "y": 321.79, "z": -50.97, "jx": 75.0, "jy": 2641.0, "ch": "Markov property and transition matrix"}, {"id": "naive-definition-of-probability", "c": 1, "imp": 0.419, "h": 0.088, "t": "Naive definition of probability", "d": "Let A be an event for an experiment with a finite sample space S. The naive probability of A is  $$P_{\\text{naive}}(A) = \\frac{|A|}{|S|} = \\frac{\\text{number of outcomes favorable to } A}{\\text{total number of outcomes i\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 3.0, "b": 1.0, "hr": 0.84, "x": -132.32, "y": 166.1, "z": -378.93, "jx": 0.0, "jy": 1937.0, "ch": "Naive definition of probability"}, {"id": "negative-binomial-pmf", "c": 1, "imp": 0.0163, "h": 0.723, "t": "Negative Binomial PMF", "d": "If X \u223c NBin(r, p), then the PMF of X is  $$P(X = n) = \\binom{n+r-1}{r-1} p^r q^n$$", "pc": 0, "nw": 0, "nm": 0, "hp": 1, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -63.57, "y": 11.73, "z": -227.61, "jx": 75.0, "jy": 12737.0, "ch": "Geometric and Negative Binomial"}, {"id": "normal-cdf-and-pdf", "c": 1, "imp": 0.0, "h": 0.665, "t": "Normal CDF and PDF", "d": "Let  $X \\sim \\mathcal{N}(\\mu, \\sigma^2)$ . Then the CDF of X is  $$F(x) = \\Phi\\left(\\frac{x-\\mu}{\\sigma}\\right),\\,$$", "pc": 0, "nw": 0, "nm": 0, "hp": 1, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 60.62, "y": 94.35, "z": -332.22, "jx": 0.0, "jy": 9567.0, "ch": "Normal"}, {"id": "normal-distribution", "c": 1, "imp": 0.0526, "h": 0.809, "t": "Normal distribution", "d": "If  $Z \\sim \\mathcal{N}(0,1)$ , then  $$X = \\mu + \\sigma Z$$", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 99.24, "y": 122.7, "z": -285.84, "jx": 0.0, "jy": 9331.0, "ch": "Normal"}, {"id": "odds", "c": 1, "imp": 0.0082, "h": 0.139, "t": "Odds", "d": "The odds of an event A are  $$odds(A) = P(A)/P(A^c).$$", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -162.27, "y": 196.06, "z": -360.71, "jx": 0.0, "jy": 5575.0, "ch": "Bayes' rule and the law of total probability"}, {"id": "odds-form-of-bayes-rule", "c": 1, "imp": 0.0, "h": 0.756, "t": "Odds form of Bayes' rule", "d": "For any events A and B with positive probabilities, the odds of A after conditioning on B are  $$\\frac{P(A|B)}{P(A^c|B)} = \\frac{P(B|A)}{P(B|A^c)} \\frac{P(A)}{P(A^c)}.$$", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -185.58, "y": 223.22, "z": -365.78, "jx": 0.0, "jy": 5811.0, "ch": "Bayes' rule and the law of total probability"}, {"id": "order-statistics", "c": 1, "imp": 0.0232, "h": 0.737, "t": "Order statistics", "d": "For r.v.s  $X_1, X_2, \\ldots, X_n$ , the *order statistics* are the random variables  $X_{(1)}, X_{(2)}, \\ldots, X_{(n)}$ , where  $$X_{(1)} = \\min(X_1, \\dots, X_n),$$  $X_{(2)}$  is the second-smallest of  $X_1, \\dots, \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -37.07, "y": 153.23, "z": -352.63, "jx": 0.0, "jy": 14263.0, "ch": "Order statistics"}, {"id": "partnerships", "c": 1, "imp": 0.0, "h": 0.072, "t": "Partnerships", "d": "Let's use a story proof to show that  $$\\frac{(2n)!}{2^n \\cdot n!} = (2n-1)(2n-3)\\cdots 3\\cdot 1.$$", "pc": 0, "nw": 0, "nm": 0, "hp": 1, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 308.96, "y": -328.79, "z": 230.18, "jx": -75.0, "jy": 586.0, "ch": "Story proofs"}, {"id": "pdf-of-order-statistic", "c": 1, "imp": 0.0, "h": 0.603, "t": "PDF of order statistic", "d": "Let  $X_1, \\ldots, X_n$  be i.i.d. continuous r.v.s with CDF F and PDF f. Then the marginal PDF of the jth order statistic  $X_{(j)}$  is  $$f_{X_{(j)}}(x) = n \\binom{n-1}{j-1} f(x) F(x)^{j-1} (1 - F(x))^{n-j}.$$", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 10.73, "y": 180.23, "z": -373.34, "jx": 0.0, "jy": 14499.0, "ch": "Order statistics"}, {"id": "period-of-a-state-periodic-and-aperiodic-chain", "c": 1, "imp": 0.0, "h": 0.111, "t": "Period of a state, periodic and aperiodic chain", "d": "The *period* of a state i in a Markov chain is the greatest common divisor (gcd) of the possible numbers of steps it can take to return to i when starting at i. That is, the period of i is the greatest common divisor of \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 46.97, "y": 338.2, "z": -74.26, "jx": 0.0, "jy": 2230.0, "ch": "Classification of states"}, {"id": "poisson-approximation-to-binomial", "c": 1, "imp": 0.0, "h": 0.647, "t": "Poisson approximation to Binomial", "d": "If  $X \\sim \\text{Bin}(n, p)$  and we let  $n \\to \\infty$  and  $p \\to 0$  such that  $\\lambda = np$  remains fixed, then the PMF of X converges to the Pois( $\\lambda$ ) PMF. More generally, the same conclusion holds if \u2026", "pc": 1, "nw": 1, "nm": 0, "hp": 1, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -29.07, "y": 30.16, "z": -210.38, "jx": -150.0, "jy": 15085.0, "ch": "Connections between Poisson and Binomial"}, {"id": "poisson-distribution", "c": 1, "imp": 0.0979, "h": 0.769, "t": "Poisson distribution", "d": "An r.v. X has the *Poisson distribution* with parameter  $\\lambda$ , where  $\\lambda > 0$ , if the PMF of X is  $$P(X = k) = \\frac{e^{-\\lambda} \\lambda^k}{k!}, \\quad k = 0, 1, 2, \\dots$$", "pc": 5, "nw": 5, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -19.49, "y": 85.17, "z": -192.77, "jx": 0.0, "jy": 11915.0, "ch": "Poisson"}, {"id": "poisson-given-a-sum-of-poissons", "c": 1, "imp": 0.0, "h": 0.794, "t": "Poisson given a sum of Poissons", "d": "If  $X \\sim \\text{Pois}(\\lambda_1)$ ,  $Y \\sim \\text{Pois}(\\lambda_2)$ , and X is independent of Y, then the conditional distribution of X given X + Y = n is Bin  $(n, \\lambda_1/(\\lambda_1 + \\lambda_2))$ .", "pc": 0, "nw": 0, "nm": 0, "hp": 1, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -39.93, "y": 32.9, "z": -194.58, "jx": 0.0, "jy": 15085.0, "ch": "Connections between Poisson and Binomial"}, {"id": "poisson-process", "c": 1, "imp": 0.1245, "h": 0.81, "t": "Poisson process", "d": "A process of arrivals in continuous time is called a *Poisson process* with rate  $\\lambda$  if the following two conditions hold:  - 1. The number of arrivals that occur in an interval of length t is a Pois( $\\lambda t$\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 44.59, "y": 51.36, "z": -216.25, "jx": 0.0, "jy": 14792.0, "ch": "Poisson processes"}, {"id": "probability-density-function", "c": 1, "imp": 0.1308, "h": 0.834, "t": "Probability density function", "d": "For a continuous r.v. X with CDF F, the probability density function (PDF) of X is the derivative f of the CDF, given by f(x) = F 0 (x). The support of X, and of its distribution, is the set of all x where f(x) > 0.", "pc": 3, "nw": 3, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 0.89, "y": 95.24, "z": -302.21, "jx": 150.0, "jy": 9978.0, "ch": "Probability density functions"}, {"id": "probability-generating-function", "c": 1, "imp": 0.0, "h": 0.769, "t": "Probability generating function", "d": "The probability generating function (PGF) of a nonnegative integer-valued r.v. X with PMF  $p_k = P(X = k)$  is the generating function of the PMF. By LOTUS, this is  $$E(t^X) = \\sum_{k=0}^{\\infty} p_k t^k.$$", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -5.77, "y": 166.3, "z": -192.84, "jx": 0.0, "jy": 17844.0, "ch": "\\*Probability generating functions"}, {"id": "probability-mass-function", "c": 1, "imp": 0.4798, "h": 0.12, "t": "Probability mass function", "d": "The probability mass function (PMF) of a discrete r.v. X is the function  $p_X$  given by  $p_X(x) = P(X = x)$ . Note that this is positive if x is in the support of X, and 0 otherwise.", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -79.37, "y": 108.57, "z": -252.92, "jx": 0.0, "jy": 5164.0, "ch": "Distributions and probability mass functions"}, {"id": "probability-of-the-intersection-of-n-events", "c": 1, "imp": 0.0, "h": 0.647, "t": "Probability of the intersection of n events", "d": "For any events A1, . . . , A<sup>n</sup> with P(A1, A2, . . . , An\u22121) > 0,  $$P(A_1, A_2, \\dots, A_n) = P(A_1)P(A_2|A_1)P(A_3|A_1, A_2)\\cdots P(A_n|A_1, \\dots, A_{n-1}),$$", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -205.39, "y": 235.98, "z": -305.13, "jx": 75.0, "jy": 5693.0, "ch": "Bayes' rule and the law of total probability"}, {"id": "probability-of-the-intersection-of-two-events", "c": 1, "imp": 0.2563, "h": 0.127, "t": "Probability of the intersection of two events", "d": "For any events A and B with positive probabilities,  $$P(A \\cap B) = P(B)P(A|B) = P(A)P(B|A).$$", "pc": 1, "nw": 0, "nm": 1, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -166.58, "y": 215.39, "z": -303.49, "jx": 150.0, "jy": 5575.0, "ch": "Bayes' rule and the law of total probability"}, {"id": "probability-of-type-1-event-before-type-2-event", "c": 1, "imp": 0.0, "h": 0.0, "t": "Probability of type-1 event before type-2 event", "d": "Consider two independent Poisson processes: a Poisson process of type-1 arrivals, with rate  $\\lambda_1$ , and a Poisson process of type-2 arrivals, with rate  $\\lambda_2$ . In the superposition of these two processes, t\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 1, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 99.52, "y": 31.37, "z": -172.36, "jx": -150.0, "jy": 21364.0, "ch": "Conditioning, superposition, and thinning"}, {"id": "projection-of-superposition-into-discrete-time", "c": 1, "imp": 0.0, "h": 0.0, "t": "Projection of superposition into discrete time", "d": "Consider the superposition (N(t) : t > 0) of two independent Poisson processes with rates \u03bb<sup>1</sup> and \u03bb2. For j = 1, 2, . . . , let I<sup>j</sup> be the indicator of the jth event being from the Poisson process wit\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 80.66, "y": 18.51, "z": -172.69, "jx": 0.0, "jy": 21364.0, "ch": "Conditioning, superposition, and thinning"}, {"id": "properties-of-probability", "c": 1, "imp": 0.1754, "h": 0.086, "t": "Properties of probability", "d": "Probability has the following properties, for any events A and B.  - 1.  $P(A^c) = 1 P(A)$ . - 2. If  $A \\subseteq B$ , then  $P(A) \\leq P(B)$ . - 3.  $P(A \\cup B) = P(A) + P(B) P(A \\cap B)$ .", "pc": 2, "nw": 2, "nm": 0, "hp": 1, "a": 3.0, "b": 1.0, "hr": 0.84, "x": -155.96, "y": 142.3, "z": -273.92, "jx": 0.0, "jy": 3052.0, "ch": "Axioms of probability"}, {"id": "random-scan-gibbs-as-metropolis-hastings", "c": 1, "imp": 0.0, "h": 0.0, "t": "Random scan Gibbs as Metropolis-Hastings", "d": "The random scan Gibbs sampler is a special case of the Metropolis-Hastings algorithm, in which the proposal is *always* accepted. In particular, it follows that the stationary distribution of the random scan Gibbs sample\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 1, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -100.02, "y": 223.64, "z": -190.87, "jx": 0.0, "jy": 18430.0, "ch": "Gibbs sampling"}, {"id": "random-variable", "c": 1, "imp": 0.8961, "h": 0.198, "t": "Random variable", "d": "Given an experiment with sample space S, a random variable (r.v.) is a function from the sample space S to the real numbers R. It is common, but not required, to denote random variables by capital letters.", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -58.8, "y": 172.01, "z": -286.53, "jx": 0.0, "jy": 3463.0, "ch": "Random variables"}, {"id": "recurrent-and-transient-states", "c": 1, "imp": 0.0, "h": 0.166, "t": "Recurrent and transient states", "d": "State i of a Markov chain is recurrent if starting from i, the probability is 1 that the chain will eventually return to i. Otherwise, the state is transient, which means that if the chain starts from i, there is a posit\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 19.76, "y": 330.78, "z": -44.6, "jx": 150.0, "jy": 2230.0, "ch": "Classification of states"}, {"id": "reversibility", "c": 1, "imp": 0.0, "h": 0.06, "t": "Reversibility", "d": "Let Q = (qij ) be the transition matrix of a Markov chain. Suppose there is s = (s1, . . . , sM) with s<sup>i</sup> \u2265 0, P i s<sup>i</sup> = 1, such that  $$s_i q_{ij} = s_j q_{ji}$$", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -3.17, "y": 355.8, "z": -121.79, "jx": 0.0, "jy": 3756.0, "ch": "Reversibility"}, {"id": "sample-moments", "c": 1, "imp": 0.0556, "h": 0.726, "t": "Sample moments", "d": "Let X1, . . . , X<sup>n</sup> be i.i.d. random variables. The kth sample moment is the r.v.  $$M_k = \\frac{1}{n} \\sum_{j=1}^n X_j^k.$$", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 44.45, "y": 199.31, "z": -189.2, "jx": 75.0, "jy": 17433.0, "ch": "Sample moments"}, {"id": "sample-space-and-event", "c": 1, "imp": 0.7914, "h": 0.108, "t": "Sample space and event", "d": "The sample space S of an experiment is the set of all possible outcomes of the experiment. An event A is a subset of the sample space S, and we say that A occurred if the actual outcome is in A.", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 3.0, "b": 1.0, "hr": 0.84, "x": -144.63, "y": 150.61, "z": -372.99, "jx": 0.0, "jy": 293.0, "ch": "Sample spaces and events"}, {"id": "sample-variance-and-sample-standard-deviation", "c": 1, "imp": 0.0, "h": 0.844, "t": "Sample variance and sample standard deviation", "d": "Let  $X_1, \\ldots, X_n$  be i.i.d. random variables. The *sample variance* is the r.v.  $$S_n^2 = \\frac{1}{n-1} \\sum_{j=1}^n (X_j - \\bar{X}_n)^2.$$", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 2.39, "y": 202.0, "z": -240.8, "jx": -75.0, "jy": 17551.0, "ch": "Sample moments"}, {"id": "sampling-with-replacement", "c": 1, "imp": 0.0041, "h": 0.084, "t": "Sampling with replacement", "d": "Consider n objects and making k choices from them, one at a time with replacement (i.e., choosing a certain object does not preclude it from being chosen again). Then there are n <sup>k</sup> possible outcomes (where ord\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 3.0, "b": 1.0, "hr": 0.84, "x": -202.19, "y": 92.8, "z": -337.01, "jx": -75.0, "jy": 997.0, "ch": "Counting"}, {"id": "sampling-without-replacement", "c": 1, "imp": 0.0537, "h": 0.161, "t": "Sampling without replacement", "d": "Consider n objects and making k choices from them, one at a time without replacement (i.e., choosing a certain object precludes it from being chosen again). Then there are  $n(n-1)\\cdots(n-k+1)$  possible outcomes for  $\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 4.0, "b": 1.0, "hr": 0.936, "x": -193.3, "y": 75.99, "z": -304.07, "jx": 75.0, "jy": 997.0, "ch": "Counting"}, {"id": "shannon", "c": 1, "imp": 0.0, "h": 0.685, "t": "Shannon", "d": "Consider a channel where each transmitted bit gets flipped with probability p, independently. Let  $0 and <math>\\epsilon > 0$ . There exists a code with rate at least  $1 - H(p) - \\epsilon$  that can be decoded with prob\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 1, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -175.67, "y": 55.59, "z": -330.48, "jx": 0.0, "jy": 10918.0, "ch": "\\\\*Using probability and expectation to prove existence"}, {"id": "skewness", "c": 1, "imp": 0.0294, "h": 0.82, "t": "Skewness", "d": "The *skewness* of an r.v. X with mean  $\\mu$  and variance  $\\sigma^2$  is the third standardized moment of X:  $$Skew(X) = E\\left(\\frac{X - \\mu}{\\sigma}\\right)^3.$$", "pc": 2, "nw": 2, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 29.97, "y": 140.66, "z": -155.51, "jx": 75.0, "jy": 13852.0, "ch": "Interpreting moments"}, {"id": "standard-normal-distribution", "c": 1, "imp": 0.0306, "h": 0.89, "t": "Standard Normal distribution", "d": "A continuous r.v. Z is said to have the *standard Normal distribution* if its PDF  $\\varphi$  is given by  $$\\varphi(z) = \\frac{1}{\\sqrt{2\\pi}} e^{-z^2/2}, \\quad -\\infty < z < \\infty.$$", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 116.53, "y": 141.45, "z": -248.55, "jx": 75.0, "jy": 9449.0, "ch": "Normal"}, {"id": "stationary-distribution", "c": 1, "imp": 0.053, "h": 0.128, "t": "Stationary distribution", "d": "A row vector  $\\mathbf{s} = (s_1, \\dots, s_M)$  such that  $s_i \\geq 0$  and  $\\sum_i s_i = 1$  is a stationary distribution for a Markov chain with transition matrix Q if  $$\\sum_{i} s_i q_{ij} = s_j$$", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -77.02, "y": 298.5, "z": -146.51, "jx": 0.0, "jy": 4342.0, "ch": "Stationary distribution"}, {"id": "strong-law-of-large-numbers", "c": 1, "imp": 0.0136, "h": 0.847, "t": "Strong law of large numbers", "d": "The sample mean  $\\bar{X}_n$  converges to the true mean  $\\mu$  pointwise, with probability 1. Recalling that r.v.s are functions from the sample space S to  $\\mathbb{R}$ , this form of convergence says that  $\\bar{X}_n\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 102.44, "y": 209.48, "z": -191.33, "jx": -75.0, "jy": 16143.0, "ch": "Law of large numbers"}, {"id": "student-t-distribution", "c": 1, "imp": 0.0054, "h": 0.61, "t": "Student-*t* distribution", "d": "Let  $$T = \\frac{Z}{\\sqrt{V/n}},$$", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 147.86, "y": 193.58, "z": -231.46, "jx": 0.0, "jy": 20131.0, "ch": "Chi-Square and Student-t"}, {"id": "student-t-properties", "c": 1, "imp": 0.0, "h": 0.703, "t": "Student-t properties", "d": "The Student-t distribution  $t_n$  has the following properties.  - 1. Symmetry: If  $T \\sim t_n$ , then  $-T \\sim t_n$  as well. - 2. Cauchy as special case: The  $t_1$  distribution is the same as the Cauchy distributi\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 1, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 130.56, "y": 182.87, "z": -220.03, "jx": 0.0, "jy": 20249.0, "ch": "Chi-Square and Student-t"}, {"id": "sum-of-independent-poissons", "c": 1, "imp": 0.029, "h": 0.471, "t": "Sum of independent Poissons", "d": "If X \u223c Pois(\u03bb1), Y \u223c Pois(\u03bb2), and X is independent of Y , then X + Y \u223c Pois(\u03bb<sup>1</sup> + \u03bb2).", "pc": 0, "nw": 0, "nm": 0, "hp": 1, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 35.24, "y": 116.98, "z": -206.55, "jx": 150.0, "jy": 15085.0, "ch": "Connections between Poisson and Binomial"}, {"id": "superposition", "c": 1, "imp": 0.0396, "h": 0.422, "t": "Superposition", "d": "Let  $(N_1(t):t>0)$  and  $(N_2(t):t>0)$  be independent Poisson processes with rates  $\\lambda_1$  and  $\\lambda_2$ , respectively. Then the combined process  $N(t) = N_1(t) + N_2(t)$  is a Poisson process with rate  $\\\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 1, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 75.48, "y": 47.5, "z": -195.33, "jx": 300.0, "jy": 21246.0, "ch": "Conditioning, superposition, and thinning"}, {"id": "symmetry-of-an-rv", "c": 1, "imp": 0.0116, "h": 0.784, "t": "Symmetry of an r.v.", "d": "We say that an r.v. X has a *symmetric distribution about*  $\\mu$  if  $X - \\mu$  has the same distribution as  $\\mu - X$ . We also say that X is symmetric or that the distribution of X is symmetric; these all have the s\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 65.37, "y": 176.52, "z": -135.7, "jx": 0.0, "jy": 13970.0, "ch": "Interpreting moments"}, {"id": "taking-out-whats-known", "c": 1, "imp": 0.0082, "h": 0.194, "t": "Taking out what's known", "d": "For any function h,  $$E(h(X)Y|X) = h(X)E(Y|X).$$", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -288.36, "y": 130.49, "z": -181.89, "jx": 225.0, "jy": 22186.0, "ch": "Properties of conditional expectation"}, {"id": "the-team-captain", "c": 1, "imp": 0.0, "h": 0.113, "t": "The team captain", "d": "For any positive integers n and k with  $k \\leq n$ ,  $$n\\binom{n-1}{k-1} = k\\binom{n}{k}.$$", "pc": 0, "nw": 0, "nm": 0, "hp": 1, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 124.7, "y": 374.94, "z": -168.27, "jx": 75.0, "jy": 586.0, "ch": "Story proofs"}, {"id": "thinning", "c": 1, "imp": 0.0082, "h": 0.769, "t": "Thinning", "d": "Let (N(t):t>0) be a Poisson process with rate  $\\lambda$ , and classify each arrival as a type-1 event with probability p and a type-2 event with probability 1-p, where these classifications are independent of each other\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 1, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 115.26, "y": 22.03, "z": -187.06, "jx": 150.0, "jy": 21364.0, "ch": "Conditioning, superposition, and thinning"}, {"id": "transition-matrix", "c": 1, "imp": 0.094, "h": 0.107, "t": "Transition matrix", "d": "Let  $X_0, X_1, X_2,...$  be a Markov chain with state space  $\\{1, 2,..., M\\}$ , and let  $q_{ij} = P(X_{n+1} = j | X_n = i)$  be the transition probability from state i to state j. The  $M \\times M$  matrix  $Q = (q_{i\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -26.97, "y": 326.0, "z": -111.03, "jx": -75.0, "jy": 2641.0, "ch": "Markov property and transition matrix"}, {"id": "unbiasedness-of-sample-variance", "c": 1, "imp": 0.0, "h": 0.0, "t": "Unbiasedness of sample variance", "d": "Let  $X_1, \\ldots, X_n$  be i.i.d. r.v.s with mean  $\\mu$  and variance  $\\sigma^2$ . Then the sample variance  $S_n^2$  is unbiased for estimating  $\\sigma^2$ , i.e.,  $$E(S_n^2) = \\sigma^2.$$", "pc": 8, "nw": 8, "nm": 0, "hp": 1, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 40.07, "y": 181.57, "z": -161.98, "jx": 75.0, "jy": 17551.0, "ch": "Sample moments"}, {"id": "uniform-distribution", "c": 1, "imp": 0.0823, "h": 0.667, "t": "Uniform distribution", "d": "A continuous r.v. U is said to have the *Uniform distribution* on the interval (a, b) if its PDF is  $$f(x) = \\begin{cases} \\frac{1}{b-a} & \\text{if } a < x < b, \\\\ 0 & \\text{otherwise.} \\end{cases}$$", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 76.29, "y": 95.41, "z": -246.8, "jx": 75.0, "jy": 7101.0, "ch": "Uniform"}, {"id": "universality-of-the-uniform", "c": 1, "imp": 0.0163, "h": 0.772, "t": "Universality of the Uniform", "d": "Let F be a CDF which is a continuous function and strictly increasing on the support of the distribution. This ensures that the inverse function  $F^{-1}$  exists, as a function from (0,1) to  $\\mathbb{R}$ . We then have\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 1, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 65.33, "y": 64.31, "z": -315.07, "jx": 75.0, "jy": 19427.0, "ch": "Universality of the Uniform"}, {"id": "valid-cdfs", "c": 1, "imp": 0.0074, "h": 0.679, "t": "Valid CDFs", "d": "Any CDF F has the following properties.", "pc": 0, "nw": 0, "nm": 0, "hp": 1, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -95.58, "y": -3.65, "z": -223.0, "jx": 0.0, "jy": 8216.0, "ch": "Cumulative distribution functions"}, {"id": "valid-pdfs", "c": 1, "imp": 0.0, "h": 0.89, "t": "Valid PDFs", "d": "The PDF f of a continuous r.v. must satisfy the following two criteria:  - Nonnegative:  $f(x) \\ge 0$ ; - Integrates to 1:  $\\int_{-\\infty}^{\\infty} f(x)dx = 1$ .", "pc": 2, "nw": 2, "nm": 0, "hp": 1, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 89.51, "y": 36.95, "z": -343.91, "jx": 75.0, "jy": 9860.0, "ch": "Probability density functions"}, {"id": "valid-pmfs", "c": 1, "imp": 0.2249, "h": 0.728, "t": "Valid PMFs", "d": "Let X be a discrete r.v. with support  $x_1, x_2, \\ldots$  (assume these values are distinct and, for notational simplicity, that the support is countably infinite; the analogous results hold if the support is finite). T\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 1, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -89.23, "y": 50.62, "z": -226.49, "jx": 0.0, "jy": 5282.0, "ch": "Distributions and pr   if(sp.correct) sess.correct++;
  recolor(cs.map(o=>o.c)); refreshColors(); sess.idx++;
  if(sess.idx>=sess.cards.length) showSummary(); else showCard();
}
function recolor(ids){ ids.forEach(c=>{ const n=byId[c]; if(n) H[c]=heatOf(n); }); G.linkColor(G.linkColor()); }
function showSummary(){
  document.getElementById('prachtitle').textContent='Session complete'; document.getElementById('prachprog').textContent='';
  document.getElementById('pracbody').innerHTML='<div style="font-size:16px;margin:8px 0">You got <b>'+sess.correct+' / '+sess.cards.length+'</b> right on <b>'+sess.label+'</b>.</div><div style="color:#6a6a72;font-size:13px">The map just updated — these concepts and their links warmed up.</div>';
  document.getElementById('pracsol').style.display='none';
  const ctl=document.getElementById('pracctl'); ctl.innerHTML='<button class=bdone>Done</button>';
  ctl.firstChild.onclick=()=>{ document.getElementById('prac').classList.remove('open'); rotResume(); if(sess.node) openPanel(sess.node); };
}

// ---- recommendation / prereq-gated selector (JS) ----
function stable(n){ return comp(n)>=0.6 && (n.a+n.b-2)>=1; }               // mastered enough to unlock dependents
function eligible(n){ const ps=prereqs[n.id]||[]; for(const pid of ps){ const p=byId[pid]; if(p && !stable(p)) return false; } return true; }
function masteredC(n){ return comp(n)>=0.82 && (n.a+n.b-2)>=2; }
function recScore(n){ return n.imp*1.0 + (1-comp(n))*0.5 + (n.hr||0)*0.8; }  // importance + weakness + due-ness
function recommendations(k){ return DATA.nodes.filter(n=> (!focusSet||focusSet.has(n.id)) && retainScope(n) && eligible(n) && !masteredC(n)).sort((a,b)=>recScore(b)-recScore(a)).slice(0,k||10); }
let recSet=new Set();
function updateStates(){ recSet=new Set(recommendations(12).map(n=>n.id)); DATA.nodes.forEach(n=>{ n._locked=!eligible(n); n._rec=recSet.has(n.id); }); }
function refreshColors(){ updateStates(); try{ G.nodeColor(G.nodeColor()); G.linkColor(G.linkColor()); }catch(e){} updateHud(); updateActions(); jrefresh(); renderDash(); }
// ---- top-bar actions: stay on point ----
function studied(n){ return (n.a+n.b-2)>=1; }                          // has real evidence
function dueFlash(n){ return studied(n) && (n.hr||0)<0.5; }            // learned once, cooled -> refresh
function needsEval(n){ return (n.a+n.b-2)>=2 && (n.hr||0)<0.45; }      // thought-known but slipping
function actIds(a){
  const pool=DATA.nodes.filter(n=>(!focusSet||focusSet.has(n.id)) && retainScope(n));
  if(a==='flash'){ let d=pool.filter(dueFlash); if(!d.length) d=pool.filter(eligible);
    return d.sort((x,y)=>(x.hr||0)-(y.hr||0)).slice(0,14).map(n=>n.id); }
  if(a==='theory'){ return recommendations(10).map(n=>n.id); }          // frontier you're ready for
  if(a==='exam'){ return pool.filter(n=>n.nw>0 && eligible(n)).map(n=>n.id); }
  if(a==='eval'){ let d=pool.filter(needsEval); if(!d.length) d=pool.filter(studied).sort((x,y)=>comp(x)-comp(y));
    return d.slice(0,12).map(n=>n.id); }
  return [];
}
const ACT={flash:{m:'flashcard',l:'Flashcards due'}, exam:{m:'exam',l:'Exam simulation'}, theory:{m:'theory',l:'Theory development'}, eval:{m:'mix',l:'Re-evaluation'}};
function runAct(a){ const ids=actIds(a); if(!ids.length){ toast(a==='flash'?'No cards due — you\'re current':a==='eval'?'Nothing slipping right now':'Nothing available yet'); return; }
  if(CTRL){CTRL.autoRotate=false;clearTimeout(__rt);} startSession(ids, ACT[a].l, null, ACT[a].m); }
function setCnt(a,v,color){ const e=document.getElementById('cnt-'+a); if(!e)return; e.textContent=v; e.style.display=v>0?'inline-flex':'none'; if(color)e.style.background=color; }
function updateActions(){ const pool=DATA.nodes.filter(n=>(!focusSet||focusSet.has(n.id)) && retainScope(n));
  setCnt('flash', pool.filter(dueFlash).length, '#c0562f');
  setCnt('theory', recommendations(999).length, '#4a8c5c');
  setCnt('eval', pool.filter(needsEval).length, '#c99a2a'); }
document.querySelectorAll('#acts .act').forEach(b=>b.onclick=()=>runAct(b.dataset.a));
// stats HUD (bottom-right)
function hbar(l,v,c,note){ const p=Math.round(Math.max(0,Math.min(1,v))*100); return '<div class=hb><div class=hl><span>'+l+'</span><span>'+note+'</span></div><div class=hbar><i style="width:'+p+'%;background:'+c+'"></i></div></div>'; }
function updateHud(){ const scope=DATA.nodes.filter(n=>(!focusSet||focusSet.has(n.id)) && retainScope(n)); const tot=scope.length||1;
  let mast=0,heat=0,comps=0,ready=0; scope.forEach(n=>{ if(masteredC(n))mast++; heat+=(n.hr||0); comps+=comp(n); if(eligible(n)&&!masteredC(n))ready++; });
  const hud=document.getElementById('hud'); if(!hud)return;
  hud.innerHTML='<div class=htitle>'+(mode==='retain'?'Retained':focusSet?'This topic':'Overall')+'</div>'+
    hbar('Mastered', mast/tot, '#4a8c5c', Math.round(mast/tot*100)+'%')+
    hbar('Avg mastery', comps/tot, '#3a6ea5', Math.round(comps/tot*100)+'%')+
    hbar('Avg heat · due', heat/tot, '#e0842c', Math.round(heat/tot*100)+'%')+
    hbar('Ready to practice', ready/tot, '#b8892f', ''+ready); }
// learning path (prerequisite chain -> concept), topologically ordered
const _dm={};
function depthOf(x){ if(x in _dm) return _dm[x]; _dm[x]=0; let d=0; (prereqs[x]||[]).forEach(p=>{ d=Math.max(d, depthOf(p)+1); }); _dm[x]=d; return d; }
function ancestorsOf(id){ const seen=new Set(), st=[id]; while(st.length){ const x=st.pop(); (prereqs[x]||[]).forEach(p=>{ if(!seen.has(p)){ seen.add(p); st.push(p);} }); } return seen; }
function pathTo(id){ const set=ancestorsOf(id); set.add(id); return [...set].sort((a,b)=>depthOf(a)-depthOf(b)); }
function flyTo(n){ const p=byId[n.id]; if(!p)return; const cam=G.cameraPosition(); const D=Math.hypot(cam.x||0,cam.y||0,cam.z||1)||300; const L=Math.hypot(p.x,p.y,p.z)||1; const s=D/L*1.12; G.cameraPosition({x:p.x*s,y:p.y*s,z:p.z*s},{x:p.x,y:p.y,z:p.z},1000); }
document.getElementById('recbtn').onclick=()=>{ if(CTRL){CTRL.autoRotate=false;clearTimeout(__rt);} refreshColors(); const top=recommendations(1)[0]; if(!top){ toast('Nothing recommended right now'); return; } openPanel(top); flyTo(top); toast('Start here — a foundation you’re ready for'); };
// ---- sidebar: courses (books) -> topics -> targeted practice ----
function findTopic(t){ for(const c in TOPICS){ const f=TOPICS[c].find(x=>x.t===t); if(f)return f; } return null; }
function centroid(ids){ let x=0,y=0,z=0,k=0; ids.forEach(id=>{const n=byId[id]; if(n){x+=n.x;y+=n.y;z+=n.z;k++;}}); return k?{x:x/k,y:y/k,z:z/k}:null; }
function flyToPoint(p,mult){ if(!p)return; const cam=G.cameraPosition(); const D=Math.hypot(cam.x||0,cam.y||0,cam.z||1)||300; const L=Math.hypot(p.x,p.y,p.z)||1; const s=D/L*(mult||1.1); G.cameraPosition({x:p.x*s,y:p.y*s,z:p.z*s},{x:p.x,y:p.y,z:p.z},1000); }
function focusTopic(t){ focusSet=new Set(topicConcepts[t]||[]); if(CTRL){CTRL.autoRotate=false;clearTimeout(__rt);} refreshColors(); flyToPoint(centroid([...focusSet]),0.75); document.getElementById('clearfocus').style.display='block'; }
function clearFocus(){ focusSet=null; refreshColors(); document.getElementById('clearfocus').style.display='none'; try{G.zoomToFit(600,60);}catch(e){} }
function renderSidebar(){
  const sb=document.getElementById('sidebar'); let h='<div class=sbh>Courses</div>';
  Object.keys(COURSE).forEach(cid=>{ const tops=TOPICS[cid]||[]; const tot=tops.reduce((s,x)=>s+x.np,0);
    h+='<div class=chead data-c="'+cid+'"><span class=cjrn data-cj="'+cid+'" title="Start the course journey">▶</span><span class=cttl>'+COURSE[cid]+'</span><span class=cn>'+tot+'</span></div><div class=tlist id=tl'+cid+' style="display:none">';
    tops.forEach(x=>{ h+='<div class=trow data-t="'+x.t+'"><span class=tname>'+x.title+'</span><span class=tc>'+(x.np>0?('<b>'+x.np+'</b>/'+x.n+' <span class=tplay data-pt="'+x.t+'">▶</span>'):x.n)+'</span></div>'; });
    h+='</div>'; });
  h+='<div id=clearfocus>← show whole map</div>'; sb.innerHTML=h;
  sb.querySelectorAll('.chead').forEach(el=>el.onclick=(e)=>{ e.stopPropagation(); showRoadmap(el.dataset.c); });   // course = its Learn roadmap
  sb.querySelectorAll('.trow').forEach(el=>el.onclick=(e)=>{ if(e.target.classList.contains('tplay')){ e.stopPropagation(); practiceTopic(+e.target.dataset.pt); } else focusTopic(+el.dataset.t); });
  document.getElementById('clearfocus').onclick=clearFocus;
}
// ---- course journey: the acquisition roadmap (persisted units, sequential unlock) ----
let JC=null;
const LST={mastered:'#4a8c5c', cur:'#d9a441', locked:'#c6c6cc'};
const LIC={mastered:'✓', cur:'▶', locked:''};
function uCids(u){ return (u.cids||[]).filter(id=>byId[id]); }
function uMastered(u){ return window.UP[u.unit_id]==='mastered'; }
// authored learning module (Theory → Practice → Test) for a unit, if one exists on disk
function unitSlug(code){ return (code||'').toLowerCase().replace(/[^a-z0-9]+/g,'_'); }
function unitModule(u){ const s=unitSlug(u.code); return MODULES.has(s)?('module_'+s+'.html'):null; }
function openModule(u){ const url=unitModule(u); if(!url){ toast('No authored module for this unit yet'); return; }
  const f=document.getElementById('moduleframe');
  f.onload=()=>{ try{ const d=f.contentDocument;   // land on the Theory content, not the intro
    const t=[...d.querySelectorAll('button,[data-tab],.tab,.seg,nav *')].find(e=>/^theory$/i.test(e.textContent.trim()));
    if(t) t.click(); }catch(e){} };
  f.src=url;
  document.getElementById('mtitle').textContent=u.code+' · learning module';
  document.getElementById('module').classList.add('open'); }
function closeModule(){ document.getElementById('module').classList.remove('open'); document.getElementById('moduleframe').src='about:blank'; }
function renderPath(){ if(JC==null)return; const cid=JC; updateStates();
  const units=UNITS[cid]||[]; const jp=document.getElementById('jpath');
  if(!units.length){ jp.innerHTML='<div id=jempty style="display:block">No units persisted for this course yet.</div>';
    document.getElementById('jprogtxt').textContent=''; document.querySelector('#jprogbar>i').style.width='0%'; return; }
  let totC=0, doneC=0;
  units.forEach(u=>{ const n=uCids(u).length; totC+=n; if(uMastered(u))doneC+=n; });
  const totU=units.length, doneU=units.filter(uMastered).length, pct=totU?Math.round(doneU/totU*100):0;
  // roadmap header: course-level progress
  let html='<div class=rmhead><div class=big>'+doneU+' / '+totU+' units</div>'+
    '<div class=cap>'+esc(COURSE[cid])+' · '+doneC+' of '+totC+' concepts retained</div>'+
    '<div class=rmbar><i style="width:'+pct+'%"></i></div></div>';
  let prevMastered=true;   // unit N is actionable once unit N-1 is mastered (sequential unlock)
  units.forEach((u,i)=>{
    const done=uMastered(u);
    const st = done?'mastered' : (prevMastered?'cur':'locked');
    const ids=uCids(u); const off=Math.sin(i*0.9)*76;
    const secs=(u.sections||[]).join(', ');
    const statusTxt = st==='cur'?'in progress':done?'graduated':'locked';
    const sub=ids.length+' concept'+(ids.length===1?'':'s')+' · '+statusTxt;
    const hasMod=!!unitModule(u);
    let acts='';
    if(st==='cur') acts='<div class=acts2>'+(hasMod?'<button class=modl>Start unit</button>':'<button class=prac>Practice</button>')+'<button class=grad>Complete → graduate</button></div>';
    else if(done) acts='<div class=acts2>'+(hasMod?'<button class=modl>Open module</button>':'<button class=prac>Review</button>')+'</div>';
    else if(hasMod) acts='<div class=acts2><button class=modl>Open module</button></div>';   // locked, but the authored content is readable ahead
    html+='<div class="jl '+st+'">'+
      (i>0?'<div class=conn></div>':'')+
      '<div class=node data-ui="'+i+'" style="left:calc(50% + '+off.toFixed(0)+'px)">'+
        '<div class=dot style="background:'+LST[st]+'">'+LIC[st]+'</div>'+
        '<div class=lbl><div class=t>'+esc(u.code)+(u.title?' · '+esc(u.title):'')+(hasMod?'<span class=modtag>module</span>':'')+'</div>'+
          (secs?'<div class=sub2>'+esc(secs)+'</div>':'')+
          '<div class=s>'+sub+'</div>'+acts+'</div>'+
      '</div></div>';
    prevMastered=done;
  });
  jp.innerHTML=html;
  jp.querySelectorAll('.node').forEach(nd=>{ const u=units[+nd.dataset.ui];
    const mb=nd.querySelector('.modl'); if(mb) mb.onclick=(e)=>{ e.stopPropagation(); openModule(u); };
    const pb=nd.querySelector('.prac'); if(pb) pb.onclick=(e)=>{ e.stopPropagation(); startUnit(u); };
    const gb=nd.querySelector('.grad'); if(gb) gb.onclick=(e)=>{ e.stopPropagation(); graduateUnit(u); };
    nd.onclick=()=>{ if(unitModule(u)){ openModule(u); return; }   // authored module readable anytime
      if(nd.parentNode.classList.contains('locked')){ toast('Locked — finish the current unit first'); return; }
      startUnit(u); };
  });
  document.getElementById('jprogtxt').textContent=doneU+' / '+totU+' units';
  document.querySelector('#jprogbar>i').style.width=pct+'%';
}
function startUnit(u){ const ids=uCids(u);
  if(!ids.length){ toast('No concepts in this unit'); return; }
  startSession(ids, u.code, byId[ids[0]], 'mix', 'acquire'); }   // acquisition practice: competence only
// ---- graduation: mirror pipeline.modules.progress.graduate_unit in JS ----
async function graduateUnit(u){
  const ids=(u.cids||[]), now=new Date().toISOString();
  try{
    await SB.from('unit_progress').upsert({user_id:USER,unit_id:u.unit_id,status:'mastered',mastered_at:now,updated_at:now},{onConflict:'user_id,unit_id'});
    for(const cid of ids){   // seed fresh heat; preserve alpha/beta by omitting them from the upsert
      await SB.from('memory_state').upsert({user_id:USER,concept_id:cid,heat:1.0,last_reviewed:now,last_decayed:now},{onConflict:'user_id,concept_id'});
      const n=byId[cid]; if(n){ n.hr=1.0; H[cid]=heatOf(n); }
    }
    window.UP[u.unit_id]='mastered';
    await loadRetained();
    refreshColors();
    toast('Graduated '+u.code+' — '+ids.length+' concept'+(ids.length===1?'':'s')+' now in Retain');
  }catch(e){ console.warn('graduate failed',e); toast('Graduation failed — see console'); }
}
function openJourney(cid){ JC=+cid; learnCourse=+cid; if(CTRL){CTRL.autoRotate=false;clearTimeout(__rt);}
  document.getElementById('jtitle').textContent=COURSE[cid]+' · roadmap';
  document.getElementById('jback').style.display=(mode==='learn')?'none':'';   // no "back to map" in Learn
  document.getElementById('journey').classList.add('open');
  document.querySelectorAll('#sidebar .chead').forEach(el=>el.classList.toggle('active', +el.dataset.c===+cid));
  renderPath(); document.getElementById('jwrap').scrollTop=0; }
function closeJourney(){ document.getElementById('journey').classList.remove('open'); JC=null; rotResume(); }
function jrefresh(){ if(JC!=null) renderPath(); }   // recolor live after practice
document.getElementById('jback').onclick=closeJourney;
document.getElementById('mback').onclick=closeModule;
renderSidebar();
initModeUI();
learnCourse=firstCourseWithUnits();   // Dashboard is the default view; Learn/Retain are reachable from the top bar
// load per-user retention state (retained_concept view + unit_progress) before the first paint
(async()=>{ await Promise.all([loadRetained(), loadUnitProgress()]); refreshColors(); loadActivity(); })();
</script>
