Disks", "d": "The two principal moving pieces of a disk drive are shown in Fig. 13.2; they are a *disk assembly* and a *head assembly.* The disk assembly consists of one or more circular *platters* that rotate around a central spindle\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -334.76, "y": -28.13, "z": -176.71, "jx": 0.0, "jy": 11304.0, "ch": "DBMS 13"}, {"id": "dbms-1322-the-disk-controller", "c": 3, "imp": 0.16, "h": 0.168, "t": "The Disk Controller", "d": "One or more disk drives are controlled by a *disk controller*, which is a small processor capable of:  - 1. Controlling the mechanical actuator that moves the head assembly, to position the heads at a particular radius, \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -290.77, "y": -33.71, "z": -168.47, "jx": -75.0, "jy": 11540.0, "ch": "DBMS 13"}, {"id": "dbms-1323-disk-access-characteristics", "c": 3, "imp": 0.0082, "h": 0.134, "t": "Disk Access Characteristics", "d": "*Accessing* (reading or writing) a block requires three steps, and each step has an associated delay.  1. The disk controller positions the head assembly at the cylinder containing the track on which the block is located\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -311.51, "y": 3.4, "z": -143.63, "jx": -300.0, "jy": 11658.0, "ch": "DBMS 13"}, {"id": "dbms-1331-the-io-model-of-computation", "c": 3, "imp": 0.0186, "h": 0.092, "t": "The I/O Model of Computation", "d": "Let us imagine a simple computer running a DBMS and trying to serve a number of users who are performing queries and database modifications. For the moment, assume our computer has one processor, one disk controller, and\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -263.27, "y": -79.42, "z": -129.81, "jx": 450.0, "jy": 11422.0, "ch": "DBMS 13"}, {"id": "dbms-1332-organizing-data-by-cylinders", "c": 3, "imp": 0.0, "h": 0.126, "t": "Organizing Data by Cylinders", "d": "Since seek time represents about half the time it takes to access a block, it makes sense to store data that is likely to be accessed together, such as relations, on a single cylinder, or on as many adjacent cylinders as\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -303.44, "y": 11.54, "z": -112.53, "jx": 150.0, "jy": 11776.0, "ch": "DBMS 13"}, {"id": "dbms-1333-using-m-ultiple-disks", "c": 3, "imp": 0.0082, "h": 0.164, "t": "Using M ultiple Disks", "d": "We can often improve the performance of our system if we replace one disk, with many heads locked together, by several disks with their independent heads. The arrangement was suggested in Fig. 13.4, where we showed three\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -273.27, "y": -10.45, "z": -142.41, "jx": 300.0, "jy": 11658.0, "ch": "DBMS 13"}, {"id": "dbms-1334-mirroring-disks", "c": 3, "imp": 0.0245, "h": 0.116, "t": "Mirroring Disks", "d": "There are situations where it makes sense to have two or more disks hold identical copies of data. The disks are said to be *mirrors* of each other. One important motivation is that the data will survive a head crash by \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -272.62, "y": -80.69, "z": -183.12, "jx": 150.0, "jy": 11658.0, "ch": "DBMS 13"}, {"id": "dbms-1335-disk-scheduling-and-the-elevator-algorithm", "c": 3, "imp": 0.0, "h": 0.126, "t": "Disk Scheduling and the Elevator Algorithm", "d": "Another effective way to improve the throughput of a disk system is to have the disk controller choose which of several requests to execute first. This approach cannot be used if accesses have to be made in a certain seq\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -309.16, "y": 0.37, "z": -195.63, "jx": -150.0, "jy": 11658.0, "ch": "DBMS 13"}, {"id": "dbms-1336-prefetching-and-large-scale-buffering", "c": 3, "imp": 0.0, "h": 0.154, "t": "Prefetching and Large-Scale Buffering", "d": "Our final suggestion for speeding up some secondary-memory algorithms is called *prefetching* or sometimes *double buffering.* In some applications we can predict the order in which blocks will be requested from disk. If\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -296.55, "y": -0.87, "z": -71.85, "jx": 225.0, "jy": 11540.0, "ch": "DBMS 13"}, {"id": "dbms-1341-interm-ittent-failures", "c": 3, "imp": 0.087, "h": 0.13, "t": "Interm ittent Failures", "d": "An intermittent failure occurs if we try to read a sector, but the correct content of that sector is not delivered to the disk controller. If the controller has a way to tell that the sector is good or bad (as we shall d\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -251.74, "y": -56.25, "z": -194.85, "jx": 0.0, "jy": 11658.0, "ch": "DBMS 13"}, {"id": "dbms-1342-checksums", "c": 3, "imp": 0.0245, "h": 0.191, "t": "Checksums", "d": "How a reading operation can determine the good/bad status of a sector may appear mysterious at first. Yet the technique used in modern disk drives is quite simple: each sector has some additional bits, called the *checks\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -241.83, "y": -85.52, "z": -243.38, "jx": -300.0, "jy": 11776.0, "ch": "DBMS 13"}, {"id": "dbms-1343-stable-storage", "c": 3, "imp": 0.0, "h": 0.181, "t": "Stable Storage", "d": "While checksums will almost certainly detect the existence of a media failure or a failure to read or write correctly, it does not help us correct the error. Moreover, when writing we could find ourselves in a position w\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -237.09, "y": -100.92, "z": -276.55, "jx": -300.0, "jy": 11894.0, "ch": "DBMS 13"}, {"id": "dbms-1344-error-handling-capabilities-of-stable-storage", "c": 3, "imp": 0.0244, "h": 0.089, "t": "Error-Handling Capabilities of Stable Storage", "d": "The policies described in Section 13.4.3 are capable of compensating for several different kinds of errors. We shall outline them here.  - 1. *Media failures.* If, after storing *X* in sectors *X l* and *X r ,* one of th\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -211.29, "y": -67.89, "z": -150.0, "jx": 300.0, "jy": 11776.0, "ch": "DBMS 13"}, {"id": "dbms-1345-recovery-from-disk-crashes", "c": 3, "imp": 0.0082, "h": 0.191, "t": "Recovery from Disk Crashes", "d": "The most serious mode of failure for disks is the \"disk crash\" or \"head crash,\" where data is permanently destroyed. If the data was not backed up on another medium, such as a tape backup system, or on a mirror disk as w\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -279.44, "y": -73.6, "z": -225.33, "jx": -150.0, "jy": 11776.0, "ch": "DBMS 13"}, {"id": "dbms-1346-mirroring-as-a-redundancy-technique", "c": 3, "imp": 0.0, "h": 0.071, "t": "Mirroring as a Redundancy Technique", "d": "The simplest scheme is to mirror each disk, as discussed in Section 13.3.4. We shall call one of the disks the *data disk,* while the other is the *redundant disk,* which is which doesn't matter in this scheme. Mirroring\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -233.61, "y": -81.92, "z": -172.94, "jx": 150.0, "jy": 11894.0, "ch": "DBMS 13"}, {"id": "dbms-1347-parity-blocks", "c": 3, "imp": 0.0, "h": 0.116, "t": "Parity Blocks", "d": "While mirroring disks is an effective way to reduce the probability of a disk crash involving data loss, it uses as many redundant disks as there are data disks. Another approach, often called *RAID level 4,* uses only o\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -258.37, "y": -99.44, "z": -220.51, "jx": -150.0, "jy": 11894.0, "ch": "DBMS 13"}, {"id": "dbms-1348-an-improvement-raid-5", "c": 3, "imp": 0.0, "h": 0.086, "t": "An Improvement: RAID 5", "d": "The RAID level 4 strategy described in Section 13.4.7 effectively preserves data unless there are two almost simultaneous disk crashes. However, it suffers from a bottleneck defect that we can see when we re-examine the \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -293.05, "y": -97.05, "z": -212.37, "jx": 0.0, "jy": 11894.0, "ch": "DBMS 13"}, {"id": "dbms-1349-coping-w-ith-m-ultiple-disk-crashes", "c": 3, "imp": 0.0, "h": 0.15, "t": "Coping W ith M ultiple Disk Crashes", "d": "There is a theory of error-correcting codes that allows us to deal with any number of disk crashes \u2014 data or redundant \u2014 if we use enough redundant disks. This strategy leads to the highest RAID \"level,\" *RAID level 6.* \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -256.45, "y": -20.85, "z": -179.48, "jx": 0.0, "jy": 11776.0, "ch": "DBMS 13"}, {"id": "dbms-1351-fixed-length-records", "c": 3, "imp": 0.132, "h": 0.185, "t": "Fixed-Length Records", "d": "The simplest sort of record consists of fixed-length *fields,* one for each attribute of the represented tuple. Many machines allow more efficient reading and writing of main memory when data begins at an address that is\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -134.43, "y": -93.51, "z": 9.36, "jx": -150.0, "jy": 11304.0, "ch": "DBMS 13"}, {"id": "dbms-1352-packing-fixed-length-records-into-blocks", "c": 3, "imp": 0.0, "h": 0.0, "t": "Packing Fixed-Length Records into Blocks", "d": "Records representing tuples of a relation are stored in blocks of the disk and moved into main memory (along with their entire block) when we need to access or update them. The layout of a block that holds records is sug\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -131.36, "y": -85.81, "z": -65.09, "jx": 0.0, "jy": 12248.0, "ch": "DBMS 13"}, {"id": "dbms-1361-addresses-in-client-server-systems", "c": 3, "imp": 0.0245, "h": 0.071, "t": "Addresses in Client-Server Systems", "d": "Commonly, a database system consists of a *server* process that provides data from secondary storage to one or more *client* processes that are applications using the data. The server and client processes may be on one m\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -245.05, "y": -84.21, "z": -40.33, "jx": 300.0, "jy": 11422.0, "ch": "DBMS 13"}, {"id": "dbms-1362-logical-and-structured-addresses", "c": 3, "imp": 0.0, "h": 0.195, "t": "Logical and Structured Addresses", "d": "One might wonder what the purpose of logical addresses could be. All the information needed for a physical address is found in the map table, and following logical pointers to records requires consulting the map table an\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -197.38, "y": -90.44, "z": -14.01, "jx": -225.0, "jy": 11540.0, "ch": "DBMS 13"}, {"id": "dbms-1363-pointer-swizzling", "c": 3, "imp": 0.0162, "h": 0.193, "t": "Pointer Swizzling", "d": "Often, pointers or addresses are part of records. This situation is not typical for records that represent tuples of a relation, but it is common for tuples that represent objects. Also, modern object-relational database\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -184.04, "y": -77.37, "z": -55.56, "jx": 150.0, "jy": 11422.0, "ch": "DBMS 13"}, {"id": "dbms-1364-returning-blocks-to-disk", "c": 3, "imp": 0.0, "h": 0.123, "t": "Returning Blocks to Disk", "d": "When a block is moved from memory back to disk, any pointers within that block must be \"unswizzled\"; that is, their memory addresses must be replaced by the corresponding database addresses. The translation table can be \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -278.85, "y": -101.11, "z": -30.51, "jx": 75.0, "jy": 11540.0, "ch": "DBMS 13"}, {"id": "dbms-1365-pinned-records-and-blocks", "c": 3, "imp": 0.019, "h": 0.175, "t": "Pinned Records and Blocks", "d": "A block in memory is said to be *pinned* if it cannot at the moment be written back to disk safely. A bit telling whether or not a block is pinned can be located in the header of the block. There are many reasons why a b\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -163.94, "y": -78.23, "z": -101.07, "jx": 300.0, "jy": 11894.0, "ch": "DBMS 13"}, {"id": "dbms-1371-records-w-ith-variable-length-fields", "c": 3, "imp": 0.0, "h": 0.115, "t": "Records W ith Variable-Length Fields", "d": "If one or more fields of a record have variable length, then the record must contain enough information to let us find any field of the record. A simple but effective scheme is to put all fixed-length fields ahead of the\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -163.2, "y": -70.33, "z": 7.0, "jx": -150.0, "jy": 11422.0, "ch": "DBMS 13"}, {"id": "dbms-1372-records-w-ith-repeating-fields", "c": 3, "imp": 0.0, "h": 0.101, "t": "Records W ith Repeating Fields", "d": "A similar situation occurs if a record contains a variable number of occurrences of a field *F,* but the field itself is of fixed length. It is sufficient to group all occurrences of field *F* together and put in the rec\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -125.55, "y": -123.68, "z": 6.14, "jx": -300.0, "jy": 11422.0, "ch": "DBMS 13"}, {"id": "dbms-1373-variable-format-records", "c": 3, "imp": 0.0, "h": 0.098, "t": "Variable-Format Records", "d": "An even more complex situation occurs when records do not have a fixed schema. We mentioned an example: records that represent XML elements. For another example, medical records may contain information about many tests, \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -104.34, "y": -47.98, "z": 64.52, "jx": 0.0, "jy": 11422.0, "ch": "DBMS 13"}, {"id": "dbms-1374-records-that-do-not-fit-in-a-block", "c": 3, "imp": 0.0, "h": 0.053, "t": "Records That Do Not Fit in a Block", "d": "Today, DBMS's frequently are used to manage datatypes with large values; often values do not fit in one block. Typical examples are video or audio \"clips.\" Often, these large values have a variable length, but even if th\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -168.86, "y": -105.2, "z": 16.78, "jx": -450.0, "jy": 11422.0, "ch": "DBMS 13"}, {"id": "dbms-1375-blobs", "c": 3, "imp": 0.0, "h": 0.116, "t": "BLOBs", "d": "Now, let us consider the representation of truly large values for records or fields of records. The common examples include images in various formats (e.g., GIF, or JPEG), movies in formats such as MPEG, or signals of al\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -158.63, "y": -104.45, "z": -12.88, "jx": -900.0, "jy": 11422.0, "ch": "DBMS 13"}, {"id": "dbms-1376-column-stores", "c": 3, "imp": 0.0, "h": 0.1, "t": "Column Stores", "d": "An alternative to storing tuples as records is to store each column as a record. Since an entire column of a relation may occupy far more than a single block, these records may span many blocks, much as long files do. If\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -70.36, "y": -111.77, "z": 73.91, "jx": -750.0, "jy": 11422.0, "ch": "DBMS 13"}, {"id": "dbms-1381-insertion", "c": 3, "imp": 0.045, "h": 0.625, "t": "Insertion", "d": "First, let us consider insertion of new records into a relation. If the records of a relation are kept in no particular order, we can just find a block with some empty space, or get a new block if there is none, and put \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -92.0, "y": -131.59, "z": -31.51, "jx": -600.0, "jy": 11422.0, "ch": "DBMS 13"}, {"id": "dbms-1382-deletion", "c": 3, "imp": 0.0256, "h": 0.944, "t": "Deletion", "d": "When we delete a record, we may be able to reclaim its space. If we use an offset table as in Fig. 13.28 and records can slide around the block, then we can compact the space in the block so there is always one unused re\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -98.24, "y": -99.39, "z": -87.26, "jx": 0.0, "jy": 12012.0, "ch": "DBMS 13"}, {"id": "dbms-1383-update", "c": 3, "imp": 0.0163, "h": 0.809, "t": "Update", "d": "When a fixed-length record is updated, there is no effect on the storage system, because we know it can occupy exactly the same space it did before the update. However, when a variable-length record is updated, we have a\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -108.3, "y": -108.67, "z": -56.88, "jx": 0.0, "jy": 12130.0, "ch": "DBMS 13"}, {"id": "dbms-1411-sequential-files", "c": 3, "imp": 0.2944, "h": 0.09, "t": "Sequential Files", "d": "A *sequential file* is created by sorting the tuples of a relation by their primary key. The tuples are then distributed among blocks, in this order.  E xam ple 14.1: Fig 14.2 shows a sequential file on the right. We ima\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -122.83, "y": -202.23, "z": -212.13, "jx": 0.0, "jy": 12541.0, "ch": "DBMS 14"}, {"id": "dbms-1412-dense-indexes", "c": 3, "imp": 0.1378, "h": 0.167, "t": "Dense Indexes", "d": "If records Eire sorted, we can build on them a *dense index,* which is a sequence of blocks holding only the keys of the records and pointers to the records themselves; the pointers are addresses in the sense discussed i\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -84.7, "y": -245.4, "z": -203.43, "jx": 75.0, "jy": 12659.0, "ch": "DBMS 14"}, {"id": "dbms-1413-sparse-indexes", "c": 3, "imp": 0.0466, "h": 0.069, "t": "Sparse Indexes", "d": "A sparse index typically has only one key-pointer pair per block of the data file. It thus uses less space than a dense index, at the expense of somewhat more time to find a record given its key. You can only use a spars\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -132.38, "y": -199.96, "z": -168.77, "jx": 375.0, "jy": 12659.0, "ch": "DBMS 14"}, {"id": "dbms-1414-multiple-levels-of-index", "c": 3, "imp": 0.025, "h": 0.187, "t": "Multiple Levels of Index", "d": "An index file can cover many blocks. Even if we use binary search to find the desired index entry, we still may need to do many disk I/O 's to get to the record we want. By putting an index on the index, we can make the \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -116.05, "y": -277.48, "z": -163.07, "jx": 375.0, "jy": 12777.0, "ch": "DBMS 14"}, {"id": "dbms-1415-secondary-indexes", "c": 3, "imp": 0.079, "h": 0.089, "t": "Secondary Indexes", "d": "A secondary index serves the purpose of any index: it is a data structure that facilitates finding records given a value for one or more fields. However, the secondary index is distinguished from the primary index in tha\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -159.29, "y": -211.17, "z": -244.65, "jx": 225.0, "jy": 12659.0, "ch": "DBMS 14"}, {"id": "dbms-1416-applications-of-secondary-indexes", "c": 3, "imp": 0.0738, "h": 0.188, "t": "Applications of Secondary Indexes", "d": "Besides supporting additional indexes on relations that are organized as sequential files, there are some data structures where secondary indexes are needed for even the primary key. One of these is the \"heap\" structure,\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -186.98, "y": -241.84, "z": -234.37, "jx": 675.0, "jy": 12777.0, "ch": "DBMS 14"}, {"id": "dbms-1417-indirection-in-secondary-indexes", "c": 3, "imp": 0.0, "h": 0.155, "t": "Indirection in Secondary Indexes", "d": "There is some wasted space, perhaps a significant amount of wastage, in the structure suggested by Fig. 14.5. If a search-key value appears *n* times in the data file, then the value is written n times in the index file.\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -47.92, "y": -274.69, "z": -206.13, "jx": -75.0, "jy": 12777.0, "ch": "DBMS 14"}, {"id": "dbms-1418-document-retrieval-and-inverted-indexes", "c": 3, "imp": 0.0169, "h": 0.059, "t": "Document Retrieval and Inverted Indexes", "d": "For many years, the information-retrieval community has dealt with the storage of documents and the efficient retrieval of documents with a given set of keywords. With the advent of the World-Wide Web and the feasibility\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -154.75, "y": -266.92, "z": -211.66, "jx": 450.0, "jy": 12895.0, "ch": "DBMS 14"}, {"id": "dbms-1421-the-structure-of-b-trees", "c": 3, "imp": 0.0909, "h": 0.114, "t": "The Structure of B-trees", "d": "A B-tree organizes its blocks into a tree that is *balanced,* meaning that all paths from the root to a leaf have the same length. Typically, there are three layers in a B-tree: the root, an intermediate layer, and leave\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -97.2, "y": -236.41, "z": -91.39, "jx": 150.0, "jy": 12541.0, "ch": "DBMS 14"}, {"id": "dbms-1422-applications-of-b-trees", "c": 3, "imp": 0.0632, "h": 0.191, "t": "Applications of B-trees", "d": "The B-tree is a powerful tool for building indexes. The sequence of pointers at the leaves of a B-tree can play the role of any of the pointer sequences coming out of an index file that we learned about in Section 14.1. \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -107.2, "y": -225.91, "z": -138.97, "jx": -525.0, "jy": 12777.0, "ch": "DBMS 14"}, {"id": "dbms-1423-lookup-in-b-trees", "c": 3, "imp": 0.0163, "h": 0.17, "t": "Lookup in B-Trees", "d": "We now revert to our original assumption that there are no duplicate keys at the leaves. We also suppose that the B-tree is a dense index, so every search-key value that appears in the data file will also appear at a lea\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -88.88, "y": -214.56, "z": -126.56, "jx": -225.0, "jy": 12777.0, "ch": "DBMS 14"}, {"id": "dbms-1424-range-queries", "c": 3, "imp": 0.0429, "h": 0.178, "t": "Range Queries", "d": "B-trees are useful not only for queries in which a single value of the search key is sought, but for queries in which a range of values are asked for. Typically, *range queries* have a term in the WHERE-clause that compa\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -163.58, "y": -272.62, "z": -146.16, "jx": -300.0, "jy": 12895.0, "ch": "DBMS 14"}, {"id": "dbms-1425-insertion-into-b-trees", "c": 3, "imp": 0.0, "h": 0.0, "t": "Insertion Into B-Trees", "d": "We see some of the advantages of B-trees over simpler multilevel indexes when we consider how to insert a new key into a B-tree. The corresponding record will be inserted into the file being indexed by the B-tree, using \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -85.06, "y": -189.62, "z": -54.99, "jx": 525.0, "jy": 12659.0, "ch": "DBMS 14"}, {"id": "dbms-1426-deletion-from-b-trees", "c": 3, "imp": 0.0054, "h": 0.686, "t": "Deletion From B-Trees", "d": "If we are to delete a record with a given key *K ,* we must first locate that record and its key-pointer pair in a leaf of the B-tree. This part of the deletion process is essentially a lookup, as in Section 14.2.3. We t\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -99.28, "y": -160.72, "z": -108.56, "jx": -450.0, "jy": 12895.0, "ch": "DBMS 14"}, {"id": "dbms-1427-efficiency-of-b-trees", "c": 3, "imp": 0.0, "h": 0.189, "t": "Efficiency of B-Trees", "d": "B-trees allow lookup, insertion, and deletion of records using very few disk I/O 's per file operation. First, we should observe that if *n,* the number of keys per block, is reasonably large, then splitting and merging \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -92.53, "y": -278.12, "z": -117.59, "jx": 150.0, "jy": 12895.0, "ch": "DBMS 14"}, {"id": "dbms-1431-secondary-storage-hash-tables", "c": 3, "imp": 0.1137, "h": 0.069, "t": "Secondary-Storage Hash Tables", "d": "A hash table that holds a very large number of records, so many that they must be kept mainly in secondary storage, differs from the main-memory version in small but important ways. First, the bucket array consists of bl\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -159.54, "y": -177.34, "z": -105.38, "jx": -150.0, "jy": 12541.0, "ch": "DBMS 14"}, {"id": "dbms-1432-insertion-into-a-hash-table", "c": 3, "imp": 0.0163, "h": 0.086, "t": "Insertion Into a Hash Table", "d": "When a new record with search key *K* must be inserted, we compute *h(K ).* If the bucket numbered *h(K )* has space, then we insert the record into the block for this bucket, or into one of the overflow blocks on its ch\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -221.27, "y": -177.13, "z": -83.38, "jx": -375.0, "jy": 12659.0, "ch": "DBMS 14"}, {"id": "dbms-1433-hash-table-deletion", "c": 3, "imp": 0.0, "h": 0.0, "t": "Hash-Table Deletion", "d": "Deletion of the record (or records) with search key *K* follows the same pattern as insertion. We go to the bucket numbered *h(K )* and search for records with that search key. Any that we find are deleted. If we are abl\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -115.66, "y": -156.84, "z": -77.99, "jx": -450.0, "jy": 13013.0, "ch": "DBMS 14"}, {"id": "dbms-1434-efficiency-of-hash-table-indexes", "c": 3, "imp": 0.0114, "h": 0.08, "t": "Efficiency of Hash Table Indexes", "d": "Ideally, there are enough buckets that most of them fit on one block. If so, then the typical lookup takes only one disk I/O , and insertion or deletion from the file takes only two disk I/O 's. That number is significan\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -182.1, "y": -231.14, "z": -125.97, "jx": -300.0, "jy": 13013.0, "ch": "DBMS 14"}, {"id": "dbms-1435-extensible-hash-tables", "c": 3, "imp": 0.0314, "h": 0.096, "t": "Extensible Hash Tables", "d": "Our first approach to dynamic hashing is called *extensible hash tables.* The major additions to the simpler static hash table structure are:  - 1. There is a level of indirection for the buckets. That is, an array of po\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -127.66, "y": -166.76, "z": -173.92, "jx": -75.0, "jy": 12659.0, "ch": "DBMS 14"}, {"id": "dbms-1436-insertion-into-extensible-hash-tables", "c": 3, "imp": 0.0, "h": 0.536, "t": "Insertion Into Extensible Hash Tables", "d": "Insertion into an extensible hash table begins like insertion into a static hash table. To insert a record with search key *K ,* we compute *h(K ),* take the first *i* bits of this bit sequence, and go to the entry of th\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -134.41, "y": -152.83, "z": -60.51, "jx": -675.0, "jy": 12659.0, "ch": "DBMS 14"}, {"id": "dbms-1437-linear-hash-tables", "c": 3, "imp": 0.0082, "h": 0.077, "t": "Linear Hash Tables", "d": "Extensible hash tables have some important advantages. Most significant is the fact that when looking for a record, we never need to search more than one data block. We also have to examine an entry of the bucket array, \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -93.13, "y": -160.76, "z": -210.79, "jx": -375.0, "jy": 12777.0, "ch": "DBMS 14"}, {"id": "dbms-1438-insertion-into-linear-hash-tables", "c": 3, "imp": 0.0, "h": 0.0, "t": "Insertion Into Linear Hash Tables", "d": "When we insert a new record, we determine its bucket by the algorithm outlined in Section 14.3.7. We compute *h(K ),* where *K* is the key of the record, and we use the *i* bits at the end of bit sequence *h(K)* as the b\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -124.87, "y": -164.45, "z": -58.37, "jx": -525.0, "jy": 12659.0, "ch": "DBMS 14"}, {"id": "dbms-1441-applications-of-multidimensional-indexes", "c": 3, "imp": 0.0316, "h": 0.052, "t": "Applications of Multidimensional Indexes", "d": "There are a number of applications that require us to view data as existing in a 2-dimensional space, or sometimes in higher dimensions. Some of these applications can be supported by conventional DBMS's, but there are a\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -210.28, "y": -251.78, "z": -191.65, "jx": 300.0, "jy": 12895.0, "ch": "DBMS 14"}, {"id": "dbms-1442-executing-range-queries-using-conventional-indexes", "c": 3, "imp": 0.0, "h": 0.133, "t": "Executing Range Queries Using Conventional Indexes", "d": "Now, let us consider to what extent one-dimensional indexes help in answering range queries. Suppose for simplicity that there are two dimensions, *x* and *y.* We could put a secondary index on each of the dimensions, *x\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -134.5, "y": -308.82, "z": -145.22, "jx": 0.0, "jy": 13013.0, "ch": "DBMS 14"}, {"id": "dbms-1443-executing-nearest-neighbor-queries-using-conventional-indexes", "c": 3, "imp": 0.0, "h": 0.121, "t": "Executing Nearest-Neighbor Queries Using Conventional Indexes", "d": "Almost any data structure we use will allow us to answer a nearest-neighbor query by picking a range in each dimension, asking the range query, and selecting the point closest to the target within that range. Unfortunate\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -205.68, "y": -283.78, "z": -172.65, "jx": -150.0, "jy": 13013.0, "ch": "DBMS 14"}, {"id": "dbms-1444-overview-of-m-ultidimensional-index-structures", "c": 3, "imp": 0.0, "h": 0.066, "t": "Overview of M ultidimensional Index Structures", "d": "Most data structures for supporting queries on multidimensional data fall into one of two categories:  - 1. Hash-table-like approaches. - 2. Tree-like approaches.  For each of these structures, we give up something that \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -161.93, "y": -242.93, "z": -161.58, "jx": 300.0, "jy": 13131.0, "ch": "DBMS 14"}, {"id": "dbms-1451-grid-files", "c": 3, "imp": 0.0359, "h": 0.115, "t": "Grid Files", "d": "One of the simplest data structures that often outperforms single-dimension indexes for queries involving multidimensional data is the *grid file.* Think of the space of points partitioned in a grid. In each dimension, *\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -184.77, "y": -233.34, "z": -146.01, "jx": 450.0, "jy": 13013.0, "ch": "DBMS 14"}, {"id": "dbms-1452-lookup-in-a-grid-file", "c": 3, "imp": 0.0, "h": 0.175, "t": "Lookup in a Grid File", "d": "Each of the regions into which a space is partitioned can be thought of as a bucket of a hash table, and each of the points in that region has its record placed in a block belonging to that bucket. If needed, overflow bl\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -200.23, "y": -198.95, "z": -118.05, "jx": -300.0, "jy": 13131.0, "ch": "DBMS 14"}, {"id": "dbms-1453-insertion-into-grid-files", "c": 3, "imp": 0.0, "h": 0.126, "t": "Insertion Into Grid Files", "d": "When we insert a record into a grid file, we follow the procedure for lookup of the record, and we place the new record in that bucket. If there is room in the block for the bucket then there is nothing more to do. The p\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -260.76, "y": -181.09, "z": -72.8, "jx": -675.0, "jy": 12777.0, "ch": "DBMS 14"}, {"id": "dbms-1454-performance-of-grid-files", "c": 3, "imp": 0.0, "h": 0.197, "t": "Performance of Grid Files", "d": "Let us consider how many disk I/O 's a grid file requires on various types of queries. We have been focusing on the two-dimensional version of grid files, although they can be used for any number of dimensions. One major\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -223.84, "y": -233.41, "z": -126.82, "jx": 0.0, "jy": 13131.0, "ch": "DBMS 14"}, {"id": "dbms-1455-partitioned-hash-functions", "c": 3, "imp": 0.0033, "h": 0.175, "t": "Partitioned Hash Functions", "d": "Hash functions can take a list of values as arguments, although typically there is only one argument. For instance, if a is an integer-valued attribute and 6 is a character-string-valued attribute, then we could compute \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -172.56, "y": -200.41, "z": -138.49, "jx": -225.0, "jy": 12659.0, "ch": "DBMS 14"}, {"id": "dbms-1456-comparison-of-grid-files-and-partitioned-hashing", "c": 3, "imp": 0.0, "h": 0.145, "t": "Comparison of Grid Files and Partitioned Hashing", "d": "The performance of the two data structures discussed in this section are quite different. Here are the major points of comparison.  - Partitioned hash tables are actually quite useless for nearest-neighbor queries or ran\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -200.71, "y": -274.49, "z": -136.79, "jx": -150.0, "jy": 13131.0, "ch": "DBMS 14"}, {"id": "dbms-1461-m-ultiple-key-indexes", "c": 3, "imp": 0.0, "h": 0.102, "t": "M ultiple-Key Indexes", "d": "Suppose we have several attributes representing dimensions of our data points, and we want to support range queries or nearest-neighbor queries on these points. A simple tree scheme for accessing these points is an index\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -145.94, "y": -292.43, "z": -181.86, "jx": 150.0, "jy": 13013.0, "ch": "DBMS 14"}, {"id": "dbms-1462-performance-of-m-ultiple-key-indexes", "c": 3, "imp": 0.0, "h": 0.069, "t": "Performance of M ultiple-Key Indexes", "d": "Let us consider how a multiple key index performs on various kinds of multidimensional queries. We shall concentrate on the case of two attributes, although the generalization to more than two attributes is unsurprising.", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -113.98, "y": -269.14, "z": -229.58, "jx": 300.0, "jy": 13013.0, "ch": "DBMS 14"}, {"id": "dbms-1466-quad-trees", "c": 3, "imp": 0.0, "h": 0.161, "t": "Quad Trees", "d": "In a *quad tree*, each interior node corresponds to a square region in two dimensions, or to a ^-dimensional cube in *k* dimensions. As with the other data structures in this chapter, we shall consider primarily the two-\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -148.38, "y": -246.69, "z": -101.64, "jx": 150.0, "jy": 13131.0, "ch": "DBMS 14"}, {"id": "dbms-1467-r-trees", "c": 3, "imp": 0.0, "h": 0.074, "t": "R-Trees", "d": "An *R-tree* (region tree) is a data structure that captures some of the spirit of a B-tree for multidimensional data. Recall that a B-tree node has a set of keys that divide a line into segments. Points along that line b\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -78.02, "y": -264.81, "z": -64.17, "jx": 675.0, "jy": 12659.0, "ch": "DBMS 14"}, {"id": "dbms-1468-operations-on-r-trees", "c": 3, "imp": 0.0, "h": 0.176, "t": "Operations on R-Trees", "d": "A typical query for which an R-tree is useful is a \"where-am-I\" query, which specifies a point *P* and asks for the data region or regions in which the point lies. We start at the root, with which the entire region is as\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -50.02, "y": -227.29, "z": -105.13, "jx": -150.0, "jy": 12895.0, "ch": "DBMS 14"}, {"id": "dbms-1471-motivation-for-bitmap-indexes", "c": 3, "imp": 0.0, "h": 0.151, "t": "Motivation for Bitmap Indexes", "d": "It might at first appear that bitmap indexes require much too much space, especially when there are many different values for a field, since the total number of bits is the product of the number of records and the number\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -48.42, "y": -246.76, "z": -226.54, "jx": 225.0, "jy": 12777.0, "ch": "DBMS 14"}, {"id": "dbms-1472-compressed-bitmaps", "c": 3, "imp": 0.0, "h": 0.086, "t": "Compressed Bitmaps", "d": "Suppose we have a bitmap index on field *F* of a file with *n* records, and there are *m* different values for field *F* that appear in the file. Then the number of bits in all the bit-vectors for this index is *mn.* If,\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -75.94, "y": -195.91, "z": -217.74, "jx": 0.0, "jy": 12895.0, "ch": "DBMS 14"}, {"id": "dbms-1473-operating-on-run-length-encoded-bit-vectors", "c": 3, "imp": 0.0, "h": 0.119, "t": "Operating on Run-Length-Encoded Bit-Vectors", "d": "When we need to perform bitwise AND or OR on encoded bit-vectors, we have little choice but to decode them and operate on the original bit-vectors. However, we do not have to do the decoding all at once. The compression \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -128.06, "y": -157.26, "z": -200.62, "jx": 525.0, "jy": 12777.0, "ch": "DBMS 14"}, {"id": "dbms-1474-managing-bitmap-indexes", "c": 3, "imp": 0.0, "h": 0.117, "t": "Managing Bitmap Indexes", "d": "We have described operations on bitmap indexes without addressing three important issues:  - 1. When we want to find the bit-vector for a given value, or the bit-vectors corresponding to values in a given range, how do w\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": -61.71, "y": -277.18, "z": -230.06, "jx": 75.0, "jy": 12777.0, "ch": "DBMS 14"}, {"id": "dbms-1511-scanning-tables", "c": 3, "imp": 0.2, "h": 0.194, "t": "Scanning Tables", "d": "Perhaps the most basic thing we can do in a physical query plan is to read the entire contents of a relation *R. A* variation of this operator involves a simple predicate, where we read only those tuples of the relation \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 265.84, "y": -204.28, "z": 144.82, "jx": 0.0, "jy": 13424.0, "ch": "DBMS 15"}, {"id": "dbms-1512-sorting-w-hile-scanning-tables", "c": 3, "imp": 0.0196, "h": 0.132, "t": "Sorting W hile Scanning Tables", "d": "There are a number of reasons why we might want to sort a relation as we read its tuples. For one, the query could include an ORDER BY clause, requiring that a relation be sorted. For another, some approaches to implemen\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 288.69, "y": -177.43, "z": 140.34, "jx": 600.0, "jy": 13542.0, "ch": "DBMS 15"}, {"id": "dbms-1513-the-computation-m-odel-for-physical-operators", "c": 3, "imp": 0.0847, "h": 0.195, "t": "The Computation M odel for Physical Operators", "d": "A query generally consists of several operations of relational algebra, and the corresponding physical query plan is composed of several physical operators. Since choosing physical-plan operators wisely is an essential o\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 293.67, "y": -217.14, "z": 98.5, "jx": 900.0, "jy": 13542.0, "ch": "DBMS 15"}, {"id": "dbms-1514-parameters-for-measuring-costs", "c": 3, "imp": 0.0544, "h": 0.103, "t": "Parameters for Measuring Costs", "d": "Now, let us introduce the parameters (sometimes called statistics) that we use to express the cost of an operator. Estimates of cost are essential if the optimizer is to determine which of the many query plans is likely \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 260.85, "y": -219.2, "z": 64.41, "jx": 525.0, "jy": 13660.0, "ch": "DBMS 15"}, {"id": "dbms-1515-io-cost-for-scan-operators", "c": 3, "imp": 0.0, "h": 0.107, "t": "I/O Cost for Scan Operators", "d": "As a simple application of the parameters that were introduced, we can represent the number of disk I/O 's needed for each of the table-scan operators discussed so far. If relation *R* is clustered, then the number of di\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 291.8, "y": -229.59, "z": 176.0, "jx": 300.0, "jy": 13542.0, "ch": "DBMS 15"}, {"id": "dbms-1516-iterators-for-implementation-of-physical-operators", "c": 3, "imp": 0.1035, "h": 0.125, "t": "Iterators for Implementation of Physical Operators", "d": "Many physical operators can be implemented as an *iterator,* which is a group of three methods that allows a consumer of the result of the physical operator to get the result one tuple at a time. The three methods formin\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 258.06, "y": -133.79, "z": 86.02, "jx": -300.0, "jy": 13424.0, "ch": "DBMS 15"}, {"id": "dbms-1521-one-pass-algorithms-for-tuple-at-a-time-operations", "c": 3, "imp": 0.0169, "h": 0.126, "t": "One-Pass Algorithms for Tuple-at-a-Time Operations", "d": "The tuple-at-a-time operations *cr(R)* and *ir(R)* have obvious algorithms, regardless of whether the relation fits in main memory. We read the blocks of *R* one at a time into an input buffer, perform the operation on e\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 209.01, "y": -169.04, "z": 92.03, "jx": -150.0, "jy": 13778.0, "ch": "DBMS 15"}, {"id": "dbms-1522-one-pass-algorithms-for-unary-full-relation-operations", "c": 3, "imp": 0.0371, "h": 0.09, "t": "One-Pass Algorithms for Unary, Full-Relation Operations", "d": "Now, let us consider the unary operations that apply to relations as a whole, rather than to one tuple at a time: duplicate elimination *(S)* and grouping (**7** ).", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 209.47, "y": -153.71, "z": 21.85, "jx": -900.0, "jy": 13542.0, "ch": "DBMS 15"}, {"id": "dbms-1523-one-pass-algorithms-for-binary-operations", "c": 3, "imp": 0.0169, "h": 0.11, "t": "One-Pass Algorithms for Binary Operations", "d": "Let us now take up the binary operations: union, intersection, difference, product, and join. Since in some cases we must distinguish the set- and bag-versions of these operators, we shall subscript them with *B* or *S* \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 190.53, "y": -162.08, "z": 60.96, "jx": -525.0, "jy": 13660.0, "ch": "DBMS 15"}, {"id": "dbms-1531-tuple-based-nested-loop-join", "c": 3, "imp": 0.0702, "h": 0.053, "t": "Tuple-Based Nested-Loop Join", "d": "The simplest variation of nested-loop join has loops that range over individual tuples of the relations involved. In this algorithm, which we call *tuple-based, nested-loop join*, we compute the join *R(X, Y)* ex *S(Y, Z\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 290.43, "y": -150.38, "z": 134.73, "jx": -300.0, "jy": 13542.0, "ch": "DBMS 15"}, {"id": "dbms-1532-an-iterator-for-tuple-based-nested-loop-join", "c": 3, "imp": 0.0, "h": 0.085, "t": "An Iterator for Tuple-Based Nested-Loop Join", "d": "One advantage of a nested-loop join is that it fits well into an iterator framework, and thus, as we shall see in Section 16.7.3, allows us to avoid storing intermediate relations on disk in some situations. The iterator\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 284.55, "y": -94.4, "z": 101.84, "jx": -1050.0, "jy": 13542.0, "ch": "DBMS 15"}, {"id": "dbms-1533-block-based-nested-loop-join-algorithm", "c": 3, "imp": 0.0, "h": 0.762, "t": "Block-Based Nested-Loop Join Algorithm", "d": "We can improve on the tuple-based nested-loop join of Section 15.3.1 if we compute *R* tx *S* by:  - 1. Organizing access to both argument relations by blocks, and - 2. Using as much main memory as we can to store tuples\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 249.59, "y": -164.09, "z": 127.76, "jx": 75.0, "jy": 13896.0, "ch": "DBMS 15"}, {"id": "dbms-1534-analysis-of-nested-loop-join", "c": 3, "imp": 0.0058, "h": 0.149, "t": "Analysis of Nested-Loop Join", "d": "The analysis of Example 15.4 can be repeated for any *B(R), B(S),* and *M.* Assuming *S* is the smaller relation, the number of chunks, or iterations of the outer loop is *B(S)/(M \u2014* 1). At each iteration, we read *M \u2014* \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 328.46, "y": -155.08, "z": 110.6, "jx": -375.0, "jy": 13660.0, "ch": "DBMS 15"}, {"id": "dbms-1535-summary-of-algorithms-so-far", "c": 3, "imp": 0.0331, "h": 0.182, "t": "Summary of Algorithms so Far", "d": "The main-memory and disk I/O requirements for the algorithms we have discussed in Sections 15.2 and 15.3 are shown in Fig. 15.9. The memory requirements for **7** and *6* are actually more complex than shown, and *M \u2014 B*\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 271.27, "y": -136.13, "z": 48.22, "jx": 150.0, "jy": 13424.0, "ch": "DBMS 15"}, {"id": "dbms-1541-two-phase-multiway-merge-sort", "c": 3, "imp": 0.0455, "h": 0.099, "t": "Two-Phase, Multiway Merge-Sort", "d": "It is possible to sort very large relations in two passes using an algorithm called *Two-Phase, Multiway Merge-Sort* (TPMMS), Suppose we have *M* mainmemory buffers to use for the sort. TPMMS sorts a relation *R* as foll\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 259.81, "y": -144.92, "z": 61.96, "jx": 300.0, "jy": 13424.0, "ch": "DBMS 15"}, {"id": "dbms-1542-duplicate-elimination-using-sorting", "c": 3, "imp": 0.0163, "h": 0.072, "t": "Duplicate Elimination Using Sorting", "d": "To perform the *S(R)* operation in two passes, we sort the tuples of *R* in sublists as in 2PMMS. In the second pass, we use the available main memory to hold one block from each sorted sublist and one output block, as w\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 301.64, "y": -112.51, "z": 79.95, "jx": 0.0, "jy": 13542.0, "ch": "DBMS 15"}, {"id": "dbms-1543-grouping-and-aggregation-using-sorting", "c": 3, "imp": 0.0082, "h": 0.146, "t": "Grouping and Aggregation Using Sorting", "d": "The two-pass algorithm for **7***l (R)* is quite similar to the algorithm for *6(R)* or 2PMMS. We summarize it as follows:  - 1. Read the tuples of *R* into memory, *M* blocks at a time. Sort the tuples in each set of *M\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 199.92, "y": -118.84, "z": 69.83, "jx": 1050.0, "jy": 13542.0, "ch": "DBMS 15"}, {"id": "dbms-1544-a-sort-based-union-algorithm", "c": 3, "imp": 0.0, "h": 0.884, "t": "A Sort-Based Union Algorithm", "d": "When bag-union is wanted, the one-pass algorithm of Section 15.2.3, where we simply copy both relations, works regardless of the size of the arguments, so there is no need to consider a two-pass algorithm for Ub- However\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 221.71, "y": -155.59, "z": 58.65, "jx": -75.0, "jy": 13896.0, "ch": "DBMS 15"}, {"id": "dbms-1545-sort-based-intersection-and-difference", "c": 3, "imp": 0.0, "h": 0.144, "t": "Sort-Based Intersection and Difference", "d": "Whether the set version or the bag version is wanted, the algorithms are essentially the same as that of Section 15.4.4, except that the way we handle the copies of a tuple *t* at the fronts of the sorted sublists differ\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 350.0, "y": -89.43, "z": 92.29, "jx": -75.0, "jy": 13660.0, "ch": "DBMS 15"}, {"id": "dbms-1546-a-simple-sort-based-join-algorithm", "c": 3, "imp": 0.0, "h": 0.172, "t": "A Simple Sort-Based Join Algorithm", "d": "There axe several ways that sorting can be used to join large relations. Before examining the join algorithms, let us observe one problem that can occur when we compute a join but was not an issue for the binary operatio\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 315.87, "y": -158.58, "z": 167.77, "jx": 75.0, "jy": 13660.0, "ch": "DBMS 15"}, {"id": "dbms-1547-analysis-of-simple-sort-join", "c": 3, "imp": 0.0, "h": 0.76, "t": "Analysis of Simple Sort-Join", "d": "As we noted in Example 15.6, the algorithm of Section 15.4.6 performs five disk I/O 's for every block of the argument relations. We also need to consider how big *M* needs to be in order for the simple sort-join to work\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 248.96, "y": -162.13, "z": 87.32, "jx": 375.0, "jy": 13896.0, "ch": "DBMS 15"}, {"id": "dbms-1548-a-more-efficient-sort-based-join", "c": 3, "imp": 0.0, "h": 0.884, "t": "A More Efficient Sort-Based Join", "d": "If we do not have to worry about very large numbers of tuples with a common value for the join attribute(s), then we can save two disk I/O 's per block by combining the second phase of the sorts with the join itself. We \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 249.8, "y": -121.62, "z": 109.75, "jx": 375.0, "jy": 13660.0, "ch": "DBMS 15"}, {"id": "dbms-1549-summary-of-sort-based-algorithms", "c": 3, "imp": 0.0, "h": 0.174, "t": "Summary of Sort-Based Algorithms", "d": "In Fig. 15.11 is a table of the analysis of the algorithms we have discussed in Section 15.4. As discussed in Sections 15.4.6 and 15.4.8, the join algorithms have limitiations on how many tuples can share a common value \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 334.57, "y": -124.45, "z": 160.88, "jx": -225.0, "jy": 13660.0, "ch": "DBMS 15"}, {"id": "dbms-1551-partitioning-relations-by-hashing", "c": 3, "imp": 0.087, "h": 0.184, "t": "Partitioning Relations by Hashing", "d": "To begin, let us review the way we would take a relation *R* and, using *M* buffers, partition *R* into *M \u2014* 1 buckets of roughly equal size. We shall assume that *h* is the hash function, and that *h* takes complete tu\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 316.23, "y": -158.52, "z": 1.09, "jx": -150.0, "jy": 13424.0, "ch": "DBMS 15"}, {"id": "dbms-1552-a-hash-based-algorithm-for-duplicate-elimination", "c": 3, "imp": 0.0, "h": 0.154, "t": "A Hash-Based Algorithm for Duplicate Elimination", "d": "We shall now consider the details of hash-based algorithms for the various operations of relational algebra that might need two-pass algorithms. First, consider duplicate elimination, that is, the operation *S(R).* We ha\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 364.81, "y": -162.41, "z": -5.78, "jx": -750.0, "jy": 13542.0, "ch": "DBMS 15"}, {"id": "dbms-1553-hash-based-grouping-and-aggregation", "c": 3, "imp": 0.0, "h": 0.055, "t": "Hash-Based Grouping and Aggregation", "d": "To perform the **7***l(R)* operation, we again start by hashing all the tuples of *R* to *M \u2014* 1 buckets. However, in order to make sure that all tuples of the same group wind up in the same bucket, we must choose a hash\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 295.56, "y": -138.63, "z": 5.18, "jx": 150.0, "jy": 13542.0, "ch": "DBMS 15"}, {"id": "dbms-1554-hash-based-union-intersection-and-difference", "c": 3, "imp": 0.0, "h": 0.694, "t": "Hash-Based Union, Intersection, and Difference", "d": "When the operation is binary, we must make sure that we use the same hash function to hash tuples of both arguments. For example, to compute *R* Us 5, we hash both *R* and *S* to *M* \u2014 1 buckets each, say i?i, -R**2**, -\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 250.74, "y": -157.83, "z": 16.11, "jx": -300.0, "jy": 13778.0, "ch": "DBMS 15"}, {"id": "dbms-1555-the-hash-join-algorithm", "c": 3, "imp": 0.0, "h": 0.175, "t": "The Hash-Join Algorithm", "d": "To compute *R{X, Y)* tx *S(Y, Z)* using a two-pass, hash-based algorithm, we act almost as for the other binary operations discussed in Section 15.5.4. The only difference is that we must use as the hash key just the joi\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 362.65, "y": -137.45, "z": 0.55, "jx": -450.0, "jy": 13542.0, "ch": "DBMS 15"}, {"id": "dbms-1556-saving-some-disk-io-s", "c": 3, "imp": 0.0, "h": 0.144, "t": "Saving Some Disk I/O 's", "d": "If there is more memory available on the first pass than we need to hold one block per bucket, then we have some opportunities to save disk I/O 's. One option is to use several blocks for each bucket, and write them out \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 341.4, "y": -181.29, "z": -25.63, "jx": -600.0, "jy": 13542.0, "ch": "DBMS 15"}, {"id": "dbms-1557-summary-of-hash-based-algorithms", "c": 3, "imp": 0.0, "h": 0.152, "t": "Summary of Hash-Based Algorithms", "d": "Figure 15.13 gives the memory requirements and disk I/O 's needed by each of the algorithms discussed in this section. As with other types of algorithms, we should observe that the estimates for **7** and *S* may be cons\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 312.57, "y": -131.7, "z": 21.82, "jx": 750.0, "jy": 13542.0, "ch": "DBMS 15"}, {"id": "dbms-1561-clustering-and-nonclustering-indexes", "c": 3, "imp": 0.0, "h": 0.05, "t": "Clustering and Nonclustering Indexes", "d": "Recall from Section 15.1.3 that a relation is \"clustered\" if its tuples axe packed into roughly as few blocks as can possibly hold those tuples. All the analyses we have done so far assume that relations are clustered.  \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 275.59, "y": -245.75, "z": 169.67, "jx": -150.0, "jy": 13542.0, "ch": "DBMS 15"}, {"id": "dbms-1562-index-based-selection", "c": 3, "imp": 0.0, "h": 0.162, "t": "Index-Based Selection", "d": "In Section 15.1.1 we discussed implementing a selection *ac(R)* by reading all the tuples of relation *R,* seeing which meet the condition *C,* and outputting those that do. If there are no indexes on *R,* then that is t\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 184.96, "y": -187.44, "z": 132.67, "jx": 450.0, "jy": 13542.0, "ch": "DBMS 15"}, {"id": "dbms-1563-joining-by-using-an-index", "c": 3, "imp": 0.0, "h": 0.13, "t": "Joining by Using an Index", "d": "All the binary operations we have considered, and the unary full-relation operations of **7** and *6* as well, can use certain indexes profitably. We shall leave most of these algorithms as exercises, while we focus on t\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 202.42, "y": -154.66, "z": -26.15, "jx": -675.0, "jy": 13660.0, "ch": "DBMS 15"}, {"id": "dbms-1564-joins-using-a-sorted-index", "c": 3, "imp": 0.0, "h": 0.06, "t": "Joins Using a Sorted Index", "d": "When the index is a B-tree, or any other structure from which we easily can extract the tuples of a relation in sorted order, we have a number of other opportunities to use the index. Perhaps the simplest is when we want\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 321.87, "y": -174.86, "z": 160.1, "jx": 225.0, "jy": 13660.0, "ch": "DBMS 15"}, {"id": "dbms-1571-buffer-management-architecture", "c": 3, "imp": 0.0136, "h": 0.088, "t": "Buffer Management Architecture", "d": "There are two broad architectures for a buffer manager:  - 1. The buffer manager control emory directly, as in many relational DBMS's, or - 2. The buffer manager allocat in virtual memory, allowing the operating system t\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 268.38, "y": -210.09, "z": 12.37, "jx": 150.0, "jy": 13778.0, "ch": "DBMS 15"}, {"id": "dbms-1572-buffer-management-strategies", "c": 3, "imp": 0.0, "h": 0.09, "t": "Buffer Management Strategies", "d": "The critical choice that the buffer manager must make is what block to throw out of the buffer pool when a buffer is needed for a newly requested block. The *buffer-replacement strategies* in common use may be familiar t\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 280.15, "y": -264.91, "z": 49.81, "jx": 300.0, "jy": 13778.0, "ch": "DBMS 15"}, {"id": "dbms-1573-the-relationship-between-physical-operator-selection-and-buffer-management", "c": 3, "imp": 0.0, "h": 0.081, "t": "The Relationship Between Physical Operator Selection and Buffer Management", "d": "The query optimizer will eventually select a set of physical operators that will be used to execute a given query. This selection of operators may assume that a certain number of buffers *M* is available for execution of\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 325.36, "y": -258.03, "z": 104.78, "jx": 675.0, "jy": 13660.0, "ch": "DBMS 15"}, {"id": "dbms-1581-multipass-sort-based-algorithms", "c": 3, "imp": 0.0, "h": 0.196, "t": "Multipass Sort-Based Algorithms", "d": "In Section 15.4.1 we alluded to how 2PMMS could be extended to a three-pass algorithm. In fact, there is a simple recursive approach to sorting that will allow us to sort a relation, however large, completely, or if we p\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 265.54, "y": -180.77, "z": 26.8, "jx": 225.0, "jy": 13896.0, "ch": "DBMS 15"}, {"id": "dbms-1582-performance-of-multipass-sort-based-algorithms", "c": 3, "imp": 0.0082, "h": 0.107, "t": "Performance of Multipass, Sort-Based Algorithms", "d": "Now, let us explore the relationship between the number of disk I/O 's required, the size of the relation(s) operated upon, and the size of main memory. Let *s(M, k)* be the maximum size of a relation that we can sort us\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 304.13, "y": -166.14, "z": 71.62, "jx": 0.0, "jy": 13778.0, "ch": "DBMS 15"}, {"id": "dbms-1583-multipass-hash-based-algorithms", "c": 3, "imp": 0.0, "h": 0.153, "t": "Multipass Hash-Based Algorithms", "d": "There is a corresponding recursive approach to using hashing for operations on large relations. We hash the relation or relations into *M* \u2014 1 buckets, where *M* is the number of available memory buffers. We then apply t\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 262.92, "y": -173.99, "z": -5.38, "jx": -225.0, "jy": 13896.0, "ch": "DBMS 15"}, {"id": "dbms-1584-performance-of-multipass-hash-based-algorithms", "c": 3, "imp": 0.0, "h": 0.143, "t": "Performance of Multipass Hash-Based Algorithms", "d": "In what follows, we shall make the assumption that when we hash a relation, the tuples divide as evenly as possible among the buckets. In practice, this assumption will be met approximately if we choose a truly random ha\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 339.19, "y": -167.16, "z": 34.02, "jx": -375.0, "jy": 13896.0, "ch": "DBMS 15"}, {"id": "dbms-1611-syntax-analysis-and-parse-trees", "c": 3, "imp": 0.1425, "h": 0.062, "t": "Syntax Analysis and Parse Trees", "d": "The job of the parser is to take text written in a language such as SQL and convert it to a *parse tree,* which is a tree whose nodes correspond to either:  - 1. *Atoms,* which are lexical elements such as keywords (e.g.\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 169.0, "y": -208.61, "z": -17.09, "jx": 150.0, "jy": 14189.0, "ch": "DBMS 16"}, {"id": "dbms-1612-a-grammar-for-a-simple-subset-of-sql", "c": 3, "imp": 0.0101, "h": 0.088, "t": "A Grammar for a Simple Subset of SQL", "d": "We shall illustrate the parsing process by giving some rules that describe a small subset of SQL queries.", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 186.98, "y": -231.47, "z": 31.67, "jx": 375.0, "jy": 14307.0, "ch": "DBMS 16"}, {"id": "dbms-1613-the-preprocessor", "c": 3, "imp": 0.0904, "h": 0.096, "t": "The Preprocessor", "d": "The *preprocessor* has several important functions. If a relation used in the query is actually a virtual view, then each use of this relation in the from-list must be replaced by a parse tree that describes the view. Th\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 173.98, "y": -245.41, "z": -51.96, "jx": 825.0, "jy": 14307.0, "ch": "DBMS 16"}, {"id": "dbms-1614-preprocessing-queries-involving-views", "c": 3, "imp": 0.068, "h": 0.052, "t": "Preprocessing Queries Involving Views", "d": "When an operand in a query is a virtual view, the preprocessor needs to replace the operand by a piece of parse tree that represents how the view is constructed from base tables. The idea is illustrated in Fig. 16.6. A q\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 139.88, "y": -276.85, "z": -34.56, "jx": 600.0, "jy": 14425.0, "ch": "DBMS 16"}, {"id": "dbms-1621-commutative-and-associative-laws", "c": 3, "imp": 0.0728, "h": 0.09, "t": "Commutative and Associative Laws", "d": "A *commutative law* about an operator says that it does not matter in which order you present the arguments of the operator; the result will be the same. For instance, + and x are commutative operators of arithmetic. Mor\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 154.24, "y": -271.7, "z": 53.95, "jx": -150.0, "jy": 14189.0, "ch": "DBMS 16"}, {"id": "dbms-1622-laws-involving-selection", "c": 3, "imp": 0.0136, "h": 0.827, "t": "Laws Involving Selection", "d": "Since selections tend to reduce the size of relations markedly, one of the most important rules of efficient query processing is to move the selections down the tree as far as they will go without changing what the expre\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 89.09, "y": -253.73, "z": -2.4, "jx": 150.0, "jy": 14661.0, "ch": "DBMS 16"}, {"id": "dbms-1623-pushing-selections", "c": 3, "imp": 0.0324, "h": 0.094, "t": "Pushing Selections", "d": "As was illustrated in Example 16.3, pushing a selection down an expression tree \u2014 that is, replacing the left side of one of the rules in Section 16.2.2 by its right side \u2014 is one of the most powerful tools of the query \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 106.05, "y": -267.53, "z": 18.7, "jx": 225.0, "jy": 14543.0, "ch": "DBMS 16"}, {"id": "dbms-1624-laws-involving-projection", "c": 3, "imp": 0.0131, "h": 0.12, "t": "Laws Involving Projection", "d": "Projections, like selections, can be \"pushed down\" through many other operators. Pushing projections differs from pushing selections in that when we push projections, it is quite usual for the projection also to remain w\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 80.07, "y": -222.9, "z": 91.59, "jx": 0.0, "jy": 14661.0, "ch": "DBMS 16"}, {"id": "dbms-1625-laws-about-joins-and-products", "c": 3, "imp": 0.0492, "h": 0.0, "t": "Laws About Joins and Products", "d": "We saw in Section 16.2.1 many of the important laws involving joins and products: their commutative and associative laws. However, there are a few additional laws that follow directly from the definition of the join, as \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 130.72, "y": -288.69, "z": 102.17, "jx": -825.0, "jy": 14307.0, "ch": "DBMS 16"}, {"id": "dbms-1626-laws-involving-duplicate-elimination", "c": 3, "imp": 0.0, "h": 0.63, "t": "Laws Involving Duplicate Elimination", "d": "The operator *S,* which eliminates duplicates from a bag, can be pushed through many, but not all operators. In general, moving a *6* down the tree reduces the size of intermediate relations and may therefore be benefici\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 135.07, "y": -262.62, "z": -1.5, "jx": 75.0, "jy": 14779.0, "ch": "DBMS 16"}, {"id": "dbms-1627-laws-involving-grouping-and-aggregation", "c": 3, "imp": 0.0109, "h": 0.19, "t": "Laws Involving Grouping and Aggregation", "d": "When we consider the operator <sup>7</sup> , we find that the applicability of many transformations depends on the details of the aggregate operators used. Thus, we cannot state laws in the generality that we used for th\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 126.76, "y": -288.53, "z": 21.21, "jx": -675.0, "jy": 14307.0, "ch": "DBMS 16"}, {"id": "dbms-1631-conversion-to-relational-algebra", "c": 3, "imp": 0.0, "h": 0.119, "t": "Conversion to Relational Algebra", "d": "We shall now describe informally some rules for transforming SQL parse trees to algebraic logical query plans. The first rule, perhaps the most important, allows us to convert all \"simple\" select-from-where constructs to\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 175.01, "y": -198.07, "z": -58.5, "jx": 525.0, "jy": 14307.0, "ch": "DBMS 16"}, {"id": "dbms-1632-removing-subqueries-from-conditions", "c": 3, "imp": 0.0, "h": 0.195, "t": "Removing Subqueries From Conditions", "d": "For parse trees with a <Condition> that has a subquery, we shall introduce an intermediate form of operator, between the syntactic categories of the parse tree and the relational-algebra operators that apply to relations\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 136.57, "y": -178.86, "z": 37.74, "jx": 675.0, "jy": 14307.0, "ch": "DBMS 16"}, {"id": "dbms-1633-improving-the-logical-query-plan", "c": 3, "imp": 0.0093, "h": 0.09, "t": "Improving the Logical Query Plan", "d": "When we convert our query to relational algebra we obtain one possible logical query plan. The next step is to rewrite the plan using the algebraic laws outlined    Figure 16.23: Simplification of Fig. 16.22", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 136.3, "y": -319.7, "z": -31.42, "jx": 75.0, "jy": 14543.0, "ch": "DBMS 16"}, {"id": "dbms-1634-grouping-associativecomm-utative-operators", "c": 3, "imp": 0.0163, "h": 0.928, "t": "Grouping Associative/Comm utative Operators", "d": "An operator that is associative and commutative operators may be thought of as having any number of operands. Thinking of an operator such as join as having any number of operands lets us reorder those operands so that w\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 182.37, "y": -245.07, "z": 98.36, "jx": 300.0, "jy": 14425.0, "ch": "DBMS 16"}, {"id": "dbms-1641-estimating-sizes-of-intermediate-relations", "c": 3, "imp": 0.1942, "h": 0.137, "t": "Estimating Sizes of Intermediate Relations", "d": "The physical plan is selected to minimize the estimated cost of evaluating the query. No matter what method is used for executing query plans, and no matter how costs of query plans are estimated, the sizes of intermedia\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 102.17, "y": -325.04, "z": 86.2, "jx": 0.0, "jy": 14189.0, "ch": "DBMS 16"}, {"id": "dbms-1642-estimating-the-size-of-a-projection", "c": 3, "imp": 0.0077, "h": 0.76, "t": "Estimating the Size of a Projection", "d": "The extended projection of Section 5.2.5 is a bag projection and does not eliminate duplicates. We shall treat a clasical, duplicate-eliminating projection as a bag-projection followed by a *6.* The extended projection o\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 82.23, "y": -266.04, "z": 106.12, "jx": -75.0, "jy": 14779.0, "ch": "DBMS 16"}, {"id": "dbms-1643-estimating-the-size-of-a-selection", "c": 3, "imp": 0.0054, "h": 0.603, "t": "Estimating the Size of a Selection", "d": "When we perform a selection, we generally reduce the number of tuples, although the sizes of tuples remain the same. In the simplest kind of selection, where an attribute is equated to a constant, there is an easy way to\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 70.8, "y": -287.59, "z": 39.14, "jx": 75.0, "jy": 14307.0, "ch": "DBMS 16"}, {"id": "dbms-1644-estimating-the-size-of-a-join", "c": 3, "imp": 0.0, "h": 0.623, "t": "Estimating the Size of a Join", "d": "We shall consider here only the natural join. Other joins can be handled according to the following outline:  - 1. The number of tuples in the result of an equijoin can be computed exactly as for a natural join, after ac\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 107.35, "y": -254.58, "z": 104.98, "jx": -600.0, "jy": 14425.0, "ch": "DBMS 16"}, {"id": "dbms-1645-natural-joins-w-ith-multiple-join-attributes", "c": 3, "imp": 0.0082, "h": 0.701, "t": "Natural Joins W ith Multiple Join Attributes", "d": "When the set of attributes *Y* in the join *R(X,Y)* cx *S(Y,Z)* consists of more than one attribute, the same argument as we used for a single attribute *Y* applies to each attribute in *Y.* That is:  \u2022 The estimate of t\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 128.07, "y": -250.4, "z": 142.67, "jx": 0.0, "jy": 14897.0, "ch": "DBMS 16"}, {"id": "dbms-1646-joins-o-f-m-any-r-elations", "c": 3, "imp": 0.0054, "h": 0.0, "t": "Joins o f M any R elations", "d": "Finally, let us consider the general case of a natural join:  $$S = R_1 \\bowtie R_2 \\bowtie \\cdots \\bowtie R_n$$  Suppose that attribute *A* appears in *k* of the *Ri* s, and the numbers of its sets of values in these *k\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 132.58, "y": -338.6, "z": 84.53, "jx": -300.0, "jy": 14425.0, "ch": "DBMS 16"}, {"id": "dbms-1647-estimating-sizes-for-other-operations", "c": 3, "imp": 0.0, "h": 0.054, "t": "Estimating Sizes for Other Operations", "d": "We have seen two operations \u2014 selection and join \u2014 with reasonable estimating techniques. In addition, projections do not change the number of tuples in a relation, and products multiply the numbers of tuples in the argu\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 88.14, "y": -374.48, "z": 101.04, "jx": -75.0, "jy": 14307.0, "ch": "DBMS 16"}, {"id": "dbms-1651-obtaining-estimates-for-size-parameters", "c": 3, "imp": 0.0, "h": 0.124, "t": "Obtaining Estimates for Size Parameters", "d": "The formulas of Section 16.4 were predicated on knowing certain important parameters, especially *T(R),* the number of tuples in a relation *R,* and *V(R, a),* the number of different values in the column of relation *R*\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 63.99, "y": -358.67, "z": 106.07, "jx": 225.0, "jy": 14307.0, "ch": "DBMS 16"}, {"id": "dbms-1652-computation-of-statistics", "c": 3, "imp": 0.0082, "h": 0.095, "t": "Computation of Statistics", "d": "Statistics normally are computed only periodically, for several reasons. First, statistics tend not to change radically in a short time. Second, even somewhat inaccurate statistics are useful as long as they are applied \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 108.85, "y": -330.34, "z": 142.91, "jx": -225.0, "jy": 14307.0, "ch": "DBMS 16"}, {"id": "dbms-1653-heuristics-for-reducing-the-cost-of-logical-query-plans", "c": 3, "imp": 0.0136, "h": 0.102, "t": "Heuristics for Reducing the Cost of Logical Query Plans", "d": "One important use of cost estimates for queries or subqueries is in the application of heuristic transformations of the query. We already have observed in Section 16.3.3 how certain heuristics, such as pushing selections\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 117.24, "y": -327.41, "z": 22.48, "jx": -150.0, "jy": 14661.0, "ch": "DBMS 16"}, {"id": "dbms-1654-approaches-to-enumerating-physical-plans", "c": 3, "imp": 0.057, "h": 0.176, "t": "Approaches to Enumerating Physical Plans", "d": "Now, let us consider the use of cost estimates in the conversion of a logical query plan to a physical query plan. The baseline approach, called *exhaustive,* is to consider all combinations of choices for each of the is\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 172.34, "y": -332.22, "z": 102.42, "jx": -525.0, "jy": 14307.0, "ch": "DBMS 16"}, {"id": "dbms-1661-significance-of-left-and-right-join-arguments", "c": 3, "imp": 0.0082, "h": 0.0, "t": "Significance of Left and Right Join Arguments", "d": "When ordering a join, we should remember that many of the join methods discussed in Chapter 15 are asymmetric. That is, the roles played by the two argument relations are different, and the cost of the join depends on wh\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 176.86, "y": -308.07, "z": 125.65, "jx": -150.0, "jy": 14425.0, "ch": "DBMS 16"}, {"id": "dbms-1662-join-trees", "c": 3, "imp": 0.0136, "h": 0.468, "t": "Join Trees", "d": "When we have the join of two relations, we need to order the arguments. We shall conventionally select the one whose estimated size is the smaller as the left argument. It is quite common for there to be a significant an\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 121.72, "y": -339.17, "z": 64.09, "jx": -450.0, "jy": 14425.0, "ch": "DBMS 16"}, {"id": "dbms-1663-left-deep-join-trees", "c": 3, "imp": 0.0, "h": 0.705, "t": "Left-Deep Join Trees", "d": "Figure 16.30(a) is an example of what is called a *left-deep* tree. In general, a binary tree is left-deep if all right children are leaves. Similarly, a tree like Fig. 16.30(c), all of whose left children are leaves, is\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 203.17, "y": -280.45, "z": 131.73, "jx": -75.0, "jy": 14543.0, "ch": "DBMS 16"}, {"id": "dbms-1664-dynamic-programming-to-select-a-join-order-and-grouping", "c": 3, "imp": 0.0, "h": 0.536, "t": "Dynamic Programming to Select a Join Order and Grouping", "d": "To pick an order for the join of many relations we have three choices:  - 1. Consider them all. - 2. Consider a subset. - 3. Use a heuristic to pick one.  We shall here consider a sensible approach to enumeration called \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 115.59, "y": -365.08, "z": 20.59, "jx": -375.0, "jy": 14779.0, "ch": "DBMS 16"}, {"id": "dbms-1665-dynamic-programming-w-ith-more-detailed-cost-functions", "c": 3, "imp": 0.0, "h": 0.0, "t": "Dynamic Programming W ith More Detailed Cost Functions", "d": "Using relation sizes as the cost estimate simplifies the calculations in a dynamicprogramming algorithm. However, a disadvantage of this simplification is that it does not involve the actual costs of the joins in the cal\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 125.47, "y": -297.79, "z": 166.06, "jx": 0.0, "jy": 15015.0, "ch": "DBMS 16"}, {"id": "dbms-1666-a-greedy-algorithm-for-selecting-a-join-order", "c": 3, "imp": 0.0, "h": 0.656, "t": "A Greedy Algorithm for Selecting a Join Order", "d": "As Example 16.33 suggests, even the carefully limited search of dynamic programming leads to a number of calculations that is exponential in the number of relations joined. It is reasonable to use an exhaustive method li\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 134.13, "y": -360.19, "z": 43.84, "jx": -225.0, "jy": 14779.0, "ch": "DBMS 16"}, {"id": "dbms-1671-choosing-a-selection-m-ethod", "c": 3, "imp": 0.0, "h": 0.721, "t": "Choosing a Selection M ethod", "d": "One of the important steps in choosing a physical query plan is to pick algorithms for each selection operator. In Section 15.2.1 we mentioned the obvious implementation of a *ac* (*R*) operator, where we access the enti\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 88.72, "y": -289.98, "z": -3.34, "jx": 375.0, "jy": 14779.0, "ch": "DBMS 16"}, {"id": "dbms-1672-choosing-a-join-method", "c": 3, "imp": 0.0, "h": 0.057, "t": "Choosing a Join Method", "d": "We saw in Chapter 15 the costs associated with the various join algorithms. On the assumption that we know (or can estimate) how many buffers are available to perform the join, we can apply the formulas in Section 15.4.9\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 72.71, "y": -370.84, "z": 76.4, "jx": -375.0, "jy": 14307.0, "ch": "DBMS 16"}, {"id": "dbms-1673-pipelining-versus-m-aterialization", "c": 3, "imp": 0.0054, "h": 0.175, "t": "Pipelining Versus M aterialization", "d": "The last major issue we shall discuss in connection with choice of a physical query plan is pipelining of results. The naive way to execute a query plan is to order the operations appropriately (so an operation is not pe\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 163.74, "y": -312.05, "z": 71.7, "jx": 150.0, "jy": 14425.0, "ch": "DBMS 16"}, {"id": "dbms-1674-pipelining-unary-operations", "c": 3, "imp": 0.0, "h": 0.924, "t": "Pipelining Unary Operations", "d": "Unary operations \u2014 selection and projection \u2014 are excellent candidates for pipelining. Since these operations are tuple-at-a-time, we never need to have more than one block for input, and one block for the output. This m\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 123.67, "y": -272.43, "z": 64.64, "jx": 225.0, "jy": 14779.0, "ch": "DBMS 16"}, {"id": "dbms-1675-pipelining-binary-operations", "c": 3, "imp": 0.0, "h": 0.09, "t": "Pipelining Binary Operations", "d": "The results of binary operations can also be pipelined. We use one buffer to pass the result to its consumer, one block at a time. However, the number of other buffers needed to compute the result and to consume the resu\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 204.89, "y": -363.98, "z": 111.63, "jx": 0.0, "jy": 14425.0, "ch": "DBMS 16"}, {"id": "dbms-1676-notation-for-physical-query-plans", "c": 3, "imp": 0.0, "h": 0.078, "t": "Notation for Physical Query Plans", "d": "We have seen many examples of the operators that can be used to form a physical query plan. In general, each operator of the logical plan becomes one or more operators of the physical plan, and leaves (stored relations) \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 200.44, "y": -253.92, "z": -77.13, "jx": 450.0, "jy": 14425.0, "ch": "DBMS 16"}, {"id": "dbms-1677-ordering-of-physical-operations", "c": 3, "imp": 0.0, "h": 0.932, "t": "Ordering of Physical Operations", "d": "Our final topic regarding physical query plans is the m atter of order of operations. The physical query plan is generally represented as a tree, and trees imply something about order of operations, since data must flow \u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 204.83, "y": -295.24, "z": 105.69, "jx": -225.0, "jy": 14543.0, "ch": "DBMS 16"}, {"id": "dbms-1711-failure-modes", "c": 3, "imp": 0.1432, "h": 0.172, "t": "Failure Modes", "d": "There are many things that can go wrong as a database is queried and modified. Problems range from the keyboard entry of incorrect data to an explosion in the room where the database is stored on disk. The following item\u2026", "pc": 0, "nw": 0, "nm": 0, "hp": 0, "a": 1.0, "b": 1.0, "hr": 0.0, "x": 295.65, "y": 52.22, "z": 116.4, "jx": 0.0, "jy": 15308.0, "ch": "DBMS 17"}, {"id": "dbms-1712-more-about-transactions", "c"
