name: nexus-local
options:
  bundleIdPrefix: com.bastianthomsen.nexuslocal
  deploymentTarget:
    iOS: 14.0
fileGroups: [../../src]
configs:
  debug: debug
  release: release
settingGroups:
  app:
    base:
      PRODUCT_NAME: Nexus Local
      PRODUCT_BUNDLE_IDENTIFIER: com.bastianthomsen.nexuslocal
      DEVELOPMENT_TEAM: G9D6JYJSLT
targetTemplates:
  app:
    type: application
    sources:
      - path: Sources
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      groups: [app]
targets:
  nexus-local_iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      - path: Externals
        excludes:
          - "**/*.a"   # libapp.a is a framework dependency; excluding prevents duplicate-copy errors when embedding the widget extension
      - path: nexus-local_iOS
      - path: assets
        buildPhase: resources
        type: folder
      - path: LaunchScreen.storyboard
      - path: ../../ios   # native bridges (WidgetBridge/ContentBlockerBridge) linked into the app target
        excludes:
          - "SafariBlockerExtension/**"  # those compile into the extension, not the app
    info:
      path: nexus-local_iOS/Info.plist
      properties:
        LSRequiresIPhoneOS: true
        UILaunchStoryboardName: LaunchScreen
        UIRequiredDeviceCapabilities: [arm64, metal]
        NSLocalNetworkUsageDescription: "Nexus Local connects to the Tauri development server on your local network during development."
        NSBonjourServices:
          - _http._tcp
        NSSupportsLiveActivities: true
        NSBluetoothAlwaysUsageDescription: "Nexus Local connects to your BLE scale to read body-composition measurements."
        NSBluetoothPeripheralUsageDescription: "Nexus Local connects to your BLE scale to read body-composition measurements."
        UIBackgroundModes:
          - bluetooth-central
        CFBundleURLTypes:
          - CFBundleURLName: com.bastianthomsen.nexuslocal
            CFBundleURLSchemes:
              - nexuslocal
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleShortVersionString: 0.29.0
        CFBundleVersion: "0.29.0"
    entitlements:
      path: nexus-local_iOS/nexus-local_iOS.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.bastianthomsen.nexuslocal
        # Keychain sharing: unlike App Groups (which need portal registration a
        # free account can't do), this group is just <AppIdentifierPrefix>.<bundle-id>
        # and is derived from the signing team — so it may survive free-tier
        # provisioning where the App Group did not. $(AppIdentifierPrefix) expands
        # to the team prefix at build time, so SideStore re-signing stays consistent.
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.bastianthomsen.nexuslocal
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      base:
        ENABLE_BITCODE: false
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ARCHS: [arm64]
        VALID_ARCHS: arm64 
        LIBRARY_SEARCH_PATHS[arch=x86_64]: $(inherited) $(PROJECT_DIR)/Externals/x86_64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        LIBRARY_SEARCH_PATHS[arch=arm64]: $(inherited) $(PROJECT_DIR)/Externals/arm64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: true
        EXCLUDED_ARCHS[sdk=iphoneos*]: x86_64
      groups: [app]
    dependencies:
      - framework: libapp.a
        embed: false
      - sdk: CoreGraphics.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: Security.framework
      - sdk: UIKit.framework
      - sdk: WebKit.framework
      - sdk: SafariServices.framework
      - sdk: ActivityKit.framework
        weak: true
      - sdk: CoreBluetooth.framework
      - target: NexusLocalWidgets
        embed: true
      # Safari enforcement. Each extension is its own App ID on a free Apple ID
      # (10 per rolling 7 days, SideStore's budget), so app + widgets + blocker
      # = 3 of 10 — deliberately spent, because without this extension in the
      # bundle Safari has nothing to load and the whole blocking chain
      # (focus-evaluate → widget refresh → Safari) is inert.
      - target: nexus-local_SafariBlocker
        embed: true
    preBuildScripts:
      - script: npm run -- tauri ios xcode-script -v --platform ${PLATFORM_DISPLAY_NAME:?} --sdk-root ${SDKROOT:?} --framework-search-paths "${FRAMEWORK_SEARCH_PATHS:?}" --header-search-paths "${HEADER_SEARCH_PATHS:?}" --gcc-preprocessor-definitions "${GCC_PREPROCESSOR_DEFINITIONS:-}" --configuration ${CONFIGURATION:?} ${FORCE_COLOR} ${ARCHS:?}
        name: Build Rust Code
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/Externals/x86_64/${CONFIGURATION}/libapp.a
          - $(SRCROOT)/Externals/arm64/${CONFIGURATION}/libapp.a

  NexusLocalWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: NexusLocalWidgets
        excludes:
          - "Info.plist"            # provided via INFOPLIST_FILE below
          - "Secrets.swift.template" # copied to Secrets.swift (gitignored) by the developer
          - "*.entitlements"         # wired via the entitlements block, not a source
      - path: ../../ios/TimerAttributes.swift  # shared ActivityAttributes (also compiled into the app)
      - path: ../../ios/AppGroup.swift         # shared App Group resolver (also compiled into the app)
      - path: ../../ios/KeychainSession.swift  # shared-keychain session channel (also compiled into the app)
    entitlements:
      path: NexusLocalWidgets/NexusLocalWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.bastianthomsen.nexuslocal
        # Must match the app target exactly — a shared keychain group is the
        # whole point, and a mismatched prefix silently yields separate stores.
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.bastianthomsen.nexuslocal
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: ActivityKit.framework
      - sdk: AppIntents.framework   # interactive widgets (Button(intent:)) — iOS 17+
      # The widget process is the only thing on the phone that runs with the app
      # closed, so it is what refreshes the Safari block rules: WebKit compiles
      # them into the shared WKContentRuleListStore, SafariServices signals
      # Safari to reload. Without these two the blocking is only as current as
      # the last time the app was opened.
      - sdk: WebKit.framework
      - sdk: SafariServices.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bastianthomsen.nexuslocal.widgets
        DEVELOPMENT_TEAM: G9D6JYJSLT
        SWIFT_VERSION: "5.0"
        ARCHS: [arm64]
        VALID_ARCHS: arm64
        EXCLUDED_ARCHS[sdk=iphoneos*]: x86_64
        # 17.0 (was 16.2) so Button(intent:) tap-to-toggle compiles without
        # per-view availability gating. The Live Activity's @available(iOS 16.2)
        # annotations are then trivially satisfied.
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ENABLE_BITCODE: false
        INFOPLIST_FILE: $(SRCROOT)/NexusLocalWidgets/Info.plist

  # The Safari content blocker. This is what actually enforces the block: the
  # app/widget compile rules into the shared WKContentRuleListStore and call
  # SFContentBlockerManager.reloadContentBlocker for the bundle ID below — if
  # this target isn't in the IPA that call fails silently and nothing blocks.
  # Costs one App ID (see the app target's dependencies).
  nexus-local_SafariBlocker:
    type: app-extension
    platform: iOS
    sources:
      - path: ../../ios/SafariBlockerExtension
        excludes:
          - "Info.plist"            # provided via INFOPLIST_FILE below
          - "blockerList.json"      # re-added below as a resource, not a compile input
          - "*.entitlements"        # wired via the entitlements block, not a source
      - path: ../../ios/SafariBlockerExtension/blockerList.json
        buildPhase: resources       # fallback rules; Bundle.main.url(forResource:) finds it here
      - path: ../../ios/AppGroup.swift   # shared App Group resolver (also compiled into app + widgets)
    entitlements:
      path: nexus-local_SafariBlocker/nexus-local_SafariBlocker.entitlements
      properties:
        # Must match the app and widget targets exactly — the extension reads the
        # rules the app wrote to this container, and a mismatched group silently
        # yields separate containers (which is the whole failure mode here).
        com.apple.security.application-groups:
          - group.com.bastianthomsen.nexuslocal
        # Same keychain group as app + widgets: it is the *app's* bundle ID by
        # design ($(AppIdentifierPrefix) expands to the team prefix at build
        # time), not the extension's. Do not "correct" it to .SafariBlocker.
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.bastianthomsen.nexuslocal
    dependencies:
      - sdk: SafariServices.framework
      - sdk: WebKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bastianthomsen.nexuslocal.SafariBlocker
        DEVELOPMENT_TEAM: G9D6JYJSLT
        SWIFT_VERSION: "5.0"
        ARCHS: [arm64]
        VALID_ARCHS: arm64
        EXCLUDED_ARCHS[sdk=iphoneos*]: x86_64
        IPHONEOS_DEPLOYMENT_TARGET: "14.0"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ENABLE_BITCODE: false
        INFOPLIST_FILE: $(SRCROOT)/../../ios/SafariBlockerExtension/Info.plist
        # PRODUCT_NAME is deliberately left at the target name: Info.plist
        # resolves the principal class as $(PRODUCT_MODULE_NAME).SafariContent-
        # BlockerHandler, i.e. nexus_local_SafariBlocker.…. Do not apply the
        # [app] setting group here — it would overwrite both PRODUCT_NAME and
        # PRODUCT_BUNDLE_IDENTIFIER with the host app's.
