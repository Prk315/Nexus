[package]
name = "nexus-local"
version = "0.4.0"
description = "Nexus Local — the ecosystem's local grid of background service modules"
authors = []
edition = "2021"

[lib]
name = "nexus_local_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "nexus-local"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"

# tray-icon is not supported on iOS — only enable it for non-iOS targets
[target.'cfg(not(target_os = "ios"))'.dependencies]
tauri = { version = "2", features = ["tray-icon"] }

# iOS reads the device name via libc gethostname (subprocess spawn is sandboxed)
[target.'cfg(target_os = "ios")'.dependencies]
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
